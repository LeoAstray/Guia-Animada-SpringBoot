tory<\/code> y <code>equipoRepository<\/code>. Utiliza esos mismos nombres en todas las llamadas.<\/li>\n<li>En <code>IEquipoRepository<\/code> debe poner <code>JpaRepository&lt;Equipo, Long&gt;<\/code>. Si al copiar has dejado <code>Jugador<\/code>, ese repositorio estar\u00e1 configurado para otra entidad.<\/li>\n<li><code>Jugador<\/code> ahora necesita un perfil. Antes de guardar uno nuevo, prepara su <code>PerfilEstadistico<\/code> y p\u00e1saselo al constructor: <code>new Jugador(nombre, mote, posicion, perfil)<\/code>.<\/li>\n<li>En la relaci\u00f3n bidireccional equipo y estadios, <code>@JoinColumn<\/code> est\u00e1 en <code>Estadio.equipo<\/code> y <code>mappedBy<\/code> en <code>Equipo.estadios<\/code>. No dejes la antigua <code>@JoinColumn<\/code> de la versi\u00f3n unidireccional.<\/li>\n<li>En <code>Coche<\/code>, <code>getGaraje()<\/code> debe devolver <code>Garaje<\/code> y el campo <code>garaje<\/code>; <code>setGaraje<\/code> debe asignarlo. Elimina cualquier <code>UnsupportedOperationException<\/code> que haya quedado como relleno.<\/li>\n<li>Los scripts se activan con <code>spring.sql.init.mode<\/code>. La espera a Hibernate se configura con <code>spring.jpa.defer-datasource-initialization=true<\/code>.<\/li>\n<li>No mantengas dos m\u00e9todos <code>findByMote<\/code> con los mismos argumentos y distinto retorno. En estos apuntes usamos la versi\u00f3n <code>Jugador<\/code>, con comprobaci\u00f3n de <code>null<\/code>.<\/li>\n<li>No ejecutes a la vez las pruebas antiguas y la prueba final si ambas crean los mismos datos. Si tu proyecto a\u00fan tiene clases de prueba de consola a\u00f1adidas durante versiones anteriores de estos apuntes, elim\u00ednalas y conserva las comprobaciones de la clase principal.<\/li>\n<\/ul>\n\n<h3>Comprobar y entregar<\/h3>\n<p class=\"paso\">8. Arranca el proyecto y comprueba por consola las operaciones de los pasos 8, 9 y 10. Despu\u00e9s de a\u00f1adir el perfil obligatorio, cualquier jugador nuevo debe tenerlo asignado antes de guardar. Con el servidor activo, examina las tablas en phpMyAdmin y det\u00e9n la aplicaci\u00f3n cuando termines.<\/p>\n<p class=\"paso\">9. Si necesitas comprobar las tablas en phpMyAdmin, recuerda el efecto de <code>create-drop<\/code> y la confirmaci\u00f3n de las transacciones. Para conservar datos utiliza la estrategia que permita tu enunciado; no cambies propiedades sin tener claro si recrean o conservan las tablas.<\/p>\n<p class=\"paso\">10. Si el proyecto trae pruebas configuradas, ejec\u00fatalas desde la carpeta de <code>pom.xml<\/code>:<\/p>\n<pre data-f=\"terminal (en la carpeta del pom.xml)\">.\\mvnw.cmd test<\/pre>\n<p>Las pruebas que arrancan Spring tambi\u00e9n pueden necesitar MySQL y ejecutar <code>data.sql<\/code>. Usa una base de pr\u00e1ctica para la configuraci\u00f3n que recrea tablas.<\/p>\n<p class=\"paso\">11. Para construir el JAR:<\/p>\n<pre data-f=\"terminal (en la carpeta del pom.xml)\">.\\mvnw.cmd clean package<\/pre>\n<p>Si termina con <code>BUILD SUCCESS<\/code>, busca el JAR en <code>target<\/code>. Maven compila y ejecuta sus pruebas durante ese proceso.<\/p>\n<p class=\"paso\">12. Puedes ejecutarlo as\u00ed, ajustando el nombre al archivo generado:<\/p>\n<pre data-f=\"terminal (en la carpeta del pom.xml)\">java -jar .\\target\\examen-0.0.1-SNAPSHOT.jar<\/pre>\n<p>El Java que uses para arrancarlo debe admitir el c\u00f3digo compilado para Java 21. Si trabajas en el proyecto de coches, el archivo se llamar\u00e1 seg\u00fan su <code>artifact<\/code>, por ejemplo <code>motor-0.0.1-SNAPSHOT.jar<\/code>.<\/p>\n<p class=\"paso\">13. Si te piden entregar el proyecto, incluye <code>pom.xml<\/code>, <code>src<\/code>, <code>mvnw<\/code>, <code>mvnw.cmd<\/code> y la carpeta <code>.mvn<\/code>, adem\u00e1s de la configuraci\u00f3n o el SQL que exija el examen.<\/p>\n<div class=\"warn\">Las carpetas que empiezan por punto pueden aparecer ocultas en Windows. Comprueba el enunciado antes de comprimir.<\/div>\n<\/section>\n\n<section id=\"paso-17\">\n<header class=\"opener r1\"><h2>Materiales utilizados y documentaci\u00f3n de apoyo<\/h2><div class=\"set\"><b>017<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n<p>Gu\u00eda basada en los materiales de jugadores, equipos y coches aportados. Las pruebas se realizan en la clase principal y los ejemplos mantienen el enfoque de Spring Data JPA.<\/p>\n<div class=\"warn\">Al adaptar un ejemplo, revisa paquetes, imports, columnas e identificadores. En el examen respeta los nombres, restricciones y tipos de retorno de su enunciado, incluido <code>Optional<\/code> si lo exige.<\/div>\n<p>Documentaci\u00f3n oficial de apoyo, incluida la revisi\u00f3n del servidor web del 25 de octubre de 2026:<\/p>\n<ul>\n<li>Consultas de Spring Data JPA: <a href=\"https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html\">https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html<\/a><\/li>\n<li>Inicializaci\u00f3n de la base de datos con Spring Boot: <a href=\"https://docs.spring.io/spring-boot/how-to/data-initialization.html\">https://docs.spring.io/spring-boot/how-to/data-initialization.html<\/a><\/li>\n<li>Uso de transacciones en Spring: <a href=\"https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html\">https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html<\/a><\/li>\n<li>Generador de proyectos: <a href=\"https://start.spring.io\">https://start.spring.io<\/a><\/li>\n<li>Dependencias de Spring Boot y starter webmvc: <a href=\"https://docs.spring.io/spring-boot/reference/using/build-systems.html\">https://docs.spring.io/spring-boot/reference/using/build-systems.html<\/a><\/li>\n<li>Servidor integrado y puerto web: <a href=\"https://docs.spring.io/spring-boot/how-to/webserver.html\">https://docs.spring.io/spring-boot/how-to/webserver.html<\/a><\/li>\n<\/ul>\n<\/section>\n\n\n<div class=\"part p2\" id=\"parte2\" data-indice=\"El puente a REST\">\n  <span class=\"num\">2<\/span>\n  <span class=\"ttl\">El puente, de run() a una API REST\n    <small>Qu\u00e9 se a\u00f1ade por encima de lo que ya sabes, con el proyecto del f\u00fatbol<\/small>\n  <\/span>\n  <span class=\"set\">CARTAS 018\u2013019 \u00b7 RARA<\/span>\n<\/div>\n<section id=\"s16\">\n<header class=\"opener r2\"><h2>Qu\u00e9 cambia al pasar a REST (y por qu\u00e9)<\/h2><div class=\"set\"><b>018<\/b>/033 <span class=\"rar\">RARA<\/span><\/div><\/header>\n<p>En la Parte 1, <b>t\u00fa<\/b> eras el \u00fanico que ped\u00eda cosas, desde el m\u00e9todo <code>run()<\/code>. En REST, quien pide es <b>otro programa<\/b> (Postman, una web, una app m\u00f3vil) mediante <b>peticiones HTTP<\/b>. Las entidades, las relaciones y los repositorios son <b>exactamente los mismos<\/b>: lo que hacemos es <b>a\u00f1adir capas por encima<\/b>.<\/p>\n\n<figure class=\"fig\">\n<svg viewBox=\"0 0 900 330\" xmlns=\"http://www.w3.org/2000/svg\" text-anchor=\"middle\" font-size=\"12\">\n  <text x=\"450\" y=\"22\" font-size=\"15\" font-weight=\"700\" fill=\"#4f5d68\">ANTES \u2014 Parte 1 (Data JPA)<\/text>\n  <g font-weight=\"700\">\n    <rect x=\"40\" y=\"40\" width=\"230\" height=\"60\" rx=\"12\" fill=\"#dcefee\" stroke=\"#0b6b6b\" stroke-width=\"3\"/><text x=\"155\" y=\"68\">ExamenApplication.run()<\/text><text x=\"155\" y=\"86\" font-weight=\"400\">t\u00fa pruebas desde la consola<\/text>\n    <rect x=\"340\" y=\"40\" width=\"230\" height=\"60\" rx=\"12\" fill=\"#fbeccf\" stroke=\"#a35b00\" stroke-width=\"3\"/><text x=\"455\" y=\"68\">IJugadorRepository<\/text><text x=\"455\" y=\"86\" font-weight=\"400\">guarda y busca<\/text>\n    <rect x=\"640\" y=\"40\" width=\"200\" height=\"60\" rx=\"12\" fill=\"#e8edf1\" stroke=\"#536171\" stroke-width=\"3\"/><text x=\"740\" y=\"68\">MySQL<\/text><text x=\"740\" y=\"86\" font-weight=\"400\">tablas y filas<\/text>\n  <\/g>\n  <g stroke=\"#14212b\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"><line pathLength=\"1\" class=\"ld\" x1=\"270\" y1=\"70\" x2=\"338\" y2=\"70\"/><line pathLength=\"1\" class=\"ld\" x1=\"570\" y1=\"70\" x2=\"638\" y2=\"70\"/><\/g>\n\n  <text x=\"450\" y=\"150\" font-size=\"15\" font-weight=\"700\" fill=\"#4f5d68\">DESPU\u00c9S \u2014 Parte 2 y 3 (REST)<\/text>\n  <g font-weight=\"700\">\n    <rect x=\"10\" y=\"170\" width=\"120\" height=\"110\" rx=\"12\" fill=\"#f8e2de\" stroke=\"#b23a2b\" stroke-width=\"3\"/><use href=\"#i-hand\" class=\"ic\" x=\"55.05\" y=\"179.585\" width=\"29.9\" height=\"29.9\"/><text x=\"70\" y=\"232\">Cliente<\/text><text x=\"70\" y=\"250\" font-weight=\"400\">Postman / curl<\/text>\n    <rect x=\"165\" y=\"170\" width=\"140\" height=\"110\" rx=\"12\" fill=\"#dcefee\" stroke=\"#0b6b6b\" stroke-width=\"3\"/><use href=\"#i-chef\" class=\"ic\" x=\"220.05\" y=\"179.585\" width=\"29.9\" height=\"29.9\"/><text x=\"235\" y=\"232\">RestController<\/text><text x=\"235\" y=\"250\" font-weight=\"400\">recibe HTTP<\/text>\n    <rect x=\"340\" y=\"170\" width=\"120\" height=\"110\" rx=\"12\" fill=\"#fbeccf\" stroke=\"#a35b00\" stroke-width=\"3\"/><use href=\"#i-clip\" class=\"ic\" x=\"385.05\" y=\"179.585\" width=\"29.9\" height=\"29.9\"/><text x=\"400\" y=\"232\">IService<\/text><text x=\"400\" y=\"250\" font-weight=\"400\">la carta<\/text>\n    <rect x=\"495\" y=\"170\" width=\"140\" height=\"110\" rx=\"12\" fill=\"#e0f1e7\" stroke=\"#2e7d4f\" stroke-width=\"3\"/><use href=\"#i-chef\" class=\"ic\" x=\"550.05\" y=\"179.585\" width=\"29.9\" height=\"29.9\"/><text x=\"565\" y=\"232\">Service<\/text><text x=\"565\" y=\"250\" font-weight=\"400\">l\u00f3gica + DTO\u21c4Entity<\/text>\n    <rect x=\"670\" y=\"170\" width=\"120\" height=\"110\" rx=\"12\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"3\"/><use href=\"#i-basket\" class=\"ic\" x=\"715.05\" y=\"179.585\" width=\"29.9\" height=\"29.9\"/><text x=\"730\" y=\"232\">Repository<\/text><text x=\"730\" y=\"250\" font-weight=\"400\">(el mismo de antes)<\/text>\n    <rect x=\"815\" y=\"170\" width=\"80\" height=\"110\" rx=\"12\" fill=\"#e8edf1\" stroke=\"#536171\" stroke-width=\"3\"/><use href=\"#i-store\" class=\"ic\" x=\"840.05\" y=\"179.585\" width=\"29.9\" height=\"29.9\"/><text x=\"855\" y=\"232\">MySQL<\/text>\n  <\/g>\n  <g stroke=\"#14212b\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"><line pathLength=\"1\" class=\"ld\" x1=\"130\" y1=\"225\" x2=\"163\" y2=\"225\"/><line pathLength=\"1\" class=\"ld\" x1=\"305\" y1=\"225\" x2=\"338\" y2=\"225\"/><line pathLength=\"1\" class=\"ld\" x1=\"460\" y1=\"225\" x2=\"493\" y2=\"225\"/><line pathLength=\"1\" class=\"ld\" x1=\"635\" y1=\"225\" x2=\"668\" y2=\"225\"/><line pathLength=\"1\" class=\"ld\" x1=\"790\" y1=\"225\" x2=\"813\" y2=\"225\"/><\/g>\n  <text x=\"450\" y=\"312\" fill=\"#4f5d68\" font-size=\"13\">Lo nuevo (Parte 2): DTO \u00b7 Service \u00b7 Controller \u00b7 manejo de errores. Lo viejo (Parte 1) se queda igual.<\/text>\n<\/svg>\n<figcaption>Lo nuevo (Partes 2 y 3) se a\u00f1ade por encima; lo de la Parte 1 se queda igual<\/figcaption>\n<\/figure>\n\n<table>\n<tr><th><\/th><th>Parte 1 (Data JPA)<\/th><th>Partes 2 y 3 (REST)<\/th><\/tr>\n<tr><td>Qui\u00e9n pide<\/td><td>El m\u00e9todo <code>run()<\/code><\/td><td>Un cliente HTTP llamando a endpoints (<code>GET /api/jugadores/1<\/code>)<\/td><\/tr>\n<tr><td>Capas<\/td><td>Application, Repository, MySQL<\/td><td>RestController, IService, Service, Repository, MySQL<\/td><\/tr>\n<tr><td>Qu\u00e9 sale al exterior<\/td><td>Entities directamente, por consola<\/td><td><b>DTO<\/b>, nunca Entities (as\u00ed no hay bucles en el JSON)<\/td><\/tr>\n<tr><td>C\u00f3mo se informa de un fallo<\/td><td>Mensajes por consola<\/td><td><b>C\u00f3digos HTTP<\/b>: 200, 201, 204, 400, 404, 409<\/td><\/tr>\n<tr><td>Relaciones LAZY<\/td><td><code>@Transactional<\/code> sobre <code>run<\/code><\/td><td><code>@Transactional<\/code> sobre los <b>m\u00e9todos del Service<\/b><\/td><\/tr>\n<tr><td>Dependencia nueva<\/td><td>Ninguna<\/td><td>Ninguna, si marcaste <b>Validation<\/b> en el paso 1 (<code>spring-boot-starter-validation<\/code>, para el 400)<\/td><\/tr>\n<\/table>\n<div class=\"kid\">Data JPA es aprender a <b>cocinar<\/b>: los platos son las entidades y la nevera es MySQL. El REST es <b>abrir el restaurante<\/b>: contratas un camarero (el Controller) que lleva los pedidos a la cocina (el Service), y los platos salen <b>bonitos en un plato<\/b> (el DTO), no con todos los cables de la cocina a la vista.<\/div>\n\n<h3>Los 5 pasos del puente<\/h3>\n<div class=\"grid\">\n  <div class=\"box\"><b>1. Dependencia de validaci\u00f3n<\/b><br>Para poder devolver un 400 cuando los datos llegan mal.<\/div>\n  <div class=\"box\"><b>2. DTO<\/b><br>Lo que entra y lo que sale. Nunca las entidades.<\/div>\n  <div class=\"box\"><b>3. Service<\/b><br>Interfaz e implementaci\u00f3n. Convierte DTO a Entity y lleva <code>@Transactional<\/code>.<\/div>\n  <div class=\"box\"><b>4. Controller<\/b><br>Recibe HTTP, llama al servicio y traduce su respuesta a un c\u00f3digo con <code>ResponseEntity<\/code>.<\/div>\n  <div class=\"box\"><b>5. Probar<\/b><br>Con Postman o con curl, mirando el c\u00f3digo de cada respuesta.<\/div>\n<\/div>\n<\/section>\n\n<section id=\"s17\">\n<header class=\"opener r2\"><h2>El puente paso a paso, con el proyecto de f\u00fatbol<\/h2><div class=\"set\"><b>019<\/b>/033 <span class=\"rar\">RARA<\/span><\/div><\/header>\n<p>Vamos a ofrecer <b>un jugador por REST<\/b> (<code>/api/jugadores<\/code>) sobre el proyecto que ya tienes. Es peque\u00f1o a prop\u00f3sito: cuando entiendas estos 5 pasos, la biblioteca de la Parte 3 es <b>lo mismo con m\u00e1s entidades<\/b>.<\/p>\n\n<h3><span class=\"step\">1<\/span>La dependencia de validaci\u00f3n<\/h3>\n<p>Con la dependencia de <b>validaci\u00f3n<\/b> funcionan <code>@NotBlank<\/code>, <code>@NotNull<\/code>, <code>@Valid<\/code> y compa\u00f1\u00eda. <b>Spring Web no la incluye<\/b>: son starters separados. Por eso en el paso 1 se marcan las dos en Spring Initializr, y <b>no tienes que hacer nada ahora<\/b>.<\/p>\n<p class=\"paso\">Comprueba que est\u00e1: abre <code>pom.xml<\/code> y busca <code>spring-boot-starter-validation<\/code> dentro de <code>&lt;dependencies&gt;<\/code>. Si est\u00e1, salta al paso 2.<\/p>\n<div class=\"warn\"><b>\u00bfNo est\u00e1?<\/b> Tu proyecto se cre\u00f3 sin marcar Validation. Sin ella, los <code>import jakarta.validation...<\/code> dan error de compilaci\u00f3n. A\u00f1\u00e1dela dando clic derecho en el c\u00f3digo del pom.xml &gt; Add Starters &gt; Validation.<\/div>\n\n<h3><span class=\"step\">2<\/span>Los DTO: el plato servido<\/h3>\n<p>Una <b>Entity<\/b> es el ingrediente crudo con todos sus cables a la base de datos. Un <b>DTO<\/b> (<i>Data Transfer Object<\/i>) es lo que viaja al cliente: solo los datos que necesita. Creamos el paquete <code>dto<\/code> dentro de <code>model<\/code> con tres <code>record<\/code> (un <code>record<\/code> es una clase de datos en pocas l\u00edneas, con getters autom\u00e1ticos):<\/p>\n\n<h4>Para qu\u00e9 sirve cada DTO y por qu\u00e9 hay tres tipos<\/h4>\n<p>Un DTO no es una \u00abcopia de la Entity\u00bb: es un <b>formulario hecho a medida<\/b> para un momento concreto del viaje. Seg\u00fan el momento hay tres tipos:<\/p>\n<table>\n<tr><th>Tipo<\/th><th>Cu\u00e1ndo se usa<\/th><th>Qu\u00e9 lleva<\/th><th>En este ejemplo<\/th><\/tr>\n<tr><td><b>Request DTO<\/b> (de entrada)<\/td><td>Cuando el cliente <b>env\u00eda<\/b> datos (POST, PUT). Spring convierte el JSON que llega en este objeto.<\/td><td>Solo lo que el cliente <b>puede decidir<\/b>. Nunca el <code>id<\/code> (lo pone MySQL). Lleva las reglas de validaci\u00f3n (<code>@NotBlank<\/code>\u2026).<\/td><td><code>JugadorRequestDTO<\/code>: nombre, mote, posici\u00f3n y goles.<\/td><\/tr>\n<tr><td><b>Response DTO<\/b> (de salida)<\/td><td>Cuando el servidor <b>responde<\/b>. Spring lo convierte en el JSON que recibe el cliente.<\/td><td>Lo que el cliente <b>necesita ver<\/b>: el <code>id<\/code> ya generado, los datos y, si hace falta, listas de \u00abResumen\u00bb.<\/td><td><code>JugadorResponseDTO<\/code>: id, nombre, mote, posici\u00f3n, goles y la lista de fichajes.<\/td><\/tr>\n<tr><td><b>Resumen DTO<\/b> (pieza anidada)<\/td><td>Cuando un Response DTO necesita incluir <b>otros objetos<\/b> dentro (una lista de fichajes, de libros\u2026).<\/td><td>Solo <b>2 o 3 datos sueltos<\/b> del objeto anidado, <b>sin volver al objeto padre<\/b>.<\/td><td><code>FichajeResumenDTO<\/code>: solo temporada y nombre del equipo.<\/td><\/tr>\n<\/table>\n<p><b>\u00bfPor qu\u00e9 no usar uno solo para todo?<\/b> Porque entrada y salida no coinciden. Al crear no env\u00edas <code>id<\/code>, pero al recibir s\u00ed lo quieres. Al crear env\u00edas <code>goles<\/code> suelto, pero en la base viven dentro de otra tabla (<code>PerfilEstadistico<\/code>). Y si devolvieras la Entity, saldr\u00edan campos que el cliente no debe ver y se formar\u00edan bucles. Cada DTO es la forma justa para cada caso.<\/p>\n<pre class=\"code\" data-f=\"El viaje de los datos (qui\u00e9n es qui\u00e9n)\">JSON que env\u00eda el cliente\n        \u2502  Spring lo convierte en\n        \u25bc\n  JugadorRequestDTO   \u25c0\u2500\u2500 entra al Controller\n        \u2502  el Service lo convierte en\n        \u25bc\n     Jugador (Entity) \u2500\u2500\u25b6 Repository \u2500\u2500\u25b6 MySQL\n        \u2502  el Service lo vuelve a convertir en\n        \u25bc\n  JugadorResponseDTO  (con FichajeResumenDTO dentro)\n        \u2502  Spring lo convierte en\n        \u25bc\nJSON que recibe el cliente<\/pre>\n<div class=\"why\">Un <code>record<\/code> crea los accesos <b>sin prefijo <code>get<\/code><\/b>: en un DTO escribes <code>dto.nombre()<\/code>, no <code>dto.getNombre()<\/code>. En cambio, las Entities siguen usando <code>getNombre()<\/code>. Si mezclas las dos formas, VS Code marcar\u00e1 error.<\/div>\n\n<pre class=\"code\" data-f=\"dto/JugadorRequestDTO.java  (lo que ENTRA)\">package leo.astray.examen.dto;\n\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.PositiveOrZero;\nimport leo.astray.examen.enums.Posicion;\n\n/** Lo que el cliente ENVIA para crear un jugador. Nunca una Entity. */\npublic record JugadorRequestDTO(\n        @NotBlank(message = \"El nombre es obligatorio\") String nombre,\n        @NotBlank(message = \"El mote es obligatorio\") String mote,\n        @NotNull(message = \"La posicion es obligatoria\") Posicion posicion,\n        @NotNull(message = \"Los goles son obligatorios\")\n        @PositiveOrZero(message = \"Los goles no pueden ser negativos\") Integer goles) {\n}<\/pre>\n<h4>\u00bfPor qu\u00e9 <code>goles<\/code> suelto y no el perfil entero?<\/h4>\n<p>F\u00edjate en que <code>JugadorRequestDTO<\/code> no pide un <code>PerfilEstadistico<\/code>, sino un \u00fanico n\u00famero, <code>goles<\/code>. Tiene sus razones:<\/p>\n<ul>\n<li><b>Una Entity nunca entra por la puerta.<\/b> Si el DTO llevara un <code>PerfilEstadistico<\/code>, estar\u00edamos aceptando una Entity del cliente, y es la primera regla de oro.<\/li>\n<li><b>El cliente no debe conocer la base de datos.<\/b> Que los goles vivan en otra tabla (<code>perfiles_estadisticos<\/code>) es un detalle interno. Para el cliente, un jugador es \u00abnombre, mote, posici\u00f3n y goles\u00bb. Si ma\u00f1ana cambias el modelo, la API no cambia.<\/li>\n<li><b>El cliente no decide lo dem\u00e1s.<\/b> Un jugador nuevo no ha jugado partidos, ni tiene asistencias ni valoraci\u00f3n: esos datos empiezan en 0 y los pone el Service. El perfil tiene adem\u00e1s su propio <code>id<\/code>, que no debe elegir el cliente.<\/li>\n<li><b>El JSON queda plano y simple<\/b>, m\u00e1s f\u00e1cil de enviar y de validar.<\/li>\n<\/ul>\n<p>Si un ejercicio pidiera enviar todas las estad\u00edsticas, la soluci\u00f3n correcta no ser\u00eda usar la Entity, sino crear un DTO propio para el perfil (por ejemplo <code>PerfilRequestDTO<\/code>) y anidarlo dentro de este.<\/p>\n<h4>\u00bfPor qu\u00e9 <code>Integer<\/code> y no <code>int<\/code>? Y por qu\u00e9 lleva <code>@NotNull<\/code><\/h4>\n<p><code>int<\/code> es un n\u00famero simple: nunca puede ser <code>null<\/code>. <code>Integer<\/code> es el mismo n\u00famero \u00aben caja\u00bb y s\u00ed admite <code>null<\/code>. La diferencia aparece cuando el cliente <b>olvida enviar<\/b> los goles:<\/p>\n<table>\n<tr><th>Tipo<\/th><th>Si el JSON no trae <code>goles<\/code><\/th><th>Resultado<\/th><\/tr>\n<tr><td><code>int goles<\/code><\/td><td>Java rellena el hueco con <code>0<\/code> sin avisar.<\/td><td>Se crea un jugador con 0 goles aunque nadie lo pidiera. No hay forma de detectar el olvido.<\/td><\/tr>\n<tr><td><code>Integer goles<\/code> con <code>@NotNull<\/code><\/td><td>Llega <code>null<\/code> y <code>@NotNull<\/code> lo rechaza.<\/td><td><b>400<\/b> con el mensaje \u00abLos goles son obligatorios\u00bb. Es lo correcto.<\/td><\/tr>\n<tr><td><code>Integer goles<\/code> sin <code>@NotNull<\/code><\/td><td>Llega <code>null<\/code> y <code>@PositiveOrZero<\/code> lo da por v\u00e1lido (ignora los nulos).<\/td><td>El <code>null<\/code> pasa y falla m\u00e1s adelante, al convertirlo en <code>int<\/code> dentro del Service (<code>NullPointerException<\/code>, error 500).<\/td><\/tr>\n<\/table>\n<p>Por eso usamos <code>Integer<\/code> junto con <code>@NotNull<\/code>: el 400 sale pronto y con un mensaje claro. <code>@PositiveOrZero<\/code> se encarga despu\u00e9s de rechazar los negativos.<\/p>\n<pre class=\"code\" data-f=\"dto/FichajeResumenDTO.java  (pieza anidada)\">package leo.astray.examen.dto;\n\n/** Solo lo necesario de un fichaje: sin bucles Jugador -&gt; Fichaje -&gt; Jugador. */\npublic record FichajeResumenDTO(String temporada, String equipo) {\n}<\/pre>\n<pre class=\"code\" data-f=\"dto/JugadorResponseDTO.java  (lo que SALE)\">package leo.astray.examen.dto;\n\nimport java.util.List;\n\nimport leo.astray.examen.enums.Posicion;\n\n/** Lo que el cliente RECIBE. */\npublic record JugadorResponseDTO(\n        Long id,\n        String nombre,\n        String mote,\n        Posicion posicion,\n        Integer goles,\n        List&lt;FichajeResumenDTO&gt; fichajes) {\n}<\/pre>\n<table>\n<tr><th>Pregunta<\/th><th>Respuesta<\/th><\/tr>\n<tr><td>\u00bfPor qu\u00e9 <code>JugadorRequestDTO<\/code> no tiene <code>id<\/code>?<\/td><td>Al crear, el id lo pone MySQL. El cliente no debe decidirlo.<\/td><\/tr>\n<tr><td>\u00bfPor qu\u00e9 <code>FichajeResumenDTO<\/code> solo lleva temporada y nombre del equipo?<\/td><td>Si llevara el <code>Jugador<\/code> entero tendr\u00edamos Jugador, Fichaje, Jugador, Fichaje\u2026 un <b>bucle infinito<\/b>. El \u00abResumen\u00bb corta el bucle.<\/td><\/tr>\n<tr><td>\u00bfQu\u00e9 hacen <code>@NotBlank<\/code> y <code>@NotNull<\/code>?<\/td><td>Validan lo que llega. Si fallan, Spring responde <b>400<\/b> sin llegar a nuestro c\u00f3digo.<\/td><\/tr>\n<\/table>\n<figure class=\"fig\">\n<svg viewBox=\"0 0 800 170\" xmlns=\"http://www.w3.org/2000/svg\" text-anchor=\"middle\">\n  <g font-size=\"13\" font-weight=\"700\">\n    <rect x=\"30\" y=\"50\" width=\"120\" height=\"50\" rx=\"10\" fill=\"#e8edf1\" stroke=\"#536171\" stroke-width=\"3\"/><text x=\"90\" y=\"80\">Autor<\/text>\n    <rect x=\"250\" y=\"50\" width=\"120\" height=\"50\" rx=\"10\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"3\"/><text x=\"310\" y=\"80\">Libro<\/text>\n    <rect x=\"470\" y=\"50\" width=\"120\" height=\"50\" rx=\"10\" fill=\"#e8edf1\" stroke=\"#536171\" stroke-width=\"3\"/><text x=\"530\" y=\"80\">Autor<\/text>\n    <rect x=\"690\" y=\"50\" width=\"100\" height=\"50\" rx=\"10\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"3\"/><text x=\"740\" y=\"80\">Libro\u2026<\/text>\n  <\/g>\n  <g stroke=\"#b23a2b\" stroke-width=\"3\" marker-end=\"url(#ar3)\"><line pathLength=\"1\" class=\"ld\" x1=\"150\" y1=\"75\" x2=\"248\" y2=\"75\"/><line pathLength=\"1\" class=\"ld\" x1=\"370\" y1=\"75\" x2=\"468\" y2=\"75\"/><line pathLength=\"1\" class=\"ld\" x1=\"590\" y1=\"75\" x2=\"688\" y2=\"75\"/><\/g>\n  <defs><marker id=\"ar3\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#b23a2b\"/><\/marker><\/defs>\n  <text x=\"400\" y=\"140\" font-size=\"14\" fill=\"#b23a2b\" font-weight=\"700\">StackOverflowError \u2014 dos espejos enfrentados<\/text>\n  <text x=\"400\" y=\"30\" font-size=\"13\" fill=\"#14212b\">El ResumenDTO pone un cart\u00f3n en medio: solo id + nombre, sin lista de vuelta.<\/text>\n<\/svg>\n<figcaption>Por qu\u00e9 existen los *ResumenDTO<\/figcaption>\n<\/figure>\n<div class=\"kid\">El cliente nunca ve la cocina. Le servimos un plato bonito (<b>DTO<\/b>) y no le damos los ingredientes con sus cables (la <b>Entity<\/b>). Y si dos espejos se miran, la imagen se repite sin fin: los DTO \u00abResumen\u00bb ponen un cart\u00f3n en medio.<\/div>\n\n<h3><span class=\"step\">3<\/span>El Servicio, interfaz e implementaci\u00f3n<\/h3>\n<p>Vamos a crear el servicio, una interfaz y su implementaci\u00f3n. Primero creamos paquete de service, a la misma altura que <code>model<\/code>. Luego creamos dentro los archivos correspondientes. En este caso una interfaz y dentro de otro paquete <code>impl<\/code>, una clase de implementaci\u00f3n.<\/p>\n<p>El <b>Service<\/b> es la capa donde vive la <b>l\u00f3gica<\/b> de la aplicaci\u00f3n. Est\u00e1 en medio: el Controller le pide cosas y \u00e9l habla con el Repository (la base de datos). Se escribe en <b>dos archivos<\/b> que van juntos:<\/p>\n<table>\n<tr><th>Archivo<\/th><th>Qu\u00e9 es<\/th><th>Para qu\u00e9 sirve<\/th><\/tr>\n<tr><td><code>IJugadorService<\/code><\/td><td>Una <b>interfaz<\/b>: una lista de m\u00e9todos <b>sin c\u00f3digo dentro<\/b>, solo con su nombre, lo que reciben y lo que devuelven.<\/td><td>Es el <b>contrato<\/b>. Dice <i>qu\u00e9<\/i> operaciones ofrece el servicio (crear, buscar, listar, borrar), sin decir <i>c\u00f3mo<\/i> se hacen. El Controller solo conoce este archivo.<\/td><\/tr>\n<tr><td><code>JugadorServiceImpl<\/code><\/td><td>Una <b>clase<\/b> que hace <code>implements IJugadorService<\/code>: escribe el c\u00f3digo real de cada m\u00e9todo prometido.<\/td><td>Es quien <b>trabaja<\/b>: pide los datos al Repository, convierte entre Entity y DTO y decide qu\u00e9 devolver (el objeto, \u00abvac\u00edo\u00bb, <code>true<\/code> o <code>false<\/code>).<\/td><\/tr>\n<\/table>\n<h4>\u00bfPara qu\u00e9 dos archivos y no uno?<\/h4>\n<ul>\n<li><b>El Controller no depende del \u00abc\u00f3mo\u00bb.<\/b> Si ma\u00f1ana cambias la forma de guardar, el Controller no se toca, porque solo conoce la interfaz.<\/li>\n<li><b>Fija las reglas.<\/b> La interfaz solo habla de DTO. Si ves una Entity en una firma de <code>IJugadorService<\/code>, el dise\u00f1o est\u00e1 mal.<\/li>\n<li><b>Facilita las pruebas<\/b>: se puede sustituir la implementaci\u00f3n real por una falsa.<\/li>\n<li><b>Es lo que se pide en el examen<\/b>: RestController \u2192 IService \u2192 Service \u2192 Repository.<\/li>\n<\/ul>\n<h4>\u00bfC\u00f3mo se conectan sin escribir <code>new<\/code>?<\/h4>\n<p>La anotaci\u00f3n <code>@Service<\/code> de <code>JugadorServiceImpl<\/code> le dice a Spring: \u00abcrea un objeto de esta clase y gu\u00e1rdalo\u00bb. Despu\u00e9s, el Controller escribe <code>@Autowired private IJugadorService jugadorService;<\/code> y Spring le entrega ese objeto. El Controller pide \u00abalgo que cumpla el contrato <code>IJugadorService<\/code>\u00bb y Spring le da el <code>JugadorServiceImpl<\/code>, que es el \u00fanico que lo cumple. Sin <code>@Service<\/code>, Spring no encontrar\u00eda nada que entregar y la aplicaci\u00f3n no arrancar\u00eda.<\/p>\n<p>F\u00edjate en lo que <b>devuelve<\/b> cada m\u00e9todo de la interfaz: es el \u00abidioma\u00bb con el que el servicio le cuenta al controller qu\u00e9 ha pasado.<\/p>\n<pre class=\"code\" data-f=\"service/IJugadorService.java  (la carta: solo DTO)\">package leo.astray.examen.service;\n\nimport java.util.List;\nimport java.util.Optional;\n\nimport leo.astray.examen.dto.JugadorRequestDTO;\nimport leo.astray.examen.dto.JugadorResponseDTO;\n\n/** El contrato solo habla de DTO: ninguna Entity aparece aqui. */\npublic interface IJugadorService {\n\n    JugadorResponseDTO crear(JugadorRequestDTO dto);\n\n    // Optional vacio = no existe (el controller lo traduce a 404)\n    Optional&lt;JugadorResponseDTO&gt; obtenerPorId(Long id);\n\n    List&lt;JugadorResponseDTO&gt; listar();\n\n    // true = borrado, false = no existe (el controller lo traduce a 204 / 404)\n    boolean eliminar(Long id);\n}<\/pre>\n<pre class=\"code\" data-f=\"service/impl/JugadorServiceImpl.java  (el cocinero)\">package leo.astray.examen.service.impl;\n\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport leo.astray.examen.dto.FichajeResumenDTO;\nimport leo.astray.examen.dto.JugadorRequestDTO;\nimport leo.astray.examen.dto.JugadorResponseDTO;\nimport leo.astray.examen.entity.Fichaje;\nimport leo.astray.examen.entity.Jugador;\nimport leo.astray.examen.entity.PerfilEstadistico;\nimport leo.astray.examen.repository.IJugadorRepository;\nimport leo.astray.examen.service.IJugadorService;\n\n@Service\npublic class JugadorServiceImpl implements IJugadorService {\n\n    @Autowired\n    private IJugadorRepository jugadorRepository;\n\n    @Override\n    @Transactional\n    public JugadorResponseDTO crear(JugadorRequestDTO dto) {\n        // DTO -&gt; Entity (la conversion ocurre AQUI, en el servicio)\n        // El perfil se crea primero: el constructor de Jugador lo exige (paso 11).\n        // Solo conocemos los goles; el resto de estadisticas empieza en 0.\n        PerfilEstadistico perfil = new PerfilEstadistico(0, dto.goles(), 0, 0.0);\n        Jugador jugador = new Jugador(dto.nombre(), dto.mote(), dto.posicion(), perfil);\n        Jugador guardado = jugadorRepository.save(jugador);\n        return mapearADTO(guardado);\n    }\n\n    // @Transactional(readOnly = true): la sesion sigue abierta al recorrer fichajes (LAZY)\n    @Override\n    @Transactional(readOnly = true)\n    public Optional&lt;JugadorResponseDTO&gt; obtenerPorId(Long id) {\n        Optional&lt;Jugador&gt; opt = jugadorRepository.findById(id);\n        if (opt.isEmpty()) {\n            return Optional.empty();\n        }\n        return Optional.of(mapearADTO(opt.get()));\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public List&lt;JugadorResponseDTO&gt; listar() {\n        List&lt;JugadorResponseDTO&gt; lista = new ArrayList&lt;&gt;();\n        for (Jugador j : jugadorRepository.findAll()) {\n            lista.add(mapearADTO(j));\n        }\n        return lista;\n    }\n\n    @Override\n    @Transactional\n    public boolean eliminar(Long id) {\n        if (!jugadorRepository.existsById(id)) {\n            return false;\n        }\n        jugadorRepository.deleteById(id);\n        return true;\n    }\n\n    // Entity -&gt; DTO\n    private JugadorResponseDTO mapearADTO(Jugador j) {\n        List&lt;FichajeResumenDTO&gt; fichajes = new ArrayList&lt;&gt;();\n        for (Fichaje f : j.getFichajes()) {\n            fichajes.add(new FichajeResumenDTO(f.getTemporada(), f.getEquipo().getNombre()));\n        }\n        return new JugadorResponseDTO(j.getId(), j.getNombre(), j.getMote(), j.getPosicion(),\n                j.getPerfil().getGoles(), fichajes);\n    }\n}<\/pre>\n<table>\n<tr><th>Pieza<\/th><th>Qu\u00e9 hace<\/th><\/tr>\n<tr><td><code>@Service<\/code><\/td><td>\u00abSpring, esta clase es un cocinero: cr\u00e9ala y gu\u00e1rdala.\u00bb<\/td><\/tr>\n<tr><td><code>@Autowired IJugadorRepository<\/code><\/td><td>El servicio recibe el repositorio, el <b>mismo<\/b> de la Parte 1.<\/td><\/tr>\n<tr><td><code>@Transactional<\/code><\/td><td>Mantiene abierta la sesi\u00f3n con la base mientras el m\u00e9todo trabaja. Es lo mismo que el tutorial pide para <code>run<\/code> en el paso 16, pero ahora en el servicio.<\/td><\/tr>\n<tr><td><code>@Transactional(readOnly = true)<\/code><\/td><td>En los m\u00e9todos que solo leen: m\u00e1s r\u00e1pido y m\u00e1s seguro.<\/td><\/tr>\n<tr><td><code>Optional&lt;JugadorResponseDTO&gt;<\/code><\/td><td>Una caja que puede venir <b>vac\u00eda<\/b>. Vac\u00eda significa \u00abno existe\u00bb.<\/td><\/tr>\n<tr><td><code>boolean eliminar<\/code><\/td><td><code>true<\/code> si borr\u00f3; <code>false<\/code> si el jugador no exist\u00eda.<\/td><\/tr>\n<tr><td><code>mapearADTO<\/code> y el <code>new Jugador(...)<\/code> de <code>crear<\/code><\/td><td>Aqu\u00ed ocurre la <b>conversi\u00f3n<\/b> DTO a Entity y Entity a DTO: solo en el Service.<\/td><\/tr>\n<\/table>\n<h4>M\u00e9todo por m\u00e9todo: qu\u00e9 hace <code>JugadorServiceImpl<\/code><\/h4>\n<table>\n<tr><th>M\u00e9todo<\/th><th>Qu\u00e9 hace, paso a paso<\/th><\/tr>\n<tr><td><code>crear<\/code><\/td><td>(1) Recibe el <code>JugadorRequestDTO<\/code>. (2) Crea primero el <code>PerfilEstadistico<\/code> con los goles que llegan (el resto de estad\u00edsticas empieza en 0) y despu\u00e9s el <code>Jugador<\/code>, pas\u00e1ndole el perfil en el constructor, porque la relaci\u00f3n del paso 11 es obligatoria. (3) <code>save<\/code> lo guarda en MySQL y devuelve el jugador ya con su <code>id<\/code>. (4) Lo convierte en <code>JugadorResponseDTO<\/code> y lo devuelve.<\/td><\/tr>\n<tr><td><code>obtenerPorId<\/code><\/td><td>Busca con <code>findById<\/code>, que devuelve un <code>Optional<\/code>. Si est\u00e1 vac\u00edo, devuelve <code>Optional.empty()<\/code> (el Controller dir\u00e1 404). Si no, convierte el jugador en DTO y lo mete en el <code>Optional<\/code>.<\/td><\/tr>\n<tr><td><code>listar<\/code><\/td><td>Pide todos los jugadores con <code>findAll<\/code>, convierte cada uno en DTO dentro de un bucle y devuelve la lista. Si no hay ninguno, la lista sale vac\u00eda (no es un error).<\/td><\/tr>\n<tr><td><code>eliminar<\/code><\/td><td>Comprueba si existe. Si no, devuelve <code>false<\/code>. Si existe, lo borra y devuelve <code>true<\/code>.<\/td><\/tr>\n<tr><td><code>mapearADTO<\/code><\/td><td>M\u00e9todo <code>private<\/code> de ayuda: pasa de Entity a DTO. Es <code>private<\/code> porque no forma parte del contrato; solo lo usan los dem\u00e1s m\u00e9todos de esta clase.<\/td><\/tr>\n<\/table>\n\n<h4>\u00bfQu\u00e9 hace el <code>!<\/code> en <code>if (!jugadorRepository.existsById(id))<\/code>?<\/h4>\n<p>El s\u00edmbolo <code>!<\/code> significa <b>NO<\/b>: <b>invierte<\/b> un valor booleano. <code>existsById(id)<\/code> responde <code>true<\/code> si hay un jugador con ese id y <code>false<\/code> si no. Con el <code>!<\/code> delante, la condici\u00f3n se lee: <b>\u00absi NO existe\u2026\u00bb<\/b>.<\/p>\n<table>\n<tr><th>Situaci\u00f3n<\/th><th><code>existsById(id)<\/code><\/th><th><code>!existsById(id)<\/code><\/th><th>Qu\u00e9 pasa<\/th><\/tr>\n<tr><td>El jugador <b>existe<\/b><\/td><td><code>true<\/code><\/td><td><code>false<\/code><\/td><td>No entra en el <code>if<\/code>. Sigue, borra y devuelve <code>true<\/code>.<\/td><\/tr>\n<tr><td>El jugador <b>no existe<\/b><\/td><td><code>false<\/code><\/td><td><code>true<\/code><\/td><td>Entra en el <code>if<\/code> y hace <code>return false<\/code>. El m\u00e9todo termina sin borrar nada.<\/td><\/tr>\n<\/table>\n<p>Sin esa comprobaci\u00f3n no podr\u00edamos distinguir los dos casos: <code>deleteById<\/code> no avisa si el id no existe, as\u00ed que el Controller nunca sabr\u00eda cu\u00e1ndo responder <b>404<\/b> en lugar de <b>204<\/b>.<\/p>\n\n<div class=\"warn\"><b>Error frecuente: \u00abThe constructor Jugador(...) is undefined\u00bb.<\/b> Significa que los datos del <code>new Jugador(...)<\/code> no coinciden con ning\u00fan constructor de tu <code>Jugador.java<\/code>. Aqu\u00ed se usa el de 4 par\u00e1metros del paso 11: <code>Jugador(String nombre, String mote, Posicion posicion, PerfilEstadistico perfil)<\/code>. Si el error menciona <code>(String, String, Posicion)<\/code>, todav\u00eda tienes el constructor de 3 par\u00e1metros del paso 6: c\u00e1mbialo como indica el paso 11. Si tienes otro distinto, por ejemplo con <code>fichajes<\/code>, deja solo el vac\u00edo y el de 4. Para comprobarlo, abre <code>Jugador.java<\/code> y mira sus constructores.<\/div>\n\n<div class=\"why\"><b>Las 4 reglas de oro.<\/b> (1) El Controller nunca importa una Entity. (2) El Repository nunca recibe ni devuelve DTO. (3) La conversi\u00f3n ocurre solo en el Service. (4) El contrato <code>IService<\/code> solo habla de DTO: si una firma menciona una Entity, el dise\u00f1o est\u00e1 roto.<\/div>\n<div class=\"kid\">La <b>interfaz<\/b> es el men\u00fa (promete platos) y la <b>implementaci\u00f3n<\/b> es el cocinero que los hace. El camarero solo conoce el men\u00fa, no al cocinero, as\u00ed que puedes cambiar de cocinero sin avisar al camarero.<\/div>\n\n<h3><span class=\"step\">4<\/span>El Controller: el camarero que traduce<\/h3>\n<pre class=\"code\" data-f=\"controller/JugadorController.java\">package leo.astray.examen.controller;\n\nimport java.net.URI;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.servlet.support.ServletUriComponentsBuilder;\n\nimport jakarta.validation.Valid;\nimport leo.astray.examen.dto.JugadorRequestDTO;\nimport leo.astray.examen.dto.JugadorResponseDTO;\nimport leo.astray.examen.service.IJugadorService;\n\n/** El camarero: solo importa DTO y el IService. Nunca una Entity ni un Repository. */\n@RestController\n@RequestMapping(\"/api/jugadores\")\npublic class JugadorController {\n\n    @Autowired\n    private IJugadorService jugadorService;\n\n    // POST /api/jugadores -&gt; 201 + Location | 400 (si @Valid falla, Spring ya responde 400)\n    @PostMapping\n    public ResponseEntity&lt;JugadorResponseDTO&gt; crear(@Valid @RequestBody JugadorRequestDTO dto) {\n        JugadorResponseDTO creado = jugadorService.crear(dto);\n        URI location = ServletUriComponentsBuilder\n                .fromCurrentRequest()\n                .path(\"/{id}\")\n                .buildAndExpand(creado.id())\n                .toUri();\n        return ResponseEntity.created(location).body(creado);\n    }\n\n    // GET /api/jugadores/{id} -&gt; 200 | 404\n    @GetMapping(\"/{id}\")\n    public ResponseEntity&lt;JugadorResponseDTO&gt; obtenerPorId(@PathVariable Long id) {\n        Optional&lt;JugadorResponseDTO&gt; opt = jugadorService.obtenerPorId(id);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // GET /api/jugadores -&gt; 200\n    @GetMapping\n    public ResponseEntity&lt;List&lt;JugadorResponseDTO&gt;&gt; listar() {\n        return ResponseEntity.ok(jugadorService.listar());\n    }\n\n    // DELETE /api/jugadores/{id} -&gt; 204 | 404\n    @DeleteMapping(\"/{id}\")\n    public ResponseEntity&lt;Void&gt; eliminar(@PathVariable Long id) {\n        if (jugadorService.eliminar(id)) {\n            return ResponseEntity.noContent().build();\n        }\n        return ResponseEntity.notFound().build();\n    }\n}<\/pre>\n<table>\n<tr><th>Anotaci\u00f3n<\/th><th>Significado<\/th><\/tr>\n<tr><td><code>@RestController<\/code><\/td><td>Esta clase atiende peticiones HTTP y devuelve datos (JSON), no p\u00e1ginas web.<\/td><\/tr>\n<tr><td><code>@RequestMapping(\"/api/jugadores\")<\/code><\/td><td>Todas las rutas de esta clase empiezan as\u00ed.<\/td><\/tr>\n<tr><td><code>@GetMapping<\/code>, <code>@PostMapping<\/code>, <code>@DeleteMapping<\/code><\/td><td>El <b>verbo HTTP<\/b> que atiende cada m\u00e9todo: leer, crear, borrar (<code>@PutMapping<\/code> ser\u00eda actualizar).<\/td><\/tr>\n<tr><td><code>@PathVariable Long id<\/code><\/td><td>Coge el <code>{id}<\/code> de la URL: <code>/api/jugadores/<b>1<\/b><\/code>.<\/td><\/tr>\n<tr><td><code>@RequestBody<\/code><\/td><td>Convierte el JSON que llega en un objeto Java (el DTO).<\/td><\/tr>\n<tr><td><code>@Valid<\/code><\/td><td>Comprueba las reglas (<code>@NotBlank<\/code>\u2026) antes de entrar al m\u00e9todo. Si fallan, 400.<\/td><\/tr>\n<tr><td><code>ResponseEntity<\/code><\/td><td>Una caja con <b>c\u00f3digo HTTP, cuerpo y cabeceras<\/b>.<\/td><\/tr>\n<tr><td><code>ResponseEntity.created(location)<\/code><\/td><td><b>201<\/b> m\u00e1s la cabecera <code>Location<\/code>: d\u00f3nde est\u00e1 lo que acabas de crear.<\/td><\/tr>\n<tr><td><code>ResponseEntity.noContent().build()<\/code><\/td><td><b>204<\/b>: hecho, no hay nada que devolver.<\/td><\/tr>\n<\/table>\n\n<h3>C\u00f3mo se traduce lo que devuelve el servicio<\/h3>\n<table>\n<tr><th>El Service devuelve<\/th><th>El Controller responde<\/th><\/tr>\n<tr><td><code>Optional<\/code> con valor<\/td><td>200 con el DTO (<code>ResponseEntity.ok<\/code>)<\/td><\/tr>\n<tr><td><code>Optional.empty()<\/code><\/td><td>404 (<code>ResponseEntity.notFound().build()<\/code>)<\/td><\/tr>\n<tr><td><code>true<\/code> al borrar<\/td><td>204<\/td><\/tr>\n<tr><td><code>false<\/code> al borrar<\/td><td>404<\/td><\/tr>\n<tr><td>Un DTO tras crear<\/td><td>201 m\u00e1s <code>Location<\/code><\/td><\/tr>\n<tr><td>La validaci\u00f3n falla<\/td><td>400, autom\u00e1tico gracias a <code>@Valid<\/code><\/td><\/tr>\n<\/table>\n<div class=\"why\">Otra forma, que tambi\u00e9n se usa mucho, es que el Service lance excepciones propias y un <code>@RestControllerAdvice<\/code> las convierta en c\u00f3digos HTTP en un solo sitio. La soluci\u00f3n del ejercicio de la biblioteca (Parte 3) usa <code>Optional<\/code>, <code>int<\/code> y <code>boolean<\/code>, as\u00ed que esta gu\u00eda hace lo mismo. Conviene conocer las dos.<\/div>\n\n<h3>Los c\u00f3digos HTTP, como sem\u00e1foros<\/h3>\n<div class=\"grid\">\n  <div class=\"box\"><b>200 OK<\/b><br>Todo bien (GET, PUT).<\/div>\n  <div class=\"box\"><b>201 Created<\/b> y <code>Location<\/code><br>Se cre\u00f3 algo (POST).<\/div>\n  <div class=\"box\"><b>204 No Content<\/b><br>Hecho y sin nada que devolver (DELETE).<\/div>\n  <div class=\"box\"><b>400 Bad Request<\/b><br>Datos mal enviados.<\/div>\n  <div class=\"box\"><b>404 Not Found<\/b><br>Ese id no existe.<\/div>\n  <div class=\"box\"><b>409 Conflict<\/b><br>Choca con lo que ya hay (por ejemplo, borrar algo que otros usan).<\/div>\n<\/div>\n\n<h3><span class=\"step\">5<\/span>Probar la API<\/h3>\n<p>Una API se prueba <b>envi\u00e1ndole peticiones HTTP<\/b>, igual que har\u00eda una web o una app. Para enviarlas necesitas un \u00abcliente\u00bb: <b>Postman<\/b> (un programa con ventanas, el m\u00e1s c\u00f3modo) o <code>curl<\/code> (una orden de terminal). Primero Postman, paso a paso.<\/p>\n\n<h4>Antes de empezar<\/h4>\n<ul>\n<li><b>La aplicaci\u00f3n tiene que estar arrancada<\/b> (en la consola debe aparecer <code>Started ExamenApplication<\/code>). Escucha en el puerto <b>8080<\/b>. Si Postman dice <i>Could not send request<\/i> o <i>Connection refused<\/i>, la app no est\u00e1 en marcha.<\/li>\n<li><b>Postman<\/b> es gratuito: desc\u00e1rgalo desde <code>postman.com/downloads<\/code>. No necesitas cuenta para lo que vamos a hacer; si te pide iniciar sesi\u00f3n, busca la opci\u00f3n de continuar sin ella.<\/li>\n<\/ul>\n\n<h4>Una petici\u00f3n GET (no lleva cuerpo)<\/h4>\n<p class=\"paso\">1. Abre una pesta\u00f1a de petici\u00f3n nueva: el bot\u00f3n <b>+<\/b> junto a las pesta\u00f1as (o <b>New<\/b> &gt; <b>HTTP<\/b>).<\/p>\n<p class=\"paso\">2. A la izquierda de la barra de direcci\u00f3n hay un desplegable con el <b>m\u00e9todo<\/b> HTTP. Elige <b>GET<\/b>.<\/p>\n<p class=\"paso\">3. Escribe la direcci\u00f3n: <code>http://localhost:8080/api/jugadores/1<\/code><\/p>\n<p class=\"paso\">4. Pulsa <b>Send<\/b>. Abajo aparece la respuesta: arriba a la derecha el <b>c\u00f3digo<\/b> (<code>200 OK<\/code>), en la pesta\u00f1a <b>Body<\/b> el JSON con el jugador y en <b>Headers<\/b> las cabeceras.<\/p>\n<p>Cada trozo de la direcci\u00f3n tiene su raz\u00f3n: <code>localhost<\/code> es tu propio ordenador, <code>8080<\/code> el puerto de Spring, <code>/api/jugadores<\/code> viene del <code>@RequestMapping<\/code> del Controller y el <code>/1<\/code> final es el <code>{id}<\/code> que recoge <code>@PathVariable<\/code>. Los <b>GET<\/b> y los <b>DELETE<\/b> <b>no llevan cuerpo<\/b>: el dato que necesitan (el id) viaja en la direcci\u00f3n.<\/p>\n\n<h4>Un POST con cuerpo: crear un jugador<\/h4>\n<p>Un POST env\u00eda datos, y esos datos van en el <b>cuerpo<\/b> (<i>body<\/i>) de la petici\u00f3n. Se configura as\u00ed:<\/p>\n<p class=\"paso\">1. Pesta\u00f1a nueva. M\u00e9todo <b>POST<\/b>. Direcci\u00f3n: <code>http://localhost:8080/api/jugadores<\/code> (sin id: a\u00fan no existe, lo crear\u00e1 MySQL).<\/p>\n<p class=\"paso\">2. Justo debajo de la direcci\u00f3n hay pesta\u00f1as (<i>Params, Authorization, Headers, Body\u2026<\/i>). Abre <b>Body<\/b>.<\/p>\n<p class=\"paso\">3. Marca la opci\u00f3n <b>raw<\/b>.<\/p>\n<p class=\"paso\">4. A la derecha de las opciones aparece un desplegable que pone <b>Text<\/b>. <b>C\u00e1mbialo a JSON.<\/b> Es el paso que m\u00e1s se olvida: al elegir JSON, Postman a\u00f1ade solo la cabecera <code>Content-Type: application/json<\/code> (puedes verla en la pesta\u00f1a <b>Headers<\/b>). Esa cabecera le dice a Spring \u00abel cuerpo es JSON\u00bb. Sin ella, el servidor responde <b>415 Unsupported Media Type<\/b>.<\/p>\n<p class=\"paso\">5. En el recuadro grande escribe el cuerpo:<\/p>\n<pre class=\"code\" data-f=\"Body (raw, JSON) de POST /api/jugadores\">{\n    \"nombre\": \"Nuevo\",\n    \"mote\": \"Cohete\",\n    \"posicion\": \"DEFENSA\",\n    \"goles\": 2\n}<\/pre>\n<p class=\"paso\">6. Pulsa <b>Send<\/b>. Debes recibir <b>201 Created<\/b>. En <b>Body<\/b> ver\u00e1s el <code>JugadorResponseDTO<\/code> con el <code>id<\/code> que ha asignado MySQL y la lista de fichajes vac\u00eda. En <b>Headers<\/b> ver\u00e1s <code>Location: http://localhost:8080/api/jugadores/N<\/code>, la direcci\u00f3n del jugador reci\u00e9n creado. C\u00f3piala en una pesta\u00f1a GET para comprobar que existe.<\/p>\n\n<h4>C\u00f3mo se construye el cuerpo y por qu\u00e9 as\u00ed<\/h4>\n<p>El cuerpo no se inventa: <b>su forma sale del Request DTO<\/b>. Spring lee el JSON y rellena el <code>record JugadorRequestDTO<\/code> campo por campo. Por eso el JSON tiene que ser un reflejo del record:<\/p>\n<pre class=\"code\" data-f=\"De record a JSON: cada campo del DTO es una clave\">record JugadorRequestDTO(             {\n    String   nombre,                    \"nombre\":   \"Nuevo\",\n    String   mote,                      \"mote\":     \"Cohete\",\n    Posicion posicion,                  \"posicion\": \"DEFENSA\",\n    Integer  goles)                     \"goles\":    2\n                                      }<\/pre>\n<table>\n<tr><th>Campo del record<\/th><th>C\u00f3mo se escribe en el JSON<\/th><th>Qu\u00e9 pasa si se hace mal<\/th><\/tr>\n<tr><td><code>String nombre<\/code><\/td><td>Clave <code>\"nombre\"<\/code> y texto entre comillas dobles.<\/td><td>Vac\u00edo, solo espacios o ausente: <code>@NotBlank<\/code> \u2192 <b>400<\/b>.<\/td><\/tr>\n<tr><td><code>String mote<\/code><\/td><td>Igual: <code>\"mote\": \"Cohete\"<\/code>.<\/td><td>Igual que el nombre \u2192 <b>400<\/b>.<\/td><\/tr>\n<tr><td><code>Posicion posicion<\/code><\/td><td>Es un enum: se escribe como <b>texto con el nombre exacto de la constante<\/b>: <code>\"PORTERO\"<\/code>, <code>\"DEFENSA\"<\/code>, <code>\"CENTROCAMPISTA\"<\/code> o <code>\"DELANTERO\"<\/code>.<\/td><td>Ausente (<code>@NotNull<\/code>) o un valor que no existe, como <code>\"LATERAL\"<\/code> o <code>\"defensa\"<\/code> en min\u00fasculas \u2192 <b>400<\/b>.<\/td><\/tr>\n<tr><td><code>Integer goles<\/code><\/td><td>Un n\u00famero <b>sin comillas<\/b>: <code>\"goles\": 2<\/code>.<\/td><td>Ausente (<code>@NotNull<\/code>) o negativo (<code>@PositiveOrZero<\/code>) \u2192 <b>400<\/b>.<\/td><\/tr>\n<\/table>\n<p>Las reglas que se deducen del DTO:<\/p>\n<ul>\n<li><b>Las claves se llaman igual que los campos del record<\/b>, respetando may\u00fasculas y min\u00fasculas: <code>nombre<\/code>, no <code>Nombre<\/code>. Jackson, la biblioteca que convierte el JSON, empareja por nombre.<\/li>\n<li><b>No hay <code>id<\/code> en el cuerpo<\/b> porque <code>JugadorRequestDTO<\/code> no lo tiene: lo genera MySQL (paso 2). Si lo env\u00edas, Spring Boot ignora por defecto los campos desconocidos, as\u00ed que no tendr\u00eda ning\u00fan efecto.<\/li>\n<li><b>El JSON es plano<\/b>: <code>goles<\/code> va suelto y no dentro de un objeto \u00abperfil\u00bb, porque el DTO lo pide as\u00ed (el cliente no conoce el <code>PerfilEstadistico<\/code>; la conversi\u00f3n la hace el Service).<\/li>\n<li><b>Tipos<\/b>: el texto va entre comillas dobles; los n\u00fameros y <code>true<\/code>/<code>false<\/code>, sin comillas.<\/li>\n<li><b>Sintaxis estricta<\/b>: solo comillas dobles (nunca simples), sin coma despu\u00e9s del \u00faltimo campo y sin comentarios. Un error de sintaxis da <b>400<\/b> antes de llegar siquiera a validar.<\/li>\n<\/ul>\n<div class=\"kid\">El DTO es el <b>formulario en blanco<\/b> y el cuerpo JSON es el formulario <b>rellenado<\/b>: cada casilla del formulario tiene su nombre y solo se rellenan las casillas que existen.<\/div>\n\n<h4>Probar los errores a prop\u00f3sito<\/h4>\n<p>Cambia el cuerpo del POST por cada uno de estos y comprueba el c\u00f3digo. Si te sale otro, el problema est\u00e1 en tu c\u00f3digo:<\/p>\n<table>\n<tr><th>Cuerpo que env\u00edas<\/th><th>C\u00f3digo<\/th><th>Por qu\u00e9<\/th><\/tr>\n<tr><td><code>{\"nombre\": \"\", \"mote\": \"\"}<\/code><\/td><td><b>400<\/b><\/td><td>Nombre y mote vac\u00edos y faltan <code>posicion<\/code> y <code>goles<\/code>.<\/td><\/tr>\n<tr><td><code>{\"nombre\":\"Nuevo\",\"mote\":\"Cohete\",\"posicion\":\"LATERAL\",\"goles\":2}<\/code><\/td><td><b>400<\/b><\/td><td><code>LATERAL<\/code> no es una constante de <code>Posicion<\/code>.<\/td><\/tr>\n<tr><td><code>{\"nombre\":\"Nuevo\",\"mote\":\"Cohete\",\"posicion\":\"DEFENSA\"}<\/code><\/td><td><b>400<\/b><\/td><td>Falta <code>goles<\/code> (<code>@NotNull<\/code>).<\/td><\/tr>\n<tr><td><code>{\"nombre\":\"Nuevo\",\"mote\":\"Cohete\",\"posicion\":\"DEFENSA\",\"goles\":-1}<\/code><\/td><td><b>400<\/b><\/td><td><code>@PositiveOrZero<\/code> no admite negativos.<\/td><\/tr>\n<tr><td><code>{\"nombre\": \"Nuevo\",}<\/code> (coma de m\u00e1s)<\/td><td><b>400<\/b><\/td><td>JSON mal escrito.<\/td><\/tr>\n<tr><td>Cuerpo correcto, pero con el desplegable en <b>Text<\/b><\/td><td><b>415<\/b><\/td><td>No viaja <code>Content-Type: application/json<\/code>.<\/td><\/tr>\n<tr><td>POST con la pesta\u00f1a Body vac\u00eda (sin cuerpo)<\/td><td><b>400<\/b><\/td><td>El POST exige un cuerpo (<code>@RequestBody<\/code>).<\/td><\/tr>\n<\/table>\n<div class=\"warn\">El <code>mote<\/code> es <b>\u00fanico<\/b> en la base de datos. Si repites el mismo POST con el mismo mote, MySQL lo rechaza y recibir\u00e1s un <b>500<\/b> (en este puente no controlamos duplicados). Cambia el mote en cada prueba.<\/div>\n\n<h4>El DELETE<\/h4>\n<p>M\u00e9todo <b>DELETE<\/b>, direcci\u00f3n <code>http://localhost:8080/api/jugadores/999<\/code> y <b>sin cuerpo<\/b>. Un id que no existe da <b>404<\/b>. Con un id que s\u00ed existe, la respuesta es <b>204<\/b> y la pesta\u00f1a Body sale vac\u00eda: es correcto, significa \u00abborrado y no hay nada que devolver\u00bb.<\/p>\n\n<h4>La misma prueba con curl (alternativa)<\/h4>\n<p>Con <code>curl<\/code> haces lo mismo desde la terminal. <code>-i<\/code> muestra el c\u00f3digo y las cabeceras, <code>-X<\/code> indica el m\u00e9todo, <code>-H<\/code> a\u00f1ade una cabecera (aqu\u00ed el <code>Content-Type<\/code> que Postman pon\u00eda solo) y <code>-d<\/code> es el cuerpo. En CMD y Git Bash, las comillas dobles del JSON se escriben con <code>\\<\/code> delante. En PowerShell escribe <code>curl.exe<\/code>, porque <code>curl<\/code> a secas es otra orden.<\/p>\n<pre class=\"code\" data-f=\"curl (CMD o Git Bash)\">curl -i http://localhost:8080/api/jugadores/1\ncurl -i http://localhost:8080/api/jugadores/999\ncurl -i -X POST http://localhost:8080/api/jugadores -H \"Content-Type: application/json\" -d \"{\\\"nombre\\\":\\\"Nuevo\\\",\\\"mote\\\":\\\"Cohete\\\",\\\"posicion\\\":\\\"DEFENSA\\\",\\\"goles\\\":2}\"\ncurl -i -X POST http://localhost:8080/api/jugadores -H \"Content-Type: application/json\" -d \"{\\\"nombre\\\":\\\"\\\",\\\"mote\\\":\\\"\\\"}\"\ncurl -i -X DELETE http://localhost:8080/api/jugadores/999<\/pre>\n<table>\n<tr><th>Petici\u00f3n<\/th><th>Debe devolver<\/th><\/tr>\n<tr><td><code>GET /api/jugadores/1<\/code><\/td><td><b>200<\/b> con Ana (mote Rayo), 6 goles y 1 fichaje: 26/27 con \u00abEstrellas\u00bb<\/td><\/tr>\n<tr><td><code>GET /api/jugadores/999<\/code><\/td><td><b>404<\/b><\/td><\/tr>\n<tr><td><code>POST<\/code> con datos buenos<\/td><td><b>201<\/b> m\u00e1s la cabecera <code>Location<\/code><\/td><\/tr>\n<tr><td><code>POST<\/code> con nombre y mote vac\u00edos<\/td><td><b>400<\/b><\/td><\/tr>\n<tr><td><code>DELETE /api/jugadores/999<\/code><\/td><td><b>404<\/b><\/td><\/tr>\n<\/table>\n<div class=\"warn\">Si dejaste en <code>run<\/code> las pruebas de los pasos 9 y 15, la aplicaci\u00f3n cambia el nombre de Ana (queda \u00abAna Garc\u00eda\u00bb) y su posici\u00f3n cada vez que arranca. Para ver los datos tal y como los carga <code>data.sql<\/code>, vac\u00eda el cuerpo de <code>run<\/code> antes de probar.<\/div>\n<div class=\"ok\">A\u00f1ad\u00ed este c\u00f3digo al proyecto del tutorial, cargu\u00e9 los datos de su <code>data.sql<\/code> y un test autom\u00e1tico (MockMvc) confirm\u00f3 esos 200, 201, 400 y 404. Lo hice sin MySQL, con una base H2 en memoria.<\/div>\n\n<h3>La ruta completa de una petici\u00f3n<\/h3>\n<pre class=\"code\" data-f=\"GET /api/jugadores/1: de punta a punta\">Cliente \u2500\u2500GET\u2500\u2500\u25b6 JugadorController.obtenerPorId(1)\n                     \u2502  @Autowired IJugadorService\n                     \u25bc\n              JugadorServiceImpl.obtenerPorId(1)     \u25c0\u2500\u2500 empieza la @Transactional\n                     \u2502  @Autowired IJugadorRepository\n                     \u25bc\n              jugadorRepository.findById(1)  \u2500\u2500\u25b6 MySQL (SELECT jugadores\u2026)\n                     \u2502\n                     \u25bc  recorre fichajes y equipo (LAZY, con la transacci\u00f3n a\u00fan abierta)\n              mapearADTO(jugador)  \u2192 JugadorResponseDTO\n                                                      \u25c0\u2500\u2500 termina la @Transactional\n                     \u2502\n                     \u25bc  Optional con valor\nCliente \u25c0\u2500\u2500 200 + JSON \u2500\u2500 ResponseEntity.ok(dto)<\/pre>\n<div class=\"warn\">Spring Boot deja, por defecto, la sesi\u00f3n abierta durante <b>toda la petici\u00f3n web<\/b> (<code>open-in-view=true<\/code>), y eso <b>oculta<\/b> los fallos de LAZY mal resueltos. En la biblioteca lo desactivamos (<code>spring.jpa.open-in-view=false<\/code>) para que el <code>LazyInitializationException<\/code> sea real y se entienda por qu\u00e9 la conversi\u00f3n a DTO se hace <b>dentro<\/b> del Service con <code>@Transactional<\/code>.<\/div>\n\n<h3>Lista del puente<\/h3>\n<ul class=\"check\">\n<li>Dependencia <code>spring-boot-starter-validation<\/code> en el <code>pom.xml<\/code><\/li>\n<li>Paquetes <code>dto<\/code>, <code>service<\/code> (con <code>impl<\/code>) y <code>controller<\/code><\/li>\n<li>DTO de entrada y de salida, con \u00abResumen\u00bb para romper bucles<\/li>\n<li>IService solo con DTO; Service con <code>@Transactional<\/code> y la conversi\u00f3n<\/li>\n<li>Controller solo con DTO e IService, y <code>ResponseEntity<\/code> con su c\u00f3digo<\/li>\n<li>Probado con Postman o curl<\/li>\n<\/ul>\n<p>Si todo esto lo entiendes con <b>un<\/b> jugador, est\u00e1s listo para la Parte 3.<\/p>\n<\/section>\n\n\n<div class=\"part p3\" id=\"parte3\" data-indice=\"La API completa\">\n  <span class=\"num\">3<\/span>\n  <span class=\"ttl\">La API completa: biblioteca editorial\n    <small>Soluci\u00f3n con Spring Boot, JPA, DTO y validaci\u00f3n, explicada para presentarla<\/small>\n  <\/span>\n  <span class=\"set\">CARTAS 020\u2013032 \u00b7 HOLO<\/span>\n<\/div>\n<section id=\"s18\">\n<header class=\"opener r3\"><h2>El ejercicio: qu\u00e9 se pide y c\u00f3mo se resuelve<\/h2><div class=\"set\"><b>020<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<p>El ejercicio no eval\u00faa cu\u00e1nto c\u00f3digo sabes escribir, sino si sabes <b>conectar las capas<\/b> de un sistema Spring: RestController, IService, Service, JpaRepository, Entity, DTO y ResponseEntity. Antes de programar hay que poder <b>dibujar y justificar<\/b> el sistema: qu\u00e9 relaci\u00f3n une cada entidad, qu\u00e9 viaja entre capas y qu\u00e9 c\u00f3digo HTTP devuelve cada endpoint.<\/p>\n\n<table>\n<tr><th>Entidades<\/th><th>Relaci\u00f3n<\/th><th>Anotaci\u00f3n JPA<\/th><th>Analog\u00eda<\/th><\/tr>\n<tr><td>Editorial y Libro<\/td><td><b>1 : N<\/b><\/td><td><code>@OneToMany<\/code> / <code>@ManyToOne<\/code><\/td><td>Una mam\u00e1, muchos hijos<\/td><\/tr>\n<tr><td>Autor y Libro<\/td><td><b>N : M<\/b><\/td><td><code>@ManyToMany<\/code><\/td><td>Muchos ni\u00f1os, muchos juguetes<\/td><\/tr>\n<tr><td>Libro y FichaLibro<\/td><td><b>1 : 1<\/b><\/td><td><code>@OneToOne<\/code><\/td><td>Cada ni\u00f1o, un carn\u00e9<\/td><\/tr>\n<\/table>\n<p>Las capas: <code>RestController \u2192 IService \u2192 Service \u2192 JpaRepository \u2192 MySQL<\/code>. Cada RestController inyecta su IService, y cada Service inyecta los repositorios que necesita, siempre con <code>@Autowired<\/code>.<\/p>\n\n<h3>El modelo de datos: cuatro Entities, cinco tablas<\/h3>\n<figure class=\"fig\">\n<svg viewBox=\"0 0 900 350\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"13\">\n  <g>\n    <rect x=\"10\" y=\"20\" width=\"200\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#0b6b6b\" stroke-width=\"2\"/><rect x=\"10\" y=\"20\" width=\"200\" height=\"28\" rx=\"8\" fill=\"#0b6b6b\"/><rect x=\"10\" y=\"38\" width=\"200\" height=\"10\" fill=\"#0b6b6b\"/>\n    <text x=\"24\" y=\"40\" fill=\"#fff\" font-weight=\"700\">EDITORIAL<\/text><text x=\"24\" y=\"72\">id (PK)<\/text><text x=\"24\" y=\"92\">nombre<\/text><text x=\"24\" y=\"112\">pais<\/text>\n\n    <rect x=\"350\" y=\"20\" width=\"210\" height=\"132\" rx=\"8\" fill=\"#fff\" stroke=\"#2c5f8f\" stroke-width=\"2\"/><rect x=\"350\" y=\"20\" width=\"210\" height=\"28\" rx=\"8\" fill=\"#2c5f8f\"/><rect x=\"350\" y=\"38\" width=\"210\" height=\"10\" fill=\"#2c5f8f\"/>\n    <text x=\"364\" y=\"40\" fill=\"#fff\" font-weight=\"700\">LIBRO<\/text><text x=\"364\" y=\"72\">id (PK)<\/text><text x=\"364\" y=\"92\">titulo<\/text><text x=\"364\" y=\"112\" fill=\"#b23a2b\" font-weight=\"700\">editorial_id (FK)<\/text>\n\n    <rect x=\"690\" y=\"20\" width=\"200\" height=\"152\" rx=\"8\" fill=\"#fff\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><rect x=\"690\" y=\"20\" width=\"200\" height=\"28\" rx=\"8\" fill=\"#2e7d4f\"/><rect x=\"690\" y=\"38\" width=\"200\" height=\"10\" fill=\"#2e7d4f\"/>\n    <text x=\"704\" y=\"40\" fill=\"#fff\" font-weight=\"700\">FICHA_LIBRO<\/text><text x=\"704\" y=\"72\">id (PK)<\/text><text x=\"704\" y=\"92\">isbn (\u00fanico)<\/text><text x=\"704\" y=\"112\">paginas<\/text><text x=\"704\" y=\"132\">anio<\/text><text x=\"704\" y=\"152\" fill=\"#b23a2b\" font-weight=\"700\">libro_id (FK, \u00fanico)<\/text>\n\n    <rect x=\"10\" y=\"215\" width=\"200\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#536171\" stroke-width=\"2\"/><rect x=\"10\" y=\"215\" width=\"200\" height=\"28\" rx=\"8\" fill=\"#536171\"/><rect x=\"10\" y=\"233\" width=\"200\" height=\"10\" fill=\"#536171\"/>\n    <text x=\"24\" y=\"235\" fill=\"#fff\" font-weight=\"700\">AUTOR<\/text><text x=\"24\" y=\"267\">id (PK)<\/text><text x=\"24\" y=\"287\">nombre<\/text><text x=\"24\" y=\"307\">nacionalidad<\/text>\n\n    <rect x=\"350\" y=\"225\" width=\"210\" height=\"102\" rx=\"8\" fill=\"#fbeccf\" stroke=\"#a35b00\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/><rect x=\"350\" y=\"225\" width=\"210\" height=\"28\" rx=\"8\" fill=\"#a35b00\"/><rect x=\"350\" y=\"243\" width=\"210\" height=\"10\" fill=\"#a35b00\"/>\n    <text x=\"364\" y=\"245\" fill=\"#fff\" font-weight=\"700\">LIBRO_AUTOR<\/text><text x=\"364\" y=\"277\" fill=\"#b23a2b\" font-weight=\"700\">libro_id (FK)<\/text><text x=\"364\" y=\"297\" fill=\"#b23a2b\" font-weight=\"700\">autor_id (FK)<\/text>\n  <\/g>\n  <g stroke=\"#14212b\" stroke-width=\"2\" fill=\"none\"><path pathLength=\"1\" class=\"ld\" d=\"M210 80 H350\"/><path pathLength=\"1\" class=\"ld\" d=\"M560 80 H690\"/><path pathLength=\"1\" class=\"ld\" d=\"M455 152 V225\"/><path pathLength=\"1\" class=\"ld\" d=\"M210 275 H350\"/><\/g>\n  <g text-anchor=\"middle\" fill=\"#4f5d68\"><text x=\"280\" y=\"70\">1 : N<\/text><text x=\"625\" y=\"70\">1 : 1<\/text><text x=\"485\" y=\"192\">1 : N<\/text><text x=\"280\" y=\"265\">1 : N<\/text>\n  <text x=\"450\" y=\"345\" font-size=\"12\">La tabla discontinua la crea @ManyToMany. No es una Entity: solo guarda parejas de ids.<\/text><\/g>\n<\/svg>\n<figcaption>La FK de la relaci\u00f3n 1:N est\u00e1 en LIBRO, la del 1:1 en FICHA_LIBRO, y LIBRO_AUTOR solo guarda pares de ids<\/figcaption>\n<\/figure>\n<div class=\"kid\">La \u00abcuerda\u00bb (la clave for\u00e1nea, FK) la lleva el ni\u00f1o peque\u00f1o de la mano de su mam\u00e1. En el N:M, como son muchos con muchos, hace falta una <b>libretita aparte<\/b> (<code>LIBRO_AUTOR<\/code>) que apunte \u00abAna juega con el coche\u00bb. Esa libretita no es una Entity.<\/div>\n\n<h3>Los endpoints<\/h3>\n<table>\n<tr><th>Endpoint<\/th><th>\u00c9xito<\/th><th>Casos de error<\/th><\/tr>\n<tr><td><code>POST /api/editoriales<\/code><\/td><td>201 y Location<\/td><td>400 datos inv\u00e1lidos<\/td><\/tr>\n<tr><td><code>GET /api/editoriales/{id}<\/code><\/td><td>200<\/td><td>404<\/td><\/tr>\n<tr><td><code>DELETE /api/editoriales/{id}<\/code><\/td><td>204<\/td><td>404 \u00b7 <b>409<\/b> si tiene libros<\/td><\/tr>\n<tr><td><code>POST /api/autores<\/code><\/td><td>201 y Location<\/td><td>400<\/td><\/tr>\n<tr><td><code>GET /api/autores/{id}/libros<\/code><\/td><td>200 (<code>LibroResumenDTO<\/code>)<\/td><td>404<\/td><\/tr>\n<tr><td><code>POST /api/libros<\/code><\/td><td>201 y Location<\/td><td>400 \u00b7 404 si no existe la editorial o alg\u00fan autor<\/td><\/tr>\n<tr><td><code>GET /api/libros/{id}<\/code><\/td><td>200 (<code>LibroResponseDTO<\/code>)<\/td><td>404<\/td><\/tr>\n<tr><td><code>GET /api/libros?editorialId=<\/code><\/td><td>200 (lista, puede estar vac\u00eda)<\/td><td>404 si la editorial no existe<\/td><\/tr>\n<tr><td><code>PUT /api/libros/{id}/ficha<\/code><\/td><td>200<\/td><td>404 \u00b7 400 si la ficha es inv\u00e1lida<\/td><\/tr>\n<tr><td><code>POST /api/libros/{id}/autores/{autorId}<\/code><\/td><td>200<\/td><td>404 del libro o del autor<\/td><\/tr>\n<tr><td><code>DELETE /api/libros/{id}/autores/{autorId}<\/code><\/td><td>204<\/td><td>404<\/td><\/tr>\n<\/table>\n\n<h3>El orden en que se construye<\/h3>\n<ol>\n<li><b>Proyecto<\/b> y configuraci\u00f3n (secci\u00f3n 21).<\/li>\n<li><b>Misi\u00f3n 1<\/b>: decidir las relaciones y escribir las Entities (22).<\/li>\n<li><b>Repositorios<\/b> (23).<\/li>\n<li><b>Misi\u00f3n 2<\/b>: los DTO (24).<\/li>\n<li><b>Servicios<\/b> con la conversi\u00f3n Entity y DTO (25) y <b>controladores<\/b> con los c\u00f3digos de estado (26).<\/li>\n<li><b>Misi\u00f3n 5<\/b>: provocar las trampas (27).<\/li>\n<li><b>Ampliaci\u00f3n<\/b>: validaci\u00f3n con <code>@Valid<\/code> (28).<\/li>\n<li><b>Probar<\/b> (29).<\/li>\n<\/ol>\n<\/section>\n\n<section id=\"s19\">\n<header class=\"opener r3\"><h2>Crear y configurar el proyecto<\/h2><div class=\"set\"><b>021<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<p>El proceso es el de la Parte 1 (pasos 1 a 3 del tutorial). Estos son los valores de este ejercicio:<\/p>\n<table>\n<tr><th>Campo de Initializr<\/th><th>Valor<\/th><\/tr>\n<tr><td>Project / Language<\/td><td>Maven \u00b7 Java<\/td><\/tr>\n<tr><td>Spring Boot<\/td><td>4.1.2 (una versi\u00f3n estable, no SNAPSHOT ni RC)<\/td><\/tr>\n<tr><td>Group<\/td><td><code>edu.rico.biblioteca<\/code><\/td><\/tr>\n<tr><td>Artifact<\/td><td><code>biblioteca<\/code><\/td><\/tr>\n<tr><td>Package name<\/td><td><code>edu.rico.biblioteca<\/code><\/td><\/tr>\n<tr><td>Packaging / Java / Configuration<\/td><td>Jar \u00b7 21 \u00b7 Properties<\/td><\/tr>\n<tr><td>Dependencias<\/td><td><b>MySQL Driver<\/b>, <b>Spring Data JPA<\/b>, <b>Spring Boot DevTools<\/b>, <b>Spring Web<\/b>, <b>Validation<\/b><\/td><\/tr>\n<\/table>\n<div class=\"why\">Cada dependencia tiene su motivo. <b>Spring Data JPA<\/b> trae las entidades, los repositorios y Hibernate. <b>MySQL Driver<\/b> es el traductor entre Java y MySQL. <b>Spring Web<\/b> trae Spring MVC y el servidor Tomcat, para tener endpoints. <b>Validation<\/b> permite el <code>@Valid<\/code> de la ampliaci\u00f3n (secci\u00f3n 28). <b>DevTools<\/b> reinicia la app al guardar.<\/div>\n\n<pre class=\"code\" data-f=\"pom.xml  (dependencies)\">&lt;dependencies&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;\n        &lt;artifactId&gt;spring-boot-starter-data-jpa&lt;/artifactId&gt;\n    &lt;/dependency&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;\n        &lt;artifactId&gt;spring-boot-starter-webmvc&lt;/artifactId&gt;\n    &lt;/dependency&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;\n        &lt;artifactId&gt;spring-boot-starter-validation&lt;/artifactId&gt;\n    &lt;/dependency&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;\n        &lt;artifactId&gt;spring-boot-devtools&lt;/artifactId&gt;\n        &lt;scope&gt;runtime&lt;/scope&gt;\n        &lt;optional&gt;true&lt;/optional&gt;\n    &lt;/dependency&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;com.mysql&lt;/groupId&gt;\n        &lt;artifactId&gt;mysql-connector-j&lt;/artifactId&gt;\n        &lt;scope&gt;runtime&lt;/scope&gt;\n    &lt;/dependency&gt;\n&lt;/dependencies&gt;<\/pre>\n<p>En Spring Boot 4.1 el starter web se llama <code>spring-boot-starter-webmvc<\/code> (en apuntes antiguos ver\u00e1s <code>spring-boot-starter-web<\/code>).<\/p>\n\n<pre class=\"code\" data-f=\"src/main/resources/application.properties\">spring.application.name=biblioteca\n\nspring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?createDatabaseIfNotExist=true&amp;serverTimezone=UTC\nspring.datasource.username=root\nspring.datasource.password=\n\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true\nspring.jpa.properties.hibernate.format_sql=true\n# Sin sesion abierta durante toda la peticion: asi el fallo LAZY es real y entendemos donde va @Transactional\nspring.jpa.open-in-view=false<\/pre>\n<table>\n<tr><th>Propiedad<\/th><th>Por qu\u00e9<\/th><\/tr>\n<tr><td><code>createDatabaseIfNotExist=true<\/code><\/td><td>Si la base <code>biblioteca<\/code> no existe, MySQL la crea al conectar. Evita el error \u00abUnknown database\u00bb.<\/td><\/tr>\n<tr><td><code>ddl-auto=update<\/code><\/td><td>Hibernate crea o ajusta las tablas y <b>conserva<\/b> los datos entre ejecuciones.<\/td><\/tr>\n<tr><td><code>show-sql<\/code> y <code>format_sql<\/code><\/td><td>Muestran el SQL en la terminal. Imprescindible para contar consultas y cazar el N+1 (secci\u00f3n 27).<\/td><\/tr>\n<tr><td><code>open-in-view=false<\/code><\/td><td>Evita que la sesi\u00f3n quede abierta durante toda la petici\u00f3n. As\u00ed el fallo LAZY es real y se entiende d\u00f3nde va <code>@Transactional<\/code>.<\/td><\/tr>\n<\/table>\n<p>Ajusta usuario, contrase\u00f1a y puerto a los de tu MySQL.<\/p>\n\n<h3>Paquetes<\/h3>\n<pre class=\"code\" data-f=\"estructura\">edu/rico/biblioteca/\n \u251c\u2500 BibliotecaApplication.java\n \u251c\u2500 entity/       Editorial, Libro, Autor, FichaLibro\n \u251c\u2500 repository/   IEditorialRepository, ILibroRepository, IAutorRepository, IFichaLibroRepository\n \u251c\u2500 dto/          *RequestDTO, *ResponseDTO, *ResumenDTO, FichaLibroDTO\n \u251c\u2500 service/      IEditorialService, IAutorService, ILibroService\n \u2502   \u2514\u2500 impl/     EditorialServiceImpl, AutorServiceImpl, LibroServiceImpl\n \u2514\u2500 controller/   EditorialController, AutorController, LibroController<\/pre>\n<div class=\"ok\">Con el proyecto vac\u00edo, <code>.\\mvnw.cmd spring-boot:run<\/code> debe arrancar sin errores (Tomcat en el 8080 y \u00abStarted\u00bb). Si falla aqu\u00ed, es la conexi\u00f3n, no el c\u00f3digo.<\/div>\n<\/section>\n\n<section id=\"s20\">\n<header class=\"opener r3\"><h2>Misi\u00f3n 1: decisiones de dise\u00f1o y entidades<\/h2><div class=\"set\"><b>022<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<p>Antes de codificar se responden, por escrito, las preguntas clave sobre el modelo. Estas son las respuestas, razonadas, y debajo el c\u00f3digo que las cumple.<\/p>\n\n<h3>1. Lado propietario y <code>mappedBy<\/code><\/h3>\n<p>El <b>lado propietario<\/b> es el que tiene la clave for\u00e1nea f\u00edsica (o el <code>@JoinTable<\/code>). El otro lado lleva <code>mappedBy<\/code>, que significa \u00abyo no tengo la cuerda, ya la tiene el otro\u00bb.<\/p>\n<figure class=\"fig\">\n<svg viewBox=\"0 0 900 190\" xmlns=\"http://www.w3.org/2000/svg\" text-anchor=\"middle\">\n  <g font-size=\"34\">\n    <use href=\"#i-person\" class=\"ic\" x=\"80.8\" y=\"54.36\" width=\"18.4\" height=\"18.4\"/><text x=\"90\" y=\"125\" font-size=\"13\" font-weight=\"700\">Editorial<\/text><text x=\"90\" y=\"145\" font-size=\"12\" fill=\"#4f5d68\">mappedBy = \"editorial\"<\/text>\n    <use href=\"#i-child\" class=\"ic\" x=\"390.8\" y=\"54.36\" width=\"18.4\" height=\"18.4\"/><text x=\"400\" y=\"125\" font-size=\"13\" font-weight=\"700\">Libro<\/text><text x=\"400\" y=\"145\" font-size=\"12\" fill=\"#b23a2b\">PROPIETARIO (FK)<\/text>\n    <use href=\"#i-card\" class=\"ic\" x=\"690.8\" y=\"54.36\" width=\"18.4\" height=\"18.4\"/><text x=\"700\" y=\"125\" font-size=\"13\" font-weight=\"700\">FichaLibro<\/text><text x=\"700\" y=\"145\" font-size=\"12\" fill=\"#b23a2b\">PROPIETARIO (FK)<\/text>\n  <\/g>\n  <path d=\"M385 60 Q240 20 120 55\" stroke=\"#0b6b6b\" stroke-width=\"3\" fill=\"none\" stroke-dasharray=\"2 6\" stroke-linecap=\"round\"/>\n  <path d=\"M440 55 Q560 20 665 55\" stroke=\"#0b6b6b\" stroke-width=\"3\" fill=\"none\" stroke-dasharray=\"2 6\" stroke-linecap=\"round\" transform=\"rotate(180 552 45) translate(-0 0)\" opacity=\"0\"/>\n  <text x=\"250\" y=\"25\" font-size=\"13\" fill=\"#0b6b6b\" font-weight=\"700\">\u00abllevo a mi mam\u00e1 de la mano\u00bb<\/text>\n  <text x=\"550\" y=\"25\" font-size=\"13\" fill=\"#4f5d68\">Libro tiene mappedBy=\"libro\" hacia su ficha<\/text>\n  <text x=\"450\" y=\"178\" font-size=\"13\" fill=\"#4f5d68\">N:M \u2192 elige un due\u00f1o del @JoinTable (lo natural: Libro). Autor lleva mappedBy=\"autores\".<\/text>\n<\/svg>\n<figcaption>Qui\u00e9n tiene la cuerda<\/figcaption>\n<\/figure>\n<table>\n<tr><th>Relaci\u00f3n<\/th><th>Propietario<\/th><th>Lleva <code>mappedBy<\/code><\/th><th>Por qu\u00e9<\/th><\/tr>\n<tr><td>Editorial 1:N Libro<\/td><td><b>Libro<\/b><\/td><td>Editorial (<code>mappedBy = \"editorial\"<\/code>)<\/td><td>Libro aloja la FK f\u00edsica <code>editorial_id<\/code> (<code>@JoinColumn<\/code>).<\/td><\/tr>\n<tr><td>Libro 1:1 FichaLibro<\/td><td><b>FichaLibro<\/b><\/td><td>Libro (<code>mappedBy = \"libro\"<\/code>)<\/td><td>FichaLibro contiene la columna <code>libro_id<\/code> (<code>@JoinColumn<\/code>).<\/td><\/tr>\n<tr><td>Libro N:M Autor<\/td><td><b>Libro<\/b><\/td><td>Autor (<code>mappedBy = \"autores\"<\/code>)<\/td><td>Hay que elegir un due\u00f1o de la tabla intermedia; elegimos Libro con <code>@JoinTable(name = \"libro_autor\", ...)<\/code>.<\/td><\/tr>\n<\/table>\n\n<h3>2. \u00bfPor qu\u00e9 <code>@ManyToOne(fetch = LAZY)<\/code> hacia Editorial?<\/h3>\n<p>JPA aplica por defecto <code>FetchType.EAGER<\/code> en <code>@ManyToOne<\/code>. Si listamos 100 libros, Hibernate disparar\u00eda consultas inmediatas a la tabla <code>editorial<\/code> por cada uno, o forzar\u00eda un JOIN constante. Con <b>LAZY<\/b>, la editorial solo se consulta cuando el servicio realmente la pide.<\/p>\n<div class=\"grid\">\n  <div class=\"box\"><b class=\"bad\">EAGER<\/b> (por defecto)<br>Pides la hamburguesa y te traen tambi\u00e9n bebida, patatas y juguete, aunque no lo pediste.<\/div>\n  <div class=\"box\"><b class=\"good\">LAZY<\/b><br>Te traen solo la hamburguesa. La bebida, cuando la pidas.<\/div>\n<\/div>\n\n<h3>3. En el N:M, \u00bf<code>Set<\/code> o <code>List<\/code>?<\/h3>\n<p>Usamos <b>Set<\/b> para evitar duplicidades l\u00f3gicas (un autor no puede estar asignado dos veces al mismo libro) y para que Hibernate gestione la tabla intermedia con sentencias INSERT y DELETE puntuales, en lugar de recrear toda la colecci\u00f3n como hace con <code>List<\/code>. La desventaja de Set es que exige implementar bien <code>equals()<\/code> y <code>hashCode()<\/code>, basados en el identificador o en una clave de negocio.<\/p>\n<div class=\"grid\">\n  <div class=\"box\"><b>List<\/b><br>Una fila donde \u00abPepe\u00bb puede estar dos veces. Al borrar uno, Hibernate puede borrar y reinsertar toda la tabla intermedia.<\/div>\n  <div class=\"box\"><b>Set<\/b><br>Un corro donde cada ni\u00f1o entra una vez. Sin duplicados, pero hay que hacer bien <code>equals<\/code> y <code>hashCode<\/code>.<\/div>\n<\/div>\n\n<h3>4. Cascada y <code>orphanRemoval<\/code>: Libro con Ficha frente a Editorial con Libro<\/h3>\n<ul>\n<li><b>Libro a FichaLibro:<\/b> <code>CascadeType.ALL<\/code> y <code>orphanRemoval = true<\/code>, porque la ficha es un componente dependiente con ciclo de vida supeditado al libro. Si se elimina el libro, o se desvincula la ficha, la ficha debe desaparecer.<\/li>\n<li><b>Editorial a Libro:<\/b> ni <code>CascadeType.REMOVE<\/code> ni <code>orphanRemoval<\/code>. Si se borrara una editorial, se borrar\u00eda en cascada todo el cat\u00e1logo de libros y sus registros hist\u00f3ricos: una p\u00e9rdida masiva de datos en vez de una restricci\u00f3n de integridad. Por eso se responde con un <b>409<\/b>.<\/li>\n<\/ul>\n<div class=\"kid\">Si tiras tu cuaderno, su portada va a la basura contigo (cascade). Pero si cierra el cole, no tiras a todos los ni\u00f1os.<\/div>\n\n<h3>5. Sincronizaci\u00f3n en memoria: <code>addAutor<\/code> y <code>removeAutor<\/code><\/h3>\n<p>En una relaci\u00f3n bidireccional hay que actualizar <b>los dos lados<\/b> para que los objetos no se contradigan durante la transacci\u00f3n. Para eso se dise\u00f1an en Libro los m\u00e9todos de conveniencia <code>addAutor<\/code> y <code>removeAutor<\/code> (y <code>setFicha<\/code> para el 1:1).<\/p>\n<figure class=\"fig\">\n<svg viewBox=\"0 0 700 150\" xmlns=\"http://www.w3.org/2000/svg\" text-anchor=\"middle\">\n  <use href=\"#i-child\" class=\"ic\" x=\"94.7\" y=\"16.99\" width=\"50.6\" height=\"50.6\"/><text x=\"120\" y=\"95\" font-size=\"13\" font-weight=\"700\">Libro<\/text><text x=\"120\" y=\"115\" font-size=\"12\">autores = {Ana}<\/text>\n  <use href=\"#i-child\" class=\"ic\" x=\"554.7\" y=\"16.99\" width=\"50.6\" height=\"50.6\"/><text x=\"580\" y=\"95\" font-size=\"13\" font-weight=\"700\">Autor Ana<\/text><text x=\"580\" y=\"115\" font-size=\"12\">libros = {Libro}<\/text>\n  <path pathLength=\"1\" class=\"ld\" d=\"M200 45 H500\" stroke=\"#2e7d4f\" stroke-width=\"4\" marker-end=\"url(#ar2)\"/>\n  <path pathLength=\"1\" class=\"ld\" d=\"M500 75 H200\" stroke=\"#2e7d4f\" stroke-width=\"4\" marker-end=\"url(#ar2)\"/>\n  <defs><marker id=\"ar2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#2e7d4f\"/><\/marker><\/defs>\n  <text x=\"350\" y=\"35\" font-size=\"13\">1. libro.autores.add(ana)<\/text>\n  <text x=\"350\" y=\"100\" font-size=\"13\">2. ana.libros.add(libro)<\/text>\n  <text x=\"350\" y=\"135\" font-size=\"12\" fill=\"#4f5d68\">\u00a1Los DOS lados! si no, se contradicen.<\/text>\n<\/svg>\n<figcaption>Ambos lados al d\u00eda<\/figcaption>\n<\/figure>\n<div class=\"kid\">Si Ana dice \u00abPepe es mi amigo\u00bb, Pepe tambi\u00e9n tiene que apuntar \u00abAna es mi amiga\u00bb. Si no, uno cree que son amigos y el otro no.<\/div>\n\n<h3>Las cuatro entidades<\/h3>\n<details open><summary>Libro.java: propietario del N:M y de la FK a editorial, con los m\u00e9todos helper<\/summary>\n<pre class=\"code\" data-f=\"entity/Libro.java\">package edu.rico.biblioteca.entity;\n\nimport jakarta.persistence.*;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\n@Entity\n@Table(name = \"libro\")\npublic class Libro {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, length = 150)\n    private String titulo;\n\n    // Lado propietario de 1:N con carga perezosa\n    @ManyToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"editorial_id\", nullable = false)\n    private Editorial editorial;\n\n    // Relaci\u00f3n 1:1 con propagaci\u00f3n total y borrado de hu\u00e9rfanos\n    @OneToOne(mappedBy = \"libro\", cascade = CascadeType.ALL, orphanRemoval = true, fetch = FetchType.LAZY)\n    private FichaLibro ficha;\n\n    // Lado propietario de N:M mediante tabla intermedia\n    @ManyToMany\n    @JoinTable(\n        name = \"libro_autor\",\n        joinColumns = @JoinColumn(name = \"libro_id\"),\n        inverseJoinColumns = @JoinColumn(name = \"autor_id\")\n    )\n    private Set&lt;Autor&gt; autores = new HashSet&lt;&gt;();\n\n    public Libro() {\n    }\n\n    public Libro(String titulo) {\n        this.titulo = titulo;\n    }\n\n    // M\u00e9todos helper de sincronizaci\u00f3n bidireccional\n    public void addAutor(Autor autor) {\n        this.autores.add(autor);\n        autor.getLibros().add(this);\n    }\n\n    public void removeAutor(Autor autor) {\n        this.autores.remove(autor);\n        autor.getLibros().remove(this);\n    }\n\n    public void setFicha(FichaLibro ficha) {\n        this.ficha = ficha;\n        if (ficha != null) {\n            ficha.setLibro(this);\n        }\n    }\n\n    public Long getId() { return id; }\n    public void setId(Long id) { this.id = id; }\n    public String getTitulo() { return titulo; }\n    public void setTitulo(String titulo) { this.titulo = titulo; }\n    public Editorial getEditorial() { return editorial; }\n    public void setEditorial(Editorial editorial) { this.editorial = editorial; }\n    public FichaLibro getFicha() { return ficha; }\n    public Set&lt;Autor&gt; getAutores() { return autores; }\n    public void setAutores(Set&lt;Autor&gt; autores) { this.autores = autores; }\n\n    @Override\n    public boolean equals(Object o) {\n        return o instanceof Libro other &amp;&amp; id != null &amp;&amp; id.equals(other.id);\n    }\n\n    @Override\n    public int hashCode() {\n        return Libro.class.hashCode();\n    }\n}<\/pre><\/details>\n<details><summary>Editorial.java: lado \u00abuno\u00bb, <code>mappedBy<\/code>, sin cascade REMOVE<\/summary>\n<pre class=\"cod
