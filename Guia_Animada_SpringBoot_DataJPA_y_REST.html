o general a lo concreto. Cada paso lleva la idea que conviene decir en voz alta.<\/p>\n<ol>\n<li><b>Qu\u00e9 problema resuelve.<\/b> \u00abUna API REST para una biblioteca editorial: editoriales, libros, autores y la ficha t\u00e9cnica de cada libro.\u00bb<\/li>\n<li><b>El modelo.<\/b> \u00abCuatro entidades y cinco tablas. Hay tres relaciones: 1:N entre Editorial y Libro, 1:1 entre Libro y Ficha, y N:M entre Libro y Autor, que genera una tabla intermedia.\u00bb (Ense\u00f1a la figura de la secci\u00f3n 20.)<\/li>\n<li><b>Qui\u00e9n es el due\u00f1o de cada relaci\u00f3n.<\/b> \u00abEl due\u00f1o es el que tiene la clave for\u00e1nea; el otro lado lleva <code>mappedBy<\/code>.\u00bb Despu\u00e9s, LAZY, <code>Set<\/code> y la cascada.<\/li>\n<li><b>Las capas.<\/b> \u00abController recibe HTTP, Service tiene la l\u00f3gica y Repository habla con MySQL. Cada capa solo conoce a la de al lado.\u00bb (Ense\u00f1a la figura de la secci\u00f3n 25.)<\/li>\n<li><b>Los DTO.<\/b> \u00abEl cliente nunca ve una Entity. Los DTO de salida llevan res\u00famenes para romper los bucles; los de entrada llevan ids, no objetos.\u00bb<\/li>\n<li><b>Una petici\u00f3n completa.<\/b> Cuenta <code>POST /api/libros<\/code> paso a paso, con la figura de la secci\u00f3n 25: valida, busca la editorial y los autores, ensambla, guarda, convierte y responde 201.<\/li>\n<li><b>Los c\u00f3digos HTTP.<\/b> \u00abEl servicio devuelve Optional, int o boolean y el controlador lo traduce: 200, 201, 204, 404 y 409.\u00bb<\/li>\n<li><b>Las trampas.<\/b> Bucle infinito, LAZY, N+1, 409 y duplicados: qu\u00e9 se ve y c\u00f3mo se arregla (secci\u00f3n 27).<\/li>\n<li><b>La validaci\u00f3n.<\/b> \u00abCon <code>@Valid<\/code> el 400 sale autom\u00e1tico, antes de llegar al servicio.\u00bb<\/li>\n<li><b>Demostraci\u00f3n.<\/b> Ejecuta la secuencia de curl de la secci\u00f3n 29.<\/li>\n<\/ol>\n\n<h3>Preguntas que pueden salir<\/h3>\n<table>\n<tr><th>Pregunta<\/th><th>Respuesta corta<\/th><\/tr>\n<tr><td>\u00bfPor qu\u00e9 un DTO y no la Entity?<\/td><td>Para no exponer la base de datos y para evitar el bucle infinito al serializar relaciones bidireccionales.<\/td><\/tr>\n<tr><td>\u00bfQui\u00e9n es el lado propietario del N:M?<\/td><td>Libro, porque declara el <code>@JoinTable<\/code>. Autor es el lado inverso y lleva <code>mappedBy = \"autores\"<\/code>.<\/td><\/tr>\n<tr><td>\u00bfPor qu\u00e9 <code>Set<\/code> y no <code>List<\/code>?<\/td><td>Evita duplicados y que Hibernate recree toda la tabla intermedia. A cambio hay que implementar <code>equals<\/code> y <code>hashCode<\/code>.<\/td><\/tr>\n<tr><td>\u00bfPor qu\u00e9 LAZY?<\/td><td>Para no cargar datos que no se piden. El EAGER por defecto de <code>@ManyToOne<\/code> puede disparar consultas de m\u00e1s.<\/td><\/tr>\n<tr><td>\u00bfPara qu\u00e9 sirve <code>@Transactional<\/code> aqu\u00ed?<\/td><td>Mantiene la sesi\u00f3n abierta mientras se convierte a DTO, para que las relaciones LAZY se puedan leer.<\/td><\/tr>\n<tr><td>\u00bfPor qu\u00e9 <code>LibroServiceImpl<\/code> no usa <code>IEditorialService<\/code>?<\/td><td>Necesita la Entity <code>Editorial<\/code>, y ese servicio solo entrega DTO.<\/td><\/tr>\n<tr><td>\u00bfC\u00f3mo se evita un 500 al borrar una editorial con libros?<\/td><td>Se cuentan sus libros antes (<code>countByEditorialId<\/code>) y se devuelve 409.<\/td><\/tr>\n<tr><td>\u00bfQu\u00e9 es el N+1 y c\u00f3mo se arregla?<\/td><td>Una consulta m\u00e1s N por cada elemento. Con <code>JOIN FETCH<\/code> o <code>@EntityGraph<\/code> se trae todo junto.<\/td><\/tr>\n<tr><td>\u00bfQu\u00e9 cambia con <code>@Valid<\/code>?<\/td><td>La validaci\u00f3n sale del servicio y se hace en la entrada, con anotaciones en los DTO. Responde 400 sola.<\/td><\/tr>\n<\/table>\n\n<h3>L\u00edmites de esta soluci\u00f3n (conviene conocerlos antes de que pregunten)<\/h3>\n<ul>\n<li><b>ISBN duplicado.<\/b> El ISBN es <code>unique<\/code>. Si se env\u00eda un ISBN que ya existe, la base lanza un <code>DataIntegrityViolationException<\/code> que nadie captura, y el cliente recibe un 500. Se arreglar\u00eda comprob\u00e1ndolo antes o con un <code>@RestControllerAdvice<\/code> que lo convierta en 409.<\/li>\n<li><b>El 404 depende de un texto.<\/b> <code>LibroController.crear<\/code> detecta \u00abno existe\u00bb dentro del mensaje de la excepci\u00f3n. Funciona, pero si alguien cambia el mensaje deja de funcionar; una excepci\u00f3n propia ser\u00eda m\u00e1s robusta.<\/li>\n<li><b>Listar libros por editorial<\/b> no usa fetch (secci\u00f3n 27, trampa 3).<\/li>\n<li><b>Las dos formas de avisar de un error<\/b> (devolver <code>Optional<\/code>, <code>int<\/code> o <code>boolean<\/code>, o lanzar excepciones propias con un <code>@RestControllerAdvice<\/code>) son v\u00e1lidas. Esta soluci\u00f3n usa la primera.<\/li>\n<\/ul>\n\n<h3>Qu\u00e9 he reconstruido yo a partir de las capturas del docx<\/h3>\n<p>El c\u00f3digo del docx est\u00e1 en im\u00e1genes y no se ve entero. Esto es lo que he completado, para que quede claro:<\/p>\n<ul>\n<li>Los getters y setters de las entidades y los <code>equals<\/code> y <code>hashCode<\/code> por <code>id<\/code> de Libro y Autor.<\/li>\n<li>Las anotaciones de <code>AutorRequestDTO<\/code> (<code>@NotBlank<\/code> en los dos campos), que el docx no muestra.<\/li>\n<li><code>@Valid<\/code> en el <code>PUT<\/code> de la ficha, porque el docx indica ponerlo en cada m\u00e9todo que recibe un DTO.<\/li>\n<li>El <code>fetch = LAZY<\/code> en <code>Libro.ficha<\/code>, que en la captura est\u00e1 cortado.<\/li>\n<\/ul>\n<\/section>\n\n<section id=\"s29\">\n<header class=\"opener r3\"><h2>Entregables y r\u00fabrica<\/h2><div class=\"set\"><b>031<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<h3>Lo que hay que entregar<\/h3>\n<ul class=\"check\">\n<li><b>Diagrama de clases<\/b> con las 4 Entities, marcando lado propietario, <code>mappedBy<\/code>, <code>cascade<\/code> y <code>fetch<\/code> (usa la secci\u00f3n 22).<\/li>\n<li><b>Diagrama de capas<\/b> con una pastilla <code>@Autowired<\/code> en cada inyecci\u00f3n <b>real<\/b> de tu proyecto (usa la figura de la secci\u00f3n 25).<\/li>\n<li><b>Diagramas de recorrido<\/b> de dos operaciones m\u00e1s (aqu\u00ed abajo).<\/li>\n<li>El <b>proyecto funcionando<\/b> con los endpoints, probado con Postman o curl.<\/li>\n<li>Un <b>documento corto<\/b> con las respuestas de las misiones 1, 4 y 5 (est\u00e1n razonadas en las secciones 22, 23 y 25).<\/li>\n<\/ul>\n\n<h3>Recorrido de <code>GET /api/libros/{id}<\/code><\/h3>\n<pre class=\"code\" data-f=\"d\u00f3nde empieza la transacci\u00f3n y d\u00f3nde se carga cada relaci\u00f3n\">Cliente \u2500\u2500GET /api/libros/7\u2500\u2500\u25b6 LibroController.obtenerPorId(7)\n                                    \u2502  @Autowired ILibroService\n                                    \u25bc\n                         LibroServiceImpl.obtenerPorId(7)   \u25c0\u2500\u2500 EMPIEZA @Transactional(readOnly)\n                                    \u2502\n                                    \u25bc\n                  libroRepo.findByIdConRelaciones(7)  \u2500\u2500\u25b6 MySQL: 1 SELECT con LEFT JOIN FETCH\n                                    \u2502       carga YA: editorial + ficha + autores\n                                    \u25bc\n                  mapearAResponseDTO(libro)          todo est\u00e1 cargado: no hay m\u00e1s consultas\n                                    \u2502\n                                    \u25bc                  \u25c0\u2500\u2500 TERMINA @Transactional\n                              Optional con valor\nCliente \u25c0\u2500\u2500 200 + LibroResponseDTO \u2500\u2500 ResponseEntity.ok(...)\n\n (si no existe: Optional.empty() \u2192 el controlador responde 404)<\/pre>\n\n<h3>Recorrido de <code>POST /api/libros/{id}/autores/{autorId}<\/code><\/h3>\n<pre class=\"code\" data-f=\"d\u00f3nde empieza la transacci\u00f3n y d\u00f3nde se carga cada relaci\u00f3n\">Cliente \u2500\u2500POST \u2026/libros/7/autores/3\u2500\u2500\u25b6 LibroController.asociarAutor(7, 3)\n                                              \u25bc\n                                LibroServiceImpl.asociarAutor     \u25c0\u2500\u2500 EMPIEZA @Transactional\n                                              \u2502\n                  libroRepo.findById(7)  \u2500\u2500\u25b6 carga el libro (editorial y autores LAZY)\n                  autorRepo.findById(3)  \u2500\u2500\u25b6 carga el autor\n                                              \u2502   (si falta alguno \u2192 Optional.empty() \u2192 404)\n                                              \u25bc\n                  libro.addAutor(autor)          en MEMORIA: se actualizan los DOS lados\n                                                 (al tocar getAutores() se carga la colecci\u00f3n LAZY)\n                  libroRepo.save(libro)\n                  mapearAResponseDTO(libro)\n                                              \u25bc                   \u25c0\u2500\u2500 TERMINA @Transactional \u2192 COMMIT\n                                                  aqu\u00ed se ejecuta el INSERT en LIBRO_AUTOR\nCliente \u25c0\u2500\u2500 200 + LibroResponseDTO<\/pre>\n<div class=\"why\">El <code>INSERT<\/code> en <code>LIBRO_AUTOR<\/code> se ejecuta al <b>confirmar la transacci\u00f3n<\/b> (commit), no en la l\u00ednea de <code>addAutor<\/code>. Hibernate acumula los cambios y los env\u00eda al final.<\/div>\n\n<h3>R\u00fabrica<\/h3>\n<table>\n<tr><th>Criterio<\/th><th>Peso<\/th><th>C\u00f3mo asegurarlo<\/th><\/tr>\n<tr><td>Relaciones JPA correctas y justificadas<\/td><td><b>30 %<\/b><\/td><td>La secci\u00f3n 22, bien razonada.<\/td><\/tr>\n<tr><td>Separaci\u00f3n estricta Entity y DTO, y conversi\u00f3n en la capa adecuada<\/td><td><b>25 %<\/b><\/td><td>Controller sin imports de <code>entity<\/code>; IService solo con DTO; conversi\u00f3n solo en el servicio.<\/td><\/tr>\n<tr><td>Uso correcto de <code>ResponseEntity<\/code> y c\u00f3digos de estado<\/td><td><b>20 %<\/b><\/td><td>Tabla de la secci\u00f3n 20 y pruebas de la 29.<\/td><\/tr>\n<tr><td>Inyecci\u00f3n de dependencias coherente con el diagrama<\/td><td><b>10 %<\/b><\/td><td>Dibuja solo los <code>@Autowired<\/code> reales (figura de la secci\u00f3n 25).<\/td><\/tr>\n<tr><td>Diagramas y respuestas de comprensi\u00f3n<\/td><td><b>15 %<\/b><\/td><td>La lista de entregables.<\/td><\/tr>\n<\/table>\n<\/section>\n\n<section id=\"s30\">\n<header class=\"opener r3\"><h2>Chuleta final<\/h2><div class=\"set\"><b>032<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<table>\n<tr><th>Anotaci\u00f3n<\/th><th>D\u00f3nde<\/th><th>Para qu\u00e9<\/th><\/tr>\n<tr><td><code>@RestController<\/code> y <code>@RequestMapping<\/code><\/td><td>Controller<\/td><td>Atiende HTTP y devuelve JSON; ruta base.<\/td><\/tr>\n<tr><td><code>@GetMapping<\/code>, <code>@PostMapping<\/code>, <code>@PutMapping<\/code>, <code>@DeleteMapping<\/code><\/td><td>M\u00e9todo del controller<\/td><td>Verbo HTTP: leer, crear, actualizar, borrar.<\/td><\/tr>\n<tr><td><code>@PathVariable<\/code>, <code>@RequestParam<\/code>, <code>@RequestBody<\/code><\/td><td>Par\u00e1metro<\/td><td>Dato de la URL (<code>/{id}<\/code>), del filtro (<code>?x=<\/code>) o del JSON del cuerpo.<\/td><\/tr>\n<tr><td><code>@Valid<\/code> y <code>@NotBlank<\/code>, <code>@NotNull<\/code>, <code>@NotEmpty<\/code>, <code>@Size<\/code>, <code>@Pattern<\/code>, <code>@Min<\/code>, <code>@Max<\/code><\/td><td>Par\u00e1metro y DTO<\/td><td>Validar la entrada; si falla, 400.<\/td><\/tr>\n<tr><td><code>@Service<\/code><\/td><td>Clase<\/td><td>Spring la crea y la guarda para inyectarla.<\/td><\/tr>\n<tr><td><code>@Autowired<\/code><\/td><td>Campo<\/td><td>Spring inyecta la dependencia.<\/td><\/tr>\n<tr><td><code>@Transactional<\/code> y <code>(readOnly = true)<\/code><\/td><td>M\u00e9todo del Service<\/td><td>Sesi\u00f3n abierta mientras trabajas (LAZY).<\/td><\/tr>\n<tr><td><code>@Entity<\/code>, <code>@Table<\/code>, <code>@Id<\/code>, <code>@GeneratedValue<\/code>, <code>@Column<\/code><\/td><td>Entity<\/td><td>La clase es una tabla, con su clave y columnas.<\/td><\/tr>\n<tr><td><code>@OneToOne<\/code>, <code>@OneToMany<\/code>, <code>@ManyToOne<\/code>, <code>@ManyToMany<\/code><\/td><td>Campo<\/td><td>Las relaciones; <code>mappedBy<\/code> marca el lado inverso.<\/td><\/tr>\n<tr><td><code>@JoinColumn<\/code> y <code>@JoinTable<\/code><\/td><td>Lado propietario<\/td><td>La FK o la tabla intermedia.<\/td><\/tr>\n<tr><td><code>cascade<\/code>, <code>orphanRemoval<\/code>, <code>fetch<\/code><\/td><td>Relaci\u00f3n<\/td><td>Propagar operaciones, borrar hu\u00e9rfanos, cargar al pedirlo.<\/td><\/tr>\n<tr><td><code>@Query<\/code> con <code>JOIN FETCH<\/code>, o <code>@EntityGraph<\/code><\/td><td>Repositorio<\/td><td>Cargar relaciones de golpe (anti N+1).<\/td><\/tr>\n<\/table>\n\n<h3>Las ideas en una l\u00ednea<\/h3>\n<ul>\n<li><b>Capas:<\/b> cada una hace una cosa; cambiar una no rompe las dem\u00e1s.<\/li>\n<li><b>DTO:<\/b> el cliente no ve la base de datos ni recibe bucles.<\/li>\n<li><b>LAZY:<\/b> no traigas lo que no pides.<\/li>\n<li><b><code>mappedBy<\/code>:<\/b> \u00abyo no tengo la cuerda; la tiene el otro\u00bb.<\/li>\n<li><b><code>Set<\/code>:<\/b> sin duplicados y mejor comportamiento en el N:M.<\/li>\n<li><b><code>orphanRemoval<\/code>:<\/b> una ficha sin libro es basura, se borra.<\/li>\n<li><b>Sin cascade REMOVE de Editorial a Libro:<\/b> no borres hijos por accidente; responde 409.<\/li>\n<li><b><code>@Transactional<\/code> en el Service:<\/b> mantiene la sesi\u00f3n abierta mientras trabajas.<\/li>\n<li><b><code>JOIN FETCH<\/code> o <code>@EntityGraph<\/code>:<\/b> pedir todo de una vez (N+1).<\/li>\n<li><b><code>LibroService<\/code> usa repositorios, no <code>EditorialService<\/code>:<\/b> necesita Entities, no DTO.<\/li>\n<li><b><code>@Valid<\/code>:<\/b> el 400 sale solo, antes de llegar al servicio.<\/li>\n<\/ul>\n<\/section>\n\n\n<div class=\"part p4\" id=\"parte4\" data-indice=\"Ejercicios de pr\u00e1ctica\">\n  <span class=\"num\">4<\/span>\n  <span class=\"ttl\">Ejercicios de pr\u00e1ctica\n    <small>Enunciados tipo examen para hacerlos t\u00fa; cada uno ir\u00e1 seguido de su soluci\u00f3n<\/small>\n  <\/span>\n  <span class=\"set\">CARTAS 033\u2013033 \u00b7 RETO<\/span>\n<\/div>\n<section id=\"ejercicios\">\n<header class=\"opener r4\"><h2>Ejercicios de pr\u00e1ctica<\/h2><div class=\"set\"><b>033<\/b>/033 <span class=\"rar\">RETO<\/span><\/div><\/header>\n<p>Los ejercicios tipo examen est\u00e1n en su <b>propia secci\u00f3n<\/b>, aparte de esta gu\u00eda. Cada ejercicio tiene su <b>enunciado<\/b> y, para comprobarlo cuando termines, su <b>solucionario<\/b>.<\/p>\n<p><a class=\"btn main\" href=\"#/ejercicios\">Ir a los ejercicios \u2192<\/a><\/p>\n<\/section>\n\n<\/main>\n<\!-- Pie de p\u00e1gina -->\n<footer>El texto y el c\u00f3digo de la Parte 1 son los del tutorial, reordenados (entidades primero, una sola prueba) y comprobados. El c\u00f3digo del puente y de la Parte 3 tambi\u00e9n est\u00e1 probado con Spring Boot 4.1.2 y Hibernate 7, sobre una base H2 en modo MySQL. Para guardarla como PDF, usa Ctrl+P en el navegador.<\/footer>\n\n<\/div>\n<\/div>\n\n<nav class=\"dock\" id=\"dock\" aria-label=\"Controles de lectura\">\n  <button type=\"button\" class=\"idx\" id=\"dock-idx\" aria-controls=\"menu\">\u00cdndice<\/button>\n  <span class=\"count\" id=\"dock-count\" aria-live=\"polite\">000/033<\/span>\n  <button type=\"button\" id=\"dock-repaso\" aria-pressed=\"false\">Modo repaso<\/button>\n  <a href=\"#inicio\">Arriba<\/a>\n<\/nav>\n\n<script>\n/* Utilidades compartidas por el resto de scripts */\nwindow.Guia = {\n  // Total de cartas (lo escribe construir.py en <html data-total>)\n  total: document.documentElement.getAttribute('data-total') || '030',\n  // \u00bfEl usuario pide menos movimiento en su sistema?\n  reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,\n\n  // localStorage protegido (en modo privado puede fallar)\n  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },\n  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },\n\n  // Ejecuta fn(elemento) la primera vez que cada elemento entra en pantalla\n  alEntrar: function (elementos, fn, umbral) {\n    if (!('IntersectionObserver' in window) || Guia.reduce) { elementos.forEach(fn); return; }\n    var io = new IntersectionObserver(function (es) {\n      es.forEach(function (e) { if (e.isIntersecting) { fn(e.target); io.unobserve(e.target); } });\n    }, { threshold: umbral || .25 });\n    elementos.forEach(function (el) { io.observe(el); });\n  },\n\n  // N\u00famero de carta (p. ej. \"007\") de una secci\u00f3n\n  numero: function (sec) { var b = sec.querySelector('.opener .set b'); return b ? b.textContent : '000'; }\n};\n\n/* Bloques de c\u00f3digo: resaltado de Java y bot\u00f3n \"Copiar\". Tablas con scroll en m\u00f3vil. */\n(function () {\n  // Tablas: se envuelven en .tw para que hagan scroll horizontal en pantallas estrechas\n  document.querySelectorAll('main table').forEach(function (t) {\n    var w = document.createElement('div'); w.className = 'tw';\n    t.parentNode.insertBefore(w, t); w.appendChild(t);\n  });\n\n  // Resaltado sencillo para Java (comentarios, textos, anotaciones, palabras clave, n\u00fameros)\n  var RX = /(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)|(\"(?:[^\"\\\\\\n]|\\\\.)*\")|(@\\w+)|\\b(public|private|protected|class|interface|record|enum|extends|implements|return|new|if|else|for|try|catch|throw|import|package|static|final|void|int|long|boolean|double|null|true|false|this|instanceof)\\b|\\b(\\d+L?)\\b/g;\n  function esc(s) { return s.replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;'); }\n\n  document.querySelectorAll('pre').forEach(function (pre) {\n    var text = pre.textContent;\n    var esJava = /\\b(public|private)\\b[\\s\\S]*[{;]|^@\\w+/m.test(text) && /\\b(class|interface|record|enum|import)\\b/.test(text);\n    if (esJava) {\n      var out = '', last = 0, m;\n      RX.lastIndex = 0;\n      while ((m = RX.exec(text))) {\n        out += esc(text.slice(last, m.index));\n        var cls = m[1] ? 't-c' : m[2] ? 't-s' : m[3] ? 't-a' : m[4] ? 't-k' : 't-n';\n        out += '<span class=\"' + cls + '\">' + esc(m[0]) + '<\/span>';\n        last = RX.lastIndex;\n      }\n      out += esc(text.slice(last));\n      pre.setAttribute('data-raw', text);\n      pre.innerHTML = out;\n    }\n\n    // Bot\u00f3n Copiar\n    var b = document.createElement('button');\n    b.type = 'button'; b.className = 'copy'; b.textContent = 'Copiar';\n    b.addEventListener('click', function () {\n      var raw = pre.getAttribute('data-raw') || text;\n      function hecho() { b.textContent = 'Copiado'; setTimeout(function () { b.textContent = 'Copiar'; }, 1400); }\n      if (navigator.clipboard && navigator.clipboard.writeText) {\n        navigator.clipboard.writeText(raw).then(hecho, function () { copiaAntigua(raw); hecho(); });\n      } else { copiaAntigua(raw); hecho(); }\n    });\n    pre.appendChild(b);\n  });\n\n  // Copia para navegadores sin portapapeles moderno (o abriendo el archivo sin servidor)\n  function copiaAntigua(t) {\n    var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';\n    document.body.appendChild(a); a.select();\n    try { document.execCommand('copy'); } catch (e) {}\n    document.body.removeChild(a);\n  }\n\n  // Al imprimir, abrir todos los desplegables\n  window.addEventListener('beforeprint', function () {\n    document.querySelectorAll('details').forEach(function (d) { d.setAttribute('open', ''); });\n  });\n})();\n\n/* Cargador con porcentaje: solo la primera vez que abres la gu\u00eda en la sesi\u00f3n */\n(function () {\n  var L = document.getElementById('loader');\n  if (!L) return;\n  var visto = false;\n  try { visto = sessionStorage.getItem('guia-loaded'); sessionStorage.setItem('guia-loaded', '1'); } catch (e) {}\n\n  // Si se llega desde el selector, su cortina de color ya hace de cargador (ver recursos/paginas/entrada.js)\n  if (document.documentElement.classList.contains('entra')) { L.remove(); return; }\n\n  if (Guia.reduce || visto) {\n    L.remove();\n    // Sin cargador, la portada anima sin esperar\n    document.querySelectorAll('.hero h1 .w, .pack').forEach(function (el) { el.style.animationDelay = '0s'; });\n    return;\n  }\n\n  var bar = document.getElementById('bar'), pct = document.getElementById('pct'), n = 0;\n  for (var i = 0; i < 12; i++) bar.appendChild(document.createElement('i'));\n  var t = setInterval(function () {\n    n = Math.min(100, n + Math.ceil(Math.random() * 15));\n    pct.textContent = 'BARAJANDO ' + parseInt(Guia.total, 10) + ' CARTAS \u00b7 ' + n + '%';\n    Array.prototype.forEach.call(bar.children, function (b, i) { b.classList.toggle('on', i < Math.round(n / 100 * 12)); });\n    if (n >= 100) {\n      clearInterval(t);\n      setTimeout(function () { L.classList.add('done'); }, 150);\n      setTimeout(function () { L.remove(); }, 1100);\n    }\n  }, 55);\n})();\n\n/* Animaciones de las cartas: sobres de la portada, cartas de secci\u00f3n y diagramas */\n(function () {\n  // Guarda d\u00f3nde est\u00e1 el puntero dentro del elemento (--mx y --my, en %) para el brillo; devuelve [x, y] de 0 a 1\n  function brillo(el, e) {\n    var r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;\n    el.style.setProperty('--mx', x * 100 + '%');\n    el.style.setProperty('--my', y * 100 + '%');\n    return [x, y];\n  }\n\n  // Sobres de la portada: se inclinan y brillan siguiendo el puntero\n  document.querySelectorAll('.pack').forEach(function (p) {\n    p.addEventListener('pointermove', function (e) {\n      var xy = brillo(p, e);\n      if (!Guia.reduce) {\n        p.style.setProperty('--ry', (xy[0] - .5) * 26 + 'deg');\n        p.style.setProperty('--rx', (.5 - xy[1]) * 26 + 'deg');\n      }\n    });\n    p.addEventListener('pointerleave', function () {\n      p.style.setProperty('--rx', '0deg');\n      p.style.setProperty('--ry', '0deg');\n    });\n  });\n\n  // Cartas de secci\u00f3n: se dan la vuelta al entrar en pantalla y tienen un brillo que sigue al puntero\n  var cartas = document.querySelectorAll('.opener');\n  Guia.alEntrar(cartas, function (o) { o.classList.add('in'); }, .25);\n  if (!Guia.reduce) cartas.forEach(function (o) {\n    o.addEventListener('pointermove', function (e) { brillo(o, e); });\n  });\n\n  // Diagramas: las l\u00edneas se dibujan al entrar en pantalla\n  Guia.alEntrar(document.querySelectorAll('.fig'), function (f) { f.classList.add('in'); }, .3);\n})();\n\n/* \u00cdndice lateral: secci\u00f3n activa, \"aqu\u00ed lo dejaste\" y caj\u00f3n en el m\u00f3vil */\n(function () {\n  var sb = document.querySelector('.sidebar');\n  var idx = document.getElementById('dock-idx');\n  var cerrar = document.getElementById('drawer-close');\n  if (!sb) return;\n\n  // --- Secci\u00f3n activa en el \u00edndice + contador del dock + recordar la \u00faltima ---\n  var links = {};\n  sb.querySelectorAll('a[href^=\"#\"]').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });\n  var contador = document.getElementById('dock-count');\n  var actual = null;\n\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function (es) {\n      es.forEach(function (e) {\n        if (!e.isIntersecting) return;\n        var sec = e.target;\n        if (contador) contador.textContent = Guia.numero(sec) + '/' + Guia.total;\n        Guia.set('guia-ultima', sec.id);\n        var a = links[sec.id];\n        if (!a) return;\n        if (actual) actual.classList.remove('active');\n        actual = a; a.classList.add('active');\n        // En escritorio, mantener visible el enlace activo dentro del \u00edndice\n        if (sb.scrollHeight > sb.clientHeight && innerWidth >= 960) {\n          var r = a.getBoundingClientRect();\n          if (r.top < 80 || r.bottom > innerHeight - 40) a.scrollIntoView({ block: 'center' });\n        }\n      });\n    }, { rootMargin: '-15% 0px -75% 0px' });\n    document.querySelectorAll('main section[id]').forEach(function (s) { io.observe(s); });\n  }\n\n  // --- \"Seguir donde lo dej\u00e9\" ---\n  var ultima = Guia.get('guia-ultima'), sec = ultima && document.getElementById(ultima);\n  if (sec) {\n    var btn = document.getElementById('resume');\n    if (btn) {\n      btn.href = '#' + ultima; btn.hidden = false;\n      document.getElementById('resume-n').textContent = Guia.numero(sec) + '/' + Guia.total;\n    }\n    if (links[ultima]) links[ultima].classList.add('left');\n  }\n\n  // --- Caj\u00f3n del \u00edndice en el m\u00f3vil ---\n  var scrim = document.createElement('div'); scrim.className = 'scrim';\n  document.body.appendChild(scrim);\n  function abrir() {\n    sb.classList.add('open'); scrim.classList.add('on');\n    if (idx) idx.setAttribute('aria-expanded', 'true');\n    if (cerrar) cerrar.focus();\n  }\n  function cerrarIndice() {\n    if (!sb.classList.contains('open')) return;\n    sb.classList.remove('open'); scrim.classList.remove('on');\n    if (idx) idx.setAttribute('aria-expanded', 'false');\n  }\n  if (idx) {\n    idx.setAttribute('aria-expanded', 'false');\n    idx.addEventListener('click', function () { sb.classList.contains('open') ? cerrarIndice() : abrir(); });\n  }\n  if (cerrar) cerrar.addEventListener('click', function () { cerrarIndice(); if (idx) idx.focus(); });\n  scrim.addEventListener('click', cerrarIndice);\n  sb.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', cerrarIndice); });\n  addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarIndice(); });\n})();\n\n/* Barra de progreso, mostrar/ocultar el dock y modo repaso */\n(function () {\n  var prog = document.getElementById('progress');\n  var dock = document.getElementById('dock');\n  var hero = document.querySelector('.hero');\n\n  // Barra de tElement, antes = raiz.style.scrollBehavior;\n    raiz.style.scrollBehavior = 'auto';       // salto directo, sin deslizarse desde arriba\n    el.scrollIntoView();\n    raiz.style.scrollBehavior = antes;\n  }\n\n  function lanzar() {\n    ir();\n    setTimeout(ir, 300);\n    setTimeout(ir, 1300);                    // despu\u00e9s de que desaparezca el cargador\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(ir);\n  }\n  if (document.readyState === 'complete') lanzar();\n  else window.addEventListener('load', lanzar);\n})();\n\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#\"]');\n  if (!a) return;\n  e.preventDefault();\n  var destino = a.getAttribute('href');\n  // \"#/...\" es un enlace a otra p\u00e1gina; el resto, un enlace dentro de esta (en un marco, un \"#x\" normal se\n  // resolver\u00eda contra la p\u00e1gina contenedora y recargar\u00eda todo el archivo dentro del marco)\n  if (destino.indexOf('#/') === 0) parent.postMessage({ ruta: destino }, '*');\n  else location.hash = destino;\n});\naddEventListener('message', function (e) {\n  if (e.source !== parent || !e.data || typeof e.data.ancla !== 'string') return;\n  var ancla = e.data.ancla, destino = ancla && document.getElementById(ancla);\n  location.hash = ancla;                    // necesario para que funcione :target (ejercicios)\n  // salto directo, sin deslizarse desde donde estaba (la gu\u00eda tiene scroll-behavior: smooth)\n  if (destino) destino.scrollIntoView({ behavior: 'instant' });\n  else scrollTo({ top: 0, behavior: 'instant' });\n});\nif (window.ANCLA_INICIAL) location.hash = window.ANCLA_INICIAL;\n<\/script>\n<\/body>\n<\/html>\n", "resumida": "<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"color-scheme\" content=\"dark\">\n<script>\n/* Entrada con cortina: si se llega desde el selector, la cortina del color de la opci\u00f3n elegida sigue tapando\n   la p\u00e1gina mientras carga y luego se recoge hacia el punto donde se puls\u00f3. Va en el <head> para que ni un\n   instante se vea la p\u00e1gina sin cortina. En la carpeta, los datos llegan por sessionStorage; en el archivo\n   \u00fanico, por window.REVELA (p\u00e1gina nueva) o por un mensaje (p\u00e1gina que ya estaba abierta). */\n(function () {\n  var d, quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  try {\n    d = window.REVELA;\n    if (!d) d = JSON.parse(sessionStorage.getItem('cortina') || 'null');\n    sessionStorage.removeItem('cortina');\n  } catch (e) {}\n\n  function abrir(d) {\n    if (!d || Date.now() - d.t > 8000) return;\n    var raiz = document.documentElement, punto = d.x + 'px ' + d.y + 'px';\n    var cortina = document.createElement('div'), texto = document.createElement('span');\n    cortina.setAttribute('aria-hidden', 'true');\n    cortina.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;pointer-events:none;background:' +\n      d.color + ';clip-path:circle(150vmax at ' + punto + ')';\n    texto.style.cssText = 'color:#0d0a1f;font:700 14px Silkscreen,monospace;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:0 1rem';\n    texto.textContent = d.texto || '';\n    cortina.appendChild(texto);\n    raiz.classList.add('entra');          // la gu\u00eda completa se salta su cargador: la cortina ya hace de cargador\n    raiz.appendChild(cortina);\n\n    var hecho = false;\n    function recoger() {\n      if (hecho) return;\n      hecho = true;\n      cortina.getBoundingClientRect();    // fija el estado inicial para que la transici\u00f3n arranque\n      texto.style.transition = 'opacity .25s';\n      texto.style.opacity = '0';\n      cortina.style.transition = quieto ? 'opacity .3s' : 'clip-path .95s cubic-bezier(.16,1,.3,1)';\n      if (quieto) cortina.style.opacity = '0'; else cortina.style.clipPath = 'circle(0 at ' + punto + ')';\n      setTimeout(function () { cortina.remove(); raiz.classList.remove('entra'); }, 1100);\n    }\n    // Se espera a la p\u00e1gina Y a las tipograf\u00edas: si se recogiera antes, se ver\u00eda el texto saltar al cambiar de letra\n    var lista = new Promise(function (ok) {\n      if (document.readyState === 'complete') ok(); else addEventListener('load', ok);\n    }).then(function () { return document.fonts ? document.fonts.ready : 0; });\n    lista.then(function () { setTimeout(recoger, 250); });\n    setTimeout(recoger, 3500);            // por si la carga se alarga (sin conexi\u00f3n, por ejemplo)\n  }\n\n  addEventListener('message', function (e) { if (e.source === parent && e.data && e.data.revela) abrir(e.data.revela); });\n  abrir(d);\n})();\n\n<\/script>\n<title>Spring Boot de cero a REST \u00b7 gu\u00eda resumida<\/title>\n<style>\n/* =========================================================\n   TIPOGRAF\u00cdAS (guardadas en fuentes/, solo el juego \u00ablatin\u00bb, que cubre el espa\u00f1ol).\n   As\u00ed la gu\u00eda no depende de internet ni de Google Fonts.\n   ========================================================= */\n@font-face { font-family: 'Atkinson Hyperlegible'; font-style: italic; font-weight: 400; font-display: swap;\n  src: url(../fuentes/AtkinsonHyperlegible-400-italic.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Atkinson Hyperlegible'; font-style: normal; font-weight: 400; font-display: swap;\n  src: url(../fuentes/AtkinsonHyperlegible-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Atkinson Hyperlegible'; font-style: normal; font-weight: 700; font-display: swap;\n  src: url(../fuentes/AtkinsonHyperlegible-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Silkscreen'; font-style: normal; font-weight: 400; font-display: swap;\n  src: url(../fuentes/Silkscreen-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Silkscreen'; font-style: normal; font-weight: 700; font-display: swap;\n  src: url(../fuentes/Silkscreen-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Unbounded'; font-style: normal; font-weight: 200 900; font-display: swap;\n  src: url(../fuentes/Unbounded-variable.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n\n/* =========================================================\n   VARIABLES: colores, tipograf\u00edas y curva de animaci\u00f3n.\n   Cambia aqu\u00ed un color y se cambia en toda la gu\u00eda.\n   ========================================================= */\n:root {\n  /* Fondos (de m\u00e1s oscuro a m\u00e1s claro) */\n  --void:   #0d0a1f;   /* fondo de la p\u00e1gina */\n  --void-2: #151030;   /* tarjetas, \u00edndice, tablas */\n  --void-3: #211a47;   /* cabeceras de tabla, c\u00f3digo en l\u00ednea */\n  --void-4: #2c2360;   /* barra de scroll */\n  --line:   #3a2f6b;   /* bordes y separadores */\n\n  /* Texto */\n  --ink:   #ece8ff;    /* texto principal */\n  --ink-2: #bdb4ea;    /* texto secundario */\n  --ink-3: #958bc9;    /* notas al pie, leyendas */\n\n  /* Acentos */\n  --lime:   #c6ff3d;   /* acci\u00f3n principal y \"est\u00e1s aqu\u00ed\" */\n  --pink:   #ff4fa3;   /* Parte 2 (rara) y avisos \"Ojo\" */\n  --cyan:   #3de0ff;   /* Parte 1 (com\u00fan) y \"Por qu\u00e9\" */\n  --violet: #8b5bff;\n  --gold:   #ffd23d;   /* Parte 3 (holo) y \"Para un ni\u00f1o de 5 a\u00f1os\" */\n  --green:  #5ef0a0;   /* \"Comprobaci\u00f3n\" */\n  --red:    #ff6b6b;\n  --plum:   #2a1450;   /* fondo del sobre de la Parte 2 */\n  --plum-2: #1c1440;   /* fondo del sobre de la Parte 3 */\n  --code-bg:#07051a;   /* fondo de los bloques de c\u00f3digo */\n\n  /* Foil hologr\u00e1fico (gira con la variable --ang) */\n  --holo: conic-gradient(from var(--ang, 200deg) at var(--mx, 50%) var(--my, 50%),\n          #c6ff3d, #3de0ff, #8b5bff, #ff4fa3, #ffd23d, #c6ff3d);\n  --rar: var(--cyan);  /* color de rareza de la carta actual */\n\n  /* Tipograf\u00edas */\n  --pix:  \"Silkscreen\", ui-monospace, monospace;                 /* etiquetas p\u00edxel */\n  --disp: \"Unbounded\", \"Segoe UI Black\", sans-serif;             /* t\u00edtulos */\n  --body: \"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif; /* lectura */\n  --mono: \"Cascadia Code\", \"Cascadia Mono\", Consolas, \"SFMono-Regular\", Menlo, monospace; /* c\u00f3digo */\n\n  /* Altura de la barra superior (la que lleva el enlace \u00abElegir otra gu\u00eda\u00bb) */\n  --bar: 3rem;\n\n  /* Curva de todas las animaciones */\n  --out: cubic-bezier(.16, 1, .3, 1);\n}\n\n@property --ang { syntax: \"<angle>\"; inherits: true; initial-value: 200deg; }\n@keyframes spin { to { --ang: 560deg; } }\n\n/* =========================================================\n   BASE: reglas generales de la p\u00e1gina\n   ========================================================= */\n* { box-sizing: border-box; }\n\nhtml {\n  scroll-behavior: smooth;\n  scroll-padding-top: 5rem;\n  scrollbar-color: var(--violet) var(--void);\n}\n\nbody {\n  margin: 0;\n  background: var(--void);\n  color: var(--ink);\n  font: 1.0625rem/1.68 var(--body);\n  -webkit-text-size-adjust: 100%;\n  overflow-x: hidden;\n}\n\n::selection { background: var(--lime); color: var(--void); }\n\n::-webkit-scrollbar { width: 11px; height: 11px; }\n::-webkit-scrollbar-track { background: var(--void); }\n::-webkit-scrollbar-thumb { background: var(--void-4); border-radius: 10px; border: 2px solid var(--void); }\n::-webkit-scrollbar-thumb:hover { background: var(--violet); }\n\n:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; border-radius: 6px; }\n\na { color: var(--lime); text-underline-offset: .2em; text-decoration-thickness: 1px; }\na:hover { color: #e2ff9a; }\nb, strong { color: #fff; }\n\n/* Palabras largas (nombres de clases, URLs) no rompen el ancho */\np, li, td, h2, h3 { overflow-wrap: anywhere; }\n\n/* Barra superior de todas las p\u00e1ginas de la gu\u00eda: para volver al selector de gu\u00edas.\n   (header.bar y no .bar, porque el cargador tambi\u00e9n tiene un .bar) */\n.tag { margin: 0; font: 700 .75rem var(--pix); letter-spacing: .08em; color: var(--ink-3); }\nheader.bar {\n  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 1rem;\n  height: var(--bar); padding: 0 max(1rem, calc((100vw - 56rem) / 2));\n  background: rgba(13, 10, 31, .88); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);\n}\nheader.bar .back { font: 700 .78rem var(--pix); text-decoration: none; }\nheader.bar .tag { color: var(--cyan); }\n@media (max-width: 40rem) { header.bar .back { font-size: .7rem; } }\n\n/* =========================================================\n   BLOQUES DE C\u00d3DIGO Y TABLAS\n   ========================================================= */\npre {\n  position: relative; overflow: auto; tab-size: 4;\n  margin: 1.6rem 0; padding: 1.1rem 1.3rem;\n  background: var(--code-bg); color: #e6e1ff; border: 1px solid var(--line); border-radius: 14px;\n  font: .86rem/1.65 var(--mono);\n}\n/* <pre data-f=\"nombre/del/Archivo.java\"> muestra el nombre arriba */\npre[data-f] { padding-top: 3.1rem; }\n/* Sin nombre de archivo, el bot\u00f3n Copiar tiene su propia fila arriba: as\u00ed no tapa el c\u00f3digo */\npre:not([data-f]) { padding-top: 2.9rem; }\npre[data-f]::before {\n  content: attr(data-f); position: absolute; top: 0; left: 0; right: 0; height: 2.3rem;\n  display: flex; align-items: center; padding: 0 6rem 0 1.3rem;\n  border-bottom: 1px solid var(--line); color: var(--ink-2);\n  font: 700 .75rem var(--pix); letter-spacing: .03em;\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.copy {\n  position: absolute; top: .35rem; right: .5rem; cursor: pointer;\n  padding: .35rem .85rem; border-radius: 999px;\n  background: var(--void-3); color: var(--ink); border: 1px solid var(--line);\n  font: 700 .75rem var(--pix); transition: background .3s, color .3s;\n}\n.copy:hover { background: var(--violet); color: var(--void); }\n\n/* M\u00f3vil: letra algo menor y scroll horizontal dentro del bloque (la usan la gu\u00eda completa y la resumida) */\n@media (max-width: 40rem) {\n  pre { margin: 1.2rem 0; padding: .9rem 1rem; font-size: .78rem; border-radius: 12px; }\n  pre[data-f], pre:not([data-f]) { padding-top: 2.9rem; }\n  pre[data-f]::before { height: 2.2rem; padding: 0 5.5rem 0 1rem; font-size: .7rem; }\n  .copy { padding: .3rem .7rem; font-size: .7rem; }\n}\n\n/* Colores del resaltado de Java (los pone recursos/js/2-codigo.js) */\n.t-c { color: #8e86b8; font-style: italic; } /* comentarios */\n.t-s { color: var(--gold); }                 /* textos \"entre comillas\" */\n.t-a { color: var(--lime); }                 /* @Anotaciones */\n.t-k { color: var(--pink); }                 /* palabras clave */\n.t-n { color: var(--cyan); }                 /* n\u00fameros */\n\n/* Tablas (recursos/js/2-codigo.js las envuelve en .tw para el scroll en m\u00f3vil) */\n.tw { overflow-x: auto; margin: 1.5rem 0; background: var(--void-2); border: 1px solid var(--line); border-radius: 14px; }\ntable { width: 100%; border-collapse: collapse; font-size: .95rem; font-variant-numeric: tabular-nums; }\nth {\n  padding: .8rem 1rem; text-align: left; background: var(--void-3); border-bottom: 1px solid var(--line);\n  color: var(--lime); font: 700 .75rem/1.3 var(--pix); letter-spacing: .03em;\n}\nth b { color: inherit; }\ntd { padding: .7rem 1rem; vertical-align: top; border-bottom: 1px solid rgba(58, 47, 107, .6); }\ntd code { white-space: normal; overflow-wrap: anywhere; }\ntd:first-child { width: 30%; max-width: 16rem; font-weight: 700; color: #fff; }\ntr:last-child td { border-bottom: 0; }\ntr:hover td { background: rgba(139, 91, 255, .06); }\n\n/* =========================================================\n   GU\u00cdA RESUMIDA y EJERCICIOS\n   Usa los colores y tipograf\u00edas de recursos/css/01-variables.css y las reglas\n   generales de recursos/css/02-base.css (construir.py las junta antes que este archivo).\n   ========================================================= */\nbody.resumida, body.ejercicios {\n  background:\n    radial-gradient(45% 40% at 85% 0%, rgba(139, 91, 255, .22), transparent 70%),\n    radial-gradient(35% 35% at 5% 100%, rgba(61, 224, 255, .10), transparent 70%),\n    var(--void);\n  background-attachment: fixed;\n  min-height: 100vh;\n}\ncode {\n  padding: .1em .38em; border-radius: 5px; background: var(--void-3); color: #e6e1ff;\n  font: .88em var(--mono); white-space: normal; overflow-wrap: anywhere;\n}\n\n/* ---------- GU\u00cdA RESUMIDA ---------- */\n/* (la barra superior, header.bar, es com\u00fan a todas las p\u00e1ginas y est\u00e1 en recursos/css/02-base.css) */\n.wrap { max-width: 56rem; margin: 0 auto; padding: 2.6rem 1.25rem 4rem; }\nhtml { scroll-padding-top: 4.5rem; }\n.intro h1 {\n  margin: 0 0 .8rem; color: var(--lime); text-wrap: balance;\n  font: 900 clamp(1.9rem, 6vw, 3rem)/1.04 var(--disp); letter-spacing: -.035em;\n}\n.intro .sub { max-width: 40rem; margin: 0 0 1.8rem; color: var(--ink-2); font-size: 1.1rem; text-wrap: pretty; }\n\n/* \u00cdndice de saltos: una fila de n\u00fameros por parte */\n.jump { display: grid; gap: .9rem; margin-bottom: 2.4rem; padding: 1.1rem 1.2rem; border-radius: 18px; background: var(--void-2); border: 1px solid var(--line); }\n.jump .row { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; }\n.jump .row b { flex: 0 0 100%; color: var(--acc); font: 700 .72rem var(--pix); letter-spacing: .05em; }\n.jump a {\n  display: inline-grid; place-items: center; min-width: 2.4rem; height: 2.4rem; padding: 0 .5rem; border-radius: 8px;\n  background: var(--void-3); border: 1px solid var(--line); color: var(--ink); text-decoration: none; font: 700 .8rem var(--pix);\n  transition: background .25s, color .25s, border-color .25s;\n}\n.jump a:hover { background: var(--acc); color: var(--void); border-color: var(--acc); }\n\n/* Partes y pasos */\n.p1 { --acc: var(--cyan); }\n.p2 { --acc: var(--pink); }\n.p3 { --acc: var(--gold); }\n.p4 { --acc: var(--green); }\n.parte { margin-top: 3.2rem; }\n.parte > header { margin-bottom: 1.2rem; padding-bottom: .9rem; border-bottom: 1px solid var(--line); }\n.parte > header .n { margin: 0 0 .15rem; color: var(--acc); font: 700 .75rem var(--pix); letter-spacing: .08em; }\n.parte > header h2 { margin: 0; font: 900 clamp(1.3rem, 4vw, 1.8rem)/1.1 var(--disp); letter-spacing: -.03em; color: #fff; text-wrap: balance; }\n.parte > header p { margin: .35rem 0 0; color: var(--ink-2); }\n\narticle.paso {\n  display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: 0 1.1rem;\n  margin: 0 0 1rem; padding: 1.2rem 1.3rem 1.2rem 1.1rem; border-radius: 18px;\n  background: var(--void-2); border: 1px solid var(--line);\n}\narticle.paso:target { border-color: var(--acc); outline: 2px solid var(--acc); outline-offset: 3px; }\narticle.paso .num { grid-row: 1 / span 3; color: var(--acc); font: 900 2rem/1 var(--disp); letter-spacing: -.04em; text-align: center; }\narticle.paso h3 { margin: .1rem 0 .6rem; color: #fff; font: 700 1.12rem/1.25 var(--body); }\n/* minmax(0, 1fr) y min-width: 0: sin esto, una l\u00ednea larga de c\u00f3digo ensancha toda la columna y la p\u00e1gina */\narticle.paso ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; grid-template-columns: minmax(0, 1fr); gap: .5rem; }\narticle.paso li { position: relative; counter-increment: s; padding-left: 1.9rem; line-height: 1.5; min-width: 0; }\narticle.paso > * { min-width: 0; }\narticle.paso li::before {\n  content: counter(s); position: absolute; left: 0; top: .12em; display: grid; place-items: center;\n  width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--void-3); color: var(--acc);\n  font: 700 .66rem var(--pix);\n}\n/* C\u00f3digo dentro de un paso: ocupa todo el ancho de la tarjeta (sale del hueco de la numeraci\u00f3n) */\narticle.paso pre { max-width: 100%; font-size: .8rem; }\narticle.paso details { max-width: 100%; }\narticle.paso li > pre, article.paso li > details { margin: .7rem 0 .3rem -1.9rem; }\narticle.paso li > details.cod > pre { margin: 0; border-radius: 0 0 14px 14px; border-top: 0; }\narticle.paso details.cod { border: 1px solid var(--line); border-radius: 14px; background: var(--code-bg); }\narticle.paso details.cod[open] { border-color: var(--violet); }\narticle.paso details.cod > summary {\n  cursor: pointer; list-style: none; padding: .7rem 1rem; border-radius: 14px;\n  color: var(--cyan); font: 700 .72rem var(--pix); letter-spacing: .03em;\n}\narticle.paso details.cod > summary::-webkit-details-marker { display: none; }\narticle.paso details.cod > summary::before { content: \"\u25b8 \"; }\narticle.paso details.cod[open] > summary { border-radius: 14px 14px 0 0; border-bottom: 1px solid var(--line); }\narticle.paso details.cod[open] > summary::before { content: \"\u25be \"; }\n\narticle.paso .mas {\n  justify-self: start; margin-top: 1rem; display: inline-flex; align-items: center; gap: .5rem;\n  padding: .55rem 1rem; border-radius: 999px; border: 1.5px solid var(--lime);\n  color: var(--lime); text-decoration: none; font: 700 .74rem var(--pix);\n  transition: background .25s, color .25s;\n}\narticle.paso .mas:hover { background: var(--lime); color: var(--void); }\n\n.end { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; margin-top: 3rem; padding-top: 1.4rem; border-top: 1px solid var(--line); font: 700 .78rem var(--pix); }\n.end a { text-decoration: none; }\n\n/* ---------- EJERCICIOS ---------- */\n/* La lista y los paneles viven en la misma p\u00e1gina: un panel solo se ve cuando la direcci\u00f3n apunta a \u00e9l (#ejercicio-1) */\n.panel { display: none; --acc: var(--green); }\n.panel:target { display: block; }\nbody:has(.panel:target) .hub { display: none; }\n\n.ej-list { display: grid; gap: 1rem; }\n.ej {\n  --acc: var(--green);\n  display: grid; gap: .55rem; padding: 1.3rem 1.4rem; border-radius: 18px;\n  background: var(--void-2); border: 1px solid var(--line);\n}\n.ej .n, .panel .n { margin: 0; color: var(--acc); font: 700 .75rem var(--pix); letter-spacing: .08em; }\n.ej h2, .panel h2 { margin: 0; color: #fff; text-wrap: balance; font: 900 clamp(1.25rem, 3.6vw, 1.7rem)/1.1 var(--disp); letter-spacing: -.03em; }\n.ej p { margin: 0; color: var(--ink-2); }\n.ej .meta { display: flex; flex-wrap: wrap; gap: .5rem; }\n.ej .meta span { padding: .2rem .65rem; border-radius: 999px; background: var(--void-3); color: var(--ink-2); font: 700 .7rem var(--pix); }\n.ej .acciones { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: .5rem; }\n.acciones > *, .panel .nav a {\n  padding: .7rem 1.1rem; border-radius: 999px; text-decoration: none; text-align: center; font: 700 .76rem var(--pix);\n}\n.acciones .ver { background: var(--acc); color: var(--void); }\n.acciones .sol { border: 1.5px solid var(--acc); color: var(--acc); transition: background .25s, color .25s; }\n.acciones .sol:hover { background: var(--acc); color: var(--void); }\n.acciones .off { border: 1.5px dashed var(--line); color: var(--ink-3); }\n\n.panel > header { margin: 1.2rem 0 1.6rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }\n.panel .nav { display: flex; flex-wrap: wrap; gap: .6rem; }\n.panel .nav a { border: 1.5px solid var(--line); color: var(--ink); }\n.panel .nav a:hover { border-color: var(--acc); color: var(--acc); }\n.panel .nav.pie { margin-top: 2.4rem; padding-top: 1.4rem; border-top: 1px solid var(--line); }\n.panel h3 { color: var(--acc); }\n\n/* ---------- M\u00d3VIL ---------- */\n@media (max-width: 40rem) {\n  .wrap { padding: 1.8rem 1rem 3rem; }\n  .jump { padding: .9rem; }\n  article.paso { grid-template-columns: minmax(0, 1fr); padding: 1rem 1rem 1.1rem; }\n  article.paso .num { grid-row: auto; text-align: left; font-size: 1.6rem; margin-bottom: .1rem; }\n  article.paso h3 { font-size: 1.08rem; }\n  article.paso .mas { justify-self: stretch; justify-content: center; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  *, *::before, *::after { transition: none !important; }\n}\n\n<\/style>\n<\/head>\n<body class=\"resumida\" id=\"inicio\">\n<header class=\"bar\">\n  <a class=\"back\" href=\"#/\">\u2190 Elegir otra gu\u00eda<\/a>\n  <span class=\"tag\">GU\u00cdA RESUMIDA<\/span>\n<\/header>\n\n<main class=\"wrap\">\n  <section class=\"intro\">\n    <h1>Spring Boot de cero a REST<\/h1>\n    <p class=\"sub\">Los 33 pasos, uno por uno y sin complicarse. En cada paso, <b>\u00abVer explicaci\u00f3n completa\u00bb<\/b> te lleva a ese mismo paso de la gu\u00eda principal.<\/p>\n  <\/section>\n\n  <nav class=\"jump\" aria-label=\"Ir a un paso\">\n    <div class=\"row p1\"><b>PARTE 1<\/b><a href=\"#r-1\" title=\"1. Crear el proyecto en Spring Initializr\">1<\/a><a href=\"#r-2\" title=\"2. Abrir el proyecto en VS Code\">2<\/a><a href=\"#r-3\" title=\"3. Configurar la conexi\u00f3n y las tablas\">3<\/a><a href=\"#r-4\" title=\"4. Crear los paquetes y distinguir los tipos Java\">4<\/a><a href=\"#r-5\" title=\"5. Crear el enum Posicion\">5<\/a><a href=\"#r-6\" title=\"6. Crear la entidad Jugador\">6<\/a><a href=\"#r-7\" title=\"7. Crear la interfaz del repositorio\">7<\/a><a href=\"#r-8\" title=\"8. Ejecutar la primera prueba desde ExamenApplication\">8<\/a><a href=\"#r-9\" title=\"9. Practicar buscar, cambiar y borrar desde ExamenApplication\">9<\/a><a href=\"#r-10\" title=\"10. Escribir consultas en la interfaz\">10<\/a><a href=\"#r-11\" title=\"11. A\u00f1adir una relaci\u00f3n uno a uno\">11<\/a><a href=\"#r-12\" title=\"12. Crear una relaci\u00f3n uno a muchos\">12<\/a><a href=\"#r-13\" title=\"13. Representar una relaci\u00f3n muchos a muchos\">13<\/a><a href=\"#r-14\" title=\"14. Cargar los datos iniciales\">14<\/a><a href=\"#r-15\" title=\"15. Escribir consultas en el repositorio y ejecutarlas en la aplicaci\u00f3n\">15<\/a><a href=\"#r-16\" title=\"16. Corregir errores y terminar el proyecto\">16<\/a><a href=\"#r-17\" title=\"17. Materiales utilizados y documentaci\u00f3n de apoyo\">17<\/a><\/div>\n    <div class=\"row p2\"><b>PARTE 2<\/b><a href=\"#r-18\" title=\"18. Qu\u00e9 cambia al pasar a REST (y por qu\u00e9)\">18<\/a><a href=\"#r-19\" title=\"19. El puente paso a paso, con el proyecto de f\u00fatbol\">19<\/a><\/div>\n    <div class=\"row p3\"><b>PARTE 3<\/b><a href=\"#r-20\" title=\"20. El ejercicio: qu\u00e9 se pide y c\u00f3mo se resuelve\">20<\/a><a href=\"#r-21\" title=\"21. Crear y configurar el proyecto\">21<\/a><a href=\"#r-22\" title=\"22. Misi\u00f3n 1: decisiones de dise\u00f1o y entidades\">22<\/a><a href=\"#r-23\" title=\"23. Los repositorios\">23<\/a><a href=\"#r-24\" title=\"24. Misi\u00f3n 2: los DTO como contrato de la API\">24<\/a><a href=\"#r-25\" title=\"25. Los servicios: interfaces, implementaciones y conversi\u00f3n\">25<\/a><a href=\"#r-26\" title=\"26. Los controladores y los c\u00f3digos de estado\">26<\/a><a href=\"#r-27\" title=\"27. Misi\u00f3n 5: las trampas de comprensi\u00f3n\">27<\/a><a href=\"#r-28\" title=\"28. Ampliaci\u00f3n: validaci\u00f3n declarativa con @Valid\">28<\/a><a href=\"#r-29\" title=\"29. Probar con Postman o curl\">29<\/a><a href=\"#r-30\" title=\"30. C\u00f3mo explicar el ejercicio\">30<\/a><a href=\"#r-31\" title=\"31. Entregables y r\u00fabrica\">31<\/a><a href=\"#r-32\" title=\"32. Chuleta final\">32<\/a><\/div>\n    <div class=\"row p4\"><b>PARTE 4<\/b><a href=\"#r-33\" title=\"33. Ejercicios de pr\u00e1ctica\">33<\/a><\/div>\n  <\/nav>\n\n<section class=\"parte p1\" id=\"parte1\">\n  <header><p class=\"n\">PARTE 1<\/p><h2>Spring Data JPA<\/h2><p>El proyecto \u00abexamen\u00bb: jugadores, equipos, estadios y fichajes.<\/p><\/header>\n<article class=\"paso\" id=\"r-1\">\n  <span class=\"num\" aria-hidden=\"true\">1<\/span>\n  <h3>Crear el proyecto en Spring Initializr<\/h3>\n  <ol>\n<li>Abre <code>start.spring.io<\/code>.<\/li>\n<li>Elige <b>Maven<\/b>, <b>Java<\/b> y Spring Boot <b>4.1.3<\/b>.<\/li>\n<li>Rellena: Group <code>leo.astray<\/code>, Artifact <code>examen<\/code>, Package <code>leo.astray.examen<\/code>, Jar y Java 21.<\/li>\n<li>En <b>Add Dependencies<\/b> a\u00f1ade Spring Data JPA, MySQL Driver, Spring Boot DevTools, Spring Web y Validation.<\/li>\n<li>Pulsa <b>Generate<\/b> y guarda el ZIP.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-1\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-2\">\n  <span class=\"num\" aria-hidden=\"true\">2<\/span>\n  <h3>Abrir el proyecto en VS Code<\/h3>\n  <ol>\n<li>Extrae el ZIP con clic derecho &gt; <b>Extraer todo<\/b>. No trabajes dentro del ZIP.<\/li>\n<li>En VS Code: <b>File &gt; Open Folder<\/b> y elige la carpeta extra\u00edda.<\/li>\n<li>Acepta importar el proyecto Maven y espera a que descargue las dependencias (necesita Internet).<\/li>\n<li>Reconoce las carpetas: <code>pom.xml<\/code> (dependencias), <code>src/main/java<\/code> (tu c\u00f3digo), <code>src/main/resources<\/code> (configuraci\u00f3n) y <code>ExamenApplication.java<\/code> (arranque).<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-2\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-3\">\n  <span class=\"num\" aria-hidden=\"true\">3<\/span>\n  <h3>Configurar la conexi\u00f3n y las tablas<\/h3>\n  <ol>\n<li>Abre <code>src/main/resources/application.properties<\/code>.<\/li>\n<li>Pega esta configuraci\u00f3n. Cambia usuario, contrase\u00f1a, puerto (aqu\u00ed <code>3308<\/code>) y <code>spring.application.name<\/code>, que debe ser el mismo nombre que el Artifact.\n<pre class=\"code\" data-f=\"src/main/resources/application.properties\">spring.application.name=examen\nserver.port=8080\n\nspring.datasource.url=jdbc:mysql://localhost:3308/examen?createDatabaseIfNotExist=true\nspring.datasource.username=root\nspring.datasource.password=\nspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver\n\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true\nspring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect\nspring.jpa.database-platform=org.hibernate.dialect.MySQLDialect\nspring.sql.init.mode=always\nspring.jpa.defer-datasource-initialization=true\nspring.jpa.properties.hibernate.format_sql=true<\/pre><\/li>\n<li>Guarda con <code>Ctrl+S<\/code>.<\/li>\n<li>Spring Web (que ya marcaste en el paso 1) mantiene la aplicaci\u00f3n arrancada para poder mirar phpMyAdmin.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-3\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-4\">\n  <span class=\"num\" aria-hidden=\"true\">4<\/span>\n  <h3>Crear los paquetes y distinguir los tipos Java<\/h3>\n  <ol>\n<li>Despliega <code>src/main/java/leo/astray/examen<\/code>.<\/li>\n<li>Clic derecho &gt; <b>New Java Package<\/b>: crea <code>model<\/code> y, dentro, <code>entity<\/code>, <code>enums<\/code> y <code>repository<\/code>. Quedar\u00e1 as\u00ed:\n<pre class=\"code\" data-f=\"estructura de paquetes\">leo/astray/examen/\n  ExamenApplication.java\n  model/       \n    entity/   Jugador.java...\n    enums/        Posicion.java...\n    repository/   IJugadorRepository.java...<\/pre><\/li>\n<li>Recuerda qu\u00e9 es cada tipo: <b>class<\/b> es un molde de objetos, <b>interface<\/b> un contrato y <b>enum<\/b> una lista cerrada de valores.<\/li>\n<li>Para crear cada uno: clic derecho sobre la carpeta &gt; <b>New Java File<\/b> &gt; Class, Interface o Enum.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-4\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-5\">\n  <span class=\"num\" aria-hidden=\"true\">5<\/span>\n  <h3>Crear el enum Posicion<\/h3>\n  <ol>\n<li>Clic derecho en <code>enums<\/code> &gt; <b>New Java File &gt; Enum<\/b> y escribe <code>Posicion<\/code>.<\/li>\n<li>Sustituye el contenido por este c\u00f3digo y guarda.\n<pre data-f=\"enums/Posicion.java\">package leo.astray.examen.enums;\n\npublic enum Posicion {\n    PORTERO, DEFENSA, CENTROCAMPISTA, DELANTERO\n}<\/pre><\/li>\n<li>En Java se usa <code>Posicion.PORTERO<\/code>; en SQL, el texto exacto <code>'PORTERO'<\/code>.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-5\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-6\">\n  <span class=\"num\" aria-hidden=\"true\">6<\/span>\n  <h3>Crear la entidad Jugador<\/h3>\n  <ol>\n<li>Clic derecho en <code>entity<\/code> &gt; <b>New Java File &gt; Class<\/b> y escribe <code>Jugador<\/code>.<\/li>\n<li>Pega el archivo completo.\n<pre data-f=\"entity/Jugador.java\">package leo.astray.examen.entity;\n\nimport leo.astray.examen.enums.Posicion;\nimport jakarta.persistence.*;\n\n@Entity\n@Table(name = \"jugadores\")\npublic class Jugador {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_jugador\")\n    private Long id;\n\n    @Column(nullable = false, length = 100)\n    private String nombre;\n\n    @Column(nullable = false, unique = true, length = 50)\n    private String mote;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 20)\n    private Posicion posicion;\n\n    public Jugador() {}\n\n    public Jugador(String nombre, String mote, Posicion posicion) {\n        this.nombre = nombre;\n        this.mote = mote;\n        this.posicion = posicion;\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public String getMote() { return mote; }\n    public Posicion getPosicion() { return posicion; }\n\n    public void setNombre(String nombre) { this.nombre = nombre; }\n    public void setMote(String mote) { this.mote = mote; }\n    public void setPosicion(Posicion posicion) {\n        this.posicion = posicion;\n    }\n}<\/pre><\/li>\n<li>Marca <code>@Entity<\/code> y <code>@Table<\/code> la clase, <code>@Id<\/code> y <code>@GeneratedValue(IDENTITY)<\/code> el <code>id<\/code>, y <code>@Enumerated(EnumType.STRING)<\/code> la posici\u00f3n. El constructor vac\u00edo lo necesita JPA.<\/li>\n<li>Abre <b>Problems<\/b> con <code>Ctrl+Shift+M<\/code>: no debe haber errores.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-6\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-7\">\n  <span class=\"num\" aria-hidden=\"true\">7<\/span>\n  <h3>Crear la interfaz del repositorio<\/h3>\n  <ol>\n<li>Clic derecho en <code>repository<\/code> &gt; <b>New Java File &gt; Interface<\/b> y escribe <code>IJugadorRepository<\/code>.<\/li>\n<li>Pega el archivo completo.\n<pre data-f=\"repository/IJugadorRepository.java\">package leo.astray.examen.repository;\n\nimport leo.astray.examen.entity.Jugador;\nimport org.springframework.data.jpa.repository.JpaRepository;\n\npublic interface IJugadorRepository\n        extends JpaRepository&lt;Jugador, Long&gt; {\n}<\/pre><\/li>\n<li>Sin escribir m\u00e1s c\u00f3digo ya tienes <code>save<\/code>, <code>findById<\/code>, <code>findAll<\/code>, <code>existsById<\/code>, <code>count<\/code> y <code>deleteById<\/code>.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-7\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-8\">\n  <span class=\"num\" aria-hidden=\"true\">8<\/span>\n  <h3>Ejecutar la primera prueba desde ExamenApplication<\/h3>\n  <ol>\n<li>Abre <code>ExamenApplication.java<\/code> y sustituye su contenido por este c\u00f3digo.\n<pre data-f=\"ExamenApplication.java\">package leo.astray.examen;\n\nimport leo.astray.examen.entity.Jugador;\nimport leo.astray.examen.enums.Posicion;\nimport leo.astray.examen.repository.IJugadorRepository;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.CommandLineRunner;\nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\n@SpringBootApplication\npublic class ExamenApplication implements CommandLineRunner {\n\n    @Autowired\n    private IJugadorRepository jugadorRepository;\n\n    public static void main(String[] args) {\n        SpringApplication.run(ExamenApplication.class, args);\n    }\n\n    @Override\n    public void run(String... args) {\n\n        if (jugadorRepository.count() == 0) {\n\n            Jugador jugador1 = new Jugador\n                  (\"Lionel Messi\",\"La Pulga\",Posicion.DELANTERO);\n\n            jugadorRepository.save(jugador1);\n\n            System.out.println(\"ID creado: \" + jugador1.getId());\n        }\n\n        System.out.println(\"Total: \" + jugadorRepository.count());\n\n        for (Jugador jugador : jugadorRepository.findAll()) {\n            System.out.println(jugador.getNombre());\n        }\n    }\n}<\/pre><\/li>\n<li>Si <code>count() == 0<\/code>, crea y guarda un jugador. Despu\u00e9s recorre <code>findAll()<\/code> e imprime los nombres.<\/li>\n<li>Guarda todo (<b>File &gt; Save All<\/b>) y ejecuta.<\/li>\n<li>Comprueba la consola y, en phpMyAdmin, <code>examen &gt; jugadores<\/code>.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-8\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-9\">\n  <span class=\"num\" aria-hidden=\"true\">9<\/span>\n  <h3>Practicar buscar, cambiar y borrar desde ExamenApplication<\/h3>\n  <ol>\n<li>A\u00f1ade este import en <code>ExamenApplication<\/code>, antes de <code>@SpringBootApplication<\/code>.\n<pre data-f=\"ExamenApplication.java (imports)\">import java.util.Optional;<\/pre><\/li>\n<li><b>Buscar y cambiar un nombre.<\/b> P\u00e9galo dentro de <code>run<\/code>, despu\u00e9s del <code>for<\/code> anterior. Si el jugador tiene otro ID, cambia <code>1L<\/code>.\n<pre data-f=\"ExamenApplication.java (dentro de run)\">Optional&lt;Jugador&gt; resultado = jugadorRepository.findById(1L);\n\nif (resultado.isPresent()) {\n\n    Jugador jugador = resultado.get();\n\n    jugador.setNombre(\"Ana Garc\u00eda\");\n\n    jugadorRepository.save(jugador);\n\n    System.out.println(\n        \"Nombre cambiado: \" + jugador.getNombre()\n    );\n\n} else {\n\n    System.out.println(\"No existe ese jugador\");\n\n}<\/pre><\/li>\n<li><b>Borrar un jugador temporal.<\/b> Debajo del bloque anterior, todav\u00eda dentro de <code>run<\/code>:\n<pre data-f=\"ExamenApplication.java (dentro de run)\">Jugador temporal = new Jugador(\n    \"Temporal\",\n    \"PruebaUnica\",\n    Posicion.PORTERO\n);\n\njugadorRepository.save(temporal);\n\nLong idTemporal = temporal.getId();\n\nSystem.out.println(\n    \"ID del jugador temporal: \" + idTemporal\n);\n\njugadorRepository.deleteById(idTemporal);\n\nSystem.out.println(\n    \"\u00bfSigue existiendo? \" + jugadorRepository.existsById(idTemporal)\n);<\/pre>\nDebe imprimir <code>\u00bfSigue existiendo? false<\/code>.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-9\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-10\">\n  <span class=\"num\" aria-hidden=\"true\">10<\/span>\n  <h3>Escribir consultas en la interfaz<\/h3>\n  <ol>\n<li>Deja <code>IJugadorRepository<\/code> as\u00ed (solo las firmas, sin cuerpo; el nombre del m\u00e9todo usa el nombre exacto del campo Java).\n<pre data-f=\"repository/IJugadorRepository.java\">package leo.astray.examen.repository;\n\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport leo.astray.examen.entity.Jugador;\nimport leo.astray.examen.enums.Posicion;\n\npublic interface IJugadorRepository\n        extends JpaRepository&lt;Jugador, Long&gt; {\n\n    Jugador findByMote(String mote);\n\n    List&lt;Jugador&gt; findByPosicionAndNombre(\n        Posicion posicion, String nombre\n    );\n}<\/pre><\/li>\n<li>Pru\u00e9bala dentro de <code>run<\/code>. <code>findByMote<\/code> devuelve <code>null<\/code> si no encuentra nada.\n<pre data-f=\"ExamenApplication.java (dentro de run)\">Jugador encontrado = jugadorRepository.findByMote(\"Rayo\");\n\nif (encontrado != null) {\n    System.out.println(encontrado.getNombre());\n} else {\n    System.out.println(\"No existe ning\u00fan jugador con ese mote\");\n}<\/pre><\/li>\n<li>Y la segunda consulta:\n<pre data-f=\"ExamenApplication.java (dentro de run)\">for (Jugador jugador :\n        jugadorRepository.findByPosicionAndNombre(\n            Posicion.DELANTERO, \"Ana Garc\u00eda\")) {\n\n    System.out.println(jugador.getNombre());\n    System.out.println(jugador.getMote());\n}<\/pre><\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-10\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-11\">\n  <span class=\"num\" aria-hidden=\"true\">11<\/span>\n  <h3>A\u00f1adir una relaci\u00f3n uno a uno<\/h3>\n  <ol>\n<li>Vac\u00eda las pruebas antiguas de <code>run<\/code> y deja solo esta l\u00ednea.\n<pre data-f=\"ExamenApplication.java (dentro de run)\">System.out.println(\"Preparando las relaciones\");<\/pre><\/li>\n<li>Crea la clase <code>PerfilEstadistico<\/code> en <code>entity<\/code> con este c\u00f3digo.\n<pre data-f=\"entity/PerfilEstadistico.java\">package leo.astray.examen.entity;\n\nimport jakarta.persistence.*;\n\n@Entity\n@Table(name = \"perfiles_estadisticos\")\npublic class PerfilEstadistico {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_perfil\")\n    private Long id;\n\n    @Column(nullable = false)\n    private int partidos;\n    @Column(nullable = false)\n    private int goles;\n    @Column(nullable = false)\n    private int asistencias;\n    @Column(nullable = false)\n    private double valoracion;\n\n    public PerfilEstadistico() {}\n\n    public PerfilEstadistico(int partidos, int goles,\n            int asistencias, double valoracion) {\n        this.partidos = partidos;\n        this.goles = goles;\n        this.asistencias = asistencias;\n        this.valoracion = valoracion;\n    }\n\n    public Long getId() { return id; }\n    public int getPartidos() { return partidos; }\n    public int getGoles() { return goles; }\n    public int getAsistencias() { return asistencias; }\n    public double getValoracion() { return valoracion; }\n}<\/pre><\/li>\n<li>En <code>Jugador<\/code> a\u00f1ade este campo, dentro de la clase y fuera de cualquier m\u00e9todo.\n<pre data-f=\"entity/Jugador.java (nuevo campo)\">@OneToOne(cascade = CascadeType.ALL, optional = false)\n@JoinColumn(name = \"id_perfil\", nullable = false, unique = true)\nprivate PerfilEstadistico perfil;<\/pre><\/li>\n<li>A\u00f1ade su getter y su setter junto a los dem\u00e1s.\n<pre data-f=\"entity/Jugador.java (nuevos m\u00e9todos)\">public PerfilEstadistico getPerfil() {\n    return perfil;\n}\n\npublic void setPerfil(PerfilEstadistico perfil) {\n    this.perfil = perfil;\n}<\/pre><\/li>\n<li><b>Sustituye<\/b> el constructor de 3 par\u00e1metros por este de 4. Conserva el constructor vac\u00edo.\n<pre data-f=\"entity/Jugador.java (constructor nuevo, sustituye al de 3 par\u00e1metros)\">public Jugador(String nombre, String mote,\n        Posicion posicion, PerfilEstadistico perfil) {\n    this.nombre = nombre;\n    this.mote = mote;\n    this.posicion = posicion;\n    this.perfil = perfil;\n}<\/pre><\/li>\n<li>As\u00ed se guarda un jugador desde <code>run<\/code>: primero el perfil y despu\u00e9s el jugador con \u00e9l.\n<pre data-f=\"ExamenApplication.java (ejemplo)\">PerfilEstadistico perfil = new PerfilEstadistico(\n    10, 2, 1, 7.5);\n\nJugador jugador = new Jugador(\n    \"Leo\", \"Flecha\", Posicion.DEFENSA, perfil);\n\njugadorRepository.save(jugador);<\/pre><\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-11\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-12\">\n  <span class=\"num\" aria-hidden=\"true\">12<\/span>\n  <h3>Crear una relaci\u00f3n uno a muchos<\/h3>\n  <ol>\n<li>Crea <code>Estadio<\/code> en <code>entity<\/code>.\n<pre data-f=\"entity/Estadio.java\">package leo.astray.examen.entity;\n\nimport jakarta.persistence.*;\n\n@Entity\n@Table(name = \"estadios\")\npublic class Estadio {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_estadio\")\n    private Long id;\n\n    @Column(nullable = false, length = 100)\n    private String nombre;\n    @Column(nullable = false)\n    private int capacidad;\n\n    public Estadio() {}\n\n    public Estadio(String nombre, int capacidad) {\n        this.nombre = nombre;\n        this.capacidad = capacidad;\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public int getCapacidad() { return capacidad; }\n}<\/pre><\/li>\n<li>Crea <code>Equipo<\/code> con su lista de estadios.\n<pre data-f=\"entity/Equipo.java\">package leo.astray.examen.entity;\n\nimport jakarta.persistence.*;\nimport java.math.BigDecimal;\nimport java.util.ArrayList;\nimport java.util.List;\n\n@Entity\n@Table(name = \"equipos\")\npublic class Equipo {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_equipo\")\n    private Long id;\n\n    @Column(nullable = false, length = 100)\n    private String nombre;\n    @Column(nullable = false, length = 100)\n    private String ciudad;\n    @Column(nullable = false, precision = 14, scale = 2)\n    private BigDecimal presupuesto;\n\n    @OneToMany(cascade = CascadeType.ALL, orphanRemoval = true)\n    @JoinColumn(name = \"id_equipo\")\n    private List&lt;Estadio&gt; estadios = new ArrayList&lt;&gt;();\n\n    public Equipo() {}\n\n    public Equipo(String nombre, String ciudad,\n            BigDecimal presupuesto) {\n        this.nombre = nombre;\n        this.ciudad = ciudad;\n        this.presupuesto = presupuesto;\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public String getCiudad() { return ciudad; }\n    public BigDecimal getPresupuesto() { return presupuesto; }\n    public List&lt;Estadio&gt; getEstadios() { return estadios; }\n\n    public void addEstadio(Estadio estadio) {\n        estadios.add(estadio);\n    }\n}<\/pre><\/li>\n<li>Para hacerla bidireccional, a\u00f1ade esto en <code>Estadio<\/code>.\n<pre data-f=\"entity/Estadio.java (nuevo campo y m\u00e9todos)\">@ManyToOne(fetch = FetchType.LAZY, optional = false)\n@JoinColumn(name = \"id_equipo\", nullable = false)\nprivate Equipo equipo;\n\npublic Equipo getEquipo() {\n    return equipo;\n}\n\npublic void setEquipo(Equipo equipo) {\n    this.equipo = equipo;\n}<\/pre><\/li>\n<li>En <code>Equipo<\/code>, <b>sustituye<\/b> las dos anotaciones de la lista <code>estadios<\/code> por esta y quita el <code>@JoinColumn<\/code> antiguo.\n<pre data-f=\"entity/Equipo.java (lista estadios)\">@OneToMany(mappedBy = \"equipo\", cascade = CascadeType.ALL,\n    orphanRemoval = true)\nprivate List&lt;Estadio&gt; estadios = new ArrayList&lt;&gt;();<\/pre>\n<code>mappedBy<\/code> apunta al campo Java <code>equipo<\/code>, no a la columna SQL.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-12\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-13\">\n  <span class=\"num\" aria-hidden=\"true\">13<\/span>\n  <h3>Representar una relaci\u00f3n muchos a muchos<\/h3>\n  <ol>\n<li>Aqu\u00ed no basta con un <code>@ManyToMany<\/code>, porque la relaci\u00f3n lleva datos propios (temporada, precio\u2026). Por eso se crea la entidad <code>Fichaje<\/code>. Primero, dos enums en <code>enums<\/code>.\n<pre data-f=\"enums/PeriodoMercado.java\">package leo.astray.examen.enums;\n\npublic enum PeriodoMercado {\n    VERANO,\n    INVIERNO\n}<\/pre>\n<pre data-f=\"enums/TipoOperacion.java\">package leo.astray.examen.enums;\n\npublic enum TipoOperacion {\n    TRASPASO,\n    CESION,\n    LIBRE\n}<\/pre><\/li>\n<li>Crea <code>Fichaje<\/code> en <code>entity<\/code>.\n<details class=\"cod\"><summary>Ver el c\u00f3digo completo (65 l\u00edneas)<\/summary><pre data-f=\"entity/Fichaje.java\">package leo.astray.examen.entity;\n\nimport jakarta.persistence.*;\nimport java.math.BigDecimal;\nimport leo.astray.examen.enums.PeriodoMercado;\nimport leo.astray.examen.enums.TipoOperacion;\n\n@Entity\n@Table(name = \"fichajes\")\npublic class Fichaje {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_fichaje\")\n    private Long id;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"id_jugador\", nullable = false)\n    private Jugador jugador;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"id_equipo\", nullable = false)\n    private Equipo equipo;\n\n    @Column(nullable = false, length = 5)\n    private String temporada;\n    @Column(nullable = false, precision = 14, scale = 2)\n    private BigDecimal precio;\n    @Column(name = \"clausula_pagada\", nullable = false)\n    private boolean clausulaPagada;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 10)\n    private PeriodoMercado mercado;\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 10)\n    private TipoOperacion tipo;\n\n    public Fichaje() {}\n\n    public Fichaje(Jugador jugador, Equipo equipo,\n            String temporada, BigDecimal precio,\n            boolean clausulaPagada, PeriodoMercado mercado,\n            TipoOperacion tipo) {\n        this.jugador = jugador;\n        this.equipo = equipo;\n        this.temporada = temporada;\n        this.precio = precio;\n        this.clausulaPagada = clausulaPagada;\n        this.mercado = mercado;\n        this.tipo = tipo;\n    }\n\n    public Long getId() { return id; }\n    public Jugador getJugador() { return jugador; }\n    public Equipo getEquipo() { return equipo; }\n    public String getTemporada() { return temporada; }\n    public BigDecimal getPrecio() { return precio; }\n    public boolean isClausulaPagada() { return clausulaPagada; }\n    public PeriodoMercado getMercado() { return mercado; }\n    public TipoOperacion getTipo() { return tipo; }\n\n    public void setJugador(Jugador jugador) {\n        this.jugador = jugador;\n    }\n}<\/pre><\/details><\/li>\n<li>En <code>Jugador<\/code> a\u00f1ade la lista <code>fichajes<\/code> (con imports de <code>List<\/code> y <code>ArrayList<\/code>), su getter y <code>addFichaje<\/code>.\n<pre data-f=\"entity/Jugador.java (fichajes)\">@OneToMany(mappedBy = \"jugador\", cascade = CascadeType.ALL,\n    orphanRemoval = true)\nprivate List&lt;Fichaje&gt; fichajes = new ArrayList&lt;&gt;();\n\npublic List&lt;Fichaje&gt; getFichajes() {\n    return fichajes;\n}\n\npublic void addFichaje(Fichaje fichaje) {\n    fichajes.add(fichaje);\n    fichaje.setJugador(this);\n}<\/pre><\/li>\n<li>En <code>Equipo<\/code> a\u00f1ade su lista y su getter.\n<pre data-f=\"entity/Equipo.java (fichajes)\">@OneToMany(mappedBy = \"equipo\")\nprivate List&lt;Fichaje&gt; fichajes = new ArrayList&lt;&gt;();\n\npublic List&lt;Fichaje&gt; getFichajes() {\n    return fichajes;\n}<\/pre><\/li>\n<li>No vuelvas a generar constructores: <code>Jugador<\/code> conserva el vac\u00edo y el de 4 par\u00e1metros.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-13\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-14\">\n  <span class=\"num\" aria-hidden=\"true\">14<\/span>\n  <h3>Cargar los datos iniciales<\/h3>\n  <ol>\n<li>Det\u00e9n la aplicaci\u00f3n. En <code>application.properties<\/code> sustituye la l\u00ednea de <code>ddl-auto<\/code> y a\u00f1ade las otras dos (deja una sola l\u00ednea de cada propiedad).\n<pre data-f=\"src/main/resources/application.properties\">spring.jpa.hibernate.ddl-auto=create-drop\nspring.sql.init.mode=always\nspring.jpa.defer-datasource-initialization=true<\/pre><\/li>\n<li>Crea <code>src/main/resources/data.sql<\/code> (clic derecho &gt; <b>New File<\/b>). El orden de los <code>INSERT<\/code> importa.\n<pre data-f=\"src/main/resources/data.sql\">INSERT INTO perfiles_estadisticos\n  (id_perfil, partidos, goles, asistencias, valoracion)\nVALUES (1, 10, 6, 3, 8.5),\n       (2, 12, 0, 1, 7.2);\n\nINSERT INTO jugadores\n  (id_jugador, nombre, mote, posicion, id_perfil)\nVALUES (1, 'Ana', 'Rayo', 'DELANTERO', 1),\n       (2, 'Luis', 'Muro', 'PORTERO', 2);\n\nINSERT INTO equipos (id_equipo, nombre, ciudad, presupuesto)\nVALUES (1, 'Estrellas', 'Madrid', 100000.00),\n       (2, 'Cometas', 'Sevilla', 80000.00);\n\nINSERT INTO estadios (id_estadio, nombre, capacidad, id_equipo)\nVALUES (1, 'Campo Norte', 5000, 1),\n       (2, 'Campo Sur', 3000, 2);\n\nINSERT INTO fichajes\n  (id_fichaje, id_jugador, id_equipo, temporada, precio,\n   clausula_pagada, mercado, tipo)\nVALUES (1, 1, 1, '26/27', 1200.00, false, 'VERANO', 'TRASPASO'),\n       (2, 2, 2, '26/27', 500.00, false, 'INVIERNO', 'CESION');<\/pre><\/li>\n<li>Crea <code>IEquipoRepository<\/code> (<b>New Java File &gt; Interface<\/b>).\n<pre data-f=\"repository/IEquipoRepository.java\">package leo.astray.examen.repository;\n\nimport leo.astray.examen.entity.Equipo;\nimport org.springframework.data.jpa.repository.JpaRepository;\n\npublic interface IEquipoRepository\n        extends JpaRepository&lt;Equipo, Long&gt; {\n}<\/pre><\/li>\n<li>Deja solo esta l\u00ednea dentro de <code>run<\/code>, ejecuta y mira las tablas en phpMyAdmin (2 filas en cada una).\n<pre data-f=\"ExamenApplication.java (dentro de run)\">System.out.println(\"Datos iniciales cargados\");<\/pre><\/li>\n<li>Cierra con <code>Ctrl+C<\/code>: <code>create-drop<\/code> borra las tablas al cerrar.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-14\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-15\">\n  <span class=\"num\" aria-hidden=\"true\">15<\/span>\n  <h3>Escribir consultas en el repositorio y ejecutarlas en la aplicaci\u00f3n<\/h3>\n  <ol>\n<li>El repositorio <b>declara<\/b> la b\u00fasqueda y <code>run<\/code> la <b>ejecuta<\/b>.<\/li>\n<li>A\u00f1ade estos imports a <code>IJugadorRepository<\/code>.\n<pre data-f=\"repository/IJugadorRepository.java (imports)\">import java.util.List;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.jpa.repository.Modifying;\nimport org.springframework.data.repository.query.Param;\nimport org.springframework.transaction.annotation.Transactional;<\/pre><\/li>\n<li><b>Posici\u00f3n y trozo del nombre.<\/b> En el repositorio, dentro de la interfaz:\n<pre data-f=\"repository/IJugadorRepository.java\">@Query(value = \"\"\"\n    SELECT * FROM jugadores\n    WHERE posicion = 'DELANTERO' AND nombre LIKE '%Ana%'\n    \"\"\", nativeQuery = true)\nList&lt;Jugador&gt; buscarPorPosicionYNombre();<\/pre>\nY en <code>run<\/code>:\n<pre data-f=\"ExamenApplication.java (dentro de run)\">for (Jugador jugador : jugadorRepository.buscarPorPosicionYNombre()) {\n    System.out.println(jugador.getNombre());\n}<\
