/pre><\/li>\n<li><b>Jugadores con fichaje en equipos de una ciudad<\/b> (<code>JOIN<\/code> y <code>DISTINCT<\/code>). En el repositorio:\n<pre data-f=\"repository/IJugadorRepository.java\">@Query(value = \"\"\"\n    SELECT DISTINCT j.*\n    FROM jugadores j\n    JOIN fichajes f ON f.id_jugador = j.id_jugador\n    JOIN equipos e ON e.id_equipo = f.id_equipo\n    WHERE e.ciudad = :ciudad\n    \"\"\", nativeQuery = true)\nList&lt;Jugador&gt; buscarPorCiudad(@Param(\"ciudad\") String ciudad);<\/pre>\nY en <code>run<\/code>:\n<pre data-f=\"ExamenApplication.java (dentro de run)\">for (Jugador jugador : jugadorRepository.buscarPorCiudad(\"Madrid\")) {\n    System.out.println(jugador.getNombre());\n}<\/pre><\/li>\n<li><b>Cambiar la posici\u00f3n<\/b> de los jugadores de un equipo (<code>@Modifying<\/code>, devuelve un <code>int<\/code>). En el repositorio:\n<pre data-f=\"repository/IJugadorRepository.java\">@Modifying(clearAutomatically = true, flushAutomatically = true)\n@Transactional\n@Query(value = \"\"\"\n    UPDATE jugadores SET posicion = :posicion\n    WHERE id_jugador IN (\n        SELECT id_jugador FROM fichajes\n        WHERE id_equipo = :idEquipo\n    )\n    \"\"\", nativeQuery = true)\nint cambiarPosicionPorEquipo(\n    @Param(\"posicion\") String posicion,\n    @Param(\"idEquipo\") Long idEquipo);<\/pre>\nY al final de <code>run<\/code>:\n<pre data-f=\"ExamenApplication.java (al final de run)\">int cambiados = jugadorRepository.cambiarPosicionPorEquipo(\n    \"DEFENSA\", 1L);\nSystem.out.println(\"Filas cambiadas: \" + cambiados);<\/pre><\/li>\n<li><b>Si piden JPQL<\/b> (clases y atributos Java en vez de tablas y columnas):\n<pre data-f=\"repository/IJugadorRepository.java\">@Query(\"select j from Jugador j where j.posicion = :posicion\")\nList&lt;Jugador&gt; buscarJPQL(@Param(\"posicion\") Posicion posicion);<\/pre><\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-15\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-16\">\n  <span class=\"num\" aria-hidden=\"true\">16<\/span>\n  <h3>Corregir errores y terminar el proyecto<\/h3>\n  <ol>\n<li>Abre <b>Problems<\/b> (<code>Ctrl+Shift+M<\/code>) y corrige primero los errores de Java.<\/li>\n<li>Revisa el JDK 21, las dependencias del <code>pom.xml<\/code> y la conexi\u00f3n a MySQL (puerto, usuario, contrase\u00f1a).<\/li>\n<li>Si falla un <code>INSERT<\/code>, mira la causa en la terminal y revisa el orden de <code>data.sql<\/code>.<\/li>\n<li>Ejecuta las pruebas, desde la carpeta del <code>pom.xml<\/code>:\n<pre data-f=\"terminal (en la carpeta del pom.xml)\">.\\mvnw.cmd test<\/pre><\/li>\n<li>Construye el JAR (si dice <code>BUILD SUCCESS<\/code>, est\u00e1 en <code>target<\/code>):\n<pre data-f=\"terminal (en la carpeta del pom.xml)\">.\\mvnw.cmd clean package<\/pre><\/li>\n<li>Ejec\u00fatalo, ajustando el nombre al del archivo generado:\n<pre data-f=\"terminal (en la carpeta del pom.xml)\">java -jar .\\target\\examen-0.0.1-SNAPSHOT.jar<\/pre><\/li>\n<li>Para entregar incluye <code>pom.xml<\/code>, <code>src<\/code>, <code>mvnw<\/code>, <code>mvnw.cmd<\/code> y la carpeta <code>.mvn<\/code>.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-16\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-17\">\n  <span class=\"num\" aria-hidden=\"true\">17<\/span>\n  <h3>Materiales utilizados y documentaci\u00f3n de apoyo<\/h3>\n  <ol>\n<li>Consulta la documentaci\u00f3n oficial: consultas de Spring Data JPA, inicializaci\u00f3n de la base de datos, transacciones, <code>start.spring.io<\/code> y el servidor web.<\/li>\n<li>Al adaptar un ejemplo, revisa paquetes, imports, columnas e identificadores.<\/li>\n<li>En el examen respeta los nombres, tipos y restricciones del enunciado, incluido <code>Optional<\/code> si lo pide.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/paso-17\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<\/section>\n\n<section class=\"parte p2\" id=\"parte2\">\n  <header><p class=\"n\">PARTE 2<\/p><h2>El puente, de run() a una API REST<\/h2><p>Qu\u00e9 se a\u00f1ade por encima de lo que ya sabes, con el proyecto del f\u00fatbol<\/p><\/header>\n<article class=\"paso\" id=\"r-18\">\n  <span class=\"num\" aria-hidden=\"true\">18<\/span>\n  <h3>Qu\u00e9 cambia al pasar a REST (y por qu\u00e9)<\/h3>\n  <ol>\n<li>Antes ped\u00edas t\u00fa desde <code>run()<\/code>. Ahora pide un <b>cliente HTTP<\/b> (Postman, una web, una app).<\/li>\n<li>Entidades, relaciones y repositorios se quedan igual. Se a\u00f1aden capas: <code>RestController \u2192 IService \u2192 Service \u2192 Repository<\/code>.<\/li>\n<li>Hacia fuera salen <b>DTO<\/b>, nunca Entities.<\/li>\n<li>Los resultados se comunican con c\u00f3digos HTTP: 200, 201, 204, 400, 404 y 409.<\/li>\n<li>Los 5 pasos del puente: dependencia de validaci\u00f3n, DTO, Service, Controller y probar.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s16\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-19\">\n  <span class=\"num\" aria-hidden=\"true\">19<\/span>\n  <h3>El puente paso a paso, con el proyecto de f\u00fatbol<\/h3>\n  <ol>\n<li><b>Validaci\u00f3n:<\/b> comprueba que <code>spring-boot-starter-validation<\/code> est\u00e1 en el <code>pom.xml<\/code>. Si no, clic derecho en <code>pom.xml<\/code> &gt; <b>Add Starters<\/b> &gt; Validation.<\/li>\n<li><b>DTO:<\/b> crea el paquete <code>dto<\/code> con tres <code>record<\/code>. Lo que entra (con validaciones):\n<pre class=\"code\" data-f=\"dto/JugadorRequestDTO.java  (lo que ENTRA)\">package leo.astray.examen.dto;\n\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.PositiveOrZero;\nimport leo.astray.examen.enums.Posicion;\n\n/** Lo que el cliente ENVIA para crear un jugador. Nunca una Entity. */\npublic record JugadorRequestDTO(\n        @NotBlank(message = \"El nombre es obligatorio\") String nombre,\n        @NotBlank(message = \"El mote es obligatorio\") String mote,\n        @NotNull(message = \"La posicion es obligatoria\") Posicion posicion,\n        @NotNull(message = \"Los goles son obligatorios\")\n        @PositiveOrZero(message = \"Los goles no pueden ser negativos\") Integer goles) {\n}<\/pre>\nUna pieza anidada, para no crear bucles:\n<pre class=\"code\" data-f=\"dto/FichajeResumenDTO.java  (pieza anidada)\">package leo.astray.examen.dto;\n\n/** Solo lo necesario de un fichaje: sin bucles Jugador -&gt; Fichaje -&gt; Jugador. */\npublic record FichajeResumenDTO(String temporada, String equipo) {\n}<\/pre>\nY lo que sale:\n<pre class=\"code\" data-f=\"dto/JugadorResponseDTO.java  (lo que SALE)\">package leo.astray.examen.dto;\n\nimport java.util.List;\n\nimport leo.astray.examen.enums.Posicion;\n\n/** Lo que el cliente RECIBE. */\npublic record JugadorResponseDTO(\n        Long id,\n        String nombre,\n        String mote,\n        Posicion posicion,\n        Integer goles,\n        List&lt;FichajeResumenDTO&gt; fichajes) {\n}<\/pre><\/li>\n<li><b>Service:<\/b> el contrato, que solo habla de DTO.\n<pre class=\"code\" data-f=\"service/IJugadorService.java  (la carta: solo DTO)\">package leo.astray.examen.service;\n\nimport java.util.List;\nimport java.util.Optional;\n\nimport leo.astray.examen.dto.JugadorRequestDTO;\nimport leo.astray.examen.dto.JugadorResponseDTO;\n\n/** El contrato solo habla de DTO: ninguna Entity aparece aqui. */\npublic interface IJugadorService {\n\n    JugadorResponseDTO crear(JugadorRequestDTO dto);\n\n    // Optional vacio = no existe (el controller lo traduce a 404)\n    Optional&lt;JugadorResponseDTO&gt; obtenerPorId(Long id);\n\n    List&lt;JugadorResponseDTO&gt; listar();\n\n    // true = borrado, false = no existe (el controller lo traduce a 204 / 404)\n    boolean eliminar(Long id);\n}<\/pre>\nY quien hace el trabajo, con <code>@Transactional<\/code> y la conversi\u00f3n entre DTO y Entity:\n<details class=\"cod\"><summary>Ver el c\u00f3digo completo (78 l\u00edneas)<\/summary><pre class=\"code\" data-f=\"service/impl/JugadorServiceImpl.java  (el cocinero)\">package leo.astray.examen.service.impl;\n\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport leo.astray.examen.dto.FichajeResumenDTO;\nimport leo.astray.examen.dto.JugadorRequestDTO;\nimport leo.astray.examen.dto.JugadorResponseDTO;\nimport leo.astray.examen.entity.Fichaje;\nimport leo.astray.examen.entity.Jugador;\nimport leo.astray.examen.entity.PerfilEstadistico;\nimport leo.astray.examen.repository.IJugadorRepository;\nimport leo.astray.examen.service.IJugadorService;\n\n@Service\npublic class JugadorServiceImpl implements IJugadorService {\n\n    @Autowired\n    private IJugadorRepository jugadorRepository;\n\n    @Override\n    @Transactional\n    public JugadorResponseDTO crear(JugadorRequestDTO dto) {\n        // DTO -&gt; Entity (la conversion ocurre AQUI, en el servicio)\n        // El perfil se crea primero: el constructor de Jugador lo exige (paso 11).\n        // Solo conocemos los goles; el resto de estadisticas empieza en 0.\n        PerfilEstadistico perfil = new PerfilEstadistico(0, dto.goles(), 0, 0.0);\n        Jugador jugador = new Jugador(dto.nombre(), dto.mote(), dto.posicion(), perfil);\n        Jugador guardado = jugadorRepository.save(jugador);\n        return mapearADTO(guardado);\n    }\n\n    // @Transactional(readOnly = true): la sesion sigue abierta al recorrer fichajes (LAZY)\n    @Override\n    @Transactional(readOnly = true)\n    public Optional&lt;JugadorResponseDTO&gt; obtenerPorId(Long id) {\n        Optional&lt;Jugador&gt; opt = jugadorRepository.findById(id);\n        if (opt.isEmpty()) {\n            return Optional.empty();\n        }\n        return Optional.of(mapearADTO(opt.get()));\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public List&lt;JugadorResponseDTO&gt; listar() {\n        List&lt;JugadorResponseDTO&gt; lista = new ArrayList&lt;&gt;();\n        for (Jugador j : jugadorRepository.findAll()) {\n            lista.add(mapearADTO(j));\n        }\n        return lista;\n    }\n\n    @Override\n    @Transactional\n    public boolean eliminar(Long id) {\n        if (!jugadorRepository.existsById(id)) {\n            return false;\n        }\n        jugadorRepository.deleteById(id);\n        return true;\n    }\n\n    // Entity -&gt; DTO\n    private JugadorResponseDTO mapearADTO(Jugador j) {\n        List&lt;FichajeResumenDTO&gt; fichajes = new ArrayList&lt;&gt;();\n        for (Fichaje f : j.getFichajes()) {\n            fichajes.add(new FichajeResumenDTO(f.getTemporada(), f.getEquipo().getNombre()));\n        }\n        return new JugadorResponseDTO(j.getId(), j.getNombre(), j.getMote(), j.getPosicion(),\n                j.getPerfil().getGoles(), fichajes);\n    }\n}<\/pre><\/details><\/li>\n<li><b>Controller:<\/b> recibe HTTP y responde con <code>ResponseEntity<\/code> (201 con <code>Location<\/code>, 200, 204 y 404).\n<details class=\"cod\"><summary>Ver el c\u00f3digo completo (67 l\u00edneas)<\/summary><pre class=\"code\" data-f=\"controller/JugadorController.java\">package leo.astray.examen.controller;\n\nimport java.net.URI;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.servlet.support.ServletUriComponentsBuilder;\n\nimport jakarta.validation.Valid;\nimport leo.astray.examen.dto.JugadorRequestDTO;\nimport leo.astray.examen.dto.JugadorResponseDTO;\nimport leo.astray.examen.service.IJugadorService;\n\n/** El camarero: solo importa DTO y el IService. Nunca una Entity ni un Repository. */\n@RestController\n@RequestMapping(\"/api/jugadores\")\npublic class JugadorController {\n\n    @Autowired\n    private IJugadorService jugadorService;\n\n    // POST /api/jugadores -&gt; 201 + Location | 400 (si @Valid falla, Spring ya responde 400)\n    @PostMapping\n    public ResponseEntity&lt;JugadorResponseDTO&gt; crear(@Valid @RequestBody JugadorRequestDTO dto) {\n        JugadorResponseDTO creado = jugadorService.crear(dto);\n        URI location = ServletUriComponentsBuilder\n                .fromCurrentRequest()\n                .path(\"/{id}\")\n                .buildAndExpand(creado.id())\n                .toUri();\n        return ResponseEntity.created(location).body(creado);\n    }\n\n    // GET /api/jugadores/{id} -&gt; 200 | 404\n    @GetMapping(\"/{id}\")\n    public ResponseEntity&lt;JugadorResponseDTO&gt; obtenerPorId(@PathVariable Long id) {\n        Optional&lt;JugadorResponseDTO&gt; opt = jugadorService.obtenerPorId(id);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // GET /api/jugadores -&gt; 200\n    @GetMapping\n    public ResponseEntity&lt;List&lt;JugadorResponseDTO&gt;&gt; listar() {\n        return ResponseEntity.ok(jugadorService.listar());\n    }\n\n    // DELETE /api/jugadores/{id} -&gt; 204 | 404\n    @DeleteMapping(\"/{id}\")\n    public ResponseEntity&lt;Void&gt; eliminar(@PathVariable Long id) {\n        if (jugadorService.eliminar(id)) {\n            return ResponseEntity.noContent().build();\n        }\n        return ResponseEntity.notFound().build();\n    }\n}<\/pre><\/details><\/li>\n<li><b>Probar:<\/b> arranca y usa Postman. En el POST, <b>Body &gt; raw &gt; JSON<\/b>, con este cuerpo (sus claves son los campos del <code>RequestDTO<\/code>, sin <code>id<\/code>).\n<pre class=\"code\" data-f=\"Body (raw, JSON) de POST /api/jugadores\">{\n    \"nombre\": \"Nuevo\",\n    \"mote\": \"Cohete\",\n    \"posicion\": \"DEFENSA\",\n    \"goles\": 2\n}<\/pre>\nPrueba tambi\u00e9n los errores a prop\u00f3sito (nombre vac\u00edo, una posici\u00f3n que no existe, sin <code>goles<\/code>\u2026): deben dar <b>400<\/b>.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s17\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<\/section>\n\n<section class=\"parte p3\" id=\"parte3\">\n  <header><p class=\"n\">PARTE 3<\/p><h2>La API completa: biblioteca editorial<\/h2><p>Soluci\u00f3n con Spring Boot, JPA, DTO y validaci\u00f3n, explicada para presentarla<\/p><\/header>\n<article class=\"paso\" id=\"r-20\">\n  <span class=\"num\" aria-hidden=\"true\">20<\/span>\n  <h3>El ejercicio: qu\u00e9 se pide y c\u00f3mo se resuelve<\/h3>\n  <ol>\n<li>Lo que se eval\u00faa es saber <b>conectar las capas<\/b>: RestController, IService, Service, JpaRepository, Entity, DTO y ResponseEntity.<\/li>\n<li>El modelo: Editorial 1:N Libro, Libro 1:1 FichaLibro y Libro N:M Autor (4 entidades y 5 tablas).<\/li>\n<li>La gu\u00eda completa trae la tabla de endpoints con su c\u00f3digo de \u00e9xito y los de error.<\/li>\n<li>Orden de trabajo: proyecto, Misi\u00f3n 1 (entidades), repositorios, DTO, servicios y controladores, trampas, <code>@Valid<\/code> y probar.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s18\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-21\">\n  <span class=\"num\" aria-hidden=\"true\">21<\/span>\n  <h3>Crear y configurar el proyecto<\/h3>\n  <ol>\n<li>En Initializr: Maven, Java 21, Spring Boot 4.1.2, Group y package <code>edu.rico.biblioteca<\/code>, Artifact <code>biblioteca<\/code>. Dependencias: MySQL Driver, Spring Data JPA, Spring Boot DevTools, Spring Web y Validation.<\/li>\n<li>El <code>pom.xml<\/code> debe quedar con estas dependencias (en Spring Boot 4.1 el starter web se llama <code>spring-boot-starter-webmvc<\/code>).\n<pre class=\"code\" data-f=\"pom.xml  (dependencies)\">&lt;dependencies&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;\n        &lt;artifactId&gt;spring-boot-starter-data-jpa&lt;/artifactId&gt;\n    &lt;/dependency&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;\n        &lt;artifactId&gt;spring-boot-starter-webmvc&lt;/artifactId&gt;\n    &lt;/dependency&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;\n        &lt;artifactId&gt;spring-boot-starter-validation&lt;/artifactId&gt;\n    &lt;/dependency&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;\n        &lt;artifactId&gt;spring-boot-devtools&lt;/artifactId&gt;\n        &lt;scope&gt;runtime&lt;/scope&gt;\n        &lt;optional&gt;true&lt;/optional&gt;\n    &lt;/dependency&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;com.mysql&lt;/groupId&gt;\n        &lt;artifactId&gt;mysql-connector-j&lt;/artifactId&gt;\n        &lt;scope&gt;runtime&lt;/scope&gt;\n    &lt;/dependency&gt;\n&lt;/dependencies&gt;<\/pre><\/li>\n<li>Configura <code>application.properties<\/code>. Ajusta usuario, contrase\u00f1a y puerto.\n<pre class=\"code\" data-f=\"src/main/resources/application.properties\">spring.application.name=biblioteca\n\nspring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?createDatabaseIfNotExist=true&amp;serverTimezone=UTC\nspring.datasource.username=root\nspring.datasource.password=\n\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true\nspring.jpa.properties.hibernate.format_sql=true\n# Sin sesion abierta durante toda la peticion: asi el fallo LAZY es real y entendemos donde va @Transactional\nspring.jpa.open-in-view=false<\/pre><\/li>\n<li>Crea esta estructura de paquetes.\n<pre class=\"code\" data-f=\"estructura\">edu/rico/biblioteca/\n \u251c\u2500 BibliotecaApplication.java\n \u251c\u2500 entity/       Editorial, Libro, Autor, FichaLibro\n \u251c\u2500 repository/   IEditorialRepository, ILibroRepository, IAutorRepository, IFichaLibroRepository\n \u251c\u2500 dto/          *RequestDTO, *ResponseDTO, *ResumenDTO, FichaLibroDTO\n \u251c\u2500 service/      IEditorialService, IAutorService, ILibroService\n \u2502   \u2514\u2500 impl/     EditorialServiceImpl, AutorServiceImpl, LibroServiceImpl\n \u2514\u2500 controller/   EditorialController, AutorController, LibroController<\/pre><\/li>\n<li>Con el proyecto vac\u00edo debe arrancar sin errores (Tomcat en el 8080).<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s19\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-22\">\n  <span class=\"num\" aria-hidden=\"true\">22<\/span>\n  <h3>Misi\u00f3n 1: decisiones de dise\u00f1o y entidades<\/h3>\n  <ol>\n<li>El <b>lado propietario<\/b> es el que tiene la clave for\u00e1nea; el otro lleva <code>mappedBy<\/code>. Aqu\u00ed: <code>Libro<\/code> (con <code>Editorial<\/code> y con <code>Autor<\/code>) y <code>FichaLibro<\/code> (con <code>Libro<\/code>).<\/li>\n<li><code>@ManyToOne<\/code> con <code>fetch = LAZY<\/code>; en el N:M, <code>Set<\/code> con <code>equals<\/code> y <code>hashCode<\/code>; <code>Libro \u2192 FichaLibro<\/code> con <code>cascade = ALL<\/code> y <code>orphanRemoval<\/code>; <code>Editorial \u2192 Libro<\/code> sin <code>REMOVE<\/code>.<\/li>\n<li><code>Libro<\/code>, propietario del N:M y de la clave a editorial, con los m\u00e9todos <code>addAutor<\/code>, <code>removeAutor<\/code> y <code>setFicha<\/code>, que actualizan los dos lados:\n<details class=\"cod\"><summary>Ver el c\u00f3digo completo (81 l\u00edneas)<\/summary><pre class=\"code\" data-f=\"entity/Libro.java\">package edu.rico.biblioteca.entity;\n\nimport jakarta.persistence.*;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\n@Entity\n@Table(name = \"libro\")\npublic class Libro {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, length = 150)\n    private String titulo;\n\n    // Lado propietario de 1:N con carga perezosa\n    @ManyToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"editorial_id\", nullable = false)\n    private Editorial editorial;\n\n    // Relaci\u00f3n 1:1 con propagaci\u00f3n total y borrado de hu\u00e9rfanos\n    @OneToOne(mappedBy = \"libro\", cascade = CascadeType.ALL, orphanRemoval = true, fetch = FetchType.LAZY)\n    private FichaLibro ficha;\n\n    // Lado propietario de N:M mediante tabla intermedia\n    @ManyToMany\n    @JoinTable(\n        name = \"libro_autor\",\n        joinColumns = @JoinColumn(name = \"libro_id\"),\n        inverseJoinColumns = @JoinColumn(name = \"autor_id\")\n    )\n    private Set&lt;Autor&gt; autores = new HashSet&lt;&gt;();\n\n    public Libro() {\n    }\n\n    public Libro(String titulo) {\n        this.titulo = titulo;\n    }\n\n    // M\u00e9todos helper de sincronizaci\u00f3n bidireccional\n    public void addAutor(Autor autor) {\n        this.autores.add(autor);\n        autor.getLibros().add(this);\n    }\n\n    public void removeAutor(Autor autor) {\n        this.autores.remove(autor);\n        autor.getLibros().remove(this);\n    }\n\n    public void setFicha(FichaLibro ficha) {\n        this.ficha = ficha;\n        if (ficha != null) {\n            ficha.setLibro(this);\n        }\n    }\n\n    public Long getId() { return id; }\n    public void setId(Long id) { this.id = id; }\n    public String getTitulo() { return titulo; }\n    public void setTitulo(String titulo) { this.titulo = titulo; }\n    public Editorial getEditorial() { return editorial; }\n    public void setEditorial(Editorial editorial) { this.editorial = editorial; }\n    public FichaLibro getFicha() { return ficha; }\n    public Set&lt;Autor&gt; getAutores() { return autores; }\n    public void setAutores(Set&lt;Autor&gt; autores) { this.autores = autores; }\n\n    @Override\n    public boolean equals(Object o) {\n        return o instanceof Libro other &amp;&amp; id != null &amp;&amp; id.equals(other.id);\n    }\n\n    @Override\n    public int hashCode() {\n        return Libro.class.hashCode();\n    }\n}<\/pre><\/details><\/li>\n<li><code>Editorial<\/code>:\n<pre class=\"code\" data-f=\"entity/Editorial.java\">package edu.rico.biblioteca.entity;\n\nimport jakarta.persistence.*;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\n@Entity\n@Table(name = \"editorial\")\npublic class Editorial {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, length = 100)\n    private String nombre;\n\n    @Column(nullable = false, length = 60)\n    private String pais;\n\n    // Relaci\u00f3n 1:N inversa (no lleva CascadeType.REMOVE para proteger los libros)\n    @OneToMany(mappedBy = \"editorial\")\n    private List&lt;Libro&gt; libros = new ArrayList&lt;&gt;();\n\n    public Editorial() {\n    }\n\n    public Editorial(String nombre, String pais) {\n        this.nombre = nombre;\n        this.pais = pais;\n    }\n\n    public Long getId() { return id; }\n    public void setId(Long id) { this.id = id; }\n    public String getNombre() { return nombre; }\n    public void setNombre(String nombre) { this.nombre = nombre; }\n    public String getPais() { return pais; }\n    public void setPais(String pais) { this.pais = pais; }\n    public List&lt;Libro&gt; getLibros() { return libros; }\n    public void setLibros(List&lt;Libro&gt; libros) { this.libros = libros; }\n}<\/pre><\/li>\n<li><code>Autor<\/code>, lado inverso del N:M:\n<pre class=\"code\" data-f=\"entity/Autor.java\">package edu.rico.biblioteca.entity;\n\nimport jakarta.persistence.*;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\n@Entity\n@Table(name = \"autor\")\npublic class Autor {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, length = 100)\n    private String nombre;\n\n    @Column(nullable = false, length = 60)\n    private String nacionalidad;\n\n    // Lado inverso de la relaci\u00f3n N:M\n    @ManyToMany(mappedBy = \"autores\")\n    private Set&lt;Libro&gt; libros = new HashSet&lt;&gt;();\n\n    public Autor() {\n    }\n\n    public Autor(String nombre, String nacionalidad) {\n        this.nombre = nombre;\n        this.nacionalidad = nacionalidad;\n    }\n\n    public Long getId() { return id; }\n    public void setId(Long id) { this.id = id; }\n    public String getNombre() { return nombre; }\n    public void setNombre(String nombre) { this.nombre = nombre; }\n    public String getNacionalidad() { return nacionalidad; }\n    public void setNacionalidad(String nacionalidad) { this.nacionalidad = nacionalidad; }\n    public Set&lt;Libro&gt; getLibros() { return libros; }\n    public void setLibros(Set&lt;Libro&gt; libros) { this.libros = libros; }\n\n    // El Set necesita saber cu\u00e1ndo dos autores son \"el mismo\": por id.\n    @Override\n    public boolean equals(Object o) {\n        return o instanceof Autor other &amp;&amp; id != null &amp;&amp; id.equals(other.id);\n    }\n\n    @Override\n    public int hashCode() {\n        return Autor.class.hashCode();\n    }\n}<\/pre><\/li>\n<li><code>FichaLibro<\/code>, propietaria del 1:1:\n<pre class=\"code\" data-f=\"entity/FichaLibro.java\">package edu.rico.biblioteca.entity;\n\nimport jakarta.persistence.*;\n\n@Entity\n@Table(name = \"ficha_libro\")\npublic class FichaLibro {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, unique = true, length = 20)\n    private String isbn;\n\n    @Column(nullable = false)\n    private int paginas;\n\n    @Column(nullable = false)\n    private int anio;\n\n    // Lado propietario de la relaci\u00f3n 1:1\n    @OneToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"libro_id\", nullable = false, unique = true)\n    private Libro libro;\n\n    public FichaLibro() {\n    }\n\n    public FichaLibro(String isbn, int paginas, int anio) {\n        this.isbn = isbn;\n        this.paginas = paginas;\n        this.anio = anio;\n    }\n\n    public Long getId() { return id; }\n    public void setId(Long id) { this.id = id; }\n    public String getIsbn() { return isbn; }\n    public void setIsbn(String isbn) { this.isbn = isbn; }\n    public int getPaginas() { return paginas; }\n    public void setPaginas(int paginas) { this.paginas = paginas; }\n    public int getAnio() { return anio; }\n    public void setAnio(int anio) { this.anio = anio; }\n    public Libro getLibro() { return libro; }\n    public void setLibro(Libro libro) { this.libro = libro; }\n}<\/pre><\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s20\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-23\">\n  <span class=\"num\" aria-hidden=\"true\">23<\/span>\n  <h3>Los repositorios<\/h3>\n  <ol>\n<li>Crea cuatro interfaces <code>JpaRepository&lt;Entidad, Long&gt;<\/code>, una por entidad. La interesante es la de libros: <code>findByEditorialId<\/code>, <code>countByEditorialId<\/code> (para decidir el 409) y <code>findByIdConRelaciones<\/code> (con <code>JOIN FETCH<\/code>, contra el N+1).\n<pre class=\"code\" data-f=\"repository/ILibroRepository.java\">package edu.rico.biblioteca.repository;\n\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.repository.query.Param;\n\nimport edu.rico.biblioteca.entity.Libro;\n\npublic interface ILibroRepository extends JpaRepository&lt;Libro, Long&gt; {\n\n    // B\u00fasqueda por FK directa\n    List&lt;Libro&gt; findByEditorialId(Long editorialId);\n\n    // Conteo de libros asignados a una editorial para validar el borrado con 409\n    long countByEditorialId(Long editorialId);\n\n    // Consulta optimizada para evitar problema N+1 al cargar el detalle completo\n    @Query(\"SELECT l FROM Libro l \" +\n            \"LEFT JOIN FETCH l.editorial \" +\n            \"LEFT JOIN FETCH l.ficha \" +\n            \"LEFT JOIN FETCH l.autores \" +\n            \"WHERE l.id = :id\")\n    Optional&lt;Libro&gt; findByIdConRelaciones(@Param(\"id\") Long id);\n}<\/pre><\/li>\n<li>Los otros tres:\n<pre class=\"code\" data-f=\"repository/IEditorialRepository.java\">package edu.rico.biblioteca.repository;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport edu.rico.biblioteca.entity.Editorial;\n\npublic interface IEditorialRepository extends JpaRepository&lt;Editorial, Long&gt; {\n    boolean existsByNombre(String nombre);\n}<\/pre>\n<pre class=\"code\" data-f=\"repository/IAutorRepository.java\">package edu.rico.biblioteca.repository;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport edu.rico.biblioteca.entity.Autor;\n\npublic interface IAutorRepository extends JpaRepository&lt;Autor, Long&gt; {\n}<\/pre>\n<pre class=\"code\" data-f=\"repository/IFichaLibroRepository.java\">package edu.rico.biblioteca.repository;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport edu.rico.biblioteca.entity.FichaLibro;\n\npublic interface IFichaLibroRepository extends JpaRepository&lt;FichaLibro, Long&gt; {\n}<\/pre><\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s21\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-24\">\n  <span class=\"num\" aria-hidden=\"true\">24<\/span>\n  <h3>Misi\u00f3n 2: los DTO como contrato de la API<\/h3>\n  <ol>\n<li>El cliente nunca ve una Entity. Todos los DTO son <code>record<\/code>: de entrada (<code>*RequestDTO<\/code>), de salida (<code>*ResponseDTO<\/code>) y <code>*ResumenDTO<\/code> anidados para romper los bucles.<\/li>\n<li>El libro recibe <b>ids<\/b> (<code>editorialId<\/code> y <code>autoresIds<\/code>), no objetos: el Service busca los reales.<\/li>\n<li>Esta es la primera versi\u00f3n, sin validar (cada <code>record<\/code> va en su archivo, en el paquete <code>dto<\/code>). La versi\u00f3n final est\u00e1 en el paso 28.\n<pre class=\"code\" data-f=\"dto/  (versi\u00f3n 1, tal como se crean al principio)\">public record EditorialResumenDTO(Long id, String nombre) {}\npublic record AutorResumenDTO(Long id, String nombre) {}\npublic record LibroResumenDTO(Long id, String titulo) {}\n\npublic record FichaLibroDTO(String isbn, int paginas, int anio) {}\n\npublic record EditorialRequestDTO(String nombre, String pais) {}\npublic record EditorialResponseDTO(Long id, String nombre, String pais) {}\n\npublic record AutorRequestDTO(String nombre, String nacionalidad) {}\npublic record AutorResponseDTO(Long id, String nombre, String nacionalidad, List&lt;LibroResumenDTO&gt; libros) {}\n\npublic record LibroRequestDTO(String titulo, Long editorialId, Set&lt;Long&gt; autoresIds, FichaLibroDTO ficha) {}\npublic record LibroResponseDTO(Long id, String titulo, EditorialResumenDTO editorial,\n                               List&lt;AutorResumenDTO&gt; autores, FichaLibroDTO ficha) {}<\/pre><\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s22\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-25\">\n  <span class=\"num\" aria-hidden=\"true\">25<\/span>\n  <h3>Los servicios: interfaces, implementaciones y conversi\u00f3n<\/h3>\n  <ol>\n<li>Para cada entidad, una interfaz (solo con DTO) y su implementaci\u00f3n con <code>@Service<\/code>, <code>@Autowired<\/code> y <code>@Transactional<\/code>. El Service convierte entre DTO y Entity.<\/li>\n<li><b>Libro<\/b>, el m\u00e1s completo. <code>LibroServiceImpl<\/code> usa tres repositorios y no <code>IEditorialService<\/code>, porque necesita Entities.\n<pre class=\"code\" data-f=\"service/ILibroService.java\">package edu.rico.biblioteca.service;\n\nimport java.util.List;\nimport java.util.Optional;\n\nimport edu.rico.biblioteca.dto.FichaLibroDTO;\nimport edu.rico.biblioteca.dto.LibroRequestDTO;\nimport edu.rico.biblioteca.dto.LibroResponseDTO;\n\npublic interface ILibroService {\n    LibroResponseDTO crear(LibroRequestDTO dto);\n\n    Optional&lt;LibroResponseDTO&gt; obtenerPorId(Long id);\n\n    Optional&lt;List&lt;LibroResponseDTO&gt;&gt; listarPorEditorial(Long editorialId);\n\n    Optional&lt;LibroResponseDTO&gt; actualizarFicha(Long libroId, FichaLibroDTO fichaDTO);\n\n    Optional&lt;LibroResponseDTO&gt; asociarAutor(Long libroId, Long autorId);\n\n    boolean desasociarAutor(Long libroId, Long autorId);\n}<\/pre>\n<details class=\"cod\"><summary>Ver el c\u00f3digo completo (176 l\u00edneas)<\/summary><pre class=\"code\" data-f=\"service/impl/LibroServiceImpl.java\">package edu.rico.biblioteca.service.impl;\n\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport edu.rico.biblioteca.dto.AutorResumenDTO;\nimport edu.rico.biblioteca.dto.EditorialResumenDTO;\nimport edu.rico.biblioteca.dto.FichaLibroDTO;\nimport edu.rico.biblioteca.dto.LibroRequestDTO;\nimport edu.rico.biblioteca.dto.LibroResponseDTO;\nimport edu.rico.biblioteca.entity.Autor;\nimport edu.rico.biblioteca.entity.Editorial;\nimport edu.rico.biblioteca.entity.FichaLibro;\nimport edu.rico.biblioteca.entity.Libro;\nimport edu.rico.biblioteca.repository.IAutorRepository;\nimport edu.rico.biblioteca.repository.IEditorialRepository;\nimport edu.rico.biblioteca.repository.ILibroRepository;\nimport edu.rico.biblioteca.service.ILibroService;\n\n@Service\npublic class LibroServiceImpl implements ILibroService {\n\n    @Autowired\n    private ILibroRepository libroRepo;\n\n    @Autowired\n    private IEditorialRepository editorialRepo;\n\n    @Autowired\n    private IAutorRepository autorRepo;\n\n    @Override\n    @Transactional\n    public LibroResponseDTO crear(LibroRequestDTO dto) {\n        // 1. Resolver la Editorial\n        Optional&lt;Editorial&gt; editorialOpt = editorialRepo.findById(dto.editorialId());\n        if (editorialOpt.isEmpty()) {\n            throw new IllegalArgumentException(\"La editorial con ID \" + dto.editorialId() + \" no existe\");\n        }\n\n        Libro libro = new Libro(dto.titulo());\n        libro.setEditorial(editorialOpt.get());\n\n        // 2. Resolver Autores\n        if (dto.autoresIds() != null &amp;&amp; !dto.autoresIds().isEmpty()) {\n            for (Long autorId : dto.autoresIds()) {\n                Optional&lt;Autor&gt; autorOpt = autorRepo.findById(autorId);\n                if (autorOpt.isEmpty()) {\n                    throw new IllegalArgumentException(\"El autor con ID \" + autorId + \" no existe\");\n                }\n                libro.addAutor(autorOpt.get());\n            }\n        }\n\n        // 3. Resolver Ficha T\u00e9cnica (1:1)\n        if (dto.ficha() != null) {\n            FichaLibro ficha = new FichaLibro(dto.ficha().isbn(), dto.ficha().paginas(), dto.ficha().anio());\n            libro.setFicha(ficha);\n        }\n\n        Libro guardado = libroRepo.save(libro);\n        return mapearAResponseDTO(guardado);\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public Optional&lt;LibroResponseDTO&gt; obtenerPorId(Long id) {\n        Optional&lt;Libro&gt; opt = libroRepo.findByIdConRelaciones(id);\n        if (opt.isEmpty()) {\n            return Optional.empty();\n        }\n        return Optional.of(mapearAResponseDTO(opt.get()));\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public Optional&lt;List&lt;LibroResponseDTO&gt;&gt; listarPorEditorial(Long editorialId) {\n        if (!editorialRepo.existsById(editorialId)) {\n            return Optional.empty();\n        }\n\n        List&lt;Libro&gt; libros = libroRepo.findByEditorialId(editorialId);\n        List&lt;LibroResponseDTO&gt; listaDTO = new ArrayList&lt;&gt;();\n        for (Libro l : libros) {\n            listaDTO.add(mapearAResponseDTO(l));\n        }\n        return Optional.of(listaDTO);\n    }\n\n    @Override\n    @Transactional\n    public Optional&lt;LibroResponseDTO&gt; actualizarFicha(Long libroId, FichaLibroDTO fichaDTO) {\n        Optional&lt;Libro&gt; opt = libroRepo.findById(libroId);\n        if (opt.isEmpty()) {\n            return Optional.empty();\n        }\n\n        Libro libro = opt.get();\n        FichaLibro ficha = libro.getFicha();\n\n        if (ficha == null) {\n            ficha = new FichaLibro();\n            libro.setFicha(ficha);\n        }\n\n        ficha.setIsbn(fichaDTO.isbn());\n        ficha.setPaginas(fichaDTO.paginas());\n        ficha.setAnio(fichaDTO.anio());\n\n        Libro guardado = libroRepo.save(libro);\n        return Optional.of(mapearAResponseDTO(guardado));\n    }\n\n    @Override\n    @Transactional\n    public Optional&lt;LibroResponseDTO&gt; asociarAutor(Long libroId, Long autorId) {\n        Optional&lt;Libro&gt; libroOpt = libroRepo.findById(libroId);\n        Optional&lt;Autor&gt; autorOpt = autorRepo.findById(autorId);\n\n        if (libroOpt.isEmpty() || autorOpt.isEmpty()) {\n            return Optional.empty();\n        }\n\n        Libro libro = libroOpt.get();\n        Autor autor = autorOpt.get();\n\n        libro.addAutor(autor);\n        Libro guardado = libroRepo.save(libro);\n        return Optional.of(mapearAResponseDTO(guardado));\n    }\n\n    @Override\n    @Transactional\n    public boolean desasociarAutor(Long libroId, Long autorId) {\n        Optional&lt;Libro&gt; libroOpt = libroRepo.findById(libroId);\n        Optional&lt;Autor&gt; autorOpt = autorRepo.findById(autorId);\n\n        if (libroOpt.isEmpty() || autorOpt.isEmpty()) {\n            return false;\n        }\n\n        Libro libro = libroOpt.get();\n        Autor autor = autorOpt.get();\n\n        libro.removeAutor(autor);\n        libroRepo.save(libro);\n        return true;\n    }\n\n    // Conversi\u00f3n manual entre Entity y DTO (sin librer\u00edas externas)\n    private LibroResponseDTO mapearAResponseDTO(Libro l) {\n        EditorialResumenDTO edDTO = null;\n        if (l.getEditorial() != null) {\n            edDTO = new EditorialResumenDTO(l.getEditorial().getId(), l.getEditorial().getNombre());\n        }\n\n        List&lt;AutorResumenDTO&gt; autoresDTO = new ArrayList&lt;&gt;();\n        if (l.getAutores() != null) {\n            for (Autor a : l.getAutores()) {\n                autoresDTO.add(new AutorResumenDTO(a.getId(), a.getNombre()));\n            }\n        }\n\n        FichaLibroDTO fichaDTO = null;\n        if (l.getFicha() != null) {\n            fichaDTO = new FichaLibroDTO(l.getFicha().getIsbn(), l.getFicha().getPaginas(), l.getFicha().getAnio());\n        }\n\n        return new LibroResponseDTO(l.getId(), l.getTitulo(), edDTO, autoresDTO, fichaDTO);\n    }\n}<\/pre><\/details><\/li>\n<li><b>Editorial<\/b>:\n<pre class=\"code\" data-f=\"service/IEditorialService.java\">package edu.rico.biblioteca.service;\n\nimport java.util.Optional;\n\nimport edu.rico.biblioteca.dto.EditorialRequestDTO;\nimport edu.rico.biblioteca.dto.EditorialResponseDTO;\n\npublic interface IEditorialService {\n    EditorialResponseDTO crear(EditorialRequestDTO dto);\n\n    Optional&lt;EditorialResponseDTO&gt; obtenerPorId(Long id);\n\n    // Devuelve: 1 = borrado con \u00e9xito (204), 0 = no existe (404), -1 = conflicto, tiene libros (409)\n    int eliminar(Long id);\n}<\/pre>\n<details class=\"cod\"><summary>Ver el c\u00f3digo completo (61 l\u00edneas)<\/summary><pre class=\"code\" data-f=\"service/impl/EditorialServiceImpl.java\">package edu.rico.biblioteca.service.impl;\n\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport edu.rico.biblioteca.dto.EditorialRequestDTO;\nimport edu.rico.biblioteca.dto.EditorialResponseDTO;\nimport edu.rico.biblioteca.entity.Editorial;\nimport edu.rico.biblioteca.repository.IEditorialRepository;\nimport edu.rico.biblioteca.repository.ILibroRepository;\nimport edu.rico.biblioteca.service.IEditorialService;\n\n@Service\npublic class EditorialServiceImpl implements IEditorialService {\n\n    @Autowired\n    private IEditorialRepository editorialRepo;\n\n    @Autowired\n    private ILibroRepository libroRepo;\n\n    @Override\n    @Transactional\n    public EditorialResponseDTO crear(EditorialRequestDTO dto) {\n        Editorial editorial = new Editorial(dto.nombre(), dto.pais());\n        Editorial guardada = editorialRepo.save(editorial);\n        return new EditorialResponseDTO(guardada.getId(), guardada.getNombre(), guardada.getPais());\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public Optional&lt;EditorialResponseDTO&gt; obtenerPorId(Long id) {\n        Optional&lt;Editorial&gt; opt = editorialRepo.findById(id);\n        if (opt.isEmpty()) {\n            return Optional.empty();\n        }\n\n        Editorial e = opt.get();\n        return Optional.of(new EditorialResponseDTO(e.getId(), e.getNombre(), e.getPais()));\n    }\n\n    @Override\n    @Transactional\n    public int eliminar(Long id) {\n        if (!editorialRepo.existsById(id)) {\n            return 0; // 404\n        }\n\n        // Comprobaci\u00f3n de integridad: verificar si tiene libros asociados\n        long totalLibros = libroRepo.countByEditorialId(id);\n        if (totalLibros &gt; 0) {\n            return -1; // 409 Conflicto\n        }\n\n        editorialRepo.deleteById(id);\n        return 1; // 204 \u00c9xito\n    }\n}<\/pre><\/details><\/li>\n<li><b>Autor<\/b>:\n<pre class=\"code\" data-f=\"service/IAutorService.java\">package edu.rico.biblioteca.service;\n\nimport java.util.List;\nimport java.util.Optional;\n\nimport edu.rico.biblioteca.dto.AutorRequestDTO;\nimport edu.rico.biblioteca.dto.AutorResponseDTO;\nimport edu.rico.biblioteca.dto.LibroResumenDTO;\n\npublic interface IAutorService {\n    AutorResponseDTO crear(AutorRequestDTO dto);\n\n    Optional&lt;List&lt;LibroResumenDTO&gt;&gt; obtenerLibrosPorAutor(Long autorId);\n}<\/pre>\n<pre class=\"code\" data-f=\"service/impl/AutorServiceImpl.java\">package edu.rico.biblioteca.service.impl;\n\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport edu.rico.biblioteca.dto.AutorRequestDTO;\nimport edu.rico.biblioteca.dto.AutorResponseDTO;\nimport edu.rico.biblioteca.dto.LibroResumenDTO;\nimport edu.rico.biblioteca.entity.Autor;\nimport edu.rico.biblioteca.entity.Libro;\nimport edu.rico.biblioteca.repository.IAutorRepository;\nimport edu.rico.biblioteca.service.IAutorService;\n\n@Service\npublic class AutorServiceImpl implements IAutorService {\n\n    @Autowired\n    private IAutorRepository autorRepo;\n\n    @Override\n    @Transactional\n    public AutorResponseDTO crear(AutorRequestDTO dto) {\n        Autor autor = new Autor(dto.nombre(), dto.nacionalidad());\n        Autor guardado = autorRepo.save(autor);\n        return new AutorResponseDTO(guardado.getId(), guardado.getNombre(), guardado.getNacionalidad(), new ArrayList&lt;&gt;());\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public Optional&lt;List&lt;LibroResumenDTO&gt;&gt; obtenerLibrosPorAutor(Long autorId) {\n        Optional&lt;Autor&gt; opt = autorRepo.findById(autorId);\n        if (opt.isEmpty()) {\n            return Optional.empty();\n        }\n\n        Autor autor = opt.get();\n        List&lt;LibroResumenDTO&gt; resumenes = new ArrayList&lt;&gt;();\n        for (Libro l : autor.getLibros()) {\n            resumenes.add(new LibroResumenDTO(l.getId(), l.getTitulo()));\n        }\n\n        return Optional.of(resumenes);\n    }\n}<\/pre><\/li>\n<li>Devuelven <code>Optional<\/code>, <code>int<\/code> o <code>boolean<\/code>, y el Controller lo traduce a c\u00f3digo HTTP.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s23\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-26\">\n  <span class=\"num\" aria-hidden=\"true\">26<\/span>\n  <h3>Los controladores y los c\u00f3digos de estado<\/h3>\n  <ol>\n<li>Cada Controller inyecta solo su <code>IService<\/code> y responde con <code>ResponseEntity<\/code>. C\u00f3digos: <b>201<\/b> con <code>Location<\/code> al crear, <b>200<\/b> al leer o actualizar, <b>204<\/b> al borrar, <b>404<\/b> si no existe y <b>409<\/b> si choca con otros datos.<\/li>\n<li><code>LibroController<\/code>:\n<details class=\"cod\"><summary>Ver el c\u00f3digo completo (111 l\u00edneas)<\/summary><pre class=\"code\" data-f=\"controller/LibroController.java\">package edu.rico.biblioteca.controller;\n\nimport java.net.URI;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.PutMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RequestParam;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.servlet.support.ServletUriComponentsBuilder;\n\nimport edu.rico.biblioteca.dto.FichaLibroDTO;\nimport edu.rico.biblioteca.dto.LibroRequestDTO;\nimport edu.rico.biblioteca.dto.LibroResponseDTO;\nimport edu.rico.biblioteca.service.ILibroService;\nimport jakarta.validation.Valid;\n\n@RestController\n@RequestMapping(\"/api/libros\")\npublic class LibroController {\n\n    @Autowired\n    private ILibroService libroService;\n\n    // POST /api/libros \u2192 201 + Location | 400 | 404\n    @PostMapping\n    public ResponseEntity&lt;LibroResponseDTO&gt; crear(@Valid @RequestBody LibroRequestDTO dto) {\n        try {\n            LibroResponseDTO creado = libroService.crear(dto);\n            URI location = ServletUriComponentsBuilder\n                    .fromCurrentRequest()\n                    .path(\"/{id}\")\n                    .buildAndExpand(creado.id())\n                    .toUri();\n            return ResponseEntity.created(location).body(creado);\n        } catch (IllegalArgumentException ex) {\n            // Si la causa es un recurso relacionado inexistente\n            if (ex.getMessage() != null &amp;&amp; ex.getMessage().contains(\"no existe\")) {\n                return ResponseEntity.notFound().build(); // 404\n            }\n            return ResponseEntity.badRequest().build(); // 400\n        }\n    }\n\n    // GET /api/libros/{id} \u2192 200 (LibroResponseDTO) | 404\n    @GetMapping(\"/{id}\")\n    public ResponseEntity&lt;LibroResponseDTO&gt; obtenerPorId(@PathVariable Long id) {\n        Optional&lt;LibroResponseDTO&gt; opt = libroService.obtenerPorId(id);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // GET /api/libros?editorialId= \u2192 200 | 404 si la editorial no existe\n    @GetMapping\n    public ResponseEntity&lt;List&lt;LibroResponseDTO&gt;&gt; listarPorEditorial(@RequestParam Long editorialId) {\n        Optional&lt;List&lt;LibroResponseDTO&gt;&gt; opt = libroService.listarPorEditorial(editorialId);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // PUT /api/libros/{id}/ficha \u2192 200 | 404\n    @PutMapping(\"/{id}/ficha\")\n    public ResponseEntity&lt;LibroResponseDTO&gt; actualizarFicha(\n            @PathVariable Long id,\n            @Valid @RequestBody FichaLibroDTO fichaDTO) {\n\n        Optional&lt;LibroResponseDTO&gt; opt = libroService.actualizarFicha(id, fichaDTO);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // POST /api/libros/{id}/autores/{autorId} \u2192 200 | 404\n    @PostMapping(\"/{id}/autores/{autorId}\")\n    public ResponseEntity&lt;LibroResponseDTO&gt; asociarAutor(\n            @PathVariable Long id,\n            @PathVariable Long autorId) {\n\n        Optional&lt;LibroResponseDTO&gt; opt = libroService.asociarAutor(id, autorId);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // DELETE /api/libros/{id}/autores/{autorId} \u2192 204 | 404\n    @DeleteMapping(\"/{id}/autores/{autorId}\")\n    public ResponseEntity&lt;Void&gt; desasociarAutor(\n            @PathVariable Long id,\n            @PathVariable Long autorId) {\n\n        boolean desasociado = libroService.desasociarAutor(id, autorId);\n        if (desasociado) {\n            return ResponseEntity.noContent().build();\n        }\n        return ResponseEntity.notFound().build();\n    }\n}<\/pre><\/details><\/li>\n<li><code>EditorialController<\/code>:\n<details class=\"cod\"><summary>Ver el c\u00f3digo completo (63 l\u00edneas)<\/summary><pre class=\"code\" data-f=\"controller/EditorialController.java\">package edu.rico.biblioteca.controller;\n\nimport java.net.URI;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.servlet.support.ServletUriComponentsBuilder;\n\nimport edu.rico.biblioteca.dto.EditorialRequestDTO;\nimport edu.rico.biblioteca.dto.EditorialResponseDTO;\nimport edu.rico.biblioteca.service.IEditorialService;\nimport jakarta.validation.Valid;\n\n@RestController\n@RequestMapping(\"/api/editoriales\")\npublic class EditorialController {\n\n    @Autowired\n    private IEditorialService editorialService;\n\n    // POST /api/editoriales \u2192 201 + Location | 400\n    @PostMapping\n    public ResponseEntity&lt;EditorialResponseDTO&gt; crear(@Valid @RequestBody EditorialRequestDTO dto) {\n        EditorialResponseDTO creada = editorialService.crear(dto);\n        URI location = ServletUriComponentsBuilder\n                .fromCurrentRequest()\n                .path(\"/{id}\")\n                .buildAndExpand(creada.id())\n                .toUri();\n        return ResponseEntity.created(location).body(creada);\n    }\n\n    // GET /api/editoriales/{id} \u2192 200 | 404\n    @GetMapping(\"/{id}\")\n    public ResponseEntity&lt;EditorialResponseDTO&gt; obtenerPorId(@PathVariable Long id) {\n        Optional&lt;EditorialResponseDTO&gt; opt = editorialService.obtenerPorId(id);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // DELETE /api/editoriales/{id} \u2192 204 | 404 | 409\n    @DeleteMapping(\"/{id}\")\n    public ResponseEntity&lt;Void&gt; eliminar(@PathVariable Long id) {\n        int resultado = editorialService.eliminar(id);\n        if (resultado == 1) {\n            return ResponseEntity.noContent().build(); // 204\n        } else if (resultado == -1) {\n            return ResponseEntity.status(HttpStatus.CONFLICT).build(); // 409\n        }\n        return ResponseEntity.notFound().build(); // 404\n    }\n}<\/pre><\/details><\/li>\n<li><code>AutorController<\/code>:\n<pre class=\"code\" data-f=\"controller/AutorController.java\">package edu.rico.biblioteca.controller;\n\nimport java.net.URI;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.servlet.support.ServletUriComponentsBuilder;\n\nimport edu.rico.biblioteca.dto.AutorRequestDTO;\nimport edu.rico.biblioteca.dto.AutorResponseDTO;\nimport edu.rico.biblioteca.dto.LibroResumenDTO;\nimport edu.rico.biblioteca.service.IAutorService;\nimport jakarta.validation.Valid;\n\n@RestController\n@RequestMapping(\"/api/autores\")\npublic class AutorController {\n\n    @Autowired\n    private IAutorService autorService;\n\n    // POST /api/autores \u2192 201 + Location | 400\n    @PostMapping\n    public ResponseEntity&lt;AutorResponseDTO&gt; crear(@Valid @RequestBody AutorRequestDTO dto) {\n        AutorResponseDTO creado = autorService.crear(dto);\n        URI location = ServletUriComponentsBuilder\n                .fromCurrentRequest()\n                .path(\"/{id}\")\n                .buildAndExpand(creado.id())\n                .toUri();\n        return ResponseEntity.created(location).body(creado);\n    }\n\n    // GET /api/autores/{id}/libros \u2192 200 (LibroResumenDTO) | 404\n    @GetMapping(\"/{id}/libros\")\n    public ResponseEntity&lt;List&lt;LibroResumenDTO&gt;&gt; obtenerLibrosPorAutor(@PathVariable Long id) {\n        Optional&lt;List&lt;LibroResumenDTO&gt;&gt; opt = autorService.obtenerLibrosPorAutor(id);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n}<\/pre><\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s24\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-27\">\n  <span class=\"num\" aria-hidden=\"true\">27<\/span>\n  <h3>Misi\u00f3n 5: las trampas de comprensi\u00f3n<\/h3>\n  <ol>\n<li>Se trata de <b>provocar<\/b> cada trampa a prop\u00f3sito, entender por qu\u00e9 ocurre y arreglarla.<\/li>\n<li><b>Devolver una Entity<\/b> \u2192 recursi\u00f3n infinita en el JSON \u2192 usa DTO con <code>*ResumenDTO<\/code>.<\/li>\n<li><b>LAZY fuera de la transacci\u00f3n<\/b> \u2192 <code>LazyInitializationException<\/code> \u2192 <code>@Transactional<\/code> en el Service.<\/li>\n<li><b>N+1<\/b> \u2192 muchas consultas en el log \u2192 <code>JOIN FETCH<\/code> o <code>@EntityGraph<\/code>.<\/li>\n<li><b>Borrar una editorial con libros<\/b> \u2192 500 \u2192 cuenta antes los libros y devuelve 409.<\/li>\n<li><b>Autor repetido<\/b>: un <code>List<\/code> lo duplica y un <code>Set<\/code> no.<\/li>\n<li>Despu\u00e9s de cada experimento, devuelve el c\u00f3digo a su versi\u00f3n correcta.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s25\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-28\">\n  <span class=\"num\" aria-hidden=\"true\">28<\/span>\n  <h3>Ampliaci\u00f3n: validaci\u00f3n declarativa con @Valid<\/h3>\n  <ol>\n<li>Con <code>@Valid<\/code> el 400 sale solo, antes de llegar al servicio. Comprueba que est\u00e1 la dependencia <code>spring-boot-starter-validation<\/code>.\n<pre class=\"code\" data-f=\"pom.xml\">&lt;dependency&gt;\n    &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;\n    &lt;artifactId&gt;spring-boot-starter-validation&lt;/artifactId&gt;\n&lt;/dependency&gt;<\/pre><\/li>\n<li><b>DTO de entrada con validaciones<\/b> (son los finales; sustituyen a los del paso 24). <code>@NotBlank<\/code>, <code>@NotNull<\/code>, <code>@NotEmpty<\/code>, <code>@Size<\/code>, <code>@Pattern<\/code> (el ISBN), <code>@Min<\/code> y <code>@Max<\/code>.\n<pre class=\"code\" data-f=\"dto/EditorialRequestDTO.java\">package edu.rico.biblioteca.dto;\n\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.Size;\n\npublic record EditorialRequestDTO(\n    @NotBlank(message = \"El nombre de la editorial es obligatorio\")\n    @Size(min = 2, max = 100, message = \"El nombre debe tener entre 2 y 100 caracteres\")\n    String nombre,\n\n    @NotBlank(message = \"El pa\u00eds de origen es obligatorio\")\n    String pais\n) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/FichaLibroDTO.java\">package edu.rico.biblioteca.dto;\n\nimport jakarta.validation.constraints.Max;\nimport jakarta.validation.constraints.Min;\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.Pattern;\n\npublic record FichaLibroDTO(\n    @NotBlank(message = \"El ISBN es obligatorio\")\n    @Pattern(regexp = \"^(97(8|9))?\\\\d{9}(\\\\d|X)$\", message = \"Formato de ISBN inv\u00e1lido\")\n    String isbn,\n\n    @Min(value = 1, message = \"El libro debe tener al menos una p\u00e1gina\")\n    int paginas,\n\n    @Min(value = 1450, message = \"El a\u00f1o no puede ser anterior a la invenci\u00f3n de la imprenta\")\n    @Max(value = 2026, message = \"El a\u00f1o no puede ser superior al a\u00f1o actual\")\n    int anio\n) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/LibroRequestDTO.java\">package edu.rico.biblioteca.dto;\n\nimport java.util.Set;\n\nimport jakarta.validation.Valid;\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotEmpty;\nimport jakarta.validation.constraints.NotNull;\n\npublic record LibroRequestDTO(\n    @NotBlank(message = \"El t\u00edtulo es obligatorio\")\n    String titulo,\n\n    @NotNull(message = \"Debe indicarse la editorial\")\n    Long editorialId,\n\n    @NotEmpty(message = \"El libro debe tener al menos un autor asignado\")\n    Set&lt;Long&gt; autoresIds,\n\n    @Valid // Valida recursivamente las restricciones internas de FichaLibroDTO\n    @NotNull(message = \"La ficha t\u00e9cnica es obligatoria\")\n    FichaLibroDTO ficha\n) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/AutorRequestDTO.java\">package edu.rico.biblioteca.dto;\n\nimport jakarta.validation.constraints.NotBlank;\n\npublic record AutorRequestDTO(\n    @NotBlank(message = \"El nombre del autor es obligatorio\")\n    String nombre,\n\n    @NotBlank(message = \"La nacionalidad es obligatoria\")\n    String nacionalidad\n) {}<\/pre><\/li>\n<li><b>DTO de salida<\/b>, con su <code>package<\/code> e imports:\n<pre class=\"code\" data-f=\"dto/AutorResponseDTO.java\">package edu.rico.biblioteca.dto;\n\nimport java.util.List;\n\npublic record AutorResponseDTO(\n    Long id,\n    String nombre,\n    String nacionalidad,\n    List&lt;LibroResumenDTO&gt; libros\n) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/EditorialResponseDTO.java\">package edu.rico.biblioteca.dto;\n\npublic record EditorialResponseDTO(\n    Long id,\n    String nombre,\n    String pais\n) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/EditorialResumenDTO.java\">package edu.rico.biblioteca.dto;\n\npublic record EditorialResumenDTO(Long id, String nombre) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/AutorResumenDTO.java\">package edu.rico.biblioteca.dto;\n\npublic record AutorResumenDTO(Long id, String nombre) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/LibroResumenDTO.java\">package edu.rico.biblioteca.dto;\n\npublic record LibroResumenDTO(Long id, String titulo) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/LibroResponseDTO.java\">package edu.rico.biblioteca.dto;\n\nimport java.util.List;\n\npublic record LibroResponseDTO(\n    Long id,\n    String titulo,\n    EditorialResumenDTO editorial,\n    List&lt;AutorResumenDTO&gt; autores,\n    FichaLibroDTO ficha\n) {}<\/pre><\/li>\n<li>En cada m\u00e9todo del Controller que recibe un DTO va <code>@Valid<\/code> delante de <code>@RequestBody<\/code>, como en los controladores del paso 26.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s26\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-29\">\n  <span class=\"num\" aria-hidden=\"true\">29<\/span>\n  <h3>Probar con Postman o curl<\/h3>\n  <ol>\n<li>Arranca la aplicaci\u00f3n y haz la secuencia <b>en orden<\/b>. En Postman, los POST y el PUT llevan <b>Body &gt; raw &gt; JSON<\/b>; los GET y los DELETE no llevan cuerpo.<\/li>\n<li>Crear editorial (<code>POST /api/editoriales<\/code>):\n<pre class=\"code\" data-f=\"Body de POST /api/editoriales  \u2190  EditorialRequestDTO(nombre, pais)\">{\n    \"nombre\": \"Planeta\",\n    \"pais\": \"Espa\u00f1a\"\n}<\/pre><\/li>\n<li>Crear autor (<code>POST /api/autores<\/code>):\n<pre class=\"code\" data-f=\"Body de POST /api/autores  \u2190  AutorRequestDTO(nombre, nacionalidad)\">{\n    \"nombre\": \"Cervantes\",\n    \"nacionalidad\": \"Espa\u00f1ola\"\n}<\/pre><\/li>\n<li>Crear libro (<code>POST /api/libros<\/code>). Necesita la editorial 1 y el autor 1. <code>autoresIds<\/code> es una lista y <code>ficha<\/code> es un objeto.\n<pre class=\"code\" data-f=\"Body de POST /api/libros  \u2190  LibroRequestDTO(titulo, editorialId, autoresIds, ficha)\">{\n    \"titulo\": \"Don Quijote\",\n    \"editorialId\": 1,\n    \"autoresIds\": [1],\n    \"ficha\": {\n        \"isbn\": \"9788420412146\",\n        \"paginas\": 900,\n        \"anio\": 1605\n    }\n}<\/pre><\/li>\n<li>El resto: <code>GET /api/libros/1<\/code>, <code>GET /api/libros?editorialId=1<\/code>, <code>PUT /api/libros/1/ficha<\/code> (cuerpo: <code>{\"isbn\": \"842041214X\", \"paginas\": 1000, \"anio\": 1615}<\/code>), <code>POST /api/libros/1/autores/1<\/code> (sin cuerpo), <code>GET /api/autores/1/libros<\/code>, <code>DELETE /api/libros/1/autores/1<\/code> y <code>DELETE /api/editoriales/1<\/code>.<\/li>\n<li>Esperado: <b>201<\/b> al crear, <b>200<\/b> al leer, <b>204<\/b> al quitar un autor, <b>409<\/b> al borrar una editorial con libros, y <b>404<\/b> o <b>400<\/b> en los errores.<\/li>\n<li>La misma secuencia, con <code>curl<\/code>:\n<pre class=\"code\" data-f=\"secuencia de pruebas (CMD o Git Bash)\">curl -i -X POST http://localhost:8080/api/editoriales -H \"Content-Type: application/json\" -d \"{\\\"nombre\\\":\\\"Planeta\\\",\\\"pais\\\":\\\"Espa\u00f1a\\\"}\"\ncurl -i -X POST http://localhost:8080/api/autores -H \"Content-Type: application/json\" -d \"{\\\"nombre\\\":\\\"Cervantes\\\",\\\"nacionalidad\\\":\\\"Espa\u00f1ola\\\"}\"\ncurl -i -X POST http://localhost:8080/api/libros -H \"Content-Type: application/json\" -d \"{\\\"titulo\\\":\\\"Don Quijote\\\",\\\"editorialId\\\":1,\\\"autoresIds\\\":[1],\\\"ficha\\\":{\\\"isbn\\\":\\\"9788420412146\\\",\\\"paginas\\\":900,\\\"anio\\\":1605}}\"\ncurl -i http://localhost:8080/api/libros/1\ncurl -i \"http://localhost:8080/api/libros?editorialId=1\"\ncurl -i -X PUT http://localhost:8080/api/libros/1/ficha -H \"Content-Type: application/json\" -d \"{\\\"isbn\\\":\\\"842041214X\\\",\\\"paginas\\\":1000,\\\"anio\\\":1615}\"\ncurl -i -X POST http://localhost:8080/api/libros/1/autores/1\ncurl -i http://localhost:8080/api/autores/1/libros\ncurl -i -X DELETE http://localhost:8080/api/libros/1/autores/1\ncurl -i -X DELETE http://localhost:8080/api/editoriales/1<\/pre><\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s27\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-30\">\n  <span class=\"num\" aria-hidden=\"true\">30<\/span>\n  <h3>C\u00f3mo explicar el ejercicio<\/h3>\n  <ol>\n<li>Cu\u00e9ntalo en unos diez minutos y de lo general a lo concreto: el problema, el modelo, los due\u00f1os de cada relaci\u00f3n, las capas, los DTO, una petici\u00f3n completa, los c\u00f3digos HTTP, las trampas, la validaci\u00f3n y la demostraci\u00f3n.<\/li>\n<li>Prepara una respuesta corta para las preguntas t\u00edpicas (por qu\u00e9 DTO, por qu\u00e9 <code>Set<\/code>, por qu\u00e9 LAZY, para qu\u00e9 <code>@Transactional<\/code>\u2026).<\/li>\n<li>Conoce los l\u00edmites de la soluci\u00f3n: un ISBN duplicado da 500, el 404 depende de un texto y listar libros por editorial no usa fetch.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s28\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-31\">\n  <span class=\"num\" aria-hidden=\"true\">31<\/span>\n  <h3>Entregables y r\u00fabrica<\/h3>\n  <ol>\n<li><b>Entrega:<\/b> diagrama de clases, diagrama de capas con los <code>@Autowired<\/code> reales, dos diagramas de recorrido, el proyecto funcionando y un documento con las respuestas de las misiones 1, 4 y 5.<\/li>\n<li><b>R\u00fabrica:<\/b> relaciones JPA 30 %, separaci\u00f3n Entity y DTO 25 %, <code>ResponseEntity<\/code> y c\u00f3digos 20 %, inyecci\u00f3n coherente 10 % y diagramas y respuestas 15 %.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s29\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<article class=\"paso\" id=\"r-32\">\n  <span class=\"num\" aria-hidden=\"true\">32<\/span>\n  <h3>Chuleta final<\/h3>\n  <ol>\n<li>Una tabla con todas las anotaciones, agrupadas por d\u00f3nde se usan: Controller, par\u00e1metros, validaci\u00f3n, Service, entidades, relaciones y consultas.<\/li>\n<li>Las ideas clave en una l\u00ednea: capas, DTO, LAZY, <code>mappedBy<\/code>, <code>Set<\/code>, <code>orphanRemoval<\/code>, sin <code>REMOVE<\/code> de Editorial a Libro, <code>@Transactional<\/code>, <code>JOIN FETCH<\/code> y <code>@Valid<\/code>.<\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/s30\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<\/section>\n\n<section class=\"parte p4\" id=\"parte4\">\n  <header><p class=\"n\">PARTE 4<\/p><h2>Ejercicios de pr\u00e1ctica<\/h2><p>Enunciados tipo examen para hacerlos t\u00fa; cada uno ir\u00e1 seguido de su soluci\u00f3n<\/p><\/header>\n<article class=\"paso\" id=\"r-33\">\n  <span class=\"num\" aria-hidden=\"true\">33<\/span>\n  <h3>Ejercicios de pr\u00e1ctica<\/h3>\n  <ol>\n<li>Los ejercicios tipo examen est\u00e1n en su propia secci\u00f3n, con el enunciado de cada ejercicio y, aparte, su solucionario.<\/li>\n<li><a href=\"#/ejercicios\">Ir a los ejercicios \u2192<\/a><\/li>\n<\/ol>\n  <a class=\"mas\" href=\"#/completa/ejercicios\">Ver explicaci\u00f3n completa \u2192<\/a>\n<\/article>\n<\/section>\n\n  <footer class=\"end\">\n    <a href=\"#inicio\">\u2191 Volver arriba<\/a>\n    <a href=\"#/\">\u2190 Elegir otra gu\u00eda<\/a>\n  <\/footer>\n<\/main>\n<script>\n/* Bloques de c\u00f3digo: resaltado de Java y bot\u00f3n \"Copiar\". Tablas con scroll en m\u00f3vil. */\n(function () {\n  // Tablas: se envuelven en .tw para que hagan scroll horizontal en pantallas estrechas\n  document.querySelectorAll('main table').forEach(function (t) {\n    var w = document.createElement('div'); w.className = 'tw';\n    t.parentNode.insertBefore(w, t); w.appendChild(t);\n  });\n\n  // Resaltado sencillo para Java (comentarios, textos, anotaciones, palabras clave, n\u00fameros)\n  var RX = /(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)|(\"(?:[^\"\\\\\\n]|\\\\.)*\")|(@\\w+)|\\b(public|private|protected|class|interface|record|enum|extends|implements|return|new|if|else|for|try|catch|throw|import|package|static|final|void|int|long|boolean|double|null|true|false|this|instanceof)\\b|\\b(\\d+L?)\\b/g;\n  function esc(s) { return s.replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;'); }\n\n  document.querySelectorAll('pre').forEach(function (pre) {\n    var text = pre.textContent;\n    var esJava = /\\b(public|private)\\b[\\s\\S]*[{;]|^@\\w+/m.test(text) && /\\b(class|interface|record|enum|import)\\b/.test(text);\n    if (esJava) {\n      var out = '', last = 0, m;\n      RX.lastIndex = 0;\n      while ((m = RX.exec(text))) {\n        out += esc(text.slice(last, m.index));\n        var cls = m[1] ? 't-c' : m[2] ? 't-s' : m[3] ? 't-a' : m[4] ? 't-k' : 't-n';\n        out += '<span class=\"' + cls + '\">' + esc(m[0]) + '<\/span>';\n        last = RX.lastIndex;\n      }\n      out += esc(text.slice(last));\n      pre.setAttribute('data-raw', text);\n      pre.innerHTML = out;\n    }\n\n    // Bot\u00f3n Copiar\n    var b = document.createElement('button');\n    b.type = 'button'; b.className = 'copy'; b.textContent = 'Copiar';\n    b.addEventListener('click', function () {\n      var raw = pre.getAttribute('data-raw') || text;\n      function hecho() { b.textContent = 'Copiado'; setTimeout(function () { b.textContent = 'Copiar'; }, 1400); }\n      if (navigator.clipboard && navigator.clipboard.writeText) {\n        navigator.clipboard.writeText(raw).then(hecho, function () { copiaAntigua(raw); hecho(); });\n      } else { copiaAntigua(raw); hecho(); }\n    });\n    pre.appendChild(b);\n  });\n\n  // Copia para navegadores sin portapapeles moderno (o abriendo el archivo sin servidor)\n  function copiaAntigua(t) {\n    var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';\n    document.body.appendChild(a); a.select();\n    try { document.execCommand('copy'); } catch (e) {}\n    document.body.removeChild(a);\n  }\n\n  // Al imprimir, abrir todos los desplegables\n  window.addEventListener('beforeprint', function () {\n    document.querySelectorAll('details').forEach(function (d) { d.setAttribute('open', ''); });\n  });\n})();\n\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#\"]');\n  if (!a) return;\n  e.preventDefault();\n  var destino = a.getAttribute('href');\n  // \"#/...\" es un enlace a otra p\u00e1gina; el resto, un enlace dentro de esta (en un marco, un \"#x\" normal se\n  // resolver\u00eda contra la p\u00e1gina contenedora y recargar\u00eda todo el archivo dentro del marco)\n  if (destino.indexOf('#/') === 0) parent.postMessage({ ruta: destino }, '*');\n  else location.hash = destino;\n});\naddEventListener('message', function (e) {\n  if (e.source !== parent || !e.data || typeof e.data.ancla !== 'string') return;\n  var ancla = e.data.ancla, destino = ancla && document.getElementById(ancla);\n  location.hash = ancla;                    // necesario para que funcione :target (ejercicios)\n  // salto directo, sin deslizarse desde donde estaba (la gu\u00eda tiene scroll-behavior: smooth)\n  if (destino) destino.scrollIntoView({ behavior: 'instant' });\n  else scrollTo({ top: 0, behavior: 'instant' });\n});\nif (window.ANCLA_INICIAL) location.hash = window.ANCLA_INICIAL;\n<\/script>\n<\/body>\n<\/html>\n", "ejercicios": "<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"color-scheme\" content=\"dark\">\n<script>\n/* Entrada con cortina: si se llega desde el selector, la cortina del color de la opci\u00f3n elegida sigue tapando\n   la p\u00e1gina mientras carga y luego se recoge hacia el punto donde se puls\u00f3. Va en el <head> para que ni un\n   instante se vea la p\u00e1gina sin cortina. En la carpeta, los datos llegan por sessionStorage; en el archivo\n   \u00fanico, por window.REVELA (p\u00e1gina nueva) o por un mensaje (p\u00e1gina que ya estaba abierta). */\n(function () {\n  var d, quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  try {\n    d = window.REVELA;\n    if (!d) d = JSON.parse(sessionStorage.getItem('cortina') || 'null');\n    sessionStorage.removeItem('cortina');\n  } catch (e) {}\n\n  function abrir(d) {\n    if (!d || Date.now() - d.t > 8000) return;\n    var raiz = document.documentElement, punto = d.x + 'px ' + d.y + 'px';\n    var cortina = document.createElement('div'), texto = document.createElement('span');\n    cortina.setAttribute('aria-hidden', 'true');\n    cortina.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;pointer-events:none;background:' +\n      d.color + ';clip-path:circle(150vmax at ' + punto + ')';\n    texto.style.cssText = 'color:#0d0a1f;font:700 14px Silkscreen,monospace;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:0 1rem';\n    texto.textContent = d.texto || '';\n    cortina.appendChild(texto);\n    raiz.classList.add('entra');          // la gu\u00eda completa se salta su cargador: la cortina ya hace de cargador\n    raiz.appendChild(cortina);\n\n    var hecho = false;\n    function recoger() {\n      if (hecho) return;\n      hecho = true;\n      cortina.getBoundingClientRect();    // fija el estado inicial para que la transici\u00f3n arranque\n      texto.style.transition = 'opacity .25s';\n      texto.style.opacity = '0';\n      cortina.style.transition = quieto ? 'opacity .3s' : 'clip-path .95s cubic-bezier(.16,1,.3,1)';\n      if (quieto) cortina.style.opacity = '0'; else cortina.style.clipPath = 'circle(0 at ' + punto + ')';\n      setTimeout(function () { cortina.remove(); raiz.classList.remove('entra'); }, 1100);\n    }\n    // Se espera a la p\u00e1gina Y a las tipograf\u00edas: si se recogiera antes, se ver\u00eda el texto saltar al cambiar de letra\n    var lista = new Promise(function (ok) {\n      if (document.readyState === 'complete') ok(); else addEventListener('load', ok);\n    }).then(function () { return document.fonts ? document.fonts.ready : 0; });\n    lista.then(function () { setTimeout(recoger, 250); });\n    setTimeout(recoger, 3500);            // por si la carga se alarga (sin conexi\u00f3n, por ejemplo)\n  }\n\n  addEventListener('message', function (e) { if (e.source === parent && e.data && e.data.revela) abrir(e.data.revela); });\n  abrir(d);\n})();\n\n<\/script>\n<title>Spring Boot de cero a REST \u00b7 ejercicios<\/title>\n<style>\n/* =========================================================\n   TIPOGRAF\u00cdAS (guardadas en fuentes/, solo el juego \u00ablatin\u00bb, que cubre el espa\u00f1ol).\n   As\u00ed la gu\u00eda no depende de internet ni de Google Fonts.\n   ========================================================= */\n@font-face { font-family: 'Atkinson Hyperlegible'; font-style: italic; font-weight: 400; font-display: swap;\n  src: url(../fuentes/AtkinsonHyperlegible-400-italic.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Atkinson Hyperlegible'; font-style: normal; font-weight: 400; font-display: swap;\n  src: url(../fuentes/AtkinsonHyperlegible-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Atkinson Hyperlegible'; font-style: normal; font-weight: 700; font-display: swap;\n  src: url(../fuentes/AtkinsonHyperlegible-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Silkscreen'; font-style: normal; font-weight: 400; font-display: swap;\n  src: url(../fuentes/Silkscreen-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Silkscreen'; font-style: normal; font-weight: 700; font-display: swap;\n  src: url(../fuentes/Silkscreen-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Unbounded'; font-style: normal; font-weight: 200 900; font-display: swap;\n  src: url(../fuentes/Unbounded-variable.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n\n/* =========================================================\n   VARIABLES: colores, tipograf\u00edas y curva de animaci\u00f3n.\n   Cambia aqu\u00ed un color y se cambia en toda la gu\u00eda.\n   ========================================================= */\n:root {\n  /* Fondos (de m\u00e1s oscuro a m\u00e1s claro) */\n  --void:   #0d0a1f;   /* fondo de la p\u00e1gina */\n  --void-2: #151030;   /* tarjetas, \u00edndice, tablas */\n  --void-3: #211a47;   /* cabeceras de tabla, c\u00f3digo en l\u00ednea */\n  --void-4: #2c2360;   /* barra de scroll */\n  --line:   #3a2f6b;   /* bordes y separadores */\n\n  /* Texto */\n  --ink:   #ece8ff;    /* texto principal */\n  --ink-2: #bdb4ea;    /* texto secundario */\n  --ink-3: #958bc9;    /* notas al pie, leyendas */\n\n  /* Acentos */\n  --lime:   #c6ff3d;   /* acci\u00f3n principal y \"est\u00e1s aqu\u00ed\" */\n  --pink:   #ff4fa3;   /* Parte 2 (rara) y avisos \"Ojo\" */\n  --cyan:   #3de0ff;   /* Parte 1 (com\u00fan) y \"Por qu\u00e9\" */\n  --violet: #8b5bff;\n  --gold:   #ffd23d;   /* Parte 3 (holo) y \"Para un ni\u00f1o de 5 a\u00f1os\" */\n  --green:  #5ef0a0;   /* \"Comprobaci\u00f3n\" */\n  --red:    #ff6b6b;\n  --plum:   #2a1450;   /* fondo del sobre de la Parte 2 */\n  --plum-2: #1c1440;   /* fondo del sobre de la Parte 3 */\n  --code-bg:#07051a;   /* fondo de los bloques de c\u00f3digo */\n\n  /* Foil hologr\u00e1fico (gira con la variable --ang) */\n  --holo: conic-gradient(from var(--ang, 200deg) at var(--mx, 50%) var(--my, 50%),\n          #c6ff3d, #3de0ff, #8b5bff, #ff4fa3, #ffd23d, #c6ff3d);\n  --rar: var(--cyan);  /* color de rareza de la carta actual */\n\n  /* Tipograf\u00edas */\n  --pix:  \"Silkscreen\", ui-monospace, monospace;                 /* etiquetas p\u00edxel */\n  --disp: \"Unbounded\", \"Segoe UI Black\", sans-serif;             /* t\u00edtulos */\n  --body: \"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif; /* lectura */\n  --mono: \"Cascadia Code\", \"Cascadia Mono\", Consolas, \"SFMono-Regular\", Menlo, monospace; /* c\u00f3digo */\n\n  /* Altura de la barra superior (la que lleva el enlace \u00abElegir otra gu\u00eda\u00bb) */\n  --bar: 3rem;\n\n  /* Curva de todas las animaciones */\n  --out: cubic-bezier(.16, 1, .3, 1);\n}\n\n@property --ang { syntax: \"<angle>\"; inherits: true; initial-value: 200deg; }\n@keyframes spin { to { --ang: 560deg; } }\n\n/* =========================================================\n   BASE: reglas generales de la p\u00e1gina\n   ========================================================= */\n* { box-sizing: border-box; }\n\nhtml {\n  scroll-behavior: smooth;\n  scroll-padding-top: 5rem;\n  scrollbar-color: var(--violet) var(--void);\n}\n\nbody {\n  margin: 0;\n  background: var(--void);\n  color: var(--ink);\n  font: 1.0625rem/1.68 var(--body);\n  -webkit-text-size-adjust: 100%;\n  overflow-x: hidden;\n}\n\n::selection { background: var(--lime); color: var(--void); }\n\n::-webkit-scrollbar { width: 11px; height: 11px; }\n::-webkit-scrollbar-track { background: var(--void); }\n::-webkit-scrollbar-thumb { background: var(--void-4); border-radius: 10px; border: 2px solid var(--void); }\n::-webkit-scrollbar-thumb:hover
