{ background: var(--violet); }\n\n:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; border-radius: 6px; }\n\na { color: var(--lime); text-underline-offset: .2em; text-decoration-thickness: 1px; }\na:hover { color: #e2ff9a; }\nb, strong { color: #fff; }\n\n/* Palabras largas (nombres de clases, URLs) no rompen el ancho */\np, li, td, h2, h3 { overflow-wrap: anywhere; }\n\n/* Barra superior de todas las p\u00e1ginas de la gu\u00eda: para volver al selector de gu\u00edas.\n   (header.bar y no .bar, porque el cargador tambi\u00e9n tiene un .bar) */\n.tag { margin: 0; font: 700 .75rem var(--pix); letter-spacing: .08em; color: var(--ink-3); }\nheader.bar {\n  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 1rem;\n  height: var(--bar); padding: 0 max(1rem, calc((100vw - 56rem) / 2));\n  background: rgba(13, 10, 31, .88); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);\n}\nheader.bar .back { font: 700 .78rem var(--pix); text-decoration: none; }\nheader.bar .tag { color: var(--cyan); }\n@media (max-width: 40rem) { header.bar .back { font-size: .7rem; } }\n\n/* =========================================================\n   TEXTO, LISTAS, NOTAS Y DESPLEGABLES\n   ========================================================= */\nh3 {\n  margin: 2.8rem 0 .8rem; color: var(--pink); text-wrap: balance;\n  font: 600 1.22rem/1.3 var(--disp); letter-spacing: -.01em;\n}\nsection:has(.r1) h3 { color: var(--cyan); }\nsection:has(.r3) h3 { color: var(--gold); }\nsection:has(.r4) h3 { color: var(--green); }\nh4 { margin: 1.8rem 0 .5rem; color: var(--ink); font: 600 1rem/1.3 var(--disp); }\np { margin: 0 0 1rem; text-wrap: pretty; }\nul, ol { margin: 0 0 1rem; padding-left: 1.4rem; }\nli { margin: .3rem 0; }\nli::marker { color: var(--violet); }\np.paso { margin: .8rem 0; }\n\n/* C\u00f3digo dentro del texto */\ncode { font-family: var(--mono); font-size: .88em; }\np code, li code, td code, summary code, h3 code, h4 code,\n.kid code, .why code, .warn code, .ok code, blockquote code {\n  padding: .08em .4em; border-radius: 5px; background: var(--void-3); color: var(--cyan);\n}\np code, li code { overflow-wrap: anywhere; word-break: break-word; }\n\n/* N\u00famero de paso redondo */\n.step {\n  display: inline-grid; place-items: center; vertical-align: .1em;\n  min-width: 1.7rem; height: 1.7rem; margin-right: .5rem; padding: 0 .4rem; border-radius: 6px;\n  background: var(--lime); color: var(--void); font: 700 .78rem/1 var(--pix);\n}\n\n/* Notas: <div class=\"kid\">, \"why\", \"warn\", \"ok\" */\n.kid, .why, .warn, .ok, p.note { margin: 1.7rem 0; padding: 1rem 1.2rem 1.1rem; border: 1px solid; border-radius: 14px; }\n.kid::before, .why::before, .warn::before, .ok::before {\n  /* display: table = la etiqueta va en su propia l\u00ednea, separada del texto */\n  display: table; margin-bottom: .75rem; padding: .3rem .75rem; border-radius: 999px; line-height: 1.3;\n  font: 700 .75rem var(--pix); letter-spacing: .03em; color: var(--void);\n}\n.kid  { background: rgba(255, 210, 61, .07); border-color: rgba(255, 210, 61, .38); }\n.kid::before  { content: \"PARA UN NI\u00d1O DE 5 A\u00d1OS\"; background: var(--gold); }\n.why  { background: rgba(61, 224, 255, .06); border-color: rgba(61, 224, 255, .36); }\n.why::before  { content: \"POR QU\u00c9\"; background: var(--cyan); }\n.warn { background: rgba(255, 79, 163, .07); border-color: rgba(255, 79, 163, .42); }\n.warn::before { content: \"OJO\"; background: var(--pink); }\n.ok   { background: rgba(94, 240, 160, .06); border-color: rgba(94, 240, 160, .36); }\n.ok::before   { content: \"COMPROBACI\u00d3N\"; background: var(--green); }\np.note { background: rgba(94, 240, 160, .06); border-color: rgba(94, 240, 160, .3); }\n.kid p:last-child, .why p:last-child, .warn p:last-child, .ok p:last-child { margin-bottom: 0; }\n\nblockquote { margin: 1.4rem 0; padding: 1rem 1.2rem; background: var(--void-3); border: 1px solid var(--line); border-radius: 14px; }\nblockquote p { margin: 0; }\n\n/* Columnas sueltas */\n.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; margin: 1.6rem 0; }\n.box { padding: 1rem 1.1rem; background: var(--void-2); border: 1px solid var(--line); border-radius: 14px; }\n\n/* Desplegables */\ndetails { padding: .5rem 0; border-top: 1px solid var(--line); }\nmain details:last-of-type { border-bottom: 1px solid var(--line); }\nmain summary { cursor: pointer; padding: .45rem 0; color: var(--ink); font: 700 1rem var(--body); }\nmain summary::marker { color: var(--lime); }\ndetails[open] > summary { margin-bottom: .4rem; }\n\n.good { color: var(--green); font-weight: 700; }\n.bad  { color: var(--red);   font-weight: 700; }\n\n/* Lista de comprobaci\u00f3n con casillas */\nul.check { list-style: none; padding-left: 0; }\nul.check li { position: relative; padding-left: 2rem; }\nul.check li::before {\n  content: \"\"; position: absolute; left: 0; top: .3em;\n  width: 1.1rem; height: 1.1rem; border: 2px solid var(--lime); border-radius: 4px;\n}\n\n/* =========================================================\n   BLOQUES DE C\u00d3DIGO Y TABLAS\n   ========================================================= */\npre {\n  position: relative; overflow: auto; tab-size: 4;\n  margin: 1.6rem 0; padding: 1.1rem 1.3rem;\n  background: var(--code-bg); color: #e6e1ff; border: 1px solid var(--line); border-radius: 14px;\n  font: .86rem/1.65 var(--mono);\n}\n/* <pre data-f=\"nombre/del/Archivo.java\"> muestra el nombre arriba */\npre[data-f] { padding-top: 3.1rem; }\n/* Sin nombre de archivo, el bot\u00f3n Copiar tiene su propia fila arriba: as\u00ed no tapa el c\u00f3digo */\npre:not([data-f]) { padding-top: 2.9rem; }\npre[data-f]::before {\n  content: attr(data-f); position: absolute; top: 0; left: 0; right: 0; height: 2.3rem;\n  display: flex; align-items: center; padding: 0 6rem 0 1.3rem;\n  border-bottom: 1px solid var(--line); color: var(--ink-2);\n  font: 700 .75rem var(--pix); letter-spacing: .03em;\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.copy {\n  position: absolute; top: .35rem; right: .5rem; cursor: pointer;\n  padding: .35rem .85rem; border-radius: 999px;\n  background: var(--void-3); color: var(--ink); border: 1px solid var(--line);\n  font: 700 .75rem var(--pix); transition: background .3s, color .3s;\n}\n.copy:hover { background: var(--violet); color: var(--void); }\n\n/* M\u00f3vil: letra algo menor y scroll horizontal dentro del bloque (la usan la gu\u00eda completa y la resumida) */\n@media (max-width: 40rem) {\n  pre { margin: 1.2rem 0; padding: .9rem 1rem; font-size: .78rem; border-radius: 12px; }\n  pre[data-f], pre:not([data-f]) { padding-top: 2.9rem; }\n  pre[data-f]::before { height: 2.2rem; padding: 0 5.5rem 0 1rem; font-size: .7rem; }\n  .copy { padding: .3rem .7rem; font-size: .7rem; }\n}\n\n/* Colores del resaltado de Java (los pone recursos/js/2-codigo.js) */\n.t-c { color: #8e86b8; font-style: italic; } /* comentarios */\n.t-s { color: var(--gold); }                 /* textos \"entre comillas\" */\n.t-a { color: var(--lime); }                 /* @Anotaciones */\n.t-k { color: var(--pink); }                 /* palabras clave */\n.t-n { color: var(--cyan); }                 /* n\u00fameros */\n\n/* Tablas (recursos/js/2-codigo.js las envuelve en .tw para el scroll en m\u00f3vil) */\n.tw { overflow-x: auto; margin: 1.5rem 0; background: var(--void-2); border: 1px solid var(--line); border-radius: 14px; }\ntable { width: 100%; border-collapse: collapse; font-size: .95rem; font-variant-numeric: tabular-nums; }\nth {\n  padding: .8rem 1rem; text-align: left; background: var(--void-3); border-bottom: 1px solid var(--line);\n  color: var(--lime); font: 700 .75rem/1.3 var(--pix); letter-spacing: .03em;\n}\nth b { color: inherit; }\ntd { padding: .7rem 1rem; vertical-align: top; border-bottom: 1px solid rgba(58, 47, 107, .6); }\ntd code { white-space: normal; overflow-wrap: anywhere; }\ntd:first-child { width: 30%; max-width: 16rem; font-weight: 700; color: #fff; }\ntr:last-child td { border-bottom: 0; }\ntr:hover td { background: rgba(139, 91, 255, .06); }\n\n/* =========================================================\n   GU\u00cdA RESUMIDA y EJERCICIOS\n   Usa los colores y tipograf\u00edas de recursos/css/01-variables.css y las reglas\n   generales de recursos/css/02-base.css (construir.py las junta antes que este archivo).\n   ========================================================= */\nbody.resumida, body.ejercicios {\n  background:\n    radial-gradient(45% 40% at 85% 0%, rgba(139, 91, 255, .22), transparent 70%),\n    radial-gradient(35% 35% at 5% 100%, rgba(61, 224, 255, .10), transparent 70%),\n    var(--void);\n  background-attachment: fixed;\n  min-height: 100vh;\n}\ncode {\n  padding: .1em .38em; border-radius: 5px; background: var(--void-3); color: #e6e1ff;\n  font: .88em var(--mono); white-space: normal; overflow-wrap: anywhere;\n}\n\n/* ---------- GU\u00cdA RESUMIDA ---------- */\n/* (la barra superior, header.bar, es com\u00fan a todas las p\u00e1ginas y est\u00e1 en recursos/css/02-base.css) */\n.wrap { max-width: 56rem; margin: 0 auto; padding: 2.6rem 1.25rem 4rem; }\nhtml { scroll-padding-top: 4.5rem; }\n.intro h1 {\n  margin: 0 0 .8rem; color: var(--lime); text-wrap: balance;\n  font: 900 clamp(1.9rem, 6vw, 3rem)/1.04 var(--disp); letter-spacing: -.035em;\n}\n.intro .sub { max-width: 40rem; margin: 0 0 1.8rem; color: var(--ink-2); font-size: 1.1rem; text-wrap: pretty; }\n\n/* \u00cdndice de saltos: una fila de n\u00fameros por parte */\n.jump { display: grid; gap: .9rem; margin-bottom: 2.4rem; padding: 1.1rem 1.2rem; border-radius: 18px; background: var(--void-2); border: 1px solid var(--line); }\n.jump .row { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; }\n.jump .row b { flex: 0 0 100%; color: var(--acc); font: 700 .72rem var(--pix); letter-spacing: .05em; }\n.jump a {\n  display: inline-grid; place-items: center; min-width: 2.4rem; height: 2.4rem; padding: 0 .5rem; border-radius: 8px;\n  background: var(--void-3); border: 1px solid var(--line); color: var(--ink); text-decoration: none; font: 700 .8rem var(--pix);\n  transition: background .25s, color .25s, border-color .25s;\n}\n.jump a:hover { background: var(--acc); color: var(--void); border-color: var(--acc); }\n\n/* Partes y pasos */\n.p1 { --acc: var(--cyan); }\n.p2 { --acc: var(--pink); }\n.p3 { --acc: var(--gold); }\n.p4 { --acc: var(--green); }\n.parte { margin-top: 3.2rem; }\n.parte > header { margin-bottom: 1.2rem; padding-bottom: .9rem; border-bottom: 1px solid var(--line); }\n.parte > header .n { margin: 0 0 .15rem; color: var(--acc); font: 700 .75rem var(--pix); letter-spacing: .08em; }\n.parte > header h2 { margin: 0; font: 900 clamp(1.3rem, 4vw, 1.8rem)/1.1 var(--disp); letter-spacing: -.03em; color: #fff; text-wrap: balance; }\n.parte > header p { margin: .35rem 0 0; color: var(--ink-2); }\n\narticle.paso {\n  display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: 0 1.1rem;\n  margin: 0 0 1rem; padding: 1.2rem 1.3rem 1.2rem 1.1rem; border-radius: 18px;\n  background: var(--void-2); border: 1px solid var(--line);\n}\narticle.paso:target { border-color: var(--acc); outline: 2px solid var(--acc); outline-offset: 3px; }\narticle.paso .num { grid-row: 1 / span 3; color: var(--acc); font: 900 2rem/1 var(--disp); letter-spacing: -.04em; text-align: center; }\narticle.paso h3 { margin: .1rem 0 .6rem; color: #fff; font: 700 1.12rem/1.25 var(--body); }\n/* minmax(0, 1fr) y min-width: 0: sin esto, una l\u00ednea larga de c\u00f3digo ensancha toda la columna y la p\u00e1gina */\narticle.paso ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; grid-template-columns: minmax(0, 1fr); gap: .5rem; }\narticle.paso li { position: relative; counter-increment: s; padding-left: 1.9rem; line-height: 1.5; min-width: 0; }\narticle.paso > * { min-width: 0; }\narticle.paso li::before {\n  content: counter(s); position: absolute; left: 0; top: .12em; display: grid; place-items: center;\n  width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--void-3); color: var(--acc);\n  font: 700 .66rem var(--pix);\n}\n/* C\u00f3digo dentro de un paso: ocupa todo el ancho de la tarjeta (sale del hueco de la numeraci\u00f3n) */\narticle.paso pre { max-width: 100%; font-size: .8rem; }\narticle.paso details { max-width: 100%; }\narticle.paso li > pre, article.paso li > details { margin: .7rem 0 .3rem -1.9rem; }\narticle.paso li > details.cod > pre { margin: 0; border-radius: 0 0 14px 14px; border-top: 0; }\narticle.paso details.cod { border: 1px solid var(--line); border-radius: 14px; background: var(--code-bg); }\narticle.paso details.cod[open] { border-color: var(--violet); }\narticle.paso details.cod > summary {\n  cursor: pointer; list-style: none; padding: .7rem 1rem; border-radius: 14px;\n  color: var(--cyan); font: 700 .72rem var(--pix); letter-spacing: .03em;\n}\narticle.paso details.cod > summary::-webkit-details-marker { display: none; }\narticle.paso details.cod > summary::before { content: \"\u25b8 \"; }\narticle.paso details.cod[open] > summary { border-radius: 14px 14px 0 0; border-bottom: 1px solid var(--line); }\narticle.paso details.cod[open] > summary::before { content: \"\u25be \"; }\n\narticle.paso .mas {\n  justify-self: start; margin-top: 1rem; display: inline-flex; align-items: center; gap: .5rem;\n  padding: .55rem 1rem; border-radius: 999px; border: 1.5px solid var(--lime);\n  color: var(--lime); text-decoration: none; font: 700 .74rem var(--pix);\n  transition: background .25s, color .25s;\n}\narticle.paso .mas:hover { background: var(--lime); color: var(--void); }\n\n.end { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; margin-top: 3rem; padding-top: 1.4rem; border-top: 1px solid var(--line); font: 700 .78rem var(--pix); }\n.end a { text-decoration: none; }\n\n/* ---------- EJERCICIOS ---------- */\n/* La lista y los paneles viven en la misma p\u00e1gina: un panel solo se ve cuando la direcci\u00f3n apunta a \u00e9l (#ejercicio-1) */\n.panel { display: none; --acc: var(--green); }\n.panel:target { display: block; }\nbody:has(.panel:target) .hub { display: none; }\n\n.ej-list { display: grid; gap: 1rem; }\n.ej {\n  --acc: var(--green);\n  display: grid; gap: .55rem; padding: 1.3rem 1.4rem; border-radius: 18px;\n  background: var(--void-2); border: 1px solid var(--line);\n}\n.ej .n, .panel .n { margin: 0; color: var(--acc); font: 700 .75rem var(--pix); letter-spacing: .08em; }\n.ej h2, .panel h2 { margin: 0; color: #fff; text-wrap: balance; font: 900 clamp(1.25rem, 3.6vw, 1.7rem)/1.1 var(--disp); letter-spacing: -.03em; }\n.ej p { margin: 0; color: var(--ink-2); }\n.ej .meta { display: flex; flex-wrap: wrap; gap: .5rem; }\n.ej .meta span { padding: .2rem .65rem; border-radius: 999px; background: var(--void-3); color: var(--ink-2); font: 700 .7rem var(--pix); }\n.ej .acciones { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: .5rem; }\n.acciones > *, .panel .nav a {\n  padding: .7rem 1.1rem; border-radius: 999px; text-decoration: none; text-align: center; font: 700 .76rem var(--pix);\n}\n.acciones .ver { background: var(--acc); color: var(--void); }\n.acciones .sol { border: 1.5px solid var(--acc); color: var(--acc); transition: background .25s, color .25s; }\n.acciones .sol:hover { background: var(--acc); color: var(--void); }\n.acciones .off { border: 1.5px dashed var(--line); color: var(--ink-3); }\n\n.panel > header { margin: 1.2rem 0 1.6rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }\n.panel .nav { display: flex; flex-wrap: wrap; gap: .6rem; }\n.panel .nav a { border: 1.5px solid var(--line); color: var(--ink); }\n.panel .nav a:hover { border-color: var(--acc); color: var(--acc); }\n.panel .nav.pie { margin-top: 2.4rem; padding-top: 1.4rem; border-top: 1px solid var(--line); }\n.panel h3 { color: var(--acc); }\n\n/* ---------- M\u00d3VIL ---------- */\n@media (max-width: 40rem) {\n  .wrap { padding: 1.8rem 1rem 3rem; }\n  .jump { padding: .9rem; }\n  article.paso { grid-template-columns: minmax(0, 1fr); padding: 1rem 1rem 1.1rem; }\n  article.paso .num { grid-row: auto; text-align: left; font-size: 1.6rem; margin-bottom: .1rem; }\n  article.paso h3 { font-size: 1.08rem; }\n  article.paso .mas { justify-self: stretch; justify-content: center; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  *, *::before, *::after { transition: none !important; }\n}\n\n<\/style>\n<\/head>\n<body class=\"ejercicios\" id=\"inicio\">\n<header class=\"bar\">\n  <a class=\"back\" href=\"#/\">\u2190 Elegir otra gu\u00eda<\/a>\n  <span class=\"tag\">EJERCICIOS<\/span>\n<\/header>\n\n<main class=\"wrap\">\n  <\!-- La lista. Se oculta cuando se abre un enunciado o un solucionario (el que coincide con la direcci\u00f3n #...) -->\n  <section class=\"hub intro\">\n    <h1>Ejercicios de pr\u00e1ctica<\/h1>\n    <p class=\"sub\">Enunciados tipo examen para hacer t\u00fa solo. Cada ejercicio tiene su <b>enunciado<\/b> y su <b>solucionario<\/b>: empieza por el enunciado y abre el solucionario cuando termines.<\/p>\n    <div class=\"ej-list\">\n      <article class=\"ej\">\n        <p class=\"n\">EJERCICIO 1<\/p>\n        <h2>La academia de idiomas<\/h2>\n        <p>Entidades con relaciones 1:N, 1:1 y N:M con datos propios, consultas, datos iniciales y la API REST de alumnos y matr\u00edculas.<\/p>\n        <div class=\"meta\"><span>2 horas<\/span><span>10 puntos<\/span><\/div>\n        <div class=\"acciones\"><a class=\"ver\" href=\"#ejercicio-1\">Ver el ejercicio<\/a> <a class=\"sol\" href=\"#solucion-1\">Ir al solucionario<\/a><\/div>\n      <\/article>\n      <article class=\"ej\">\n        <p class=\"n\">EJERCICIO 2<\/p>\n        <h2>El hospital \u00abSan Gabriel\u00bb<\/h2>\n        <p>M\u00e9dicos, pacientes e historiales cl\u00ednicos: relaciones 1:N, 1:1 y N:M con datos propios (consultas), repositorios, datos iniciales y la API REST de m\u00e9dicos.<\/p>\n        <div class=\"meta\"><span>10 puntos<\/span><\/div>\n        <div class=\"acciones\"><a class=\"ver\" href=\"#ejercicio-2\">Ver el ejercicio<\/a> <a class=\"sol\" href=\"#solucion-2\">Ir al solucionario<\/a><\/div>\n      <\/article>\n    <\/div>\n  <\/section>\n\n<section class=\"panel\" id=\"ejercicio-1\">\n  <nav class=\"nav\"><a href=\"#\">\u2190 Todos los ejercicios<\/a> <a href=\"#solucion-1\">Ir al solucionario \u2192<\/a><\/nav>\n  <header><p class=\"n\">EJERCICIO 1 \u00b7 ENUNCIADO<\/p><h2>La academia de idiomas<\/h2><\/header>\n<p>Un ejercicio completo, con el formato de un examen. Haz el proyecto <b>sin mirar la soluci\u00f3n<\/b> y, cuando termines, compara. Es el mismo recorrido de la gu\u00eda (entidades, repositorios, datos, API REST y preguntas de comprensi\u00f3n) aplicado a un tema nuevo.<\/p>\n\n<table>\n<tr><th>Ficha del ejercicio<\/th><th><\/th><\/tr>\n<tr><td>Proyecto<\/td><td>Spring Boot + Spring Data JPA + MySQL, con Validation y Spring Web<\/td><\/tr>\n<tr><td>Paquete base<\/td><td><code>com.academia.babel<\/code>, con los subpaquetes <code>entity<\/code>, <code>enums<\/code>, <code>repository<\/code>, <code>dto<\/code>, <code>service<\/code> (y <code>impl<\/code>) y <code>controller<\/code><\/td><\/tr>\n<tr><td>Tiempo orientativo<\/td><td>2 horas<\/td><\/tr>\n<tr><td>Puntuaci\u00f3n<\/td><td>Parte 1: 3 \u00b7 Parte 2: 1,5 \u00b7 Parte 3: 1 \u00b7 Parte 4: 3 \u00b7 Parte 5: 1,5<\/td><\/tr>\n<\/table>\n<div class=\"warn\">La academia <b>Babel<\/b> tiene varias sedes. En cada sede trabajan profesores. Los alumnos se matriculan en cursos, y cada alumno tiene un expediente propio. Todo lo que no diga el enunciado, dec\u00eddelo t\u00fa y justif\u00edcalo.<\/div>\n\n<h3>Parte 1: entidades y relaciones (3 puntos)<\/h3>\n<p class=\"paso\"><b>1.<\/b> Crea los enums <code>Idioma<\/code> (<code>INGLES<\/code>, <code>FRANCES<\/code>, <code>ALEMAN<\/code>, <code>ITALIANO<\/code>), <code>Nivel<\/code> (<code>A1<\/code>, <code>A2<\/code>, <code>B1<\/code>, <code>B2<\/code>, <code>C1<\/code>, <code>C2<\/code>) y <code>EstadoMatricula<\/code> (<code>ACTIVA<\/code>, <code>FINALIZADA<\/code>, <code>ABANDONADA<\/code>).<\/p>\n<p class=\"paso\"><b>2.<\/b> Crea la entidad <code>Academia<\/code>, con tabla <code>academias<\/code>: <code>id<\/code> (clave autogenerada, columna <code>id_academia<\/code>), <code>nombre<\/code> (obligatorio, m\u00e1ximo 80 caracteres) y <code>ciudad<\/code> (obligatoria).<\/p>\n<p class=\"paso\"><b>3.<\/b> Crea la entidad <code>Profesor<\/code>, con tabla <code>profesores<\/code>: <code>id<\/code> (columna <code>id_profesor<\/code>), <code>nombre<\/code> (obligatorio), <code>salarioHora<\/code> (<code>BigDecimal<\/code>, precisi\u00f3n 8 y escala 2, obligatorio), <code>idioma<\/code> (el enum, guardado como texto, obligatorio) y <code>activo<\/code> (<code>boolean<\/code>).<\/p>\n<p class=\"paso\"><b>4.<\/b> Crea la entidad <code>Alumno<\/code>, con tabla <code>alumnos<\/code>: <code>id<\/code> (columna <code>id_alumno<\/code>), <code>nombre<\/code> (obligatorio), <code>email<\/code> (obligatorio y \u00fanico) y <code>fechaNacimiento<\/code> (<code>LocalDate<\/code>, obligatoria).<\/p>\n<p class=\"paso\"><b>5.<\/b> Crea la entidad <code>Expediente<\/code>, con tabla <code>expedientes<\/code>: <code>id<\/code> (columna <code>id_expediente<\/code>), <code>numeroMatricula<\/code> (obligatorio y \u00fanico), <code>nivelInicial<\/code> (el enum <code>Nivel<\/code>, como texto, obligatorio) y <code>observaciones<\/code> (texto largo, puede ser nulo).<\/p>\n<p class=\"paso\"><b>6.<\/b> Crea la entidad <code>Curso<\/code>, con tabla <code>cursos<\/code>: <code>id<\/code> (columna <code>id_curso<\/code>), <code>titulo<\/code> (obligatorio), <code>idioma<\/code> y <code>nivel<\/code> (enums, como texto, obligatorios) y <code>precio<\/code> (<code>BigDecimal<\/code>, precisi\u00f3n 8 y escala 2, obligatorio).<\/p>\n<p class=\"paso\"><b>7.<\/b> Haz una <b>relaci\u00f3n bidireccional uno a muchos<\/b> entre <code>Academia<\/code> y <code>Profesor<\/code>. El propietario es <code>Profesor<\/code>, con la columna <code>id_academia<\/code>, obligatoria. Al borrar una academia <b>no<\/b> deben borrarse sus profesores. Inicializa la lista y escribe un m\u00e9todo <code>addProfesor<\/code> que mantenga sincronizados los dos lados.<\/p>\n<p class=\"paso\"><b>8.<\/b> Haz una <b>relaci\u00f3n uno a uno unidireccional<\/b> entre <code>Alumno<\/code> y <code>Expediente<\/code>. El propietario es <code>Alumno<\/code>, con la columna <code>id_expediente<\/code>, obligatoria y \u00fanica. Al guardar un alumno debe guardarse su expediente, y al borrarlo, tambi\u00e9n. Dise\u00f1a el <b>constructor<\/b> de <code>Alumno<\/code> de forma que sea imposible crear un alumno sin expediente.<\/p>\n<p class=\"paso\"><b>9.<\/b> Haz una <b>relaci\u00f3n muchos a muchos con datos propios<\/b> entre <code>Alumno<\/code> y <code>Curso<\/code>, creando la entidad <code>Matricula<\/code> (tabla <code>matriculas<\/code>): <code>id<\/code>, <code>alumno<\/code> y <code>curso<\/code> (<code>@ManyToOne<\/code> obligatorios y con carga perezosa), <code>fecha<\/code> (<code>LocalDate<\/code>, obligatoria), <code>nota<\/code> (<code>Double<\/code>; <b>puede ser nula<\/b>, porque al matricularse a\u00fan no hay nota), <code>estado<\/code> (<code>EstadoMatricula<\/code>, como texto) y <code>pagada<\/code> (<code>boolean<\/code>). A\u00f1ade las listas inversas de matr\u00edculas con <code>mappedBy<\/code>: en <code>Alumno<\/code>, que se borren con \u00e9l (<code>orphanRemoval<\/code>); en <code>Curso<\/code>, sin cascada.<\/p>\n<p class=\"paso\"><b>10.<\/b> Responde con tus palabras:<\/p>\n<ul>\n<li>a) \u00bfPor qu\u00e9 <code>Matricula<\/code> es una entidad y no un <code>@ManyToMany<\/code> directo entre <code>Alumno<\/code> y <code>Curso<\/code>?<\/li>\n<li>b) \u00bfEn qu\u00e9 tabla est\u00e1 cada clave for\u00e1nea del modelo?<\/li>\n<li>c) \u00bfQu\u00e9 ocurre con <code>FetchType.EAGER<\/code> en un <code>@ManyToOne<\/code> cuando se listan 100 matr\u00edculas?<\/li>\n<\/ul>\n\n<h3>Parte 2: repositorios y consultas (1,5 puntos)<\/h3>\n<p class=\"paso\"><b>11.<\/b> Crea los repositorios de las cinco entidades (<code>JpaRepository<\/code>), con la convenci\u00f3n <code>I<\/code> + entidad + <code>Repository<\/code>.<\/p>\n<p class=\"paso\"><b>12.<\/b> En <code>IProfesorRepository<\/code>, escribe estos m\u00e9todos (consulta derivada donde se pueda, <code>@Query<\/code> donde haga falta):<\/p>\n<ul>\n<li>a) Profesores de un idioma dado.<\/li>\n<li>b) Profesores activos de una academia (por el id de la academia).<\/li>\n<li>c) Profesores con <code>salarioHora<\/code> mayor que una cantidad, de mayor a menor.<\/li>\n<li>d) N\u00famero de profesores de cada academia (JPQL con <code>GROUP BY<\/code>).<\/li>\n<\/ul>\n<p class=\"paso\"><b>13.<\/b> En <code>IMatriculaRepository<\/code>, escribe:<\/p>\n<ul>\n<li>a) Matr\u00edculas de un alumno, de la m\u00e1s reciente a la m\u00e1s antigua.<\/li>\n<li>b) Nota media de un curso (<code>@Query<\/code> con <code>AVG<\/code>). Las matr\u00edculas sin nota no cuentan.<\/li>\n<li>c) Matr\u00edculas <code>ACTIVA<\/code> que todav\u00eda no est\u00e1n pagadas.<\/li>\n<\/ul>\n<p class=\"paso\"><b>14.<\/b> En <code>IAlumnoRepository<\/code>, escribe una consulta que devuelva los alumnos matriculados en un curso concreto, sin repetidos (<code>JOIN<\/code> y <code>DISTINCT<\/code>), y un m\u00e9todo que diga si ya existe un alumno con un email dado.<\/p>\n<p class=\"paso\"><b>15.<\/b> En <code>ICursoRepository<\/code>, escribe los cursos de un idioma y un nivel dados, y los cursos cuyo precio no supera una cantidad.<\/p>\n\n<h3>Parte 3: datos iniciales (1 punto)<\/h3>\n<p class=\"paso\"><b>16.<\/b> Configura la aplicaci\u00f3n para que cargue los datos al arrancar (<code>create-drop<\/code>) y escribe el <code>data.sql<\/code> con:<\/p>\n<ul>\n<li>2 academias,<\/li>\n<li>4 profesores, de idiomas distintos y repartidos entre las academias,<\/li>\n<li>4 cursos,<\/li>\n<li>3 alumnos, cada uno con su expediente,<\/li>\n<li>5 matr\u00edculas, de modo que un alumno est\u00e9 en dos cursos, un curso tenga dos alumnos, una matr\u00edcula tenga la nota nula y otra est\u00e9 <code>ABANDONADA<\/code>.<\/li>\n<\/ul>\n<p>Respeta el orden de inserci\u00f3n y los textos exactos de los enums.<\/p>\n<p class=\"paso\"><b>17.<\/b> Desde <code>run()<\/code>, crea y guarda un alumno nuevo con su expediente y matr\u00edc\u00falalo en un curso que ya exista. Indica en qu\u00e9 orden creas y guardas cada objeto, y por qu\u00e9.<\/p>\n\n<h3>Parte 4: API REST por capas (3 puntos)<\/h3>\n<p class=\"paso\"><b>18.<\/b> <b>DTO.<\/b> Crea, como <code>record<\/code>:<\/p>\n<ul>\n<li><code>AlumnoRequestDTO<\/code>: <code>nombre<\/code>, <code>email<\/code>, <code>fechaNacimiento<\/code>, <code>numeroMatricula<\/code> y <code>nivelInicial<\/code>. Valida con <code>@Valid<\/code>: nombre no vac\u00edo, email con formato correcto, fecha de nacimiento en el pasado, n\u00famero de matr\u00edcula con el formato <code>AL-<\/code> seguido de 4 cifras, y todos los campos obligatorios.<\/li>\n<li><code>MatriculaRequestDTO<\/code>: <code>cursoId<\/code> y <code>fecha<\/code>.<\/li>\n<li><code>MatriculaResumenDTO<\/code>: <code>tituloCurso<\/code>, <code>fecha<\/code>, <code>estado<\/code> y <code>nota<\/code>.<\/li>\n<li><code>AlumnoResponseDTO<\/code>: <code>id<\/code>, <code>nombre<\/code>, <code>email<\/code>, <code>numeroMatricula<\/code>, <code>nivelInicial<\/code> y la lista de <code>MatriculaResumenDTO<\/code>.<\/li>\n<\/ul>\n<p class=\"paso\"><b>19.<\/b> <b>Servicio.<\/b> Crea <code>IAlumnoService<\/code> y <code>AlumnoServiceImpl<\/code>, con los repositorios inyectados con <code>@Autowired<\/code>. Implementa:<\/p>\n<ul>\n<li>a) <code>crear(AlumnoRequestDTO)<\/code>: si el email ya existe, hay que informar al controlador para responder 409.<\/li>\n<li>b) <code>obtenerPorId(Long)<\/code>.<\/li>\n<li>c) <code>listarPorNivel(Nivel)<\/code>: filtra por el nivel inicial del expediente. Una lista vac\u00eda es v\u00e1lida.<\/li>\n<li>d) <code>matricular(Long alumnoId, MatriculaRequestDTO)<\/code>: 404 si no existe el alumno o el curso; 409 si el alumno ya tiene una matr\u00edcula <code>ACTIVA<\/code> en ese curso.<\/li>\n<li>e) <code>eliminar(Long)<\/code>: 409 si el alumno tiene alguna matr\u00edcula <code>ACTIVA<\/code>.<\/li>\n<li>f) El m\u00e9todo privado que convierte <code>Alumno<\/code> en <code>AlumnoResponseDTO<\/code>.<\/li>\n<\/ul>\n<p>Explica c\u00f3mo comunica tu servicio cada uno de esos resultados al controlador.<\/p>\n<p class=\"paso\"><b>20.<\/b> <b>Controlador.<\/b> Crea <code>AlumnoController<\/code> con estos endpoints. Escribe el c\u00f3digo HTTP de \u00e9xito y los de error de cada uno:<\/p>\n<table>\n<tr><th>Endpoint<\/th><th>\u00c9xito<\/th><th>Errores<\/th><\/tr>\n<tr><td><code>POST /api/alumnos<\/code><\/td><td>\u00bf?<\/td><td>\u00bf?<\/td><\/tr>\n<tr><td><code>GET /api/alumnos/{id}<\/code><\/td><td>\u00bf?<\/td><td>\u00bf?<\/td><\/tr>\n<tr><td><code>GET /api/alumnos?nivel=<\/code><\/td><td>\u00bf?<\/td><td>\u00bf?<\/td><\/tr>\n<tr><td><code>POST /api/alumnos/{id}/matriculas<\/code><\/td><td>\u00bf?<\/td><td>\u00bf?<\/td><\/tr>\n<tr><td><code>DELETE /api/alumnos/{id}<\/code><\/td><td>\u00bf?<\/td><td>\u00bf?<\/td><\/tr>\n<\/table>\n<p>El primer <code>POST<\/code> debe devolver la cabecera <code>Location<\/code> con la direcci\u00f3n del alumno creado.<\/p>\n<p class=\"paso\"><b>21.<\/b> <b>Postman.<\/b> Escribe:<\/p>\n<ul>\n<li>a) El cuerpo JSON para crear un alumno con datos v\u00e1lidos, y explica por qu\u00e9 sus claves son las que son.<\/li>\n<li>b) Un cuerpo que provoque un <b>400<\/b> por el email, y otro que lo provoque por el n\u00famero de matr\u00edcula.<\/li>\n<li>c) El cuerpo para matricular a ese alumno en un curso.<\/li>\n<li>d) Qu\u00e9 hay que marcar en la pesta\u00f1a <b>Body<\/b> y qu\u00e9 error obtienes si te olvidas de hacerlo.<\/li>\n<\/ul>\n\n<h3>Parte 5: preguntas de comprensi\u00f3n (1,5 puntos)<\/h3>\n<p class=\"paso\"><b>22.<\/b> Una petici\u00f3n <code>GET /api/alumnos/3<\/code> lanza <code>LazyInitializationException<\/code>. Explica por qu\u00e9 puede ocurrir y c\u00f3mo se evita.<\/p>\n<p class=\"paso\"><b>23.<\/b> Al listar 50 alumnos con sus matr\u00edculas se lanzan 51 consultas. \u00bfC\u00f3mo se llama el problema y c\u00f3mo se arregla? Da dos soluciones.<\/p>\n<p class=\"paso\"><b>24.<\/b> \u00bfPor qu\u00e9 el constructor de <code>Alumno<\/code> exige el expediente en lugar de asignarlo despu\u00e9s con un <i>setter<\/i>?<\/p>\n<p class=\"paso\"><b>25.<\/b> <code>DELETE<\/code> de una academia que tiene profesores devuelve un 500. \u00bfQu\u00e9 c\u00f3digo deber\u00eda devolver y qu\u00e9 comprobaci\u00f3n falta en el servicio?<\/p>\n<p class=\"paso\"><b>26.<\/b> Dibuja el esquema de tablas que genera todo el modelo, con sus claves primarias y for\u00e1neas, y marca d\u00f3nde est\u00e1 cada clave for\u00e1nea.<\/p>\n\n<div class=\"why\">Intenta hacerlo t\u00fa primero y no abras el solucionario hasta terminar: lo que m\u00e1s ense\u00f1a es comparar tus fallos con la soluci\u00f3n.<\/div>\n  <nav class=\"nav pie\"><a href=\"#\">\u2190 Todos los ejercicios<\/a> <a href=\"#solucion-1\">Ir al solucionario \u2192<\/a><\/nav>\n<\/section>\n\n<section class=\"panel\" id=\"solucion-1\">\n  <nav class=\"nav\"><a href=\"#ejercicio-1\">\u2190 Volver al enunciado<\/a> <a href=\"#\">\u2190 Todos los ejercicios<\/a><\/nav>\n  <header><p class=\"n\">EJERCICIO 1 \u00b7 SOLUCIONARIO<\/p><h2>La academia de idiomas<\/h2><\/header>\n<p>Esta es <b>una<\/b> soluci\u00f3n posible: hay otras igual de v\u00e1lidas. Lo importante es que entiendas <i>por qu\u00e9<\/i> est\u00e1 hecha as\u00ed. Cada pregunta del enunciado tiene aqu\u00ed su respuesta, con el n\u00famero que lleva all\u00ed.<\/p>\n<div class=\"warn\">No mires esto hasta haber hecho el ejercicio. Despu\u00e9s, compara <b>tus fallos<\/b> con la soluci\u00f3n: ah\u00ed es donde se aprende.<\/div>\n\n<h3>Parte 1: entidades y relaciones<\/h3>\n\n<p class=\"paso\"><b>1.<\/b> Los tres enums, cada uno en su archivo del paquete <code>enums<\/code>:<\/p>\n<pre data-f=\"enums/Idioma.java\">package com.academia.babel.enums;\n\npublic enum Idioma {\n    INGLES, FRANCES, ALEMAN, ITALIANO\n}<\/pre>\n<pre data-f=\"enums/Nivel.java\">package com.academia.babel.enums;\n\npublic enum Nivel {\n    A1, A2, B1, B2, C1, C2\n}<\/pre>\n<pre data-f=\"enums/EstadoMatricula.java\">package com.academia.babel.enums;\n\npublic enum EstadoMatricula {\n    ACTIVA, FINALIZADA, ABANDONADA\n}<\/pre>\n\n<p class=\"paso\"><b>2 y 7.<\/b> <code>Academia<\/code>, que es el lado \u00abuno\u00bb de la relaci\u00f3n bidireccional con <code>Profesor<\/code>. Lleva <code>mappedBy<\/code> y <b>no lleva cascada<\/b>: as\u00ed, borrar una academia no borra a sus profesores.<\/p>\n<pre data-f=\"entity/Academia.java\">package com.academia.babel.entity;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.OneToMany;\nimport jakarta.persistence.Table;\n\n@Entity\n@Table(name = \"academias\")\npublic class Academia {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_academia\")\n    private Long id;\n\n    @Column(nullable = false, length = 80)\n    private String nombre;\n\n    @Column(nullable = false)\n    private String ciudad;\n\n    // Lado inverso: la clave for\u00e1nea est\u00e1 en Profesor. Sin cascade: borrar la academia no borra a los profesores.\n    @OneToMany(mappedBy = \"academia\")\n    private List&lt;Profesor&gt; profesores = new ArrayList&lt;&gt;();\n\n    public Academia() {}\n\n    public Academia(String nombre, String ciudad) {\n        this.nombre = nombre;\n        this.ciudad = ciudad;\n    }\n\n    // Mantiene sincronizados los dos lados de la relaci\u00f3n\n    public void addProfesor(Profesor profesor) {\n        profesores.add(profesor);\n        profesor.setAcademia(this);\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public String getCiudad() { return ciudad; }\n    public List&lt;Profesor&gt; getProfesores() { return profesores; }\n}<\/pre>\n\n<p class=\"paso\"><b>3 y 7.<\/b> <code>Profesor<\/code> es el <b>propietario<\/b> de la relaci\u00f3n: tiene la clave for\u00e1nea <code>id_academia<\/code>, obligatoria, con carga perezosa.<\/p>\n<pre data-f=\"entity/Profesor.java\">package com.academia.babel.entity;\n\nimport java.math.BigDecimal;\n\nimport com.academia.babel.enums.Idioma;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.EnumType;\nimport jakarta.persistence.Enumerated;\nimport jakarta.persistence.FetchType;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.JoinColumn;\nimport jakarta.persistence.ManyToOne;\nimport jakarta.persistence.Table;\n\n@Entity\n@Table(name = \"profesores\")\npublic class Profesor {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_profesor\")\n    private Long id;\n\n    @Column(nullable = false)\n    private String nombre;\n\n    @Column(name = \"salario_hora\", nullable = false, precision = 8, scale = 2)\n    private BigDecimal salarioHora;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 20)\n    private Idioma idioma;\n\n    private boolean activo;\n\n    // Lado propietario: aqu\u00ed est\u00e1 la columna id_academia\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"id_academia\", nullable = false)\n    private Academia academia;\n\n    public Profesor() {}\n\n    public Profesor(String nombre, BigDecimal salarioHora, Idioma idioma, boolean activo) {\n        this.nombre = nombre;\n        this.salarioHora = salarioHora;\n        this.idioma = idioma;\n        this.activo = activo;\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public BigDecimal getSalarioHora() { return salarioHora; }\n    public Idioma getIdioma() { return idioma; }\n    public boolean isActivo() { return activo; }\n    public Academia getAcademia() { return academia; }\n    public void setAcademia(Academia academia) { this.academia = academia; }\n}<\/pre>\n\n<p class=\"paso\"><b>5.<\/b> <code>Expediente<\/code>. El texto largo (<code>observaciones<\/code>) puede ser nulo, as\u00ed que no lleva <code>nullable = false<\/code>. Podr\u00edas usar <code>@Lob<\/code> si el enunciado pide un texto realmente enorme.<\/p>\n<pre data-f=\"entity/Expediente.java\">package com.academia.babel.entity;\n\nimport com.academia.babel.enums.Nivel;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.EnumType;\nimport jakarta.persistence.Enumerated;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.Table;\n\n@Entity\n@Table(name = \"expedientes\")\npublic class Expediente {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_expediente\")\n    private Long id;\n\n    @Column(name = \"numero_matricula\", nullable = false, unique = true, length = 10)\n    private String numeroMatricula;\n\n    @Enumerated(EnumType.STRING)\n    @Column(name = \"nivel_inicial\", nullable = false, length = 2)\n    private Nivel nivelInicial;\n\n    @Column(length = 1000)\n    private String observaciones;\n\n    public Expediente() {}\n\n    public Expediente(String numeroMatricula, Nivel nivelInicial, String observaciones) {\n        this.numeroMatricula = numeroMatricula;\n        this.nivelInicial = nivelInicial;\n        this.observaciones = observaciones;\n    }\n\n    public Long getId() { return id; }\n    public String getNumeroMatricula() { return numeroMatricula; }\n    public Nivel getNivelInicial() { return nivelInicial; }\n    public String getObservaciones() { return observaciones; }\n}<\/pre>\n\n<p class=\"paso\"><b>4, 8 y 9.<\/b> <code>Alumno<\/code>. Es el propietario del 1:1 con <code>Expediente<\/code> (<code>id_expediente<\/code>, obligatoria y \u00fanica), con cascada total. Y es el lado \u00abuno\u00bb de <code>Matricula<\/code>, con <code>orphanRemoval<\/code>. F\u00edjate en el <b>constructor<\/b>: recibe el expediente, as\u00ed que es imposible crear un alumno sin \u00e9l.<\/p>\n<pre data-f=\"entity/Alumno.java\">package com.academia.babel.entity;\n\nimport java.time.LocalDate;\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport jakarta.persistence.CascadeType;\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.JoinColumn;\nimport jakarta.persistence.OneToMany;\nimport jakarta.persistence.OneToOne;\nimport jakarta.persistence.Table;\n\n@Entity\n@Table(name = \"alumnos\")\npublic class Alumno {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_alumno\")\n    private Long id;\n\n    @Column(nullable = false)\n    private String nombre;\n\n    @Column(nullable = false, unique = true)\n    private String email;\n\n    @Column(name = \"fecha_nacimiento\", nullable = false)\n    private LocalDate fechaNacimiento;\n\n    // Propietario del 1:1. La cascada guarda y borra el expediente junto con el alumno.\n    @OneToOne(cascade = CascadeType.ALL, optional = false)\n    @JoinColumn(name = \"id_expediente\", nullable = false, unique = true)\n    private Expediente expediente;\n\n    // Lado inverso del N:M con datos: las matr\u00edculas dependen del alumno\n    @OneToMany(mappedBy = \"alumno\", cascade = CascadeType.ALL, orphanRemoval = true)\n    private List&lt;Matricula&gt; matriculas = new ArrayList&lt;&gt;();\n\n    // Lo necesita JPA para crear objetos al leer de la base. No lo uses t\u00fa.\n    public Alumno() {}\n\n    // \u00danica forma de crear un alumno: obliga a darle su expediente\n    public Alumno(String nombre, String email, LocalDate fechaNacimiento, Expediente expediente) {\n        this.nombre = nombre;\n        this.email = email;\n        this.fechaNacimiento = fechaNacimiento;\n        this.expediente = expediente;\n    }\n\n    public void addMatricula(Matricula matricula) {\n        matriculas.add(matricula);\n        matricula.setAlumno(this);\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public String getEmail() { return email; }\n    public LocalDate getFechaNacimiento() { return fechaNacimiento; }\n    public Expediente getExpediente() { return expediente; }\n    public List&lt;Matricula&gt; getMatriculas() { return matriculas; }\n}<\/pre>\n\n<p class=\"paso\"><b>6.<\/b> <code>Curso<\/code>. Su lista de matr\u00edculas es el lado inverso y <b>no lleva cascada<\/b>: borrar un curso no debe arrastrar las matr\u00edculas por accidente.<\/p>\n<pre data-f=\"entity/Curso.java\">package com.academia.babel.entity;\n\nimport java.math.BigDecimal;\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport com.academia.babel.enums.Idioma;\nimport com.academia.babel.enums.Nivel;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.EnumType;\nimport jakarta.persistence.Enumerated;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.OneToMany;\nimport jakarta.persistence.Table;\n\n@Entity\n@Table(name = \"cursos\")\npublic class Curso {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_curso\")\n    private Long id;\n\n    @Column(nullable = false)\n    private String titulo;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 20)\n    private Idioma idioma;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 2)\n    private Nivel nivel;\n\n    @Column(nullable = false, precision = 8, scale = 2)\n    private BigDecimal precio;\n\n    // Lado inverso, sin cascada\n    @OneToMany(mappedBy = \"curso\")\n    private List&lt;Matricula&gt; matriculas = new ArrayList&lt;&gt;();\n\n    public Curso() {}\n\n    public Curso(String titulo, Idioma idioma, Nivel nivel, BigDecimal precio) {\n        this.titulo = titulo;\n        this.idioma = idioma;\n        this.nivel = nivel;\n        this.precio = precio;\n    }\n\n    public Long getId() { return id; }\n    public String getTitulo() { return titulo; }\n    public Idioma getIdioma() { return idioma; }\n    public Nivel getNivel() { return nivel; }\n    public BigDecimal getPrecio() { return precio; }\n    public List&lt;Matricula&gt; getMatriculas() { return matriculas; }\n}<\/pre>\n\n<p class=\"paso\"><b>9.<\/b> <code>Matricula<\/code> es la entidad que representa la relaci\u00f3n N:M con datos. Tiene dos <code>@ManyToOne<\/code> (propietaria de ambas claves for\u00e1neas). F\u00edjate en que <code>nota<\/code> es un <code>Double<\/code> y no un <code>double<\/code>, porque tiene que poder valer <code>null<\/code>.<\/p>\n<pre data-f=\"entity/Matricula.java\">package com.academia.babel.entity;\n\nimport java.time.LocalDate;\n\nimport com.academia.babel.enums.EstadoMatricula;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.EnumType;\nimport jakarta.persistence.Enumerated;\nimport jakarta.persistence.FetchType;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.JoinColumn;\nimport jakarta.persistence.ManyToOne;\nimport jakarta.persistence.Table;\n\n@Entity\n@Table(name = \"matriculas\")\npublic class Matricula {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_matricula\")\n    private Long id;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"id_alumno\", nullable = false)\n    private Alumno alumno;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"id_curso\", nullable = false)\n    private Curso curso;\n\n    @Column(nullable = false)\n    private LocalDate fecha;\n\n    // Double (con may\u00fascula) porque puede ser nula: al matricularse todav\u00eda no hay nota\n    private Double nota;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 20)\n    private EstadoMatricula estado;\n\n    private boolean pagada;\n\n    public Matricula() {}\n\n    // El alumno no va aqu\u00ed: se asigna con alumno.addMatricula(...)\n    public Matricula(Curso curso, LocalDate fecha, EstadoMatricula estado, boolean pagada) {\n        this.curso = curso;\n        this.fecha = fecha;\n        this.estado = estado;\n        this.pagada = pagada;\n    }\n\n    public Long getId() { return id; }\n    public Alumno getAlumno() { return alumno; }\n    public void setAlumno(Alumno alumno) { this.alumno = alumno; }\n    public Curso getCurso() { return curso; }\n    public LocalDate getFecha() { return fecha; }\n    public Double getNota() { return nota; }\n    public EstadoMatricula getEstado() { return estado; }\n    public boolean isPagada() { return pagada; }\n}<\/pre>\n\n<p class=\"paso\"><b>10.<\/b> Respuestas:<\/p>\n<ul>\n<li><b>a)<\/b> Porque la relaci\u00f3n <b>tiene datos propios<\/b> (fecha, nota, estado y si est\u00e1 pagada). Un <code>@ManyToMany<\/code> directo solo crea una tabla intermedia con dos ids y no puede guardar nada m\u00e1s. Con <code>Matricula<\/code> la relaci\u00f3n pasa a ser dos <code>@ManyToOne<\/code> y la tabla intermedia se convierte en una entidad con sus propias columnas.<\/li>\n<li><b>b)<\/b> Las claves for\u00e1neas: <code>profesores.id_academia<\/code>, <code>alumnos.id_expediente<\/code>, <code>matriculas.id_alumno<\/code> y <code>matriculas.id_curso<\/code>. <b>Siempre est\u00e1 en el lado propietario<\/b> (el que lleva <code>@JoinColumn<\/code>); el lado con <code>mappedBy<\/code> no tiene columna.<\/li>\n<li><b>c)<\/b> Con <code>EAGER<\/code>, al cargar 100 matr\u00edculas Hibernate carga tambi\u00e9n el alumno y el curso de cada una, aunque no los necesites. Pueden dispararse muchas consultas de m\u00e1s. Con <code>LAZY<\/code>, solo se cargan cuando se piden.<\/li>\n<\/ul>\n\n<h3>Parte 2: repositorios y consultas<\/h3>\n\n<p class=\"paso\"><b>11 y 12.<\/b> Cada repositorio es una interfaz que extiende <code>JpaRepository&lt;Entidad, Long&gt;<\/code>. Estos son los de profesores y academias:<\/p>\n<pre data-f=\"repository/IAcademiaRepository.java\">package com.academia.babel.repository;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport com.academia.babel.entity.Academia;\n\npublic interface IAcademiaRepository extends JpaRepository&lt;Academia, Long&gt; {\n}<\/pre>\n<pre data-f=\"repository/IProfesorRepository.java\">package com.academia.babel.repository;\n\nimport java.math.BigDecimal;\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Query;\n\nimport com.academia.babel.entity.Profesor;\nimport com.academia.babel.enums.Idioma;\n\npublic interface IProfesorRepository extends JpaRepository&lt;Profesor, Long&gt; {\n\n    // a) Profesores de un idioma\n    List&lt;Profesor&gt; findByIdioma(Idioma idioma);\n\n    // b) Activos de una academia: \"AcademiaId\" navega por profesor.academia.id\n    List&lt;Profesor&gt; findByAcademiaIdAndActivoTrue(Long academiaId);\n\n    // c) Salario mayor que X, de mayor a menor\n    List&lt;Profesor&gt; findBySalarioHoraGreaterThanOrderBySalarioHoraDesc(BigDecimal salario);\n\n    // d) Cu\u00e1ntos profesores tiene cada academia: cada fila es [nombre de la academia, cantidad]\n    @Query(\"SELECT a.nombre, COUNT(p) FROM Profesor p JOIN p.academia a GROUP BY a.id, a.nombre\")\n    List&lt;Object[]&gt; contarPorAcademia();\n\n    // Lo usa el servicio para impedir borrar una academia con profesores\n    long countByAcademiaId(Long academiaId);\n}<\/pre>\n\n<p class=\"paso\"><b>13.<\/b> Matr\u00edculas:<\/p>\n<pre data-f=\"repository/IMatriculaRepository.java\">package com.academia.babel.repository;\n\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.repository.query.Param;\n\nimport com.academia.babel.entity.Matricula;\nimport com.academia.babel.enums.EstadoMatricula;\n\npublic interface IMatriculaRepository extends JpaRepository&lt;Matricula, Long&gt; {\n\n    // a) De un alumno, de la m\u00e1s reciente a la m\u00e1s antigua\n    List&lt;Matricula&gt; findByAlumnoIdOrderByFechaDesc(Long alumnoId);\n\n    // b) Nota media de un curso. AVG ignora las notas nulas, que es lo que pide el enunciado\n    @Query(\"SELECT AVG(m.nota) FROM Matricula m WHERE m.curso.id = :cursoId\")\n    Double notaMedia(@Param(\"cursoId\") Long cursoId);\n\n    // c) Activas sin pagar: findByEstadoAndPagadaFalse(EstadoMatricula.ACTIVA)\n    List&lt;Matricula&gt; findByEstadoAndPagadaFalse(EstadoMatricula estado);\n\n    // Los usa el servicio\n    boolean existsByAlumnoIdAndCursoIdAndEstado(Long alumnoId, Long cursoId, EstadoMatricula estado);\n\n    long countByAlumnoIdAndEstado(Long alumnoId, EstadoMatricula estado);\n}<\/pre>\n\n<p class=\"paso\"><b>14.<\/b> Alumnos. La consulta de \u00abmatriculados en un curso\u00bb necesita <code>JOIN<\/code> (hay que pasar por <code>matriculas<\/code>) y <code>DISTINCT<\/code> (un alumno podr\u00eda aparecer repetido). El filtro por nivel navega <code>alumno \u2192 expediente \u2192 nivelInicial<\/code>, y Spring lo entiende solo por el nombre.<\/p>\n<pre data-f=\"repository/IAlumnoRepository.java\">package com.academia.babel.repository;\n\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.repository.query.Param;\n\nimport com.academia.babel.entity.Alumno;\nimport com.academia.babel.enums.Nivel;\n\npublic interface IAlumnoRepository extends JpaRepository&lt;Alumno, Long&gt; {\n\n    // Alumnos matriculados en un curso, sin repetidos\n    @Query(\"SELECT DISTINCT a FROM Alumno a JOIN a.matriculas m WHERE m.curso.id = :cursoId\")\n    List&lt;Alumno&gt; buscarPorCurso(@Param(\"cursoId\") Long cursoId);\n\n    boolean existsByEmail(String email);\n\n    boolean existsByExpedienteNumeroMatricula(String numeroMatricula);\n\n    // alumno.expediente.nivelInicial\n    List&lt;Alumno&gt; findByExpedienteNivelInicial(Nivel nivel);\n}<\/pre>\n\n<p class=\"paso\"><b>15.<\/b> Cursos:<\/p>\n<pre data-f=\"repository/ICursoRepository.java\">package com.academia.babel.repository;\n\nimport java.math.BigDecimal;\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport com.academia.babel.entity.Curso;\nimport com.academia.babel.enums.Idioma;\nimport com.academia.babel.enums.Nivel;\n\npublic interface ICursoRepository extends JpaRepository&lt;Curso, Long&gt; {\n\n    List&lt;Curso&gt; findByIdiomaAndNivel(Idioma idioma, Nivel nivel);\n\n    // \"no supera\" significa menor o igual\n    List&lt;Curso&gt; findByPrecioLessThanEqual(BigDecimal precio);\n}<\/pre>\n\n<h3>Parte 3: datos iniciales<\/h3>\n\n<p class=\"paso\"><b>16.<\/b> En <code>application.properties<\/code> (adem\u00e1s de la conexi\u00f3n a MySQL de siempre):<\/p>\n<pre data-f=\"src/main/resources/application.properties (a\u00f1adir)\">spring.jpa.hibernate.ddl-auto=create-drop\nspring.sql.init.mode=always\nspring.jpa.defer-datasource-initialization=true<\/pre>\n<p>Y el <code>data.sql<\/code>. <b>El orden importa:<\/b> primero lo que otros van a apuntar (academias, expedientes, cursos) y despu\u00e9s lo que apunta (profesores, alumnos, matr\u00edculas). Los nombres de columna son los de las anotaciones.<\/p>\n<pre data-f=\"src/main/resources/data.sql\">INSERT INTO academias (id_academia, nombre, ciudad)\nVALUES (1, 'Babel Madrid', 'Madrid'),\n       (2, 'Babel Sevilla', 'Sevilla');\n\nINSERT INTO profesores (id_profesor, nombre, salario_hora, idioma, activo, id_academia)\nVALUES (1, 'Helen Clarke', 28.50, 'INGLES', true, 1),\n       (2, 'Pierre Dubois', 26.00, 'FRANCES', true, 1),\n       (3, 'Anke Vogel', 30.00, 'ALEMAN', false, 2),\n       (4, 'Giulia Rossi', 25.00, 'ITALIANO', true, 2);\n\nINSERT INTO expedientes (id_expediente, numero_matricula, nivel_inicial, observaciones)\nVALUES (1, 'AL-0001', 'A1', NULL),\n       (2, 'AL-0002', 'B1', 'Necesita reforzar la expresi\u00f3n oral'),\n       (3, 'AL-0003', 'B2', NULL);\n\nINSERT INTO alumnos (id_alumno, nombre, email, fecha_nacimiento, id_expediente)\nVALUES (1, 'Luc\u00eda P\u00e9rez', 'lucia@mail.com', '2000-05-14', 1),\n       (2, 'Marcos Ruiz', 'marcos@mail.com', '1998-11-02', 2),\n       (3, 'Sara G\u00f3mez', 'sara@mail.com', '2003-02-27', 3);\n\nINSERT INTO cursos (id_curso, titulo, idioma, nivel, precio)\nVALUES (1, 'Ingl\u00e9s conversaci\u00f3n', 'INGLES', 'B1', 250.00),\n       (2, 'Franc\u00e9s inicial', 'FRANCES', 'A1', 180.00),\n       (3, 'Alem\u00e1n intensivo', 'ALEMAN', 'A2', 320.00),\n       (4, 'Ingl\u00e9s avanzado', 'INGLES', 'C1', 300.00);\n\nINSERT INTO matriculas (id_matricula, id_alumno, id_curso, fecha, nota, estado, pagada)\nVALUES (1, 1, 2, '2026-09-15', NULL, 'ACTIVA', true),\n       (2, 1, 1, '2026-09-20', 7.5, 'FINALIZADA', true),\n       (3, 2, 1, '2026-09-18', 8.0, 'FINALIZADA', true),\n       (4, 2, 3, '2026-10-01', NULL, 'ABANDONADA', false),\n       (5, 3, 4, '2026-10-05', NULL, 'ACTIVA', false);<\/pre>\n<div class=\"ok\">Se cumple lo que ped\u00eda el enunciado: <b>Luc\u00eda<\/b> est\u00e1 en dos cursos (matr\u00edculas 1 y 2), el <b>curso 1<\/b> tiene dos alumnos (Luc\u00eda y Marcos), la matr\u00edcula 4 est\u00e1 <code>ABANDONADA<\/code> y varias tienen la nota nula.<\/div>\n\n<p class=\"paso\"><b>17.<\/b> La clase principal, con el <code>run()<\/code> que crea un alumno nuevo y lo matricula:<\/p>\n<pre data-f=\"BabelApplication.java\">package com.academia.babel;\n\nimport java.time.LocalDate;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.CommandLineRunner;\nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\nimport com.academia.babel.entity.Alumno;\nimport com.academia.babel.entity.Curso;\nimport com.academia.babel.entity.Expediente;\nimport com.academia.babel.entity.Matricula;\nimport com.academia.babel.enums.EstadoMatricula;\nimport com.academia.babel.enums.Nivel;\nimport com.academia.babel.repository.IAlumnoRepository;\nimport com.academia.babel.repository.ICursoRepository;\n\n@SpringBootApplication\npublic class BabelApplication implements CommandLineRunner {\n\n    @Autowired\n    private IAlumnoRepository alumnoRepository;\n\n    @Autowired\n    private ICursoRepository cursoRepository;\n\n    public static void main(String[] args) {\n        SpringApplication.run(BabelApplication.class, args);\n    }\n\n    @Override\n    public void run(String... args) {\n        // 1) El curso ya existe (lo carg\u00f3 data.sql): solo hay que buscarlo\n        Curso curso = cursoRepository.findById(1L).orElseThrow();\n\n        // 2) El expediente se crea primero porque el constructor de Alumno lo exige\n        Expediente expediente = new Expediente(\"AL-0004\", Nivel.A2, null);\n        Alumno alumno = new Alumno(\"Pablo Le\u00f3n\", \"pablo@mail.com\", LocalDate.of(2001, 3, 9), expediente);\n\n        // 3) La matr\u00edcula se cuelga del alumno\n        alumno.addMatricula(new Matricula(curso, LocalDate.now(), EstadoMatricula.ACTIVA, false));\n\n        // 4) Un solo save: la cascada guarda el expediente y la matr\u00edcula\n        alumnoRepository.save(alumno);\n        System.out.println(\"Alumno guardado con id \" + alumno.getId());\n    }\n}<\/pre>\n<p><b>Por qu\u00e9 este orden:<\/b> el curso tiene que existir antes, porque la matr\u00edcula apunta a \u00e9l. El expediente se crea antes que el alumno porque el constructor lo exige. Y gracias a <code>cascade = ALL<\/code>, un solo <code>save(alumno)<\/code> inserta el expediente (primero, porque el alumno tiene su clave for\u00e1nea), el alumno y, por \u00faltimo, la matr\u00edcula, que necesita el id del alumno.<\/p>\n\n<h3>Parte 4: API REST por capas<\/h3>\n\n<p class=\"paso\"><b>18.<\/b> Los DTO, como <code>record<\/code>. Los de entrada llevan validaciones; los de salida, no. <b>Wrapper o primitivo:<\/b> <code>nota<\/code> es <code>Double<\/code> porque puede ser nula; <code>cursoId<\/code> es <code>Long<\/code> con <code>@NotNull<\/code>, para detectar que no se envi\u00f3 (con un <code>long<\/code>, un olvido se convertir\u00eda en un <code>0<\/code> sin avisar).<\/p>\n<pre data-f=\"dto/AlumnoRequestDTO.java\">package com.academia.babel.dto;\n\nimport java.time.LocalDate;\n\nimport com.academia.babel.enums.Nivel;\n\nimport jakarta.validation.constraints.Email;\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.Past;\nimport jakarta.validation.constraints.Pattern;\n\npublic record AlumnoRequestDTO(\n        @NotBlank(message = \"El nombre es obligatorio\") String nombre,\n        @NotBlank(message = \"El email es obligatorio\") @Email(message = \"El email no tiene un formato v\u00e1lido\") String email,\n        @NotNull(message = \"La fecha de nacimiento es obligatoria\") @Past(message = \"La fecha de nacimiento debe estar en el pasado\") LocalDate fechaNacimiento,\n        @NotBlank(message = \"El n\u00famero de matr\u00edcula es obligatorio\")\n        @Pattern(regexp = \"^AL-\\\\d{4}$\", message = \"El n\u00famero de matr\u00edcula debe ser AL- y 4 cifras\") String numeroMatricula,\n        @NotNull(message = \"El nivel inicial es obligatorio\") Nivel nivelInicial) {\n}<\/pre>\n<pre data-f=\"dto/MatriculaRequestDTO.java\">package com.academia.babel.dto;\n\nimport java.time.LocalDate;\n\nimport jakarta.validation.constraints.NotNull;\n\npublic record MatriculaRequestDTO(\n        @NotNull(message = \"El curso es obligatorio\") Long cursoId,\n        @NotNull(message = \"La fecha es obligatoria\") LocalDate fecha) {\n}<\/pre>\n<pre data-f=\"dto/MatriculaResumenDTO.java\">package com.academia.babel.dto;\n\nimport java.time.LocalDate;\n\nimport com.academia.babel.enums.EstadoMatricula;\n\n/** Pieza anidada: solo lo necesario de una matr\u00edcula, sin volver al alumno (as\u00ed no hay bucles). */\npublic record MatriculaResumenDTO(String tituloCurso, LocalDate fecha, EstadoMatricula estado, Double nota) {\n}<\/pre>\n<pre data-f=\"dto/AlumnoResponseDTO.java\">package com.academia.babel.dto;\n\nimport java.util.List;\n\nimport com.academia.babel.enums.Nivel;\n\npublic record AlumnoResponseDTO(\n        Long id,\n        String nombre,\n        String email,\n        String numeroMatricula,\n        Nivel nivelInicial,\n        List&lt;MatriculaResumenDTO&gt; matriculas) {\n}<\/pre>\n\n<p class=\"paso\"><b>19.<\/b> <b>El servicio.<\/b> Para comunicar los resultados al controlador uso <b>excepciones propias<\/b>: <code>NoEncontradoException<\/code> (\u2192 404) y <code>ConflictoException<\/code> (\u2192 409). Un <code>@RestControllerAdvice<\/code> las traduce a c\u00f3digo HTTP en un solo sitio, y el controlador queda limpio. Es la segunda forma de la gu\u00eda (la otra es devolver <code>Optional<\/code>, <code>int<\/code> o <code>boolean<\/code>); las dos valen.<\/p>\n<pre data-f=\"exception/NoEncontradoException.java\">package com.academia.babel.exception;\n\npublic class NoEncontradoException extends RuntimeException {\n    public NoEncontradoException(String mensaje) {\n        super(mensaje);\n    }\n}<\/pre>\n<pre data-f=\"exception/ConflictoException.java\">package com.academia.babel.exception;\n\npublic class ConflictoException extends RuntimeException {\n    public ConflictoException(String mensaje) {\n        super(mensaje);\n    }\n}<\/pre>\n<pre data-f=\"exception/ManejadorErrores.java\">package com.academia.babel.exception;\n\nimport java.util.Map;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.ExceptionHandler;\nimport org.springframework.web.bind.annotation.RestControllerAdvice;\n\n@RestControllerAdvice\npublic class ManejadorErrores {\n\n    @ExceptionHandler(NoEncontradoException.class)\n    public ResponseEntity&lt;Map&lt;String, String&gt;&gt; noEncontrado(NoEncontradoException e) {\n        return ResponseEntity.status(HttpStatus.NOT_FOUND).body(Map.of(\"mensaje\", e.getMessage()));\n    }\n\n    @ExceptionHandler(ConflictoException.class)\n    public ResponseEntity&lt;Map&lt;String, String&gt;&gt; conflicto(ConflictoException e) {\n        return ResponseEntity.status(HttpStatus.CONFLICT).body(Map.of(\"mensaje\", e.getMessage()));\n    }\n}<\/pre>\n<p>El contrato del servicio solo habla de DTO:<\/p>\n<pre data-f=\"service/IAlumnoService.java\">package com.academia.babel.service;\n\nimport java.util.List;\n\nimport com.academia.babel.dto.AlumnoRequestDTO;\nimport com.academia.babel.dto.AlumnoResponseDTO;\nimport com.academia.babel.dto.MatriculaRequestDTO;\nimport com.academia.babel.enums.Nivel;\n\npublic interface IAlumnoService {\n\n    AlumnoResponseDTO crear(AlumnoRequestDTO dto);\n\n    AlumnoResponseDTO obtenerPorId(Long id);\n\n    List&lt;AlumnoResponseDTO&gt; listarPorNivel(Nivel nivel);\n\n    AlumnoResponseDTO matricular(Long alumnoId, MatriculaRequestDTO dto);\n\n    void eliminar(Long id);\n}<\/pre>\n<p>Y la implementaci\u00f3n. Cada m\u00e9todo que lee relaciones perezosas va con <code>@Transactional(readOnly = true)<\/code>, y la conversi\u00f3n a DTO se hace <b>dentro<\/b> del servicio:<\/p>\n<pre data-f=\"service/impl/AlumnoServiceImpl.java\">package com.academia.babel.service.impl;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport com.academia.babel.dto.AlumnoRequestDTO;\nimport com.academia.babel.dto.AlumnoResponseDTO;\nimport com.academia.babel.dto.MatriculaRequestDTO;\nimport com.academia.babel.dto.MatriculaResumenDTO;\nimport com.academia.babel.entity.Alumno;\nimport com.academia.babel.entity.Curso;\nimport com.academia.babel.entity.Expediente;\nimport com.academia.babel.entity.Matricula;\nimport com.academia.babel.enums.EstadoMatricula;\nimport com.academia.babel.enums.Nivel;\nimport com.academia.babel.exception.ConflictoException;\nimport com.academia.babel.exception.NoEncontradoException;\nimport com.academia.babel.repository.IAlumnoRepository;\nimport com.academia.babel.repository.ICursoRepository;\nimport com.academia.babel.repository.IMatriculaRepository;\nimport com.academia.babel.service.IAlumnoService;\n\n@Service\npublic class AlumnoServiceImpl implements IAlumnoService {\n\n    @Autowired\n    private IAlumnoRepository alumnoRepository;\n\n    @Autowired\n    private ICursoRepository cursoRepository;\n\n    @Autowired\n    private IMatriculaRepository matriculaRepository;\n\n    @Override\n    @Transactional\n    public AlumnoResponseDTO crear(AlumnoRequestDTO dto) {\n        if (alumnoRepository.existsByEmail(dto.email())) {\n            throw new ConflictoException(\"Ya existe un alumno con ese email\");\n        }\n        if (alumnoRepository.existsByExpedienteNumeroMatricula(dto.numeroMatricula())) {\n            throw new ConflictoException(\"Ya existe un alumno con ese n\u00famero de matr\u00edcula\");\n        }\n        // DTO -&gt; Entity: el expediente se crea primero porque el constructor de Alumno lo exige\n        Expediente expediente = new Expediente(dto.numeroMatricula(), dto.nivelInicial(), null);\n        Alumno alumno = new Alumno(dto.nombre(), dto.email(), dto.fechaNacimiento(), expediente);\n        return mapearADTO(alumnoRepository.save(alumno));\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public AlumnoResponseDTO obtenerPorId(Long id) {\n        return mapearADTO(buscarAlumno(id));\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public List&lt;AlumnoResponseDTO&gt; listarPorNivel(Nivel nivel) {\n        List&lt;AlumnoResponseDTO&gt; lista = new ArrayList&lt;&gt;();\n        for (Alumno a : alumnoRepository.findByExpedienteNivelInicial(nivel)) {\n            lista.add(mapearADTO(a));\n        }\n        return lista;\n    }\n\n    @Override\n    @Transactional\n    public AlumnoResponseDTO matricular(Long alumnoId, MatriculaRequestDTO dto) {\n        Alumno alumno = buscarAlumno(alumnoId);\n        Curso curso = cursoRepository.findById(dto.cursoId())\n                .orElseThrow(() -&gt; new NoEncontradoException(\"No existe el curso \" + dto.cursoId()));\n        if (matriculaRepository.existsByAlumnoIdAndCursoIdAndEstado(alumnoId, dto.cursoId(), EstadoMatricula.ACTIVA)) {\n            throw new ConflictoException(\"El alumno ya tiene una matr\u00edcula activa en ese curso\");\n        }\n        Matricula matricula = new Matricula(curso, dto.fecha(), EstadoMatricula.ACTIVA, false);\n        alumno.addMatricula(matricula);\n        matriculaRepository.save(matricula);\n        return mapearADTO(alumno);\n    }\n\n    @Override\n    @Transactional\n    public void eliminar(Long id) {\n        Alumno alumno = buscarAlumno(id);\n        if (matriculaRepository.countByAlumnoIdAndEstado(id, EstadoMatricula.ACTIVA) &gt; 0) {\n            throw new ConflictoException(\"El alumno tiene matr\u00edculas activas\");\n        }\n        alumnoRepository.delete(alumno);   // la cascada borra su expediente y sus matr\u00edculas\n    }\n\n    private Alumno buscarAlumno(Long id) {\n        return alumnoRepository.findById(id)\n                .orElseThrow(() -&gt; new NoEncontradoException(\"No existe el alumno \" + id));\n    }\n\n    // Entity -&gt; DTO (recorre las matr\u00edculas, que son LAZY: por eso se hace dentro de la transacci\u00f3n)\n    private AlumnoResponseDTO mapearADTO(Alumno a) {\n        List&lt;MatriculaResumenDTO&gt; matriculas = new ArrayList&lt;&gt;();\n        for (Matricula m : a.getMatriculas()) {\n            matriculas.add(new MatriculaResumenDTO(m.getCurso().getTitulo(), m.getFecha(), m.getEstado(), m.getNota()));\n        }\n        return new AlumnoResponseDTO(a.getId(), a.getNombre(), a.getEmail(),\n                a.getExpediente().getNumeroMatricula(), a.getExpediente().getNivelInicial(), matriculas);\n    }\n}<\/pre>\n<p><b>C\u00f3mo comunica cada resultado:<\/b> el email repetido y la matr\u00edcula activa repetida lanzan <code>ConflictoException<\/code> (409); el alumno o el curso que no existen lanzan <code>NoEncontradoException<\/code> (404); borrar con matr\u00edculas activas lanza <code>ConflictoException<\/code> (409). Una lista vac\u00eda no es error: se devuelve vac\u00eda (200).<\/p>\n\n<p class=\"paso\"><b>20.<\/b> <b>El controlador.<\/b> Solo conoce el <code>IAlumnoService<\/code> y los DTO. No tiene l\u00f3gica ni <code>try/catch<\/code>: las excepciones las recoge el <code>@RestControllerAdvice<\/code>.<\/p>\n<pre data-f=\"controller/AlumnoController.java\">package com.academia.babel.controller;\n\nimport java.net.URI;\nimport java.util.List;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RequestParam;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.servlet.support.ServletUriComponentsBuilder;\n\nimport com.academia.babel.dto.AlumnoRequestDTO;\nimport com.academia.babel.dto.AlumnoResponseDTO;\nimport com.academia.babel.dto.MatriculaRequestDTO;\nimport com.academia.babel.enums.Nivel;\nimport com.academia.babel.service.IAlumnoService;\n\nimport jakarta.validation.Valid;\n\n@RestController\n@RequestMapping(\"/api/alumnos\")\npublic class AlumnoController {\n\n    @Autowired\n    private IAlumnoService alumnoService;\n\n    // POST /api/alumnos -&gt; 201 + Location | 400 (@Valid) | 409 (email o matr\u00edcula repetidos)\n    @PostMapping\n    public ResponseEntity&lt;AlumnoResponseDTO&gt; crear(@Valid @RequestBody AlumnoRequestDTO dto) {\n        AlumnoResponseDTO creado = alumnoService.crear(dto);\n        URI location = ServletUriComponentsBuilder.fromCurrentRequest()\n                .path(\"/{id}\").buildAndExpand(creado.id()).toUri();\n        return ResponseEntity.created(location).body(creado);\n    }\n\n    // GET /api/alumnos/{id} -&gt; 200 | 404\n    @GetMapping(\"/{id}\")\n    public ResponseEntity&lt;AlumnoResponseDTO&gt; obtener(@PathVariable Long id) {\n        return ResponseEntity.ok(alumnoService.obtenerPorId(id));\n    }\n\n    // GET /api/alumnos?nivel=B1 -&gt; 200 (lista, puede estar vac\u00eda) | 400 si falta o no es un nivel v\u00e1lido\n    @GetMapping\n    public ResponseEntity&lt;List&lt;AlumnoResponseDTO&gt;&gt; listarPorNivel(@RequestParam Nivel nivel) {\n        return ResponseEntity.ok(alumnoService.listarPorNivel(nivel));\n    }\n\n    // POST /api/alumnos/{id}/matriculas -&gt; 201 | 400 | 404 (alumno o curso) | 409 (ya matriculado)\n    @PostMapping(\"/{id}/matriculas\")\n    public ResponseEntity&lt;AlumnoResponseDTO&gt; matricular(@PathVariable Long id,\n            @Valid @RequestBody MatriculaRequestDTO dto) {\n        return ResponseEntity.status(HttpStatus.CREATED).body(alumnoService.matricular(id, dto));\n    }\n\n    // DELETE /api/alumnos/{id} -&gt; 204 | 404 | 409 (matr\u00edculas activas)\n    @DeleteMapping(\"/{id}\")\n    public ResponseEntity&lt;Void&gt; eliminar(@PathVariable Long id) {\n        alumnoService.eliminar(id);\n        return ResponseEntity.noContent().build();\n    }\n}<\/pre>\n<table>\n<tr><th>Endpoint<\/th><th>\u00c9xito<\/th><th>Errores<\/th><\/tr>\n<tr><td><code>POST /api/alumnos<\/code><\/td><td><b>201<\/b> y <code>Location<\/code><\/td><td><b>400<\/b> datos inv\u00e1lidos \u00b7 <b>409<\/b> email o matr\u00edcula ya existentes<\/td><\/tr>\n<tr><td><code>GET /api/alumnos/{id}<\/code><\/td><td><b>200<\/b><\/td><td><b>404<\/b><\/td><\/tr>\n<tr><td><code>GET /api/alumnos?nivel=<\/code><\/td><td><b>200<\/b> (puede ser lista vac\u00eda)<\/td><td><b>400<\/b> si el nivel falta o no existe<\/td><\/tr>\n<tr><td><code>POST /api/alumnos/{id}/matriculas<\/code><\/td><td><b>201<\/b><\/td><td><b>400<\/b> cuerpo inv\u00e1lido \u00b7 <b>404<\/b> alumno o curso inexistente \u00b7 <b>409<\/b> ya tiene esa matr\u00edcula activa<\/td><\/tr>\n<tr><td><code>DELETE /api/alumnos/{id}<\/code><\/td><td><b>204<\/b><\/td><td><b>404<\/b> \u00b7 <b>409<\/b> si tiene matr\u00edculas activas<\/td><\/tr>\n<\/table>\n\n<p class=\"paso\"><b>21.<\/b> <b>Postman.<\/b> En todas las peticiones con cuerpo: pesta\u00f1a <b>Body<\/b> \u2192 <b>raw<\/b> \u2192 desplegable <b>JSON<\/b>. Si te olvidas y lo dejas en <i>Text<\/i>, no viaja <code>Content-Type: application/json<\/code> y el servidor responde <b>415<\/b>.<\/p>\n<ul>\n<li><b>a)<\/b> Crear un alumno (<code>POST /api/alumnos<\/code>). Las claves son los campos del <code>record<\/code>, con el mismo nombre; no hay <code>id<\/code> (lo pone MySQL) ni objeto \u00abexpediente\u00bb (el DTO es plano; el servicio lo crea); la fecha va como texto <code>yyyy-MM-dd<\/code> y el nivel como el texto exacto del enum:\n<pre data-f=\"Body de POST /api/alumnos\">{\n    \"nombre\": \"Irene Soto\",\n    \"email\": \"irene@mail.com\",\n    \"fechaNacimiento\": \"2002-07-21\",\n    \"numeroMatricula\": \"AL-0005\",\n    \"nivelInicial\": \"B1\"\n}<\/pre><\/li>\n<li><b>b)<\/b> Un <b>400<\/b> por el email (no tiene formato de correo) y otro por el n\u00famero de matr\u00edcula (no cumple el patr\u00f3n <code>AL-<\/code> y 4 cifras):\n<pre data-f=\"400 por el email\">{\n    \"nombre\": \"Irene Soto\",\n    \"email\": \"esto-no-es-un-email\",\n    \"fechaNacimiento\": \"2002-07-21\",\n    \"numeroMatricula\": \"AL-0006\",\n    \"nivelInicial\": \"B1\"\n}<\/pre>\n<pre data-f=\"400 por el n\u00famero de matr\u00edcula\">{\n    \"nombre\": \"Irene Soto\",\n    \"email\": \"otra@mail.com\",\n    \"fechaNacimiento\": \"2002-07-21\",\n    \"numeroMatricula\": \"AL-12\",\n    \"nivelInicial\": \"B1\"\n}<\/pre><\/li>\n<li><b>c)<\/b> Matricular (<code>POST /api/alumnos/1/matriculas<\/code>). El alumno va en la direcci\u00f3n y el curso, en el cuerpo:\n<pre data-f=\"Body de POST /api/alumnos/1/matriculas\">{\n    \"cursoId\": 3,\n    \"fecha\": \"2026-11-20\"\n}<\/pre><\/li>\n<li><b>d)<\/b> Lo que hay que marcar es <b>Body \u2192 raw \u2192 JSON<\/b>. Sin eso, el error es <b>415 Unsupported Media Type<\/b>.<\/li>\n<\/ul>\n\n<h3>Parte 5: preguntas de comprensi\u00f3n<\/h3>\n\n<p class=\"paso\"><b>22.<\/b> <b>LazyInitializationException.<\/b> Ocurre al leer una relaci\u00f3n <code>LAZY<\/code> (aqu\u00ed, las matr\u00edculas del alumno o el curso de cada matr\u00edcula) <b>cuando la sesi\u00f3n de Hibernate ya se ha cerrado<\/b>: por ejemplo, si el servicio devuelve la entidad y es el controlador quien intenta recorrerla. Se evita convirtiendo a DTO <b>dentro<\/b> del servicio y anot\u00e1ndolo con <code>@Transactional<\/code> (<code>readOnly = true<\/code> si solo lee), para que la sesi\u00f3n siga abierta mientras se recorren las relaciones.<\/p>\n\n<p class=\"paso\"><b>23.<\/b> <b>El problema N+1.<\/b> Una consulta trae los 50 alumnos y despu\u00e9s, al recorrer las matr\u00edculas de cada uno, Hibernate lanza <b>otra consulta por alumno<\/b> (y otra m\u00e1s por cada curso): 1 + N. Dos soluciones: un <code>JOIN FETCH<\/code> en la consulta, o <code>@EntityGraph<\/code> sobre el m\u00e9todo del repositorio. Por ejemplo:<\/p>\n<pre data-f=\"repository/IAlumnoRepository.java (soluci\u00f3n al N+1)\">@Query(\"SELECT DISTINCT a FROM Alumno a \"\n     + \"LEFT JOIN FETCH a.matriculas m LEFT JOIN FETCH m.curso \"\n     + \"JOIN FETCH a.expediente\")\nList&lt;Alumno&gt; listarConMatriculas();\n\n@EntityGraph(attributePaths = {\"expediente\", \"matriculas\", \"matriculas.curso\"})\nList&lt;Alumno&gt; findByExpedienteNivelInicial(Nivel nivel);<\/pre>\n\n<p class=\"paso\"><b>24.<\/b> <b>El constructor de <code>Alumno<\/code> exige el expediente.<\/b> La relaci\u00f3n es obligatoria: un alumno sin expediente no puede guardarse. Si se asignara despu\u00e9s con un <i>setter<\/i>, nada impedir\u00eda olvidarlo, y el fallo solo aparecer\u00eda al ejecutar y guardar (con un error de base de datos). Con el constructor, el compilador no deja crear un alumno incompleto: el error sale antes, y en rojo, en el editor. El constructor vac\u00edo existe solo porque JPA lo necesita al leer filas.<\/p>\n\n<p class=\"paso\"><b>25.<\/b> <b>Borrar una academia con profesores.<\/b> El 500 viene de la base de datos (violaci\u00f3n de clave for\u00e1nea: los profesores siguen apuntando a ella). Deber\u00eda devolver <b>409 Conflict<\/b>. Falta la comprobaci\u00f3n previa en el servicio, igual que con las matr\u00edculas activas:<\/p>\n<pre data-f=\"AcademiaServiceImpl.eliminar (idea)\">if (profesorRepository.countByAcademiaId(id) &gt; 0) {\n    throw new ConflictoException(\"La academia tiene profesores\");\n}\nacademiaRepository.deleteById(id);<\/pre>\n\n<p class=\"paso\"><b>26.<\/b> <b>El esquema de tablas.<\/b> Las claves for\u00e1neas (FK) est\u00e1n siempre en el lado propietario:<\/p>\n<pre data-f=\"esquema de tablas\">academias    (id_academia PK, nombre, ciudad)\nprofesores   (id_profesor PK, nombre, salario_hora, idioma, activo,\n              id_academia FK -&gt; academias)                    1:N\nexpedientes  (id_expediente PK, numero_matricula UNIQUE, nivel_inicial, observaciones)\nalumnos      (id_alumno PK, nombre, email UNIQUE, fecha_nacimiento,\n              id_expediente FK UNIQUE -&gt; expedientes)          1:1\ncursos       (id_curso PK, titulo, idioma, nivel, precio)\nmatriculas   (id_matricula PK, fecha, nota, estado, pagada,\n              id_alumno FK -&gt; alumnos,                         N:M con datos:\n              id_curso  FK -&gt; cursos)                          dos 1:N hacia Matricula<\/pre>\n<div class=\"why\"><b>C\u00f3mo corregirte.<\/b> Parte 1 (3 puntos): enums, columnas y restricciones bien, la FK en <code>Profesor<\/code>, <code>mappedBy<\/code> en <code>Academia<\/code>, el constructor de <code>Alumno<\/code> con el expediente y <code>Matricula<\/code> con sus dos <code>@ManyToOne<\/code>. Parte 4 (3 puntos): los DTO con sus validaciones, la conversi\u00f3n solo en el servicio, el controlador sin l\u00f3gica y los c\u00f3digos 201, 200, 204, 400, 404 y 409 bien elegidos. Si fallaste en lo de las relaciones, repasa los pasos 11 a 13; si fue en la API, los pasos 18 y 19.<\/div>\n  <nav class=\"nav pie\"><a href=\"#ejercicio-1\">\u2190 Volver al enunciado<\/a> <a href=\"#\">\u2190 Todos los ejercicios<\/a><\/nav>\n<\/section>\n\n<section class=\"panel\" id=\"ejercicio-2\">\n  <nav class=\"nav\"><a href=\"#\">\u2190 Todos los ejercicios<\/a> <a href=\"#solucion-2\">Ir al solucionario \u2192<\/a><\/nav>\n  <header><p class=\"n\">EJERCICIO 2 \u00b7 ENUNCIADO<\/p><h2>El hospital \u00abSan Gabriel\u00bb<\/h2><\/header>\n<p>Un examen de pr\u00e1ctica completo. Haz el proyecto <b>sin mirar la soluci\u00f3n<\/b> y, cuando termines, compara. Todo lo que no diga el enunciado, dec\u00eddelo t\u00fa y justif\u00edcalo.<\/p>\n\n<table>\n<tr><th>Ficha del ejercicio<\/th><th><\/th><\/tr>\n<tr><td>Proyecto<\/td><td>Spring Boot + Spring Data JPA + MySQL<\/td><\/tr>\n<tr><td>Paquete base<\/td><td><code>com.hospital.examen<\/code>, con los subpaquetes <code>entity<\/code>, <code>enums<\/code>, <code>repository<\/code>, <code>dto<\/code>, <code>service<\/code> y <code>controller<\/code><\/td><\/tr>\n<tr><td>Puntuaci\u00f3n<\/td><td>Parte 1: 3 \u00b7 Parte 2: 1,5 \u00b7 Parte 3: 1 \u00b7 Parte 4: 3 \u00b7 Parte 5: 1,5<\/td><\/tr>\n<\/table>\n\n<h3>Parte 1: entidades y relaciones (3 puntos)<\/h3>\n<p class=\"paso\"><b>1.<\/b> Crea el enum <code>Especialidad<\/code> con los valores <code>CARDIOLOGIA<\/code>, <code>PEDIATRIA<\/code>, <code>TRAUMATOLOGIA<\/code> y <code>NEUROLOGIA<\/code>. Crea tambi\u00e9n el enum <code>TipoConsulta<\/code> con <code>PRESENCIAL<\/code>, <code>URGENCIA<\/code> y <code>TELEMATICA<\/code>.<\/p>\n<p class=\"paso\"><b>2.<\/b> Crea la entidad <code>Hospital<\/code>, con tabla <code>hospitales<\/code>:<\/p>\n<ul>\n<li><code>id<\/code> (clave autogenerada, columna <code>id_hospital<\/code>)<\/li>\n<li><code>nombre<\/code> (obligatorio, m\u00e1ximo 80 caracteres)<\/li>\n<li><code>ciudad<\/code> (obligatoria)<\/li>\n<\/ul>\n<p class=\"paso\"><b>3.<\/b> Crea la entidad <code>Medico<\/code>, con tabla <code>medicos<\/code>:<\/p>\n<ul>\n<li><code>id<\/code> (clave autogenerada, columna <code>id_medico<\/code>)<\/li>\n<li><code>nombre<\/code> (obligatorio)<\/li>\n<li><co
