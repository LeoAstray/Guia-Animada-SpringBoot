e\" data-f=\"entity/Editorial.java\">package edu.rico.biblioteca.entity;\n\nimport jakarta.persistence.*;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\n@Entity\n@Table(name = \"editorial\")\npublic class Editorial {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, length = 100)\n    private String nombre;\n\n    @Column(nullable = false, length = 60)\n    private String pais;\n\n    // Relaci\u00f3n 1:N inversa (no lleva CascadeType.REMOVE para proteger los libros)\n    @OneToMany(mappedBy = \"editorial\")\n    private List&lt;Libro&gt; libros = new ArrayList&lt;&gt;();\n\n    public Editorial() {\n    }\n\n    public Editorial(String nombre, String pais) {\n        this.nombre = nombre;\n        this.pais = pais;\n    }\n\n    public Long getId() { return id; }\n    public void setId(Long id) { this.id = id; }\n    public String getNombre() { return nombre; }\n    public void setNombre(String nombre) { this.nombre = nombre; }\n    public String getPais() { return pais; }\n    public void setPais(String pais) { this.pais = pais; }\n    public List&lt;Libro&gt; getLibros() { return libros; }\n    public void setLibros(List&lt;Libro&gt; libros) { this.libros = libros; }\n}<\/pre><\/details>\n<details><summary>Autor.java: lado inverso del N:M<\/summary>\n<pre class=\"code\" data-f=\"entity/Autor.java\">package edu.rico.biblioteca.entity;\n\nimport jakarta.persistence.*;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\n@Entity\n@Table(name = \"autor\")\npublic class Autor {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, length = 100)\n    private String nombre;\n\n    @Column(nullable = false, length = 60)\n    private String nacionalidad;\n\n    // Lado inverso de la relaci\u00f3n N:M\n    @ManyToMany(mappedBy = \"autores\")\n    private Set&lt;Libro&gt; libros = new HashSet&lt;&gt;();\n\n    public Autor() {\n    }\n\n    public Autor(String nombre, String nacionalidad) {\n        this.nombre = nombre;\n        this.nacionalidad = nacionalidad;\n    }\n\n    public Long getId() { return id; }\n    public void setId(Long id) { this.id = id; }\n    public String getNombre() { return nombre; }\n    public void setNombre(String nombre) { this.nombre = nombre; }\n    public String getNacionalidad() { return nacionalidad; }\n    public void setNacionalidad(String nacionalidad) { this.nacionalidad = nacionalidad; }\n    public Set&lt;Libro&gt; getLibros() { return libros; }\n    public void setLibros(Set&lt;Libro&gt; libros) { this.libros = libros; }\n\n    // El Set necesita saber cu\u00e1ndo dos autores son \"el mismo\": por id.\n    @Override\n    public boolean equals(Object o) {\n        return o instanceof Autor other &amp;&amp; id != null &amp;&amp; id.equals(other.id);\n    }\n\n    @Override\n    public int hashCode() {\n        return Autor.class.hashCode();\n    }\n}<\/pre><\/details>\n<details><summary>FichaLibro.java: propietaria del 1:1<\/summary>\n<pre class=\"code\" data-f=\"entity/FichaLibro.java\">package edu.rico.biblioteca.entity;\n\nimport jakarta.persistence.*;\n\n@Entity\n@Table(name = \"ficha_libro\")\npublic class FichaLibro {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, unique = true, length = 20)\n    private String isbn;\n\n    @Column(nullable = false)\n    private int paginas;\n\n    @Column(nullable = false)\n    private int anio;\n\n    // Lado propietario de la relaci\u00f3n 1:1\n    @OneToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"libro_id\", nullable = false, unique = true)\n    private Libro libro;\n\n    public FichaLibro() {\n    }\n\n    public FichaLibro(String isbn, int paginas, int anio) {\n        this.isbn = isbn;\n        this.paginas = paginas;\n        this.anio = anio;\n    }\n\n    public Long getId() { return id; }\n    public void setId(Long id) { this.id = id; }\n    public String getIsbn() { return isbn; }\n    public void setIsbn(String isbn) { this.isbn = isbn; }\n    public int getPaginas() { return paginas; }\n    public void setPaginas(int paginas) { this.paginas = paginas; }\n    public int getAnio() { return anio; }\n    public void setAnio(int anio) { this.anio = anio; }\n    public Libro getLibro() { return libro; }\n    public void setLibro(Libro libro) { this.libro = libro; }\n}<\/pre><\/details>\n\n<table>\n<tr><th>Detalle<\/th><th>Qu\u00e9 explica<\/th><\/tr>\n<tr><td><code>@Column(nullable = false, length = 100)<\/code><\/td><td>La columna es obligatoria y con longitud m\u00e1xima; la BD lo har\u00e1 cumplir.<\/td><\/tr>\n<tr><td><code>unique = true<\/code> en <code>isbn<\/code> y en <code>libro_id<\/code><\/td><td>Un ISBN no se repite, y una ficha pertenece a un \u00fanico libro (eso es lo que hace que sea 1:1).<\/td><\/tr>\n<tr><td><code>@OneToMany(mappedBy = \"editorial\")<\/code><\/td><td>Apunta al <b>atributo Java<\/b> <code>editorial<\/code> de Libro, no a la columna SQL.<\/td><\/tr>\n<tr><td>Constructor vac\u00edo y constructor con datos<\/td><td>El vac\u00edo lo necesita JPA para fabricar objetos al leer; el otro, para crearlos c\u00f3modamente.<\/td><\/tr>\n<tr><td><code>setFicha(...)<\/code> que tambi\u00e9n hace <code>ficha.setLibro(this)<\/code><\/td><td>Mantiene coherentes los dos lados del 1:1, igual que <code>addAutor<\/code> en el N:M.<\/td><\/tr>\n<tr><td><code>equals<\/code> y <code>hashCode<\/code> por <code>id<\/code> en Libro y Autor<\/td><td>Es lo que necesita el <code>Set<\/code> para saber cu\u00e1ndo dos autores son \u00abel mismo\u00bb. No aparecen en las capturas del docx; los a\u00f1ado porque la propia Misi\u00f3n 1 los exige.<\/td><\/tr>\n<\/table>\n<\/section>\n\n<section id=\"s21\">\n<header class=\"opener r3\"><h2>Los repositorios<\/h2><div class=\"set\"><b>023<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<p>Igual que en la Parte 1: interfaces que extienden <code>JpaRepository&lt;Entidad, Long&gt;<\/code> (la convenci\u00f3n de la gu\u00eda es <code>I<\/code> + entidad + <code>Repository<\/code>). Spring escribe la implementaci\u00f3n al arrancar. Solo se a\u00f1aden las b\u00fasquedas nuevas que hacen falta.<\/p>\n<details open><summary>ILibroRepository.java: aqu\u00ed est\u00e1 lo interesante<\/summary>\n<pre class=\"code\" data-f=\"repository/ILibroRepository.java\">package edu.rico.biblioteca.repository;\n\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.repository.query.Param;\n\nimport edu.rico.biblioteca.entity.Libro;\n\npublic interface ILibroRepository extends JpaRepository&lt;Libro, Long&gt; {\n\n    // B\u00fasqueda por FK directa\n    List&lt;Libro&gt; findByEditorialId(Long editorialId);\n\n    // Conteo de libros asignados a una editorial para validar el borrado con 409\n    long countByEditorialId(Long editorialId);\n\n    // Consulta optimizada para evitar problema N+1 al cargar el detalle completo\n    @Query(\"SELECT l FROM Libro l \" +\n            \"LEFT JOIN FETCH l.editorial \" +\n            \"LEFT JOIN FETCH l.ficha \" +\n            \"LEFT JOIN FETCH l.autores \" +\n            \"WHERE l.id = :id\")\n    Optional&lt;Libro&gt; findByIdConRelaciones(@Param(\"id\") Long id);\n}<\/pre><\/details>\n<details><summary>Los otros tres repositorios<\/summary>\n<pre class=\"code\" data-f=\"repository/IEditorialRepository.java\">package edu.rico.biblioteca.repository;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport edu.rico.biblioteca.entity.Editorial;\n\npublic interface IEditorialRepository extends JpaRepository&lt;Editorial, Long&gt; {\n    boolean existsByNombre(String nombre);\n}<\/pre>\n<pre class=\"code\" data-f=\"repository/IAutorRepository.java\">package edu.rico.biblioteca.repository;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport edu.rico.biblioteca.entity.Autor;\n\npublic interface IAutorRepository extends JpaRepository&lt;Autor, Long&gt; {\n}<\/pre>\n<pre class=\"code\" data-f=\"repository/IFichaLibroRepository.java\">package edu.rico.biblioteca.repository;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport edu.rico.biblioteca.entity.FichaLibro;\n\npublic interface IFichaLibroRepository extends JpaRepository&lt;FichaLibro, Long&gt; {\n}<\/pre><\/details>\n\n<table>\n<tr><th>M\u00e9todo<\/th><th>Para qu\u00e9 sirve<\/th><\/tr>\n<tr><td><code>findByEditorialId(Long)<\/code><\/td><td>Consulta derivada: busca libros por <code>editorial.id<\/code>. Spring entiende que <code>editorial<\/code> es un atributo y <code>Id<\/code> su identificador. Se usa en <code>GET /api/libros?editorialId=<\/code>.<\/td><\/tr>\n<tr><td><code>countByEditorialId(Long)<\/code><\/td><td>Cuenta cu\u00e1ntos libros tiene una editorial. Se usa para decidir el <b>409<\/b> al borrarla.<\/td><\/tr>\n<tr><td><code>findByIdConRelaciones(id)<\/code><\/td><td>Consulta JPQL con <code>LEFT JOIN FETCH<\/code>: trae el libro, su editorial, su ficha y sus autores <b>en una sola consulta<\/b>. Soluciona el problema N+1 en el detalle.<\/td><\/tr>\n<tr><td><code>existsByNombre(String)<\/code><\/td><td>Comprueba si ya hay una editorial con ese nombre (queda disponible; el ejercicio no la usa todav\u00eda).<\/td><\/tr>\n<\/table>\n\n<h3>El problema N+1 y su soluci\u00f3n<\/h3>\n<figure class=\"fig\">\n<svg viewBox=\"0 0 860 220\" xmlns=\"http://www.w3.org/2000/svg\" text-anchor=\"middle\">\n  <rect x=\"20\" y=\"20\" width=\"400\" height=\"180\" rx=\"14\" fill=\"#f8e2de\" stroke=\"#b23a2b\" stroke-width=\"3\"/>\n  <text x=\"220\" y=\"50\" font-size=\"15\" font-weight=\"700\" fill=\"#b23a2b\">Sin arreglo: 51 viajes<\/text>\n  <use href=\"#i-walk\" class=\"ic\" x=\"70\" y=\"62\" width=\"28\" height=\"28\"/><text x=\"118\" y=\"86\" font-size=\"20\">\u2192<\/text><use href=\"#i-school\" class=\"ic\" x=\"132\" y=\"62\" width=\"28\" height=\"28\"/><text x=\"245\" y=\"86\" font-size=\"15\">\u2192 \u00ab\u00bfqui\u00e9nes son?\u00bb<\/text>\n  <text x=\"220\" y=\"120\" font-size=\"14\">y luego, por cada ni\u00f1o:<\/text>\n  <use href=\"#i-walk\" class=\"ic\" x=\"60\" y=\"130\" width=\"24\" height=\"24\"/><use href=\"#i-school\" class=\"ic\" x=\"84\" y=\"130\" width=\"24\" height=\"24\"/><use href=\"#i-walk\" class=\"ic\" x=\"122\" y=\"130\" width=\"24\" height=\"24\"/><use href=\"#i-school\" class=\"ic\" x=\"146\" y=\"130\" width=\"24\" height=\"24\"/><use href=\"#i-walk\" class=\"ic\" x=\"184\" y=\"130\" width=\"24\" height=\"24\"/><use href=\"#i-school\" class=\"ic\" x=\"208\" y=\"130\" width=\"24\" height=\"24\"/><use href=\"#i-walk\" class=\"ic\" x=\"246\" y=\"130\" width=\"24\" height=\"24\"/><use href=\"#i-school\" class=\"ic\" x=\"270\" y=\"130\" width=\"24\" height=\"24\"/><text x=\"335\" y=\"150\" font-size=\"16\">\u2026 \u00d750<\/text>\n  <text x=\"220\" y=\"185\" font-size=\"12\" fill=\"#4f5d68\">\u00ab\u00bfy tus amigos?\u00bb \u00ab\u00bfy los tuyos?\u00bb \u00ab\u00bfy los tuyos?\u00bb\u2026<\/text>\n  <rect x=\"440\" y=\"20\" width=\"400\" height=\"180\" rx=\"14\" fill=\"#e0f1e7\" stroke=\"#2e7d4f\" stroke-width=\"3\"/>\n  <text x=\"640\" y=\"50\" font-size=\"15\" font-weight=\"700\" fill=\"#1f6a40\">Con @EntityGraph / JOIN FETCH: 1 viaje<\/text>\n  <use href=\"#i-walk\" class=\"ic\" x=\"495\" y=\"76\" width=\"28\" height=\"28\"/><text x=\"540\" y=\"100\" font-size=\"20\">\u2192<\/text><use href=\"#i-school\" class=\"ic\" x=\"553\" y=\"76\" width=\"28\" height=\"28\"/><text x=\"598\" y=\"100\" font-size=\"20\">\u2192<\/text><use href=\"#i-bag\" class=\"ic g\" x=\"612\" y=\"76\" width=\"28\" height=\"28\"/><use href=\"#i-bag\" class=\"ic g\" x=\"642\" y=\"76\" width=\"28\" height=\"28\"/><use href=\"#i-bag\" class=\"ic g\" x=\"672\" y=\"76\" width=\"28\" height=\"28\"/><use href=\"#i-bag\" class=\"ic g\" x=\"702\" y=\"76\" width=\"28\" height=\"28\"/><use href=\"#i-bag\" class=\"ic g\" x=\"732\" y=\"76\" width=\"28\" height=\"28\"/>\n  <text x=\"640\" y=\"140\" font-size=\"14\">\u00abDame todos los ni\u00f1os con sus amigos,<\/text>\n  <text x=\"640\" y=\"162\" font-size=\"14\">todo de una vez, por favor\u00bb<\/text>\n<\/svg>\n<figcaption>N+1<\/figcaption>\n<\/figure>\n<p>Si consultas 50 libros y, en un bucle, accedes a la editorial o a los autores de cada uno, Hibernate lanza <b>1 consulta<\/b> para los libros m\u00e1s <b>50 consultas<\/b> individuales. La soluci\u00f3n es pedirlo todo junto: <code>JOIN FETCH<\/code> en la consulta (como aqu\u00ed) o <code>@EntityGraph<\/code> sobre el m\u00e9todo.<\/p>\n<div class=\"kid\">Sin arreglo: vas a por 50 ni\u00f1os y luego preguntas 50 veces \u00ab\u00bfy sus amigos?\u00bb. Con <code>JOIN FETCH<\/code>: \u00abdame los ni\u00f1os con sus amigos, todo de una vez, por favor\u00bb.<\/div>\n<div class=\"why\"><code>JOIN FETCH<\/code> y <code>@EntityGraph<\/code> consiguen lo mismo. En <code>@Query<\/code> escribes la consulta a mano; con <code>@EntityGraph(attributePaths = {\"editorial\", \"autores\"})<\/code> solo anotas el m\u00e9todo y Spring hace el JOIN.<\/div>\n<\/section>\n\n<section id=\"s22\">\n<header class=\"opener r3\"><h2>Misi\u00f3n 2: los DTO como contrato de la API<\/h2><div class=\"set\"><b>024<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<p>El cliente <b>nunca<\/b> ve una Entity ni sabe que existe JPA. Cada DTO responde a una pregunta: <b>\u00bfqu\u00e9 necesita el cliente para esta operaci\u00f3n?<\/b> Se crean como <code>record<\/code>, sin ninguna librer\u00eda externa, y se dividen en entrada, salida y res\u00famenes.<\/p>\n<figure class=\"fig\">\n<svg viewBox=\"0 0 860 200\" xmlns=\"http://www.w3.org/2000/svg\" text-anchor=\"middle\">\n  <rect x=\"20\" y=\"30\" width=\"230\" height=\"140\" rx=\"14\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"3\"/>\n  <text x=\"135\" y=\"60\" font-size=\"15\" font-weight=\"700\">Cliente<\/text>\n  <text x=\"135\" y=\"95\" font-size=\"13\">env\u00eda <b>RequestDTO<\/b><\/text><text x=\"135\" y=\"118\" font-size=\"12\" fill=\"#4f5d68\">(solo ids y datos)<\/text>\n  <text x=\"135\" y=\"150\" font-size=\"13\">recibe <b>ResponseDTO<\/b><\/text>\n  <rect x=\"320\" y=\"30\" width=\"230\" height=\"140\" rx=\"14\" fill=\"#e0f1e7\" stroke=\"#2e7d4f\" stroke-width=\"3\"/>\n  <text x=\"435\" y=\"60\" font-size=\"15\" font-weight=\"700\">Service<\/text>\n  <text x=\"435\" y=\"95\" font-size=\"13\">convierte<\/text><text x=\"435\" y=\"118\" font-size=\"12\" fill=\"#4f5d68\">DTO \u21c4 Entity<\/text>\n  <text x=\"435\" y=\"150\" font-size=\"12\" fill=\"#4f5d68\">(\u00fanico que conoce ambos)<\/text>\n  <rect x=\"620\" y=\"30\" width=\"220\" height=\"140\" rx=\"14\" fill=\"#e8edf1\" stroke=\"#536171\" stroke-width=\"3\"/>\n  <text x=\"730\" y=\"60\" font-size=\"15\" font-weight=\"700\">Repository<\/text>\n  <text x=\"730\" y=\"95\" font-size=\"13\">solo <b>Entities<\/b><\/text><text x=\"730\" y=\"118\" font-size=\"12\" fill=\"#4f5d68\">nunca DTO<\/text>\n  <g stroke=\"#14212b\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"><line pathLength=\"1\" class=\"ld\" x1=\"250\" y1=\"100\" x2=\"318\" y2=\"100\"/><line pathLength=\"1\" class=\"ld\" x1=\"550\" y1=\"100\" x2=\"618\" y2=\"100\"/><\/g>\n<\/svg>\n<figcaption>Qui\u00e9n habla con qui\u00e9n<\/figcaption>\n<\/figure>\n<table>\n<tr><th>DTO<\/th><th>Direcci\u00f3n<\/th><th>Contenido<\/th><\/tr>\n<tr><td><code>EditorialRequestDTO<\/code> y <code>EditorialResponseDTO<\/code><\/td><td>entrada y salida<\/td><td>nombre, pa\u00eds (y el id en la respuesta)<\/td><\/tr>\n<tr><td><code>AutorRequestDTO<\/code> y <code>AutorResponseDTO<\/code><\/td><td>entrada y salida<\/td><td>nombre, nacionalidad; la respuesta lleva <code>List&lt;LibroResumenDTO&gt;<\/code><\/td><\/tr>\n<tr><td><code>LibroRequestDTO<\/code><\/td><td>entrada<\/td><td>t\u00edtulo, <b><code>editorialId<\/code><\/b>, <b><code>autoresIds<\/code><\/b>, ficha<\/td><\/tr>\n<tr><td><code>LibroResponseDTO<\/code><\/td><td>salida<\/td><td>id, t\u00edtulo, <code>EditorialResumenDTO<\/code>, <code>List&lt;AutorResumenDTO&gt;<\/code>, ficha<\/td><\/tr>\n<tr><td><code>FichaLibroDTO<\/code><\/td><td>entrada y salida<\/td><td>isbn, paginas, anio<\/td><\/tr>\n<tr><td><code>*ResumenDTO<\/code><\/td><td>salida anidada<\/td><td>solo <code>id<\/code> y nombre o t\u00edtulo. Rompen los bucles.<\/td><\/tr>\n<\/table>\n\n<h3>Pregunta 1: \u00bfpor qu\u00e9 <code>LibroRequestDTO<\/code> recibe identificadores y no entidades completas?<\/h3>\n<p>Porque el cliente web no gestiona objetos persistentes de Hibernate: solo conoce las claves primarias de los recursos existentes. Adem\u00e1s evitamos que el cliente intente modificar datos de la editorial o de los autores a trav\u00e9s del endpoint de creaci\u00f3n de un libro. El servidor es quien busca los objetos reales.<\/p>\n<div class=\"kid\">En el cole dices \u00abquiero el libro n\u00famero 5\u00bb, no traes el libro a cuestas.<\/div>\n\n<h3>Pregunta 2: \u00bfc\u00f3mo evitamos la recursi\u00f3n infinita con los <code>*ResumenDTO<\/code>?<\/h3>\n<figure class=\"fig\">\n<svg viewBox=\"0 0 800 170\" xmlns=\"http://www.w3.org/2000/svg\" text-anchor=\"middle\">\n  <g font-size=\"13\" font-weight=\"700\">\n    <rect x=\"30\" y=\"50\" width=\"120\" height=\"50\" rx=\"10\" fill=\"#e8edf1\" stroke=\"#536171\" stroke-width=\"3\"/><text x=\"90\" y=\"80\">Autor<\/text>\n    <rect x=\"250\" y=\"50\" width=\"120\" height=\"50\" rx=\"10\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"3\"/><text x=\"310\" y=\"80\">Libro<\/text>\n    <rect x=\"470\" y=\"50\" width=\"120\" height=\"50\" rx=\"10\" fill=\"#e8edf1\" stroke=\"#536171\" stroke-width=\"3\"/><text x=\"530\" y=\"80\">Autor<\/text>\n    <rect x=\"690\" y=\"50\" width=\"100\" height=\"50\" rx=\"10\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"3\"/><text x=\"740\" y=\"80\">Libro\u2026<\/text>\n  <\/g>\n  <g stroke=\"#b23a2b\" stroke-width=\"3\" marker-end=\"url(#ar3)\"><line pathLength=\"1\" class=\"ld\" x1=\"150\" y1=\"75\" x2=\"248\" y2=\"75\"/><line pathLength=\"1\" class=\"ld\" x1=\"370\" y1=\"75\" x2=\"468\" y2=\"75\"/><line pathLength=\"1\" class=\"ld\" x1=\"590\" y1=\"75\" x2=\"688\" y2=\"75\"/><\/g>\n  <defs><marker id=\"ar3\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#b23a2b\"/><\/marker><\/defs>\n  <text x=\"400\" y=\"140\" font-size=\"14\" fill=\"#b23a2b\" font-weight=\"700\">StackOverflowError \u2014 dos espejos enfrentados<\/text>\n  <text x=\"400\" y=\"30\" font-size=\"13\" fill=\"#14212b\">El ResumenDTO pone un cart\u00f3n en medio: solo id + nombre, sin lista de vuelta.<\/text>\n<\/svg>\n<figcaption>Por qu\u00e9 existen los *ResumenDTO<\/figcaption>\n<\/figure>\n<p>Al serializar un Autor <b>no<\/b> incluimos el \u00e1rbol completo de sus libros con sus editoriales y otros autores. En su lugar incluimos un <code>LibroResumenDTO<\/code> que contiene \u00fanicamente <code>id<\/code> y <code>titulo<\/code>. Eso rompe la cadena de serializaci\u00f3n de ra\u00edz.<\/p>\n\n<h3>Los records, en su primera versi\u00f3n (sin validar)<\/h3>\n<pre class=\"code\" data-f=\"dto/  (versi\u00f3n 1, tal como se crean al principio)\">public record EditorialResumenDTO(Long id, String nombre) {}\npublic record AutorResumenDTO(Long id, String nombre) {}\npublic record LibroResumenDTO(Long id, String titulo) {}\n\npublic record FichaLibroDTO(String isbn, int paginas, int anio) {}\n\npublic record EditorialRequestDTO(String nombre, String pais) {}\npublic record EditorialResponseDTO(Long id, String nombre, String pais) {}\n\npublic record AutorRequestDTO(String nombre, String nacionalidad) {}\npublic record AutorResponseDTO(Long id, String nombre, String nacionalidad, List&lt;LibroResumenDTO&gt; libros) {}\n\npublic record LibroRequestDTO(String titulo, Long editorialId, Set&lt;Long&gt; autoresIds, FichaLibroDTO ficha) {}\npublic record LibroResponseDTO(Long id, String titulo, EditorialResumenDTO editorial,\n                               List&lt;AutorResumenDTO&gt; autores, FichaLibroDTO ficha) {}<\/pre>\n<p>La versi\u00f3n final, con las anotaciones de validaci\u00f3n, est\u00e1 en la secci\u00f3n 28.<\/p>\n<\/section>\n\n<section id=\"s23\">\n<header class=\"opener r3\"><h2>Los servicios: interfaces, implementaciones y conversi\u00f3n<\/h2><div class=\"set\"><b>025<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<h3>Las capas y las inyecciones<\/h3>\n<figure class=\"fig\">\n<svg viewBox=\"0 0 900 330\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"13\" text-anchor=\"middle\">\n  <g font-weight=\"600\">\n    <rect x=\"10\" y=\"25\" width=\"180\" height=\"44\" rx=\"6\" fill=\"#dcefee\" stroke=\"#0b6b6b\" stroke-width=\"2\"/><text x=\"100\" y=\"52\">EditorialController<\/text>\n    <rect x=\"235\" y=\"25\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#fbeccf\" stroke=\"#a35b00\" stroke-width=\"2\"/><text x=\"310\" y=\"52\">IEditorialService<\/text>\n    <rect x=\"430\" y=\"25\" width=\"170\" height=\"44\" rx=\"6\" fill=\"#e0f1e7\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"515\" y=\"52\">EditorialServiceImpl<\/text>\n    <rect x=\"660\" y=\"10\" width=\"220\" height=\"30\" rx=\"15\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"2\"/><text x=\"770\" y=\"30\">IEditorialRepository<\/text>\n    <rect x=\"660\" y=\"52\" width=\"220\" height=\"30\" rx=\"15\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"2\"/><text x=\"770\" y=\"72\">ILibroRepository<\/text>\n\n    <rect x=\"10\" y=\"125\" width=\"180\" height=\"44\" rx=\"6\" fill=\"#dcefee\" stroke=\"#0b6b6b\" stroke-width=\"2\"/><text x=\"100\" y=\"152\">AutorController<\/text>\n    <rect x=\"235\" y=\"125\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#fbeccf\" stroke=\"#a35b00\" stroke-width=\"2\"/><text x=\"310\" y=\"152\">IAutorService<\/text>\n    <rect x=\"430\" y=\"125\" width=\"170\" height=\"44\" rx=\"6\" fill=\"#e0f1e7\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"515\" y=\"152\">AutorServiceImpl<\/text>\n    <rect x=\"660\" y=\"125\" width=\"220\" height=\"30\" rx=\"15\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"2\"/><text x=\"770\" y=\"145\">IAutorRepository<\/text>\n\n    <rect x=\"10\" y=\"232\" width=\"180\" height=\"44\" rx=\"6\" fill=\"#dcefee\" stroke=\"#0b6b6b\" stroke-width=\"2\"/><text x=\"100\" y=\"259\">LibroController<\/text>\n    <rect x=\"235\" y=\"232\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#fbeccf\" stroke=\"#a35b00\" stroke-width=\"2\"/><text x=\"310\" y=\"259\">ILibroService<\/text>\n    <rect x=\"430\" y=\"232\" width=\"170\" height=\"44\" rx=\"6\" fill=\"#e0f1e7\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"515\" y=\"259\">LibroServiceImpl<\/text>\n    <rect x=\"660\" y=\"205\" width=\"220\" height=\"30\" rx=\"15\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"2\"/><text x=\"770\" y=\"225\">ILibroRepository<\/text>\n    <rect x=\"660\" y=\"247\" width=\"220\" height=\"30\" rx=\"15\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"2\"/><text x=\"770\" y=\"267\">IEditorialRepository<\/text>\n    <rect x=\"660\" y=\"289\" width=\"220\" height=\"30\" rx=\"15\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"2\"/><text x=\"770\" y=\"309\">IAutorRepository<\/text>\n  <\/g>\n  <g stroke=\"#14212b\" stroke-width=\"2\" marker-end=\"url(#ar)\">\n    <line pathLength=\"1\" class=\"ld\" x1=\"190\" y1=\"47\" x2=\"233\" y2=\"47\"/><line pathLength=\"1\" class=\"ld\" x1=\"190\" y1=\"147\" x2=\"233\" y2=\"147\"/><line pathLength=\"1\" class=\"ld\" x1=\"190\" y1=\"254\" x2=\"233\" y2=\"254\"/>\n    <line pathLength=\"1\" class=\"ld\" x1=\"600\" y1=\"45\" x2=\"658\" y2=\"26\"/><line pathLength=\"1\" class=\"ld\" x1=\"600\" y1=\"52\" x2=\"658\" y2=\"67\"/>\n    <line pathLength=\"1\" class=\"ld\" x1=\"600\" y1=\"147\" x2=\"658\" y2=\"140\"/>\n    <line pathLength=\"1\" class=\"ld\" x1=\"600\" y1=\"244\" x2=\"658\" y2=\"222\"/><line pathLength=\"1\" class=\"ld\" x1=\"600\" y1=\"254\" x2=\"658\" y2=\"262\"/><line pathLength=\"1\" class=\"ld\" x1=\"600\" y1=\"264\" x2=\"658\" y2=\"302\"/>\n  <\/g>\n  <g stroke=\"#14212b\" stroke-width=\"2\" stroke-dasharray=\"5 4\" marker-end=\"url(#ar)\">\n    <line pathLength=\"1\" class=\"ld\" x1=\"428\" y1=\"47\" x2=\"387\" y2=\"47\"/><line pathLength=\"1\" class=\"ld\" x1=\"428\" y1=\"147\" x2=\"387\" y2=\"147\"/><line pathLength=\"1\" class=\"ld\" x1=\"428\" y1=\"254\" x2=\"387\" y2=\"254\"/>\n  <\/g>\n  <g font-size=\"11\" fill=\"#4f5d68\"><text x=\"212\" y=\"40\">@Autowired<\/text><text x=\"212\" y=\"140\">@Autowired<\/text><text x=\"212\" y=\"247\">@Autowired<\/text><text x=\"407\" y=\"40\">implements<\/text><text x=\"407\" y=\"140\">implements<\/text><text x=\"407\" y=\"247\">implements<\/text><\/g>\n<\/svg>\n<figcaption>Cada flecha continua es un @Autowired; la discontinua es implements. Los repositorios de las columnas a la derecha son los que inyecta cada servicio<\/figcaption>\n<\/figure>\n<table>\n<tr><th>Servicio<\/th><th>Repositorios que inyecta<\/th><th>Para qu\u00e9 los necesita<\/th><\/tr>\n<tr><td><code>EditorialServiceImpl<\/code><\/td><td><code>IEditorialRepository<\/code>, <code>ILibroRepository<\/code><\/td><td>Guardar y buscar editoriales, y <b>contar sus libros<\/b> antes de borrar.<\/td><\/tr>\n<tr><td><code>AutorServiceImpl<\/code><\/td><td><code>IAutorRepository<\/code><\/td><td>Guardar autores y recorrer sus libros.<\/td><\/tr>\n<tr><td><code>LibroServiceImpl<\/code><\/td><td><b><code>ILibroRepository<\/code>, <code>IEditorialRepository<\/code>, <code>IAutorRepository<\/code><\/b><\/td><td>Convertir los ids que llegan en entidades reales y asociarlas al libro.<\/td><\/tr>\n<\/table>\n\n<h3>\u00bfPor qu\u00e9 <code>LibroServiceImpl<\/code> inyecta tres repositorios y no llama a <code>IEditorialService<\/code>?<\/h3>\n<p><code>LibroServiceImpl<\/code> necesita transformar claves for\u00e1neas (<code>editorialId<\/code>, <code>autoresIds<\/code>) en <b>instancias de entidades persistentes<\/b> (<code>Editorial<\/code>, <code>Autor<\/code>) para establecer las relaciones en la base de datos. Si llam\u00e1ramos a <code>IEditorialService<\/code>, solo nos entregar\u00eda un <code>EditorialResponseDTO<\/code> (por la regla que proh\u00edbe exponer entidades en los contratos de servicio), y <b>un DTO no puede asociarse a una relaci\u00f3n JPA de Libro<\/b>. Por eso el servicio accede directamente a los repositorios.<\/p>\n<div class=\"kid\">El cocinero necesita el tomate de verdad, no una foto del tomate. Va a la nevera (el repositorio), no al camarero.<\/div>\n\n<h3>El \u00abidioma\u00bb entre el servicio y el controlador<\/h3>\n<p>En esta soluci\u00f3n los servicios no lanzan excepciones para los casos normales: <b>devuelven un valor que cuenta qu\u00e9 pas\u00f3<\/b>, y el controlador lo traduce a un c\u00f3digo HTTP.<\/p>\n<table>\n<tr><th>El servicio devuelve<\/th><th>Significa<\/th><th>El controlador responde<\/th><\/tr>\n<tr><td><code>Optional&lt;DTO&gt;<\/code> con valor<\/td><td>Encontrado o hecho<\/td><td>200<\/td><\/tr>\n<tr><td><code>Optional.empty()<\/code><\/td><td>No existe<\/td><td>404<\/td><\/tr>\n<tr><td><code>int eliminar(...)<\/code>: <b>1<\/b><\/td><td>Borrado con \u00e9xito<\/td><td>204<\/td><\/tr>\n<tr><td><code>int eliminar(...)<\/code>: <b>0<\/b><\/td><td>No existe<\/td><td>404<\/td><\/tr>\n<tr><td><code>int eliminar(...)<\/code>: <b>-1<\/b><\/td><td>Conflicto: la editorial tiene libros<\/td><td>409<\/td><\/tr>\n<tr><td><code>boolean desasociarAutor<\/code><\/td><td><code>true<\/code> hecho, <code>false<\/code> el libro o el autor no existen<\/td><td>204 o 404<\/td><\/tr>\n<tr><td><code>IllegalArgumentException<\/code> (solo en <code>crear<\/code> de Libro)<\/td><td>La editorial o un autor no existen<\/td><td>404 (el controlador la captura)<\/td><\/tr>\n<\/table>\n\n<h3>La pieza central: <code>POST /api/libros<\/code> de principio a fin<\/h3>\n<figure class=\"fig\">\n<svg viewBox=\"0 0 900 260\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"12\" text-anchor=\"middle\">\n  <g font-weight=\"700\">\n    <circle cx=\"40\" cy=\"60\" r=\"26\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"3\"/><use href=\"#i-hand\" class=\"ic\" x=\"27.35\" y=\"46.495\" width=\"25.3\" height=\"25.3\"/><text x=\"40\" y=\"105\">Cliente<\/text>\n    <rect x=\"110\" y=\"30\" width=\"150\" height=\"60\" rx=\"10\" fill=\"#dcefee\" stroke=\"#0b6b6b\" stroke-width=\"3\"/><text x=\"185\" y=\"55\">\u2460 Controller<\/text><text x=\"185\" y=\"73\" font-weight=\"400\">recibe RequestDTO<\/text>\n    <rect x=\"320\" y=\"30\" width=\"270\" height=\"200\" rx=\"10\" fill=\"#e0f1e7\" stroke=\"#2e7d4f\" stroke-width=\"3\"/><text x=\"455\" y=\"52\">\u2461 ServiceImpl (@Transactional \u25b6)<\/text>\n    <rect x=\"640\" y=\"30\" width=\"150\" height=\"60\" rx=\"10\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"3\"/><text x=\"715\" y=\"55\">EditorialRepo<\/text><text x=\"715\" y=\"73\" font-weight=\"400\">findById \u2192 404<\/text>\n    <rect x=\"640\" y=\"110\" width=\"150\" height=\"60\" rx=\"10\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"3\"/><text x=\"715\" y=\"135\">AutorRepo<\/text><text x=\"715\" y=\"153\" font-weight=\"400\">findById \u2192 404<\/text>\n    <rect x=\"640\" y=\"190\" width=\"150\" height=\"50\" rx=\"10\" fill=\"#e1ebf5\" stroke=\"#2c5f8f\" stroke-width=\"3\"/><text x=\"715\" y=\"212\">LibroRepo<\/text><text x=\"715\" y=\"228\" font-weight=\"400\">save \u2192 INSERT<\/text>\n  <\/g>\n  <g font-size=\"12\">\n    <text x=\"455\" y=\"85\">a) busca la editorial<\/text>\n    <text x=\"455\" y=\"110\">b) busca los autores<\/text>\n    <text x=\"455\" y=\"135\">c) monta Libro (addAutor)<\/text>\n    <text x=\"455\" y=\"160\">d) guarda el Libro<\/text>\n    <text x=\"455\" y=\"185\">\u2462 Libro \u2192 ResponseDTO<\/text>\n    <text x=\"455\" y=\"215\" fill=\"#4f5d68\">\u25c0 fin de la transacci\u00f3n<\/text>\n  <\/g>\n  <g stroke=\"#14212b\" stroke-width=\"2\" marker-end=\"url(#ar)\">\n    <line pathLength=\"1\" class=\"ld\" x1=\"68\" y1=\"60\" x2=\"108\" y2=\"60\"/><line pathLength=\"1\" class=\"ld\" x1=\"260\" y1=\"60\" x2=\"318\" y2=\"60\"/>\n    <line pathLength=\"1\" class=\"ld\" x1=\"590\" y1=\"60\" x2=\"638\" y2=\"60\"/><line pathLength=\"1\" class=\"ld\" x1=\"590\" y1=\"140\" x2=\"638\" y2=\"140\"/><line pathLength=\"1\" class=\"ld\" x1=\"590\" y1=\"215\" x2=\"638\" y2=\"215\"/>\n  <\/g>\n  <text x=\"185\" y=\"140\" font-weight=\"700\">\u2463 ResponseEntity<\/text><text x=\"185\" y=\"158\">.created(location)<\/text><text x=\"185\" y=\"176\">.body(dto)<\/text>\n  <text x=\"185\" y=\"205\" font-size=\"15\" font-weight=\"700\" fill=\"#1f6a40\">\u2464 201 Created<\/text>\n  <path d=\"M185 190 Q185 240 60 100\" stroke=\"#1f6a40\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"5 4\" marker-end=\"url(#ar)\"/>\n<\/svg>\n<figcaption>Recorrido de POST /api/libros: del cliente a MySQL y vuelta<\/figcaption>\n<\/figure>\n<p>Se debe poder explicar <b>sin mirar apuntes<\/b>. El servicio resuelve la editorial por su id, resuelve cada autor, crea la ficha t\u00e9cnica, ensambla el <code>Libro<\/code> (con <code>addAutor<\/code> para dejar los dos lados coherentes), lo guarda y lo convierte en <code>LibroResponseDTO<\/code>. El controlador lo devuelve en un <code>ResponseEntity<\/code> con <b>201<\/b> y la cabecera <code>Location<\/code>.<\/p>\n\n<details open><summary>LibroServiceImpl.java y su interfaz<\/summary>\n<pre class=\"code\" data-f=\"service/ILibroService.java\">package edu.rico.biblioteca.service;\n\nimport java.util.List;\nimport java.util.Optional;\n\nimport edu.rico.biblioteca.dto.FichaLibroDTO;\nimport edu.rico.biblioteca.dto.LibroRequestDTO;\nimport edu.rico.biblioteca.dto.LibroResponseDTO;\n\npublic interface ILibroService {\n    LibroResponseDTO crear(LibroRequestDTO dto);\n\n    Optional&lt;LibroResponseDTO&gt; obtenerPorId(Long id);\n\n    Optional&lt;List&lt;LibroResponseDTO&gt;&gt; listarPorEditorial(Long editorialId);\n\n    Optional&lt;LibroResponseDTO&gt; actualizarFicha(Long libroId, FichaLibroDTO fichaDTO);\n\n    Optional&lt;LibroResponseDTO&gt; asociarAutor(Long libroId, Long autorId);\n\n    boolean desasociarAutor(Long libroId, Long autorId);\n}<\/pre>\n<pre class=\"code\" data-f=\"service/impl/LibroServiceImpl.java\">package edu.rico.biblioteca.service.impl;\n\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport edu.rico.biblioteca.dto.AutorResumenDTO;\nimport edu.rico.biblioteca.dto.EditorialResumenDTO;\nimport edu.rico.biblioteca.dto.FichaLibroDTO;\nimport edu.rico.biblioteca.dto.LibroRequestDTO;\nimport edu.rico.biblioteca.dto.LibroResponseDTO;\nimport edu.rico.biblioteca.entity.Autor;\nimport edu.rico.biblioteca.entity.Editorial;\nimport edu.rico.biblioteca.entity.FichaLibro;\nimport edu.rico.biblioteca.entity.Libro;\nimport edu.rico.biblioteca.repository.IAutorRepository;\nimport edu.rico.biblioteca.repository.IEditorialRepository;\nimport edu.rico.biblioteca.repository.ILibroRepository;\nimport edu.rico.biblioteca.service.ILibroService;\n\n@Service\npublic class LibroServiceImpl implements ILibroService {\n\n    @Autowired\n    private ILibroRepository libroRepo;\n\n    @Autowired\n    private IEditorialRepository editorialRepo;\n\n    @Autowired\n    private IAutorRepository autorRepo;\n\n    @Override\n    @Transactional\n    public LibroResponseDTO crear(LibroRequestDTO dto) {\n        // 1. Resolver la Editorial\n        Optional&lt;Editorial&gt; editorialOpt = editorialRepo.findById(dto.editorialId());\n        if (editorialOpt.isEmpty()) {\n            throw new IllegalArgumentException(\"La editorial con ID \" + dto.editorialId() + \" no existe\");\n        }\n\n        Libro libro = new Libro(dto.titulo());\n        libro.setEditorial(editorialOpt.get());\n\n        // 2. Resolver Autores\n        if (dto.autoresIds() != null &amp;&amp; !dto.autoresIds().isEmpty()) {\n            for (Long autorId : dto.autoresIds()) {\n                Optional&lt;Autor&gt; autorOpt = autorRepo.findById(autorId);\n                if (autorOpt.isEmpty()) {\n                    throw new IllegalArgumentException(\"El autor con ID \" + autorId + \" no existe\");\n                }\n                libro.addAutor(autorOpt.get());\n            }\n        }\n\n        // 3. Resolver Ficha T\u00e9cnica (1:1)\n        if (dto.ficha() != null) {\n            FichaLibro ficha = new FichaLibro(dto.ficha().isbn(), dto.ficha().paginas(), dto.ficha().anio());\n            libro.setFicha(ficha);\n        }\n\n        Libro guardado = libroRepo.save(libro);\n        return mapearAResponseDTO(guardado);\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public Optional&lt;LibroResponseDTO&gt; obtenerPorId(Long id) {\n        Optional&lt;Libro&gt; opt = libroRepo.findByIdConRelaciones(id);\n        if (opt.isEmpty()) {\n            return Optional.empty();\n        }\n        return Optional.of(mapearAResponseDTO(opt.get()));\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public Optional&lt;List&lt;LibroResponseDTO&gt;&gt; listarPorEditorial(Long editorialId) {\n        if (!editorialRepo.existsById(editorialId)) {\n            return Optional.empty();\n        }\n\n        List&lt;Libro&gt; libros = libroRepo.findByEditorialId(editorialId);\n        List&lt;LibroResponseDTO&gt; listaDTO = new ArrayList&lt;&gt;();\n        for (Libro l : libros) {\n            listaDTO.add(mapearAResponseDTO(l));\n        }\n        return Optional.of(listaDTO);\n    }\n\n    @Override\n    @Transactional\n    public Optional&lt;LibroResponseDTO&gt; actualizarFicha(Long libroId, FichaLibroDTO fichaDTO) {\n        Optional&lt;Libro&gt; opt = libroRepo.findById(libroId);\n        if (opt.isEmpty()) {\n            return Optional.empty();\n        }\n\n        Libro libro = opt.get();\n        FichaLibro ficha = libro.getFicha();\n\n        if (ficha == null) {\n            ficha = new FichaLibro();\n            libro.setFicha(ficha);\n        }\n\n        ficha.setIsbn(fichaDTO.isbn());\n        ficha.setPaginas(fichaDTO.paginas());\n        ficha.setAnio(fichaDTO.anio());\n\n        Libro guardado = libroRepo.save(libro);\n        return Optional.of(mapearAResponseDTO(guardado));\n    }\n\n    @Override\n    @Transactional\n    public Optional&lt;LibroResponseDTO&gt; asociarAutor(Long libroId, Long autorId) {\n        Optional&lt;Libro&gt; libroOpt = libroRepo.findById(libroId);\n        Optional&lt;Autor&gt; autorOpt = autorRepo.findById(autorId);\n\n        if (libroOpt.isEmpty() || autorOpt.isEmpty()) {\n            return Optional.empty();\n        }\n\n        Libro libro = libroOpt.get();\n        Autor autor = autorOpt.get();\n\n        libro.addAutor(autor);\n        Libro guardado = libroRepo.save(libro);\n        return Optional.of(mapearAResponseDTO(guardado));\n    }\n\n    @Override\n    @Transactional\n    public boolean desasociarAutor(Long libroId, Long autorId) {\n        Optional&lt;Libro&gt; libroOpt = libroRepo.findById(libroId);\n        Optional&lt;Autor&gt; autorOpt = autorRepo.findById(autorId);\n\n        if (libroOpt.isEmpty() || autorOpt.isEmpty()) {\n            return false;\n        }\n\n        Libro libro = libroOpt.get();\n        Autor autor = autorOpt.get();\n\n        libro.removeAutor(autor);\n        libroRepo.save(libro);\n        return true;\n    }\n\n    // Conversi\u00f3n manual entre Entity y DTO (sin librer\u00edas externas)\n    private LibroResponseDTO mapearAResponseDTO(Libro l) {\n        EditorialResumenDTO edDTO = null;\n        if (l.getEditorial() != null) {\n            edDTO = new EditorialResumenDTO(l.getEditorial().getId(), l.getEditorial().getNombre());\n        }\n\n        List&lt;AutorResumenDTO&gt; autoresDTO = new ArrayList&lt;&gt;();\n        if (l.getAutores() != null) {\n            for (Autor a : l.getAutores()) {\n                autoresDTO.add(new AutorResumenDTO(a.getId(), a.getNombre()));\n            }\n        }\n\n        FichaLibroDTO fichaDTO = null;\n        if (l.getFicha() != null) {\n            fichaDTO = new FichaLibroDTO(l.getFicha().getIsbn(), l.getFicha().getPaginas(), l.getFicha().getAnio());\n        }\n\n        return new LibroResponseDTO(l.getId(), l.getTitulo(), edDTO, autoresDTO, fichaDTO);\n    }\n}<\/pre><\/details>\n<details><summary>EditorialServiceImpl.java y su interfaz<\/summary>\n<pre class=\"code\" data-f=\"service/IEditorialService.java\">package edu.rico.biblioteca.service;\n\nimport java.util.Optional;\n\nimport edu.rico.biblioteca.dto.EditorialRequestDTO;\nimport edu.rico.biblioteca.dto.EditorialResponseDTO;\n\npublic interface IEditorialService {\n    EditorialResponseDTO crear(EditorialRequestDTO dto);\n\n    Optional&lt;EditorialResponseDTO&gt; obtenerPorId(Long id);\n\n    // Devuelve: 1 = borrado con \u00e9xito (204), 0 = no existe (404), -1 = conflicto, tiene libros (409)\n    int eliminar(Long id);\n}<\/pre>\n<pre class=\"code\" data-f=\"service/impl/EditorialServiceImpl.java\">package edu.rico.biblioteca.service.impl;\n\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport edu.rico.biblioteca.dto.EditorialRequestDTO;\nimport edu.rico.biblioteca.dto.EditorialResponseDTO;\nimport edu.rico.biblioteca.entity.Editorial;\nimport edu.rico.biblioteca.repository.IEditorialRepository;\nimport edu.rico.biblioteca.repository.ILibroRepository;\nimport edu.rico.biblioteca.service.IEditorialService;\n\n@Service\npublic class EditorialServiceImpl implements IEditorialService {\n\n    @Autowired\n    private IEditorialRepository editorialRepo;\n\n    @Autowired\n    private ILibroRepository libroRepo;\n\n    @Override\n    @Transactional\n    public EditorialResponseDTO crear(EditorialRequestDTO dto) {\n        Editorial editorial = new Editorial(dto.nombre(), dto.pais());\n        Editorial guardada = editorialRepo.save(editorial);\n        return new EditorialResponseDTO(guardada.getId(), guardada.getNombre(), guardada.getPais());\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public Optional&lt;EditorialResponseDTO&gt; obtenerPorId(Long id) {\n        Optional&lt;Editorial&gt; opt = editorialRepo.findById(id);\n        if (opt.isEmpty()) {\n            return Optional.empty();\n        }\n\n        Editorial e = opt.get();\n        return Optional.of(new EditorialResponseDTO(e.getId(), e.getNombre(), e.getPais()));\n    }\n\n    @Override\n    @Transactional\n    public int eliminar(Long id) {\n        if (!editorialRepo.existsById(id)) {\n            return 0; // 404\n        }\n\n        // Comprobaci\u00f3n de integridad: verificar si tiene libros asociados\n        long totalLibros = libroRepo.countByEditorialId(id);\n        if (totalLibros &gt; 0) {\n            return -1; // 409 Conflicto\n        }\n\n        editorialRepo.deleteById(id);\n        return 1; // 204 \u00c9xito\n    }\n}<\/pre><\/details>\n<details><summary>AutorServiceImpl.java y su interfaz<\/summary>\n<pre class=\"code\" data-f=\"service/IAutorService.java\">package edu.rico.biblioteca.service;\n\nimport java.util.List;\nimport java.util.Optional;\n\nimport edu.rico.biblioteca.dto.AutorRequestDTO;\nimport edu.rico.biblioteca.dto.AutorResponseDTO;\nimport edu.rico.biblioteca.dto.LibroResumenDTO;\n\npublic interface IAutorService {\n    AutorResponseDTO crear(AutorRequestDTO dto);\n\n    Optional&lt;List&lt;LibroResumenDTO&gt;&gt; obtenerLibrosPorAutor(Long autorId);\n}<\/pre>\n<pre class=\"code\" data-f=\"service/impl/AutorServiceImpl.java\">package edu.rico.biblioteca.service.impl;\n\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport edu.rico.biblioteca.dto.AutorRequestDTO;\nimport edu.rico.biblioteca.dto.AutorResponseDTO;\nimport edu.rico.biblioteca.dto.LibroResumenDTO;\nimport edu.rico.biblioteca.entity.Autor;\nimport edu.rico.biblioteca.entity.Libro;\nimport edu.rico.biblioteca.repository.IAutorRepository;\nimport edu.rico.biblioteca.service.IAutorService;\n\n@Service\npublic class AutorServiceImpl implements IAutorService {\n\n    @Autowired\n    private IAutorRepository autorRepo;\n\n    @Override\n    @Transactional\n    public AutorResponseDTO crear(AutorRequestDTO dto) {\n        Autor autor = new Autor(dto.nombre(), dto.nacionalidad());\n        Autor guardado = autorRepo.save(autor);\n        return new AutorResponseDTO(guardado.getId(), guardado.getNombre(), guardado.getNacionalidad(), new ArrayList&lt;&gt;());\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public Optional&lt;List&lt;LibroResumenDTO&gt;&gt; obtenerLibrosPorAutor(Long autorId) {\n        Optional&lt;Autor&gt; opt = autorRepo.findById(autorId);\n        if (opt.isEmpty()) {\n            return Optional.empty();\n        }\n\n        Autor autor = opt.get();\n        List&lt;LibroResumenDTO&gt; resumenes = new ArrayList&lt;&gt;();\n        for (Libro l : autor.getLibros()) {\n            resumenes.add(new LibroResumenDTO(l.getId(), l.getTitulo()));\n        }\n\n        return Optional.of(resumenes);\n    }\n}<\/pre><\/details>\n\n<h3>Decisiones que conviene saber justificar<\/h3>\n<table>\n<tr><th>Decisi\u00f3n<\/th><th>Por qu\u00e9<\/th><\/tr>\n<tr><td><code>@Transactional<\/code> en cada m\u00e9todo, y <code>readOnly = true<\/code> en las lecturas<\/td><td>El mapeo a DTO recorre relaciones LAZY, as\u00ed que la sesi\u00f3n debe seguir abierta. <code>readOnly<\/code> avisa de que solo se lee.<\/td><\/tr>\n<tr><td>La conversi\u00f3n es un <b>m\u00e9todo privado<\/b> <code>mapearAResponseDTO<\/code> dentro de <code>LibroServiceImpl<\/code><\/td><td>La regla pide que la conversi\u00f3n ocurra en el servicio, ya sea en m\u00e9todos privados o en una clase Mapper. Aqu\u00ed se elige m\u00e9todo privado, <b>sin librer\u00edas externas<\/b>, porque solo Libro necesita ese mapeo completo. Si lo necesitaran varios servicios, un <code>@Component Mapper<\/code> evitar\u00eda repetir c\u00f3digo.<\/td><\/tr>\n<tr><td><code>obtenerPorId<\/code> usa <code>findByIdConRelaciones<\/code><\/td><td>Una sola consulta con JOIN FETCH para tener editorial, ficha y autores, sin N+1.<\/td><\/tr>\n<tr><td><code>asociarAutor<\/code> a\u00f1ade al <code>Set<\/code><\/td><td>A\u00f1adir dos veces el mismo autor no duplica nada.<\/td><\/tr>\n<tr><td><code>eliminar<\/code> de Editorial cuenta antes los libros<\/td><td>As\u00ed se devuelve un 409 limpio en vez de dejar que la base de datos falle con un 500.<\/td><\/tr>\n<tr><td>El <code>AutorResponseDTO<\/code> de <code>crear<\/code> lleva una lista vac\u00eda<\/td><td>Un autor reci\u00e9n creado todav\u00eda no tiene libros.<\/td><\/tr>\n<\/table>\n<\/section>\n\n<section id=\"s24\">\n<header class=\"opener r3\"><h2>Los controladores y los c\u00f3digos de estado<\/h2><div class=\"set\"><b>026<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<p>Elegir bien el c\u00f3digo HTTP forma parte del ejercicio. El controlador <b>no tiene l\u00f3gica de negocio<\/b>: llama al IService y traduce su respuesta con <code>ResponseEntity<\/code>. Los comentarios de cada m\u00e9todo dicen los c\u00f3digos que puede devolver.<\/p>\n<details open><summary>LibroController.java<\/summary>\n<pre class=\"code\" data-f=\"controller/LibroController.java\">package edu.rico.biblioteca.controller;\n\nimport java.net.URI;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.PutMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RequestParam;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.servlet.support.ServletUriComponentsBuilder;\n\nimport edu.rico.biblioteca.dto.FichaLibroDTO;\nimport edu.rico.biblioteca.dto.LibroRequestDTO;\nimport edu.rico.biblioteca.dto.LibroResponseDTO;\nimport edu.rico.biblioteca.service.ILibroService;\nimport jakarta.validation.Valid;\n\n@RestController\n@RequestMapping(\"/api/libros\")\npublic class LibroController {\n\n    @Autowired\n    private ILibroService libroService;\n\n    // POST /api/libros \u2192 201 + Location | 400 | 404\n    @PostMapping\n    public ResponseEntity&lt;LibroResponseDTO&gt; crear(@Valid @RequestBody LibroRequestDTO dto) {\n        try {\n            LibroResponseDTO creado = libroService.crear(dto);\n            URI location = ServletUriComponentsBuilder\n                    .fromCurrentRequest()\n                    .path(\"/{id}\")\n                    .buildAndExpand(creado.id())\n                    .toUri();\n            return ResponseEntity.created(location).body(creado);\n        } catch (IllegalArgumentException ex) {\n            // Si la causa es un recurso relacionado inexistente\n            if (ex.getMessage() != null &amp;&amp; ex.getMessage().contains(\"no existe\")) {\n                return ResponseEntity.notFound().build(); // 404\n            }\n            return ResponseEntity.badRequest().build(); // 400\n        }\n    }\n\n    // GET /api/libros/{id} \u2192 200 (LibroResponseDTO) | 404\n    @GetMapping(\"/{id}\")\n    public ResponseEntity&lt;LibroResponseDTO&gt; obtenerPorId(@PathVariable Long id) {\n        Optional&lt;LibroResponseDTO&gt; opt = libroService.obtenerPorId(id);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // GET /api/libros?editorialId= \u2192 200 | 404 si la editorial no existe\n    @GetMapping\n    public ResponseEntity&lt;List&lt;LibroResponseDTO&gt;&gt; listarPorEditorial(@RequestParam Long editorialId) {\n        Optional&lt;List&lt;LibroResponseDTO&gt;&gt; opt = libroService.listarPorEditorial(editorialId);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // PUT /api/libros/{id}/ficha \u2192 200 | 404\n    @PutMapping(\"/{id}/ficha\")\n    public ResponseEntity&lt;LibroResponseDTO&gt; actualizarFicha(\n            @PathVariable Long id,\n            @Valid @RequestBody FichaLibroDTO fichaDTO) {\n\n        Optional&lt;LibroResponseDTO&gt; opt = libroService.actualizarFicha(id, fichaDTO);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // POST /api/libros/{id}/autores/{autorId} \u2192 200 | 404\n    @PostMapping(\"/{id}/autores/{autorId}\")\n    public ResponseEntity&lt;LibroResponseDTO&gt; asociarAutor(\n            @PathVariable Long id,\n            @PathVariable Long autorId) {\n\n        Optional&lt;LibroResponseDTO&gt; opt = libroService.asociarAutor(id, autorId);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // DELETE /api/libros/{id}/autores/{autorId} \u2192 204 | 404\n    @DeleteMapping(\"/{id}/autores/{autorId}\")\n    public ResponseEntity&lt;Void&gt; desasociarAutor(\n            @PathVariable Long id,\n            @PathVariable Long autorId) {\n\n        boolean desasociado = libroService.desasociarAutor(id, autorId);\n        if (desasociado) {\n            return ResponseEntity.noContent().build();\n        }\n        return ResponseEntity.notFound().build();\n    }\n}<\/pre><\/details>\n<details><summary>EditorialController.java<\/summary>\n<pre class=\"code\" data-f=\"controller/EditorialController.java\">package edu.rico.biblioteca.controller;\n\nimport java.net.URI;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.servlet.support.ServletUriComponentsBuilder;\n\nimport edu.rico.biblioteca.dto.EditorialRequestDTO;\nimport edu.rico.biblioteca.dto.EditorialResponseDTO;\nimport edu.rico.biblioteca.service.IEditorialService;\nimport jakarta.validation.Valid;\n\n@RestController\n@RequestMapping(\"/api/editoriales\")\npublic class EditorialController {\n\n    @Autowired\n    private IEditorialService editorialService;\n\n    // POST /api/editoriales \u2192 201 + Location | 400\n    @PostMapping\n    public ResponseEntity&lt;EditorialResponseDTO&gt; crear(@Valid @RequestBody EditorialRequestDTO dto) {\n        EditorialResponseDTO creada = editorialService.crear(dto);\n        URI location = ServletUriComponentsBuilder\n                .fromCurrentRequest()\n                .path(\"/{id}\")\n                .buildAndExpand(creada.id())\n                .toUri();\n        return ResponseEntity.created(location).body(creada);\n    }\n\n    // GET /api/editoriales/{id} \u2192 200 | 404\n    @GetMapping(\"/{id}\")\n    public ResponseEntity&lt;EditorialResponseDTO&gt; obtenerPorId(@PathVariable Long id) {\n        Optional&lt;EditorialResponseDTO&gt; opt = editorialService.obtenerPorId(id);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n\n    // DELETE /api/editoriales/{id} \u2192 204 | 404 | 409\n    @DeleteMapping(\"/{id}\")\n    public ResponseEntity&lt;Void&gt; eliminar(@PathVariable Long id) {\n        int resultado = editorialService.eliminar(id);\n        if (resultado == 1) {\n            return ResponseEntity.noContent().build(); // 204\n        } else if (resultado == -1) {\n            return ResponseEntity.status(HttpStatus.CONFLICT).build(); // 409\n        }\n        return ResponseEntity.notFound().build(); // 404\n    }\n}<\/pre><\/details>\n<details><summary>AutorController.java<\/summary>\n<pre class=\"code\" data-f=\"controller/AutorController.java\">package edu.rico.biblioteca.controller;\n\nimport java.net.URI;\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.servlet.support.ServletUriComponentsBuilder;\n\nimport edu.rico.biblioteca.dto.AutorRequestDTO;\nimport edu.rico.biblioteca.dto.AutorResponseDTO;\nimport edu.rico.biblioteca.dto.LibroResumenDTO;\nimport edu.rico.biblioteca.service.IAutorService;\nimport jakarta.validation.Valid;\n\n@RestController\n@RequestMapping(\"/api/autores\")\npublic class AutorController {\n\n    @Autowired\n    private IAutorService autorService;\n\n    // POST /api/autores \u2192 201 + Location | 400\n    @PostMapping\n    public ResponseEntity&lt;AutorResponseDTO&gt; crear(@Valid @RequestBody AutorRequestDTO dto) {\n        AutorResponseDTO creado = autorService.crear(dto);\n        URI location = ServletUriComponentsBuilder\n                .fromCurrentRequest()\n                .path(\"/{id}\")\n                .buildAndExpand(creado.id())\n                .toUri();\n        return ResponseEntity.created(location).body(creado);\n    }\n\n    // GET /api/autores/{id}/libros \u2192 200 (LibroResumenDTO) | 404\n    @GetMapping(\"/{id}/libros\")\n    public ResponseEntity&lt;List&lt;LibroResumenDTO&gt;&gt; obtenerLibrosPorAutor(@PathVariable Long id) {\n        Optional&lt;List&lt;LibroResumenDTO&gt;&gt; opt = autorService.obtenerLibrosPorAutor(id);\n        if (opt.isPresent()) {\n            return ResponseEntity.ok(opt.get());\n        }\n        return ResponseEntity.notFound().build();\n    }\n}<\/pre><\/details>\n<table>\n<tr><th>Pieza<\/th><th>Qu\u00e9 hace<\/th><\/tr>\n<tr><td><code>ServletUriComponentsBuilder.fromCurrentRequest().path(\"/{id}\")\u2026<\/code><\/td><td>Construye la URL del recurso creado (<code>/api/libros/7<\/code>) a partir de la petici\u00f3n actual, para la cabecera <code>Location<\/code>.<\/td><\/tr>\n<tr><td><code>ResponseEntity.created(location).body(creado)<\/code><\/td><td><b>201<\/b> con la cabecera y el DTO creado en el cuerpo.<\/td><\/tr>\n<tr><td><code>Optional.isPresent()<\/code> y <code>opt.get()<\/code><\/td><td>Si hay valor, 200 con \u00e9l; si no, 404.<\/td><\/tr>\n<tr><td><code>try/catch (IllegalArgumentException)<\/code> solo en <code>LibroController.crear<\/code><\/td><td>El servicio avisa con ese error cuando la editorial o un autor no existen; si el mensaje contiene \u00abno existe\u00bb, el controlador responde 404, y si no, 400.<\/td><\/tr>\n<tr><td><code>@RequestParam Long editorialId<\/code><\/td><td>El filtro <code>?editorialId=<\/code>. Es obligatorio: sin \u00e9l Spring responde 400.<\/td><\/tr>\n<tr><td>El controlador solo importa DTO e IService<\/td><td>Cumple la regla \u00abel RestController nunca importa una Entity\u00bb.<\/td><\/tr>\n<\/table>\n<\/section>\n\n<section id=\"s25\">\n<header class=\"opener r3\"><h2>Misi\u00f3n 5: las trampas de comprensi\u00f3n<\/h2><div class=\"set\"><b>027<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<p>El ejercicio pide <b>provocar<\/b> cada trampa a prop\u00f3sito, entender por qu\u00e9 ocurre y arreglarla. El c\u00f3digo de esta gu\u00eda ya est\u00e1 en su versi\u00f3n correcta; para ver cada fallo hay que estropearlo.<\/p>\n\n<h3>1. Bucle infinito al devolver Entities directamente<\/h3>\n<p>Si el controlador devuelve un <code>Libro<\/code> con su colecci\u00f3n bidireccional de autores, Jackson llamar\u00e1 a <code>libro.getAutores()<\/code> y, en cada autor, a <code>autor.getLibros()<\/code>, generando una recursi\u00f3n infinita (el error que aparece es del tipo \u00abDocument nesting depth exceeds 500\u00bb, <code>StreamConstraintsException<\/code>, o un <code>StackOverflowError<\/code>, seg\u00fan la versi\u00f3n de Jackson). Se soluciona aislando el controlador con DTO basados en records.<\/p>\n<p><b>Para provocarlo:<\/b> haz que un m\u00e9todo de prueba del controlador devuelva el <code>Libro<\/code> en lugar del <code>LibroResponseDTO<\/code>.<\/p>\n\n<h3>2. <code>LazyInitializationException<\/code> fuera de la transacci\u00f3n<\/h3>\n<p>Ocurre al intentar resolver un proxy LAZY (por ejemplo <code>libro.getEditorial().getNombre()<\/code>) cuando la sesi\u00f3n de Hibernate ya se ha cerrado. Se resuelve anotando los m\u00e9todos del <b>Service<\/b> con <code>@Transactional(readOnly = true)<\/code> (los que leen) o <code>@Transactional<\/code> (los que escriben), lo que garantiza que la sesi\u00f3n siga abierta durante el ensamblado del DTO.<\/p>\n<p><b>Para provocarlo:<\/b> quita <code>@Transactional<\/code> de <code>obtenerPorId<\/code> en un m\u00e9todo que use <code>findById<\/code> (no el de JOIN FETCH) y deja <code>open-in-view=false<\/code>.<\/p>\n\n<h3>3. El problema N+1<\/h3>\n<p>Si consultas una lista de 50 libros y, en un bucle, accedes a la editorial o a los autores de cada uno, Hibernate lanza 1 consulta para los libros m\u00e1s 50 consultas individuales. Se soluciona en el repositorio con <code>JOIN FETCH<\/code> (como <code>findByIdConRelaciones<\/code>) o con <code>@EntityGraph<\/code>.<\/p>\n<p><b>Para provocarlo:<\/b> crea 50 libros con autores, llama a <code>GET /api/libros?editorialId=<\/code> y cuenta los <code>select<\/code> que salen en la terminal con <code>show-sql=true<\/code>.<\/p>\n<div class=\"warn\">En esta soluci\u00f3n <code>findByIdConRelaciones<\/code> arregla el N+1 del <b>detalle<\/b> de un libro, pero <code>listarPorEditorial<\/code> usa <code>findByEditorialId<\/code> sin fetch, as\u00ed que listar muchos libros sigue lanzando consultas extra para los autores. La mejora natural es anotar ese m\u00e9todo con <code>@EntityGraph(attributePaths = {\"editorial\", \"autores\"})<\/code>.<\/div>\n\n<h3>4. Borrar una Editorial con libros: 409 y no 500<\/h3>\n<p>Si se ejecutara directamente <code>editorialRepo.deleteById(id)<\/code> sobre una editorial con libros vinculados, MySQL lanzar\u00eda un <code>DataIntegrityViolationException<\/code> y el cliente ver\u00eda un <b>500 Internal Server Error<\/b>. En <code>EditorialServiceImpl.eliminar<\/code> se valida antes con <code>libroRepo.countByEditorialId(id)<\/code>: si hay libros devuelve <code>-1<\/code> y el controlador responde un <b>409 CONFLICT<\/b> limpio.<\/p>\n<p><b>Para provocarlo:<\/b> quita la comprobaci\u00f3n del servicio y borra una editorial que tenga un libro.<\/p>\n\n<h3>5. A\u00f1adir un autor dos veces: List frente a Set<\/h3>\n<p>Con un <code>List<\/code>, a\u00f1adir el mismo autor dos veces crear\u00eda dos entradas id\u00e9nticas en la tabla intermedia <code>libro_autor<\/code>, o fallar\u00eda por clave primaria duplicada. Con un <code>Set<\/code>, Java descarta la segunda inserci\u00f3n en memoria bas\u00e1ndose en <code>equals()<\/code> y MySQL no recibe sentencias redundantes.<\/p>\n<p><b>Para provocarlo:<\/b> cambia <code>Set<\/code> por <code>List<\/code> en <code>Libro.autores<\/code> y llama dos veces a <code>POST /api/libros/{id}/autores/{autorId}<\/code>.<\/p>\n\n<table>\n<tr><th>#<\/th><th>Trampa<\/th><th>Qu\u00e9 se ve<\/th><th>Arreglo<\/th><\/tr>\n<tr><td>1<\/td><td>Devolver una Entity<\/td><td>Recursi\u00f3n infinita en el JSON<\/td><td>DTO con <code>*ResumenDTO<\/code><\/td><\/tr>\n<tr><td>2<\/td><td>LAZY fuera de transacci\u00f3n<\/td><td><code>LazyInitializationException<\/code><\/td><td><code>@Transactional(readOnly = true)<\/code> en el Service<\/td><\/tr>\n<tr><td>3<\/td><td>Lista con N+1<\/td><td>1 + N consultas en el log<\/td><td><code>JOIN FETCH<\/code> o <code>@EntityGraph<\/code><\/td><\/tr>\n<tr><td>4<\/td><td>Borrar editorial con libros<\/td><td>500 por integridad<\/td><td>Contar antes y devolver 409<\/td><\/tr>\n<tr><td>5<\/td><td>Autor repetido<\/td><td><code>List<\/code> duplica, <code>Set<\/code> no<\/td><td>Usar <code>Set<\/code><\/td><\/tr>\n<\/table>\n<div class=\"warn\">Despu\u00e9s de cada experimento, <b>devuelve el c\u00f3digo a su versi\u00f3n correcta<\/b>. Y apunta lo que ves en el log: son las observaciones de tu documento de respuestas.<\/div>\n<\/section>\n\n<section id=\"s26\">\n<header class=\"opener r3\"><h2>Ampliaci\u00f3n: validaci\u00f3n declarativa con <code>@Valid<\/code><\/h2><div class=\"set\"><b>028<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<h3>\u00bfPara qu\u00e9 sirve <code>@Valid<\/code>?<\/h3>\n<p>Hasta ahora la validaci\u00f3n se hac\u00eda a mano en el servicio, con sentencias <code>if (dto.nombre() == null || dto.nombre().isBlank())<\/code> que lanzaban <code>IllegalArgumentException<\/code>. Eso ensucia la l\u00f3gica de negocio con comprobaciones b\u00e1sicas de formato.<\/p>\n<p>La especificaci\u00f3n <b>Jakarta Bean Validation<\/b> (con la anotaci\u00f3n <code>@Valid<\/code>) permite delegar esas comprobaciones en el propio framework, <b>justo cuando el JSON entra en el controlador<\/b>. Si el cuerpo no cumple las reglas, Spring intercepta la petici\u00f3n antes de llamar al servicio y devuelve autom\u00e1ticamente un <b>400 Bad Request<\/b>.<\/p>\n\n<h3>Antes y despu\u00e9s<\/h3>\n<pre class=\"code\" data-f=\"ANTES: validaci\u00f3n a mano dentro del servicio\">@Transactional\npublic EditorialResponseDTO crear(EditorialRequestDTO dto) {\n    if (dto.nombre() == null || dto.nombre().isBlank() || dto.pais() == null || dto.pais().isBlank()) {\n        throw new IllegalArgumentException(\"El nombre y el pa\u00eds no pueden estar vac\u00edos\");\n    }\n    Editorial editorial = new Editorial(dto.nombre(), dto.pais());\n    ...\n}\n\n// y en el controlador, un try/catch para convertirlo en 400\ntry { ... } catch (IllegalArgumentException ex) { return ResponseEntity.badRequest().build(); }<\/pre>\n<pre class=\"code\" data-f=\"DESPU\u00c9S: el servicio ya no valida y el controlador no necesita try/catch\">// Servicio: solo la l\u00f3gica\n@Transactional\npublic EditorialResponseDTO crear(EditorialRequestDTO dto) {\n    Editorial editorial = new Editorial(dto.nombre(), dto.pais());\n    ...\n}\n\n// Controlador: @Valid delante de @RequestBody\n@PostMapping\npublic ResponseEntity&lt;EditorialResponseDTO&gt; crear(@Valid @RequestBody EditorialRequestDTO dto) { ... }<\/pre>\n\n<h3>Los tres pasos<\/h3>\n<p><span class=\"step\">1<\/span><b>Dependencia<\/b> en el <code>pom.xml<\/code> (la que se marc\u00f3 como \u00abValidation\u00bb en Initializr):<\/p>\n<pre class=\"code\" data-f=\"pom.xml\">&lt;dependency&gt;\n    &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;\n    &lt;artifactId&gt;spring-boot-starter-validation&lt;/artifactId&gt;\n&lt;/dependency&gt;<\/pre>\n<p><span class=\"step\">2<\/span><b>Anotaciones en los records<\/b> (las restricciones se ponen en cada componente del record). Estos son los DTO <b>finales<\/b>:<\/p>\n<details open><summary>EditorialRequestDTO, FichaLibroDTO y LibroRequestDTO<\/summary>\n<pre class=\"code\" data-f=\"dto/EditorialRequestDTO.java\">package edu.rico.biblioteca.dto;\n\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.Size;\n\npublic record EditorialRequestDTO(\n    @NotBlank(message = \"El nombre de la editorial es obligatorio\")\n    @Size(min = 2, max = 100, message = \"El nombre debe tener entre 2 y 100 caracteres\")\n    String nombre,\n\n    @NotBlank(message = \"El pa\u00eds de origen es obligatorio\")\n    String pais\n) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/FichaLibroDTO.java\">package edu.rico.biblioteca.dto;\n\nimport jakarta.validation.constraints.Max;\nimport jakarta.validation.constraints.Min;\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.Pattern;\n\npublic record FichaLibroDTO(\n    @NotBlank(message = \"El ISBN es obligatorio\")\n    @Pattern(regexp = \"^(97(8|9))?\\\\d{9}(\\\\d|X)$\", message = \"Formato de ISBN inv\u00e1lido\")\n    String isbn,\n\n    @Min(value = 1, message = \"El libro debe tener al menos una p\u00e1gina\")\n    int paginas,\n\n    @Min(value = 1450, message = \"El a\u00f1o no puede ser anterior a la invenci\u00f3n de la imprenta\")\n    @Max(value = 2026, message = \"El a\u00f1o no puede ser superior al a\u00f1o actual\")\n    int anio\n) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/LibroRequestDTO.java\">package edu.rico.biblioteca.dto;\n\nimport java.util.Set;\n\nimport jakarta.validation.Valid;\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotEmpty;\nimport jakarta.validation.constraints.NotNull;\n\npublic record LibroRequestDTO(\n    @NotBlank(message = \"El t\u00edtulo es obligatorio\")\n    String titulo,\n\n    @NotNull(message = \"Debe indicarse la editorial\")\n    Long editorialId,\n\n    @NotEmpty(message = \"El libro debe tener al menos un autor asignado\")\n    Set&lt;Long&gt; autoresIds,\n\n    @Valid // Valida recursivamente las restricciones internas de FichaLibroDTO\n    @NotNull(message = \"La ficha t\u00e9cnica es obligatoria\")\n    FichaLibroDTO ficha\n) {}<\/pre><\/details>\n<details><summary>AutorRequestDTO y el resto de DTO<\/summary>\n<pre class=\"code\" data-f=\"dto/AutorRequestDTO.java\">package edu.rico.biblioteca.dto;\n\nimport jakarta.validation.constraints.NotBlank;\n\npublic record AutorRequestDTO(\n    @NotBlank(message = \"El nombre del autor es obligatorio\")\n    String nombre,\n\n    @NotBlank(message = \"La nacionalidad es obligatoria\")\n    String nacionalidad\n) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/AutorResponseDTO.java\">package edu.rico.biblioteca.dto;\n\nimport java.util.List;\n\npublic record AutorResponseDTO(\n    Long id,\n    String nombre,\n    String nacionalidad,\n    List&lt;LibroResumenDTO&gt; libros\n) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/EditorialResponseDTO.java\">package edu.rico.biblioteca.dto;\n\npublic record EditorialResponseDTO(\n    Long id,\n    String nombre,\n    String pais\n) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/EditorialResumenDTO.java\">package edu.rico.biblioteca.dto;\n\npublic record EditorialResumenDTO(Long id, String nombre) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/AutorResumenDTO.java\">package edu.rico.biblioteca.dto;\n\npublic record AutorResumenDTO(Long id, String nombre) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/LibroResumenDTO.java\">package edu.rico.biblioteca.dto;\n\npublic record LibroResumenDTO(Long id, String titulo) {}<\/pre>\n<pre class=\"code\" data-f=\"dto/LibroResponseDTO.java\">package edu.rico.biblioteca.dto;\n\nimport java.util.List;\n\npublic record LibroResponseDTO(\n    Long id,\n    String titulo,\n    EditorialResumenDTO editorial,\n    List&lt;AutorResumenDTO&gt; autores,\n    FichaLibroDTO ficha\n) {}<\/pre><\/details>\n<p><span class=\"step\">3<\/span><b>Activaci\u00f3n en el controlador<\/b>: <code>@Valid<\/code> delante de <code>@RequestBody<\/code> en cada m\u00e9todo que recibe un DTO (ya est\u00e1 puesto en los controladores de la secci\u00f3n 26).<\/p>\n\n<h3>Qu\u00e9 hace cada anotaci\u00f3n<\/h3>\n<table>\n<tr><th>Anotaci\u00f3n<\/th><th>Qu\u00e9 exige<\/th><th>D\u00f3nde se usa<\/th><\/tr>\n<tr><td><code>@NotBlank<\/code><\/td><td>Texto no nulo, no vac\u00edo y no solo espacios<\/td><td>nombre, pa\u00eds, t\u00edtulo, isbn<\/td><\/tr>\n<tr><td><code>@NotNull<\/code><\/td><td>El valor debe venir (no <code>null<\/code>)<\/td><td><code>editorialId<\/code>, <code>ficha<\/code><\/td><\/tr>\n<tr><td><code>@NotEmpty<\/code><\/td><td>Una colecci\u00f3n no puede venir vac\u00eda<\/td><td><code>autoresIds<\/code><\/td><\/tr>\n<tr><td><code>@Size(min, max)<\/code><\/td><td>Longitud de un texto<\/td><td>nombre de la editorial (2 a 100)<\/td><\/tr>\n<tr><td><code>@Pattern(regexp)<\/code><\/td><td>El texto debe cumplir una expresi\u00f3n regular<\/td><td>ISBN: <code>^(97(8|9))?\\d{9}(\\d|X)$<\/code> (10 o 13 cifras, sin guiones)<\/td><\/tr>\n<tr><td><code>@Min<\/code> y <code>@Max<\/code><\/td><td>Rango num\u00e9rico<\/td><td>p\u00e1ginas \u2265 1; a\u00f1o entre 1450 y 2026<\/td><\/tr>\n<tr><td><code>@Valid<\/code> sobre un campo<\/td><td>Valida <b>recursivamente<\/b> el objeto anidado<\/td><td><code>ficha<\/code> dentro de <code>LibroRequestDTO<\/code><\/td><\/tr>\n<\/table>\n<div class=\"kid\">Es como el portero de una discoteca. Antes, cada sala comprobaba a mano si ten\u00edas entrada. Ahora hay un portero en la puerta (<code>@Valid<\/code>): si tu entrada no es v\u00e1lida, ni siquiera entras. Las salas (los servicios) solo atienden a quien ya pas\u00f3 el control.<\/div>\n<div class=\"ok\">Al enviar un JSON con <code>nombre: \"\"<\/code>, o sin el campo <code>pais<\/code>, Spring MVC rechaza la petici\u00f3n con <b>400<\/b> antes de ejecutar una sola l\u00ednea del servicio. Probado: ISBN con formato inv\u00e1lido, a\u00f1o 1400, lista de autores vac\u00eda, ficha ausente y PUT de ficha inv\u00e1lida devuelven 400.<\/div>\n<\/section>\n\n<section id=\"s27\">\n<header class=\"opener r3\"><h2>Probar con Postman o curl<\/h2><div class=\"set\"><b>029<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<p>Arranca (<code>.\\mvnw.cmd spring-boot:run<\/code>) y haz la secuencia <b>en orden<\/b>, comprobando el c\u00f3digo de cada respuesta. Primero c\u00f3mo se escribe cada petici\u00f3n en Postman; m\u00e1s abajo tienes la misma secuencia con <code>curl<\/code>.<\/p>\n<div class=\"why\">Si es la primera vez que usas Postman, lee antes la secci\u00f3n <b>\u00abProbar la API\u00bb del paso 19<\/b>: all\u00ed se explica paso a paso c\u00f3mo elegir el m\u00e9todo, escribir la direcci\u00f3n y poner el cuerpo en <b>Body &gt; raw &gt; JSON<\/b>. Aqu\u00ed solo se aplica a la biblioteca.<\/div>\n\n<h3>C\u00f3mo se escribe cada petici\u00f3n en Postman<\/h3>\n<p>En todas, la direcci\u00f3n empieza por <code>http://localhost:8080<\/code>. Las que llevan cuerpo necesitan <b>Body &gt; raw &gt; JSON<\/b> (as\u00ed Postman a\u00f1ade <code>Content-Type: application/json<\/code>). Las que no, se env\u00edan con la pesta\u00f1a Body vac\u00eda.<\/p>\n<table>\n<tr><th>Petici\u00f3n<\/th><th>M\u00e9todo y direcci\u00f3n<\/th><th>\u00bfCuerpo?<\/th><\/tr>\n<tr><td>Crear editorial<\/td><td>POST <code>/api/editoriales<\/code><\/td><td>S\u00ed: <code>EditorialRequestDTO<\/code><\/td><\/tr>\n<tr><td>Crear autor<\/td><td>POST <code>/api/autores<\/code><\/td><td>S\u00ed: <code>AutorRequestDTO<\/code><\/td><\/tr>\n<tr><td>Crear libro<\/td><td>POST <code>/api/libros<\/code><\/td><td>S\u00ed: <code>LibroRequestDTO<\/code><\/td><\/tr>\n<tr><td>Ver un libro<\/td><td>GET <code>/api/libros/1<\/code><\/td><td>No: el id va en la direcci\u00f3n<\/td><\/tr>\n<tr><td>Libros de una editorial<\/td><td>GET <code>/api/libros?editorialId=1<\/code><\/td><td>No: el filtro va en la direcci\u00f3n<\/td><\/tr>\n<tr><td>Cambiar la ficha<\/td><td>PUT <code>/api/libros/1/ficha<\/code><\/td><td>S\u00ed: <code>FichaLibroDTO<\/code><\/td><\/tr>\n<tr><td>A\u00f1adir un autor a un libro<\/td><td>POST <code>/api/libros/1/autores/1<\/code><\/td><td>No: los dos ids van en la direcci\u00f3n<\/td><\/tr>\n<tr><td>Libros de un autor<\/td><td>GET <code>/api/autores/1/libros<\/code><\/td><td>No<\/td><\/tr>\n<tr><td>Quitar un autor de un libro / borrar editorial<\/td><td>DELETE <code>/api/libros/1/autores/1<\/code> \u00b7 DELETE <code>/api/editoriales/1<\/code><\/td><td>No<\/td><\/tr>\n<\/table>\n\n<h3>C\u00f3mo se construye cada cuerpo, a partir de su DTO<\/h3>\n<p>Igual que en el puente: <b>cada clave del JSON es un campo del record<\/b>, con el mismo nombre. Estos son los tres cuerpos de la secuencia:<\/p>\n<pre class=\"code\" data-f=\"Body de POST /api/editoriales  \u2190  EditorialRequestDTO(nombre, pais)\">{\n    \"nombre\": \"Planeta\",\n    \"pais\": \"Espa\u00f1a\"\n}<\/pre>\n<pre class=\"code\" data-f=\"Body de POST /api/autores  \u2190  AutorRequestDTO(nombre, nacionalidad)\">{\n    \"nombre\": \"Cervantes\",\n    \"nacionalidad\": \"Espa\u00f1ola\"\n}<\/pre>\n<pre class=\"code\" data-f=\"Body de POST /api/libros  \u2190  LibroRequestDTO(titulo, editorialId, autoresIds, ficha)\">{\n    \"titulo\": \"Don Quijote\",\n    \"editorialId\": 1,\n    \"autoresIds\": [1],\n    \"ficha\": {\n        \"isbn\": \"9788420412146\",\n        \"paginas\": 900,\n        \"anio\": 1605\n    }\n}<\/pre>\n<p>El del libro es el que m\u00e1s preguntas genera, y cada parte sale de un tipo distinto del record:<\/p>\n<table>\n<tr><th>Campo de <code>LibroRequestDTO<\/code><\/th><th>En el JSON<\/th><th>Por qu\u00e9<\/th><\/tr>\n<tr><td><code>String titulo<\/code><\/td><td>Texto entre comillas.<\/td><td>Dato simple.<\/td><\/tr>\n<tr><td><code>Long editorialId<\/code><\/td><td>Un n\u00famero, <b>sin comillas<\/b>: <code>1<\/code>.<\/td><td>El libro no lleva la editorial entera, solo su <b>id<\/b>: el cliente solo conoce las claves de lo que ya existe y es el Service quien busca la editorial real (pregunta 1 de la secci\u00f3n 24). Por eso la editorial 1 tiene que existir ya: crea antes la editorial.<\/td><\/tr>\n<tr><td><code>Set&lt;Long&gt; autoresIds<\/code><\/td><td>Una <b>lista entre corchetes<\/b> de n\u00fameros: <code>[1]<\/code> o <code>[1, 2]<\/code>.<\/td><td>Un libro puede tener varios autores (N:M), as\u00ed que son varios ids. Cada autor debe existir; si no, 404. Una lista vac\u00eda <code>[]<\/code> es rechazada con 400 (<code>@NotEmpty<\/code>, secci\u00f3n 28).<\/td><\/tr>\n<tr><td><code>FichaLibroDTO ficha<\/code><\/td><td>Un <b>objeto anidado entre llaves<\/b> con sus propias claves: <code>isbn<\/code>, <code>paginas<\/code>, <code>anio<\/code>.<\/td><td>Un record dentro de otro record se convierte en un objeto dentro de otro objeto. Es la relaci\u00f3n 1:1: la ficha viaja dentro del libro, y por eso no necesita id.<\/td><\/tr>\n<\/table>\n<p>El orden de la secuencia no es casual: para crear el libro necesitas que existan la editorial 1 y el autor 1, as\u00ed que se crean primero. F\u00edjate tambi\u00e9n en que el <b>PUT de la ficha<\/b> lleva como cuerpo solo el objeto de la ficha, sin el libro (<code>{\"isbn\": \"842041214X\", \"paginas\": 1000, \"anio\": 1615}<\/code>), porque su DTO es <code>FichaLibroDTO<\/code>. En cambio <b>POST <code>/api/libros/1/autores/1<\/code> no lleva cuerpo<\/b>: los dos datos que necesita (libro y autor) ya viajan en la direcci\u00f3n.<\/p>\n<div class=\"why\"><b>Los par\u00e1metros de la direcci\u00f3n.<\/b> Hay dos formas de pasar datos sin cuerpo. Un <b>id dentro de la ruta<\/b> (<code>/api/libros/1<\/code>) lo recoge <code>@PathVariable<\/code>. Un <b>filtro tras la <code>?<\/code><\/b> (<code>/api/libros?editorialId=1<\/code>) lo recoge <code>@RequestParam<\/code>. En Postman puedes escribir la direcci\u00f3n completa o abrir la pesta\u00f1a <b>Params<\/b> y rellenar <i>Key<\/i> = <code>editorialId<\/code> y <i>Value<\/i> = <code>1<\/code>: Postman monta la <code>?<\/code> por ti.<\/div>\n<h3>Los errores, a prop\u00f3sito<\/h3>\n<p>Para provocar un <b>400<\/b> basta con romper el cuerpo: <code>{}<\/code> (todo ausente), un ISBN como <code>\"123\"<\/code> que no cumple el patr\u00f3n, un a\u00f1o <code>1400<\/code> fuera del rango, un libro sin <code>ficha<\/code> o con <code>\"autoresIds\": []<\/code>. Para un <b>404<\/b>, apunta a un id que no existe: <code>GET /api/libros/99999<\/code>, o un POST de libro con <code>\"editorialId\": 99999<\/code>. Para un <b>409<\/b>, intenta borrar la editorial 1 mientras tenga el libro. Si el cuerpo es correcto pero Postman responde <b>415<\/b>, es que el desplegable de Body est\u00e1 en <i>Text<\/i> y no en <i>JSON<\/i>.<\/p>\n\n<h3>La misma secuencia con curl<\/h3>\n<p><code>-i<\/code> muestra el c\u00f3digo y las cabeceras, <code>-X<\/code> el m\u00e9todo, <code>-H<\/code> la cabecera <code>Content-Type<\/code> y <code>-d<\/code> el cuerpo, con las comillas del JSON escapadas con <code>\\<\/code>.<\/p>\n<pre class=\"code\" data-f=\"secuencia de pruebas (CMD o Git Bash)\">curl -i -X POST http://localhost:8080/api/editoriales -H \"Content-Type: application/json\" -d \"{\\\"nombre\\\":\\\"Planeta\\\",\\\"pais\\\":\\\"Espa\u00f1a\\\"}\"\ncurl -i -X POST http://localhost:8080/api/autores -H \"Content-Type: application/json\" -d \"{\\\"nombre\\\":\\\"Cervantes\\\",\\\"nacionalidad\\\":\\\"Espa\u00f1ola\\\"}\"\ncurl -i -X POST http://localhost:8080/api/libros -H \"Content-Type: application/json\" -d \"{\\\"titulo\\\":\\\"Don Quijote\\\",\\\"editorialId\\\":1,\\\"autoresIds\\\":[1],\\\"ficha\\\":{\\\"isbn\\\":\\\"9788420412146\\\",\\\"paginas\\\":900,\\\"anio\\\":1605}}\"\ncurl -i http://localhost:8080/api/libros/1\ncurl -i \"http://localhost:8080/api/libros?editorialId=1\"\ncurl -i -X PUT http://localhost:8080/api/libros/1/ficha -H \"Content-Type: application/json\" -d \"{\\\"isbn\\\":\\\"842041214X\\\",\\\"paginas\\\":1000,\\\"anio\\\":1615}\"\ncurl -i -X POST http://localhost:8080/api/libros/1/autores/1\ncurl -i http://localhost:8080/api/autores/1/libros\ncurl -i -X DELETE http://localhost:8080/api/libros/1/autores/1\ncurl -i -X DELETE http://localhost:8080/api/editoriales/1<\/pre>\n<table>\n<tr><th>Petici\u00f3n<\/th><th>Esperado<\/th><\/tr>\n<tr><td>POST editorial, autor y libro<\/td><td><b>201<\/b> y cabecera <code>Location<\/code><\/td><\/tr>\n<tr><td>GET libro 1, GET por editorial, PUT ficha, POST autor, GET libros del autor<\/td><td><b>200<\/b><\/td><\/tr>\n<tr><td>DELETE del autor del libro<\/td><td><b>204<\/b><\/td><\/tr>\n<tr><td>DELETE editorial 1 (tiene un libro)<\/td><td><b>409<\/b><\/td><\/tr>\n<tr><td>GET libro 99999, o POST libro con editorial 99999<\/td><td><b>404<\/b><\/td><\/tr>\n<tr><td>POST libro con <code>{}<\/code>, ISBN \u00ab123\u00bb o a\u00f1o 1400<\/td><td><b>400<\/b><\/td><\/tr>\n<\/table>\n<div class=\"warn\">El ISBN tiene que cumplir el patr\u00f3n (10 o 13 cifras, sin guiones), por eso en los ejemplos aparece <code>9788420412146<\/code> y no un valor cualquiera como \u00ab123\u00bb.<\/div>\n<div class=\"ok\">El proyecto de esta gu\u00eda lleva 5 pruebas autom\u00e1ticas (MockMvc) que recorren todos los endpoints con sus 200, 201, 204, 400, 404 y 409, y pasan. Las ejecut\u00e9 contra una base H2 en memoria y con Java 17: aqu\u00ed no tengo tu MySQL ni Java 21, as\u00ed que lo definitivo es que lo pruebes t\u00fa con tu MySQL.<\/div>\n<\/section>\n\n<section id=\"s28\">\n<header class=\"opener r3\"><h2>C\u00f3mo explicar el ejercicio<\/h2><div class=\"set\"><b>030<\/b>/033 <span class=\"rar\">HOLO<\/span><\/div><\/header>\n<p>Un orden para contarlo en unos diez minutos, de l
