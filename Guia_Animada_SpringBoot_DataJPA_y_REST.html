de>salario<\/code> (<code>BigDecimal<\/code>, precisi\u00f3n 10 y escala 2, obligatorio)<\/li>\n<li><code>especialidad<\/code> (el enum, guardado como texto, obligatorio)<\/li>\n<li><code>activo<\/code> (<code>boolean<\/code>)<\/li>\n<\/ul>\n<p class=\"paso\"><b>4.<\/b> Crea la entidad <code>Paciente<\/code>, con tabla <code>pacientes<\/code>:<\/p>\n<ul>\n<li><code>id<\/code> (clave autogenerada, columna <code>id_paciente<\/code>)<\/li>\n<li><code>nombre<\/code> (obligatorio)<\/li>\n<li><code>fechaNacimiento<\/code> (<code>LocalDate<\/code>, obligatoria)<\/li>\n<\/ul>\n<p class=\"paso\"><b>5.<\/b> Crea la entidad <code>HistorialClinico<\/code>, con tabla <code>historiales<\/code>:<\/p>\n<ul>\n<li><code>id<\/code> (clave autogenerada)<\/li>\n<li><code>numeroHistorial<\/code> (obligatorio y \u00fanico)<\/li>\n<li><code>grupoSanguineo<\/code> (obligatorio, m\u00e1ximo 3 caracteres)<\/li>\n<li><code>alergias<\/code> (texto, puede ser nulo)<\/li>\n<\/ul>\n<p class=\"paso\"><b>6.<\/b> Haz una <b>relaci\u00f3n bidireccional uno a muchos<\/b> entre <code>Hospital<\/code> y <code>Medico<\/code>:<\/p>\n<ul>\n<li>El propietario de la relaci\u00f3n es <code>Medico<\/code>, con la columna <code>id_hospital<\/code>, obligatoria.<\/li>\n<li>Al borrar un hospital <b>no<\/b> deben borrarse sus m\u00e9dicos.<\/li>\n<li>Inicializa la lista y escribe un m\u00e9todo de ayuda <code>addMedico<\/code> que mantenga sincronizados los dos lados.<\/li>\n<\/ul>\n<p class=\"paso\"><b>7.<\/b> Haz una <b>relaci\u00f3n uno a uno unidireccional<\/b> entre <code>Paciente<\/code> e <code>HistorialClinico<\/code>:<\/p>\n<ul>\n<li>El propietario es <code>Paciente<\/code>, con la columna <code>id_historial<\/code>, obligatoria y \u00fanica.<\/li>\n<li>Al guardar un paciente debe guardarse su historial, y al borrarlo, tambi\u00e9n.<\/li>\n<li>Explica con tus palabras qu\u00e9 hace <code>optional = false<\/code> y qu\u00e9 har\u00eda <code>unique = true<\/code>.<\/li>\n<\/ul>\n<p class=\"paso\"><b>8.<\/b> Haz una <b>relaci\u00f3n muchos a muchos con datos propios<\/b> entre <code>Medico<\/code> y <code>Paciente<\/code>, creando la entidad <code>Consulta<\/code>, con tabla <code>consultas<\/code>. Incluye:<\/p>\n<ul>\n<li><code>id<\/code><\/li>\n<li><code>medico<\/code> y <code>paciente<\/code>, con relaciones <code>@ManyToOne<\/code> obligatorias y carga perezosa<\/li>\n<li><code>fecha<\/code> (<code>LocalDateTime<\/code>, obligatoria)<\/li>\n<li><code>coste<\/code> (<code>BigDecimal<\/code>, obligatorio)<\/li>\n<li><code>tipo<\/code> (<code>TipoConsulta<\/code>, guardado como texto)<\/li>\n<li><code>seguimiento<\/code> (<code>boolean<\/code>)<\/li>\n<\/ul>\n<p>A\u00f1ade en <code>Medico<\/code> y en <code>Paciente<\/code> las listas inversas de consultas con <code>mappedBy<\/code>. En <code>Paciente<\/code>, que las consultas se borren con \u00e9l (<code>orphanRemoval<\/code>). En <code>Medico<\/code>, <b>sin<\/b> cascada.<\/p>\n<p class=\"paso\"><b>9.<\/b> Responde brevemente:<\/p>\n<ul>\n<li>a) \u00bfPor qu\u00e9 <code>Consulta<\/code> es una entidad y no un <code>@ManyToMany<\/code> directo?<\/li>\n<li>b) \u00bfEn qu\u00e9 tabla est\u00e1 cada clave for\u00e1nea?<\/li>\n<li>c) \u00bfQu\u00e9 pasar\u00eda si en <code>Hospital<\/code> pusieras <code>cascade = ALL<\/code> y borraras un hospital con m\u00e9dicos?<\/li>\n<\/ul>\n\n<h3>Parte 2: repositorios y consultas (1,5 puntos)<\/h3>\n<p class=\"paso\"><b>10.<\/b> Crea los repositorios de las cuatro entidades principales y de <code>Consulta<\/code> (<code>JpaRepository<\/code>).<\/p>\n<p class=\"paso\"><b>11.<\/b> En <code>MedicoRepository<\/code>, escribe estos m\u00e9todos. Usa <i>derived queries<\/i> donde se pueda y <code>@Query<\/code> donde haga falta.<\/p>\n<ul>\n<li>a) M\u00e9dicos de una especialidad dada.<\/li>\n<li>b) M\u00e9dicos activos de un hospital (por el id del hospital).<\/li>\n<li>c) M\u00e9dicos con salario mayor que una cantidad, ordenados de mayor a menor.<\/li>\n<li>d) N\u00famero de m\u00e9dicos de cada hospital (consulta JPQL con <code>GROUP BY<\/code>).<\/li>\n<\/ul>\n<p class=\"paso\"><b>12.<\/b> En <code>ConsultaRepository<\/code>, escribe:<\/p>\n<ul>\n<li>a) Consultas de un paciente ordenadas por fecha descendente.<\/li>\n<li>b) Suma del coste de todas las consultas de un m\u00e9dico (<code>@Query<\/code> con <code>SUM<\/code>).<\/li>\n<li>c) Consultas de tipo <code>URGENCIA<\/code> con seguimiento activo.<\/li>\n<\/ul>\n<p class=\"paso\"><b>13.<\/b> En <code>PacienteRepository<\/code>, escribe una consulta que devuelva los pacientes que han sido atendidos por un m\u00e9dico concreto, sin repetidos (<code>JOIN<\/code> y <code>DISTINCT<\/code>).<\/p>\n\n<h3>Parte 3: datos iniciales (1 punto)<\/h3>\n<p class=\"paso\"><b>14.<\/b> Escribe un <code>data.sql<\/code> (o las instrucciones equivalentes en el <code>CommandLineRunner<\/code>) con:<\/p>\n<ul>\n<li>2 hospitales<\/li>\n<li>4 m\u00e9dicos repartidos entre ellos, con especialidades distintas<\/li>\n<li>3 pacientes, cada uno con su historial<\/li>\n<li>5 consultas, con al menos un m\u00e9dico que atienda a dos pacientes y un paciente atendido por dos m\u00e9dicos<\/li>\n<\/ul>\n<p>Respeta el orden de inserci\u00f3n y los textos exactos de los enums.<\/p>\n<p class=\"paso\"><b>15.<\/b> Desde <code>run()<\/code>, crea y guarda un paciente nuevo con su historial y una consulta suya con un m\u00e9dico ya existente. Indica en qu\u00e9 orden guardas cada objeto y por qu\u00e9.<\/p>\n\n<h3>Parte 4: API REST por capas (3 puntos)<\/h3>\n<p class=\"paso\"><b>16.<\/b> <b>DTO.<\/b> Crea:<\/p>\n<ul>\n<li><code>MedicoRequestDTO<\/code>: <code>nombre<\/code>, <code>salario<\/code>, <code>especialidad<\/code>, <code>hospitalId<\/code>. A\u00f1ade validaciones con <code>@Valid<\/code>: nombre no vac\u00edo, salario positivo y todos los campos obligatorios.<\/li>\n<li><code>MedicoResponseDTO<\/code>: <code>id<\/code>, <code>nombre<\/code>, <code>especialidad<\/code>, <code>nombreHospital<\/code>.<\/li>\n<li><code>ConsultaResumenDTO<\/code>: <code>fecha<\/code>, <code>nombreMedico<\/code>, <code>tipo<\/code>, <code>coste<\/code>.<\/li>\n<li><code>PacienteResponseDTO<\/code>: <code>id<\/code>, <code>nombre<\/code>, <code>numeroHistorial<\/code>, <code>grupoSanguineo<\/code> y una lista de <code>ConsultaResumenDTO<\/code>.<\/li>\n<\/ul>\n<p class=\"paso\"><b>17.<\/b> Justifica por qu\u00e9 no devuelves directamente las entidades en el controlador. Da dos motivos (por ejemplo, la recursi\u00f3n infinita en las relaciones bidireccionales).<\/p>\n<p class=\"paso\"><b>18.<\/b> <b>Servicio.<\/b> Crea la interfaz <code>IMedicoService<\/code> y su implementaci\u00f3n <code>MedicoService<\/code>, con <code>@Autowired<\/code> en los repositorios necesarios. Implementa:<\/p>\n<ul>\n<li><code>crear(MedicoRequestDTO)<\/code>. Si no existe el hospital, lanza la excepci\u00f3n de \u00abno encontrado\u00bb.<\/li>\n<li><code>obtener(Long id)<\/code>.<\/li>\n<li><code>listarPorHospital(Long hospitalId)<\/code>. Si el hospital no existe, lanza \u00abno encontrado\u00bb. Una lista vac\u00eda es v\u00e1lida.<\/li>\n<li><code>eliminar(Long id)<\/code>. Si el m\u00e9dico tiene consultas, lanza una excepci\u00f3n de conflicto.<\/li>\n<li>Un m\u00e9todo privado de conversi\u00f3n <code>Medico \u2192 MedicoResponseDTO<\/code>.<\/li>\n<\/ul>\n<p class=\"paso\"><b>19.<\/b> <b>Controlador.<\/b> Crea <code>MedicoController<\/code> con estos endpoints. Indica el c\u00f3digo HTTP de \u00e9xito y los de error.<\/p>\n<table>\n<tr><th>Endpoint<\/th><th>\u00c9xito<\/th><th>Errores<\/th><\/tr>\n<tr><td><code>POST /api/medicos<\/code><\/td><td>\u00bf?<\/td><td>\u00bf?<\/td><\/tr>\n<tr><td><code>GET /api/medicos/{id}<\/code><\/td><td>\u00bf?<\/td><td>\u00bf?<\/td><\/tr>\n<tr><td><code>GET /api/medicos?hospitalId=<\/code><\/td><td>\u00bf?<\/td><td>\u00bf?<\/td><\/tr>\n<tr><td><code>DELETE /api/medicos/{id}<\/code><\/td><td>\u00bf?<\/td><td>\u00bf?<\/td><\/tr>\n<\/table>\n<p>El <code>POST<\/code> debe devolver la cabecera <code>Location<\/code> con la URI del recurso creado.<\/p>\n<p class=\"paso\"><b>20.<\/b> Crea un <code>@RestControllerAdvice<\/code> que transforme <code>NoEncontradoException<\/code> en 404, <code>ConflictoException<\/code> en 409 y los errores de validaci\u00f3n en 400. Devuelve un cuerpo JSON con <code>mensaje<\/code> y <code>codigo<\/code>.<\/p>\n<p class=\"paso\"><b>21.<\/b> A\u00f1ade el endpoint <code>POST /api/pacientes/{id}/consultas<\/code>, que registra una consulta recibiendo <code>medicoId<\/code>, <code>fecha<\/code>, <code>coste<\/code> y <code>tipo<\/code>. Indica:<\/p>\n<ul>\n<li>a) qu\u00e9 entidades hay que buscar antes de crear la consulta,<\/li>\n<li>b) qu\u00e9 c\u00f3digos devuelves si falta alguna,<\/li>\n<li>c) qu\u00e9 DTO devuelves como respuesta.<\/li>\n<\/ul>\n\n<h3>Parte 5: preguntas de comprensi\u00f3n (1,5 puntos)<\/h3>\n<p class=\"paso\"><b>22.<\/b> Una petici\u00f3n <code>GET /api/pacientes/3<\/code> lanza <code>LazyInitializationException<\/code>. Explica por qu\u00e9 puede ocurrir y c\u00f3mo lo evitar\u00edas.<\/p>\n<p class=\"paso\"><b>23.<\/b> Al serializar un <code>Hospital<\/code> con su lista de m\u00e9dicos, el JSON entra en un bucle infinito. Explica la causa y da dos soluciones.<\/p>\n<p class=\"paso\"><b>24.<\/b> <code>DELETE /api/hospitales/1<\/code> devuelve 500 por una violaci\u00f3n de clave for\u00e1nea. \u00bfQu\u00e9 c\u00f3digo deber\u00eda devolver y qu\u00e9 comprobaci\u00f3n falta en el servicio?<\/p>\n<p class=\"paso\"><b>25.<\/b> Dibuja el esquema de tablas (con claves primarias y for\u00e1neas) que genera todo el modelo y marca d\u00f3nde est\u00e1 cada clave for\u00e1nea.<\/p>\n\n<div class=\"why\">Intenta hacerlo t\u00fa primero y no abras el solucionario hasta terminar: lo que m\u00e1s ense\u00f1a es comparar tus fallos con la soluci\u00f3n.<\/div>\n  <nav class=\"nav pie\"><a href=\"#\">\u2190 Todos los ejercicios<\/a> <a href=\"#solucion-2\">Ir al solucionario \u2192<\/a><\/nav>\n<\/section>\n\n<section class=\"panel\" id=\"solucion-2\">\n  <nav class=\"nav\"><a href=\"#ejercicio-2\">\u2190 Volver al enunciado<\/a> <a href=\"#\">\u2190 Todos los ejercicios<\/a><\/nav>\n  <header><p class=\"n\">EJERCICIO 2 \u00b7 SOLUCIONARIO<\/p><h2>El hospital \u00abSan Gabriel\u00bb<\/h2><\/header>\n<p>Esta es <b>una<\/b> soluci\u00f3n posible: hay otras igual de v\u00e1lidas. Lo importante es que entiendas <i>por qu\u00e9<\/i> est\u00e1 hecha as\u00ed. Cada pregunta del enunciado tiene aqu\u00ed su respuesta, con el n\u00famero que lleva all\u00ed.<\/p>\n<div class=\"warn\">No mires esto hasta haber hecho el ejercicio. Despu\u00e9s, compara <b>tus fallos<\/b> con la soluci\u00f3n: ah\u00ed es donde se aprende.<\/div>\n\n<h3>Parte 1: entidades y relaciones<\/h3>\n\n<p class=\"paso\"><b>1.<\/b> Los dos enums, cada uno en su archivo del paquete <code>enums<\/code>:<\/p>\n<pre data-f=\"enums/Especialidad.java\">package com.hospital.examen.enums;\n\npublic enum Especialidad {\n    CARDIOLOGIA, PEDIATRIA, TRAUMATOLOGIA, NEUROLOGIA\n}<\/pre>\n<pre data-f=\"enums/TipoConsulta.java\">package com.hospital.examen.enums;\n\npublic enum TipoConsulta {\n    PRESENCIAL, URGENCIA, TELEMATICA\n}<\/pre>\n\n<p class=\"paso\"><b>2 y 6.<\/b> <code>Hospital<\/code> es el lado \u00abuno\u00bb de la relaci\u00f3n bidireccional con <code>Medico<\/code>. Lleva <code>mappedBy<\/code> y <b>no lleva cascada<\/b>: borrar un hospital no borra a sus m\u00e9dicos.<\/p>\n<pre data-f=\"entity/Hospital.java\">package com.hospital.examen.entity;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.OneToMany;\nimport jakarta.persistence.Table;\n\n@Entity\n@Table(name = \"hospitales\")\npublic class Hospital {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_hospital\")\n    private Long id;\n\n    @Column(nullable = false, length = 80)\n    private String nombre;\n\n    @Column(nullable = false)\n    private String ciudad;\n\n    // Lado inverso: la clave for\u00e1nea est\u00e1 en Medico. Sin cascade: borrar el hospital no borra a los m\u00e9dicos.\n    @OneToMany(mappedBy = \"hospital\")\n    private List&lt;Medico&gt; medicos = new ArrayList&lt;&gt;();\n\n    public Hospital() {}\n\n    public Hospital(String nombre, String ciudad) {\n        this.nombre = nombre;\n        this.ciudad = ciudad;\n    }\n\n    // Mantiene sincronizados los dos lados de la relaci\u00f3n\n    public void addMedico(Medico medico) {\n        medicos.add(medico);\n        medico.setHospital(this);\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public String getCiudad() { return ciudad; }\n    public List&lt;Medico&gt; getMedicos() { return medicos; }\n}<\/pre>\n\n<p class=\"paso\"><b>3 y 6.<\/b> <code>Medico<\/code> es el <b>propietario<\/b> de la relaci\u00f3n con <code>Hospital<\/code>: tiene la clave for\u00e1nea <code>id_hospital<\/code>, obligatoria y con carga perezosa. Su lista de consultas es el lado inverso y <b>sin cascada<\/b>.<\/p>\n<pre data-f=\"entity/Medico.java\">package com.hospital.examen.entity;\n\nimport java.math.BigDecimal;\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport com.hospital.examen.enums.Especialidad;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.EnumType;\nimport jakarta.persistence.Enumerated;\nimport jakarta.persistence.FetchType;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.JoinColumn;\nimport jakarta.persistence.ManyToOne;\nimport jakarta.persistence.OneToMany;\nimport jakarta.persistence.Table;\n\n@Entity\n@Table(name = \"medicos\")\npublic class Medico {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_medico\")\n    private Long id;\n\n    @Column(nullable = false)\n    private String nombre;\n\n    @Column(nullable = false, precision = 10, scale = 2)\n    private BigDecimal salario;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 20)\n    private Especialidad especialidad;\n\n    private boolean activo;\n\n    // Lado propietario: aqu\u00ed est\u00e1 la columna id_hospital\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"id_hospital\", nullable = false)\n    private Hospital hospital;\n\n    // Lado inverso del N:M con datos, sin cascada\n    @OneToMany(mappedBy = \"medico\")\n    private List&lt;Consulta&gt; consultas = new ArrayList&lt;&gt;();\n\n    public Medico() {}\n\n    public Medico(String nombre, BigDecimal salario, Especialidad especialidad, boolean activo) {\n        this.nombre = nombre;\n        this.salario = salario;\n        this.especialidad = especialidad;\n        this.activo = activo;\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public BigDecimal getSalario() { return salario; }\n    public Especialidad getEspecialidad() { return especialidad; }\n    public boolean isActivo() { return activo; }\n    public Hospital getHospital() { return hospital; }\n    public void setHospital(Hospital hospital) { this.hospital = hospital; }\n    public List&lt;Consulta&gt; getConsultas() { return consultas; }\n}<\/pre>\n\n<p class=\"paso\"><b>5.<\/b> <code>HistorialClinico<\/code>. Las alergias pueden ser nulas, as\u00ed que ese campo no lleva <code>nullable = false<\/code>.<\/p>\n<pre data-f=\"entity/HistorialClinico.java\">package com.hospital.examen.entity;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.Table;\n\n@Entity\n@Table(name = \"historiales\")\npublic class HistorialClinico {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_historial\")\n    private Long id;\n\n    @Column(name = \"numero_historial\", nullable = false, unique = true, length = 15)\n    private String numeroHistorial;\n\n    @Column(name = \"grupo_sanguineo\", nullable = false, length = 3)\n    private String grupoSanguineo;\n\n    @Column(length = 500)\n    private String alergias;\n\n    public HistorialClinico() {}\n\n    public HistorialClinico(String numeroHistorial, String grupoSanguineo, String alergias) {\n        this.numeroHistorial = numeroHistorial;\n        this.grupoSanguineo = grupoSanguineo;\n        this.alergias = alergias;\n    }\n\n    public Long getId() { return id; }\n    public String getNumeroHistorial() { return numeroHistorial; }\n    public String getGrupoSanguineo() { return grupoSanguineo; }\n    public String getAlergias() { return alergias; }\n}<\/pre>\n\n<p class=\"paso\"><b>4, 7 y 8.<\/b> <code>Paciente<\/code>. Es el propietario del 1:1 con <code>HistorialClinico<\/code> (<code>id_historial<\/code>, obligatoria y \u00fanica), con cascada total. Y es el lado \u00abuno\u00bb de <code>Consulta<\/code>, con <code>orphanRemoval<\/code>. El <b>constructor<\/b> recibe el historial, as\u00ed que es imposible crear un paciente sin \u00e9l.<\/p>\n<pre data-f=\"entity/Paciente.java\">package com.hospital.examen.entity;\n\nimport java.time.LocalDate;\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport jakarta.persistence.CascadeType;\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.JoinColumn;\nimport jakarta.persistence.OneToMany;\nimport jakarta.persistence.OneToOne;\nimport jakarta.persistence.Table;\n\n@Entity\n@Table(name = \"pacientes\")\npublic class Paciente {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_paciente\")\n    private Long id;\n\n    @Column(nullable = false)\n    private String nombre;\n\n    @Column(name = \"fecha_nacimiento\", nullable = false)\n    private LocalDate fechaNacimiento;\n\n    // Propietario del 1:1. La cascada guarda y borra el historial junto con el paciente.\n    @OneToOne(cascade = CascadeType.ALL, optional = false)\n    @JoinColumn(name = \"id_historial\", nullable = false, unique = true)\n    private HistorialClinico historial;\n\n    // Lado inverso del N:M con datos: las consultas se borran con el paciente\n    @OneToMany(mappedBy = \"paciente\", cascade = CascadeType.ALL, orphanRemoval = true)\n    private List&lt;Consulta&gt; consultas = new ArrayList&lt;&gt;();\n\n    // Lo necesita JPA para crear objetos al leer de la base. No lo uses t\u00fa.\n    public Paciente() {}\n\n    // \u00danica forma de crear un paciente: obliga a darle su historial\n    public Paciente(String nombre, LocalDate fechaNacimiento, HistorialClinico historial) {\n        this.nombre = nombre;\n        this.fechaNacimiento = fechaNacimiento;\n        this.historial = historial;\n    }\n\n    public void addConsulta(Consulta consulta) {\n        consultas.add(consulta);\n        consulta.setPaciente(this);\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public LocalDate getFechaNacimiento() { return fechaNacimiento; }\n    public HistorialClinico getHistorial() { return historial; }\n    public List&lt;Consulta&gt; getConsultas() { return consultas; }\n}<\/pre>\n\n<p class=\"paso\"><b>7 (pregunta).<\/b> <code>optional = false<\/code> es una regla del <b>modelo Java<\/b>: dice que la relaci\u00f3n es obligatoria, as\u00ed que JPA no permite guardar un paciente sin historial (y puede optimizar sabiendo que nunca es nulo). <code>unique = true<\/code> (en el <code>@JoinColumn<\/code>) es una regla de la <b>base de datos<\/b>: crea una restricci\u00f3n de unicidad en <code>id_historial<\/code>, de modo que dos pacientes no pueden compartir el mismo historial. Sin ella la relaci\u00f3n ser\u00eda en realidad de uno a muchos. Junto con <code>nullable = false<\/code> (la columna no admite <code>NULL<\/code>), dejan la relaci\u00f3n como \u00abuno a uno obligatoria\u00bb tanto en Java como en MySQL.<\/p>\n\n<p class=\"paso\"><b>8.<\/b> <code>Consulta<\/code> es la entidad que representa la relaci\u00f3n N:M con datos. Tiene dos <code>@ManyToOne<\/code> y es la propietaria de las dos claves for\u00e1neas.<\/p>\n<pre data-f=\"entity/Consulta.java\">package com.hospital.examen.entity;\n\nimport java.math.BigDecimal;\nimport java.time.LocalDateTime;\n\nimport com.hospital.examen.enums.TipoConsulta;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.EnumType;\nimport jakarta.persistence.Enumerated;\nimport jakarta.persistence.FetchType;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.JoinColumn;\nimport jakarta.persistence.ManyToOne;\nimport jakarta.persistence.Table;\n\n@Entity\n@Table(name = \"consultas\")\npublic class Consulta {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_consulta\")\n    private Long id;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"id_medico\", nullable = false)\n    private Medico medico;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"id_paciente\", nullable = false)\n    private Paciente paciente;\n\n    @Column(nullable = false)\n    private LocalDateTime fecha;\n\n    @Column(nullable = false, precision = 10, scale = 2)\n    private BigDecimal coste;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 20)\n    private TipoConsulta tipo;\n\n    private boolean seguimiento;\n\n    public Consulta() {}\n\n    // El paciente no va aqu\u00ed: se asigna con paciente.addConsulta(...)\n    public Consulta(Medico medico, LocalDateTime fecha, BigDecimal coste, TipoConsulta tipo, boolean seguimiento) {\n        this.medico = medico;\n        this.fecha = fecha;\n        this.coste = coste;\n        this.tipo = tipo;\n        this.seguimiento = seguimiento;\n    }\n\n    public Long getId() { return id; }\n    public Medico getMedico() { return medico; }\n    public Paciente getPaciente() { return paciente; }\n    public void setPaciente(Paciente paciente) { this.paciente = paciente; }\n    public LocalDateTime getFecha() { return fecha; }\n    public BigDecimal getCoste() { return coste; }\n    public TipoConsulta getTipo() { return tipo; }\n    public boolean isSeguimiento() { return seguimiento; }\n}<\/pre>\n\n<p class=\"paso\"><b>9.<\/b> Respuestas:<\/p>\n<ul>\n<li><b>a)<\/b> Porque la relaci\u00f3n <b>tiene datos propios<\/b> (fecha, coste, tipo y seguimiento). Un <code>@ManyToMany<\/code> directo solo crea una tabla intermedia con dos ids y no puede guardar nada m\u00e1s. Con <code>Consulta<\/code>, la tabla intermedia pasa a ser una entidad con sus propias columnas, y la relaci\u00f3n se convierte en dos <code>@ManyToOne<\/code>.<\/li>\n<li><b>b)<\/b> Las claves for\u00e1neas son <code>medicos.id_hospital<\/code>, <code>pacientes.id_historial<\/code>, <code>consultas.id_medico<\/code> y <code>consultas.id_paciente<\/code>. <b>Siempre est\u00e1n en el lado propietario<\/b> (el que lleva <code>@JoinColumn<\/code>); el lado con <code>mappedBy<\/code> no tiene columna.<\/li>\n<li><b>c)<\/b> Al borrar un hospital se borrar\u00edan <b>tambi\u00e9n todos sus m\u00e9dicos<\/b> (y, por la cadena de relaciones, podr\u00eda fallar o arrastrar m\u00e1s datos), aunque tengan consultas hist\u00f3ricas. Es una p\u00e9rdida masiva de datos en vez de una protecci\u00f3n de integridad. Por eso <code>Hospital<\/code> no lleva cascada, y borrar un hospital con m\u00e9dicos se responde con un 409.<\/li>\n<\/ul>\n\n<h3>Parte 2: repositorios y consultas<\/h3>\n\n<p class=\"paso\"><b>10.<\/b> Cada repositorio es una interfaz que extiende <code>JpaRepository&lt;Entidad, Long&gt;<\/code>. Los de hospitales, historiales y pacientes:<\/p>\n<pre data-f=\"repository/IHospitalRepository.java\">package com.hospital.examen.repository;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport com.hospital.examen.entity.Hospital;\n\npublic interface IHospitalRepository extends JpaRepository&lt;Hospital, Long&gt; {\n}<\/pre>\n<pre data-f=\"repository/IHistorialClinicoRepository.java\">package com.hospital.examen.repository;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport com.hospital.examen.entity.HistorialClinico;\n\npublic interface IHistorialClinicoRepository extends JpaRepository&lt;HistorialClinico, Long&gt; {\n}<\/pre>\n\n<p class=\"paso\"><b>11.<\/b> M\u00e9dicos:<\/p>\n<pre data-f=\"repository/IMedicoRepository.java\">package com.hospital.examen.repository;\n\nimport java.math.BigDecimal;\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Query;\n\nimport com.hospital.examen.entity.Medico;\nimport com.hospital.examen.enums.Especialidad;\n\npublic interface IMedicoRepository extends JpaRepository&lt;Medico, Long&gt; {\n\n    // a) M\u00e9dicos de una especialidad\n    List&lt;Medico&gt; findByEspecialidad(Especialidad especialidad);\n\n    // b) Activos de un hospital: \"HospitalId\" navega por medico.hospital.id\n    List&lt;Medico&gt; findByHospitalIdAndActivoTrue(Long hospitalId);\n\n    // c) Salario mayor que X, de mayor a menor\n    List&lt;Medico&gt; findBySalarioGreaterThanOrderBySalarioDesc(BigDecimal salario);\n\n    // d) Cu\u00e1ntos m\u00e9dicos tiene cada hospital: cada fila es [nombre del hospital, cantidad]\n    @Query(\"SELECT h.nombre, COUNT(m) FROM Medico m JOIN m.hospital h GROUP BY h.id, h.nombre\")\n    List&lt;Object[]&gt; contarPorHospital();\n\n    // Lo usa el servicio\n    List&lt;Medico&gt; findByHospitalId(Long hospitalId);\n\n    long countByHospitalId(Long hospitalId);\n}<\/pre>\n\n<p class=\"paso\"><b>12.<\/b> Consultas:<\/p>\n<pre data-f=\"repository/IConsultaRepository.java\">package com.hospital.examen.repository;\n\nimport java.math.BigDecimal;\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.repository.query.Param;\n\nimport com.hospital.examen.entity.Consulta;\nimport com.hospital.examen.enums.TipoConsulta;\n\npublic interface IConsultaRepository extends JpaRepository&lt;Consulta, Long&gt; {\n\n    // a) De un paciente, de la m\u00e1s reciente a la m\u00e1s antigua\n    List&lt;Consulta&gt; findByPacienteIdOrderByFechaDesc(Long pacienteId);\n\n    // b) Suma del coste de las consultas de un m\u00e9dico (SUM devuelve null si no tiene ninguna)\n    @Query(\"SELECT SUM(c.coste) FROM Consulta c WHERE c.medico.id = :medicoId\")\n    BigDecimal sumaCostePorMedico(@Param(\"medicoId\") Long medicoId);\n\n    // c) Urgencias con seguimiento activo: findByTipoAndSeguimientoTrue(TipoConsulta.URGENCIA)\n    List&lt;Consulta&gt; findByTipoAndSeguimientoTrue(TipoConsulta tipo);\n\n    // Lo usa el servicio para impedir borrar un m\u00e9dico con consultas\n    long countByMedicoId(Long medicoId);\n}<\/pre>\n\n<p class=\"paso\"><b>13.<\/b> Pacientes. La consulta necesita <code>JOIN<\/code> (hay que pasar por <code>consultas<\/code>) y <code>DISTINCT<\/code> (un paciente atendido varias veces por el mismo m\u00e9dico saldr\u00eda repetido).<\/p>\n<pre data-f=\"repository/IPacienteRepository.java\">package com.hospital.examen.repository;\n\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.repository.query.Param;\n\nimport com.hospital.examen.entity.Paciente;\n\npublic interface IPacienteRepository extends JpaRepository&lt;Paciente, Long&gt; {\n\n    // Pacientes atendidos por un m\u00e9dico, sin repetidos\n    @Query(\"SELECT DISTINCT p FROM Paciente p JOIN p.consultas c WHERE c.medico.id = :medicoId\")\n    List&lt;Paciente&gt; buscarAtendidosPor(@Param(\"medicoId\") Long medicoId);\n}<\/pre>\n\n<h3>Parte 3: datos iniciales<\/h3>\n\n<p class=\"paso\"><b>14.<\/b> En <code>application.properties<\/code> (adem\u00e1s de la conexi\u00f3n a MySQL de siempre):<\/p>\n<pre data-f=\"src/main/resources/application.properties (a\u00f1adir)\">spring.jpa.hibernate.ddl-auto=create-drop\nspring.sql.init.mode=always\nspring.jpa.defer-datasource-initialization=true<\/pre>\n<p>Y el <code>data.sql<\/code>. <b>El orden importa:<\/b> primero lo que otros van a apuntar (hospitales e historiales) y despu\u00e9s lo que apunta (m\u00e9dicos, pacientes, consultas).<\/p>\n<pre data-f=\"src/main/resources/data.sql\">INSERT INTO hospitales (id_hospital, nombre, ciudad)\nVALUES (1, 'San Gabriel Centro', 'Madrid'),\n       (2, 'San Gabriel Norte', 'Bilbao');\n\nINSERT INTO medicos (id_medico, nombre, salario, especialidad, activo, id_hospital)\nVALUES (1, 'Dra. Ana Lozano', 4200.00, 'CARDIOLOGIA', true, 1),\n       (2, 'Dr. Pablo Mar\u00edn', 3800.00, 'PEDIATRIA', true, 1),\n       (3, 'Dra. Eva Ruiz', 4500.00, 'TRAUMATOLOGIA', false, 2),\n       (4, 'Dr. Hugo Vega', 4000.00, 'NEUROLOGIA', true, 2);\n\nINSERT INTO historiales (id_historial, numero_historial, grupo_sanguineo, alergias)\nVALUES (1, 'H-0001', 'A+', NULL),\n       (2, 'H-0002', 'O-', 'Penicilina'),\n       (3, 'H-0003', 'B+', NULL);\n\nINSERT INTO pacientes (id_paciente, nombre, fecha_nacimiento, id_historial)\nVALUES (1, 'Carmen D\u00edaz', '1985-04-12', 1),\n       (2, 'Iv\u00e1n Torres', '2015-09-30', 2),\n       (3, 'Rosa Campos', '1960-01-25', 3);\n\nINSERT INTO consultas (id_consulta, id_medico, id_paciente, fecha, coste, tipo, seguimiento)\nVALUES (1, 1, 1, '2026-10-01 09:30:00', 120.00, 'PRESENCIAL', true),\n       (2, 1, 3, '2026-10-03 11:00:00', 120.00, 'TELEMATICA', false),\n       (3, 2, 2, '2026-10-05 16:15:00', 80.00, 'PRESENCIAL', false),\n       (4, 4, 1, '2026-10-08 18:40:00', 200.00, 'URGENCIA', true),\n       (5, 3, 3, '2026-10-10 08:00:00', 150.00, 'URGENCIA', false);<\/pre>\n<div class=\"ok\">Se cumple lo que ped\u00eda el enunciado: la <b>Dra. Lozano<\/b> atiende a dos pacientes (consultas 1 y 2) y <b>Carmen<\/b> es atendida por dos m\u00e9dicos (la Dra. Lozano y el Dr. Vega, consultas 1 y 4).<\/div>\n\n<p class=\"paso\"><b>15.<\/b> La clase principal, con el <code>run()<\/code> que crea un paciente nuevo con su historial y una consulta:<\/p>\n<pre data-f=\"HospitalApplication.java\">package com.hospital.examen;\n\nimport java.math.BigDecimal;\nimport java.time.LocalDate;\nimport java.time.LocalDateTime;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.CommandLineRunner;\nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\nimport com.hospital.examen.entity.Consulta;\nimport com.hospital.examen.entity.HistorialClinico;\nimport com.hospital.examen.entity.Medico;\nimport com.hospital.examen.entity.Paciente;\nimport com.hospital.examen.enums.TipoConsulta;\nimport com.hospital.examen.repository.IMedicoRepository;\nimport com.hospital.examen.repository.IPacienteRepository;\n\n@SpringBootApplication\npublic class HospitalApplication implements CommandLineRunner {\n\n    @Autowired\n    private IPacienteRepository pacienteRepository;\n\n    @Autowired\n    private IMedicoRepository medicoRepository;\n\n    public static void main(String[] args) {\n        SpringApplication.run(HospitalApplication.class, args);\n    }\n\n    @Override\n    public void run(String... args) {\n        // 1) El m\u00e9dico ya existe (lo carg\u00f3 data.sql): solo hay que buscarlo\n        Medico medico = medicoRepository.findById(2L).orElseThrow();\n\n        // 2) El historial se crea primero porque el constructor de Paciente lo exige\n        HistorialClinico historial = new HistorialClinico(\"H-0004\", \"0+\", null);\n        Paciente paciente = new Paciente(\"Lucas Prieto\", LocalDate.of(2001, 6, 18), historial);\n\n        // 3) La consulta se cuelga del paciente\n        paciente.addConsulta(new Consulta(medico, LocalDateTime.now(), new BigDecimal(\"90.00\"),\n                TipoConsulta.PRESENCIAL, false));\n\n        // 4) Un solo save: la cascada guarda el historial y la consulta\n        pacienteRepository.save(paciente);\n        System.out.println(\"Paciente guardado con id \" + paciente.getId());\n    }\n}<\/pre>\n<p><b>Por qu\u00e9 este orden:<\/b> el m\u00e9dico tiene que existir antes, porque la consulta apunta a \u00e9l. El historial se crea antes que el paciente porque el constructor lo exige. Y gracias a <code>cascade = ALL<\/code>, un solo <code>save(paciente)<\/code> inserta el historial (primero, porque el paciente guarda su clave for\u00e1nea), el paciente y, por \u00faltimo, la consulta, que necesita el id del paciente.<\/p>\n\n<h3>Parte 4: API REST por capas<\/h3>\n\n<p class=\"paso\"><b>16.<\/b> Los DTO, como <code>record<\/code>. Los de entrada llevan validaciones; los de salida, no. <code>ConsultaResumenDTO<\/code> es la pieza anidada de <code>PacienteResponseDTO<\/code>: solo lleva lo necesario de una consulta, sin volver al paciente (as\u00ed no hay bucles). Para el endpoint de la pregunta 21 a\u00f1ado <code>ConsultaRequestDTO<\/code>.<\/p>\n<pre data-f=\"dto/MedicoRequestDTO.java\">package com.hospital.examen.dto;\n\nimport java.math.BigDecimal;\n\nimport com.hospital.examen.enums.Especialidad;\n\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.Positive;\n\npublic record MedicoRequestDTO(\n        @NotBlank(message = \"El nombre es obligatorio\") String nombre,\n        @NotNull(message = \"El salario es obligatorio\") @Positive(message = \"El salario debe ser positivo\") BigDecimal salario,\n        @NotNull(message = \"La especialidad es obligatoria\") Especialidad especialidad,\n        @NotNull(message = \"El hospital es obligatorio\") Long hospitalId) {\n}<\/pre>\n<pre data-f=\"dto/MedicoResponseDTO.java\">package com.hospital.examen.dto;\n\nimport com.hospital.examen.enums.Especialidad;\n\npublic record MedicoResponseDTO(Long id, String nombre, Especialidad especialidad, String nombreHospital) {\n}<\/pre>\n<pre data-f=\"dto/ConsultaResumenDTO.java\">package com.hospital.examen.dto;\n\nimport java.math.BigDecimal;\nimport java.time.LocalDateTime;\n\nimport com.hospital.examen.enums.TipoConsulta;\n\npublic record ConsultaResumenDTO(LocalDateTime fecha, String nombreMedico, TipoConsulta tipo, BigDecimal coste) {\n}<\/pre>\n<pre data-f=\"dto/PacienteResponseDTO.java\">package com.hospital.examen.dto;\n\nimport java.util.List;\n\npublic record PacienteResponseDTO(\n        Long id,\n        String nombre,\n        String numeroHistorial,\n        String grupoSanguineo,\n        List&lt;ConsultaResumenDTO&gt; consultas) {\n}<\/pre>\n<pre data-f=\"dto/ConsultaRequestDTO.java\">package com.hospital.examen.dto;\n\nimport java.math.BigDecimal;\nimport java.time.LocalDateTime;\n\nimport com.hospital.examen.enums.TipoConsulta;\n\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.PositiveOrZero;\n\npublic record ConsultaRequestDTO(\n        @NotNull(message = \"El m\u00e9dico es obligatorio\") Long medicoId,\n        @NotNull(message = \"La fecha es obligatoria\") LocalDateTime fecha,\n        @NotNull(message = \"El coste es obligatorio\") @PositiveOrZero(message = \"El coste no puede ser negativo\") BigDecimal coste,\n        @NotNull(message = \"El tipo es obligatorio\") TipoConsulta tipo) {\n}<\/pre>\n\n<p class=\"paso\"><b>17.<\/b> Dos motivos para no devolver las entidades:<\/p>\n<ul>\n<li><b>Recursi\u00f3n infinita.<\/b> <code>Hospital<\/code> tiene una lista de <code>Medico<\/code> y cada <code>Medico<\/code> apunta a su <code>Hospital<\/code>: al serializar a JSON, Jackson entra en un bucle (hospital \u2192 m\u00e9dicos \u2192 hospital \u2192 \u2026) y falla con un <code>StackOverflowError<\/code> o similar. Los DTO, con sus \u00abres\u00famenes\u00bb, cortan el bucle.<\/li>\n<li><b>Se expone la base de datos.<\/b> La entidad lleva campos que el cliente no debe ver o decidir (ids internos, la lista completa de consultas, etc.), y atar la API a la entidad hace que cualquier cambio en el modelo rompa a los clientes. Adem\u00e1s, las relaciones <code>LAZY<\/code> se intentar\u00edan leer fuera de la transacci\u00f3n (<code>LazyInitializationException<\/code>).<\/li>\n<\/ul>\n\n<p class=\"paso\"><b>18.<\/b> <b>El servicio.<\/b> Para comunicar los resultados al controlador uso <b>excepciones propias<\/b>: <code>NoEncontradoException<\/code> (\u2192 404) y <code>ConflictoException<\/code> (\u2192 409). Un <code>@RestControllerAdvice<\/code> (pregunta 20) las traduce a c\u00f3digo HTTP en un solo sitio, y el controlador queda limpio.<\/p>\n<pre data-f=\"exception/NoEncontradoException.java\">package com.hospital.examen.exception;\n\npublic class NoEncontradoException extends RuntimeException {\n    public NoEncontradoException(String mensaje) {\n        super(mensaje);\n    }\n}<\/pre>\n<pre data-f=\"exception/ConflictoException.java\">package com.hospital.examen.exception;\n\npublic class ConflictoException extends RuntimeException {\n    public ConflictoException(String mensaje) {\n        super(mensaje);\n    }\n}<\/pre>\n<p>El contrato solo habla de DTO:<\/p>\n<pre data-f=\"service/IMedicoService.java\">package com.hospital.examen.service;\n\nimport java.util.List;\n\nimport com.hospital.examen.dto.MedicoRequestDTO;\nimport com.hospital.examen.dto.MedicoResponseDTO;\n\npublic interface IMedicoService {\n\n    MedicoResponseDTO crear(MedicoRequestDTO dto);\n\n    MedicoResponseDTO obtener(Long id);\n\n    List&lt;MedicoResponseDTO&gt; listarPorHospital(Long hospitalId);\n\n    void eliminar(Long id);\n}<\/pre>\n<p>Y la implementaci\u00f3n. Cada m\u00e9todo que lee relaciones perezosas va con <code>@Transactional<\/code>, y la conversi\u00f3n a DTO se hace <b>dentro<\/b> del servicio:<\/p>\n<pre data-f=\"service/MedicoService.java\">package com.hospital.examen.service;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport com.hospital.examen.dto.MedicoRequestDTO;\nimport com.hospital.examen.dto.MedicoResponseDTO;\nimport com.hospital.examen.entity.Hospital;\nimport com.hospital.examen.entity.Medico;\nimport com.hospital.examen.exception.ConflictoException;\nimport com.hospital.examen.exception.NoEncontradoException;\nimport com.hospital.examen.repository.IConsultaRepository;\nimport com.hospital.examen.repository.IHospitalRepository;\nimport com.hospital.examen.repository.IMedicoRepository;\n\n@Service\npublic class MedicoService implements IMedicoService {\n\n    @Autowired\n    private IMedicoRepository medicoRepository;\n\n    @Autowired\n    private IHospitalRepository hospitalRepository;\n\n    @Autowired\n    private IConsultaRepository consultaRepository;\n\n    @Override\n    @Transactional\n    public MedicoResponseDTO crear(MedicoRequestDTO dto) {\n        Hospital hospital = buscarHospital(dto.hospitalId());\n        // DTO -&gt; Entity. Un m\u00e9dico nuevo empieza activo.\n        Medico medico = new Medico(dto.nombre(), dto.salario(), dto.especialidad(), true);\n        hospital.addMedico(medico);\n        return mapearADTO(medicoRepository.save(medico));\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public MedicoResponseDTO obtener(Long id) {\n        return mapearADTO(buscarMedico(id));\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public List&lt;MedicoResponseDTO&gt; listarPorHospital(Long hospitalId) {\n        buscarHospital(hospitalId);   // si no existe, lanza \"no encontrado\"\n        List&lt;MedicoResponseDTO&gt; lista = new ArrayList&lt;&gt;();\n        for (Medico m : medicoRepository.findByHospitalId(hospitalId)) {\n            lista.add(mapearADTO(m));\n        }\n        return lista;   // una lista vac\u00eda es v\u00e1lida\n    }\n\n    @Override\n    @Transactional\n    public void eliminar(Long id) {\n        Medico medico = buscarMedico(id);\n        if (consultaRepository.countByMedicoId(id) &gt; 0) {\n            throw new ConflictoException(\"El m\u00e9dico tiene consultas registradas\");\n        }\n        medicoRepository.delete(medico);\n    }\n\n    private Hospital buscarHospital(Long id) {\n        return hospitalRepository.findById(id)\n                .orElseThrow(() -&gt; new NoEncontradoException(\"No existe el hospital \" + id));\n    }\n\n    private Medico buscarMedico(Long id) {\n        return medicoRepository.findById(id)\n                .orElseThrow(() -&gt; new NoEncontradoException(\"No existe el m\u00e9dico \" + id));\n    }\n\n    // Entity -&gt; DTO (el hospital es LAZY: por eso se hace dentro de la transacci\u00f3n)\n    private MedicoResponseDTO mapearADTO(Medico m) {\n        return new MedicoResponseDTO(m.getId(), m.getNombre(), m.getEspecialidad(), m.getHospital().getNombre());\n    }\n}<\/pre>\n<p><b>C\u00f3mo comunica cada resultado:<\/b> un hospital o un m\u00e9dico que no existen lanzan <code>NoEncontradoException<\/code> (404); un m\u00e9dico con consultas lanza <code>ConflictoException<\/code> (409). Una lista vac\u00eda no es un error: se devuelve vac\u00eda (200).<\/p>\n\n<p class=\"paso\"><b>19.<\/b> <b>El controlador.<\/b> Solo conoce el <code>IMedicoService<\/code> y los DTO. No tiene l\u00f3gica ni <code>try/catch<\/code>: las excepciones las recoge el <code>@RestControllerAdvice<\/code>.<\/p>\n<pre data-f=\"controller/MedicoController.java\">package com.hospital.examen.controller;\n\nimport java.net.URI;\nimport java.util.List;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RequestParam;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.servlet.support.ServletUriComponentsBuilder;\n\nimport com.hospital.examen.dto.MedicoRequestDTO;\nimport com.hospital.examen.dto.MedicoResponseDTO;\nimport com.hospital.examen.service.IMedicoService;\n\nimport jakarta.validation.Valid;\n\n@RestController\n@RequestMapping(\"/api/medicos\")\npublic class MedicoController {\n\n    @Autowired\n    private IMedicoService medicoService;\n\n    // POST /api/medicos -&gt; 201 + Location | 400 (@Valid) | 404 (el hospital no existe)\n    @PostMapping\n    public ResponseEntity&lt;MedicoResponseDTO&gt; crear(@Valid @RequestBody MedicoRequestDTO dto) {\n        MedicoResponseDTO creado = medicoService.crear(dto);\n        URI location = ServletUriComponentsBuilder.fromCurrentRequest()\n                .path(\"/{id}\").buildAndExpand(creado.id()).toUri();\n        return ResponseEntity.created(location).body(creado);\n    }\n\n    // GET /api/medicos/{id} -&gt; 200 | 404\n    @GetMapping(\"/{id}\")\n    public ResponseEntity&lt;MedicoResponseDTO&gt; obtener(@PathVariable Long id) {\n        return ResponseEntity.ok(medicoService.obtener(id));\n    }\n\n    // GET /api/medicos?hospitalId=1 -&gt; 200 (lista, puede estar vac\u00eda) | 404 (el hospital no existe) | 400 (falta hospitalId)\n    @GetMapping\n    public ResponseEntity&lt;List&lt;MedicoResponseDTO&gt;&gt; listarPorHospital(@RequestParam Long hospitalId) {\n        return ResponseEntity.ok(medicoService.listarPorHospital(hospitalId));\n    }\n\n    // DELETE /api/medicos/{id} -&gt; 204 | 404 | 409 (tiene consultas)\n    @DeleteMapping(\"/{id}\")\n    public ResponseEntity&lt;Void&gt; eliminar(@PathVariable Long id) {\n        medicoService.eliminar(id);\n        return ResponseEntity.noContent().build();\n    }\n}<\/pre>\n<table>\n<tr><th>Endpoint<\/th><th>\u00c9xito<\/th><th>Errores<\/th><\/tr>\n<tr><td><code>POST /api/medicos<\/code><\/td><td><b>201<\/b> y <code>Location<\/code><\/td><td><b>400<\/b> datos inv\u00e1lidos \u00b7 <b>404<\/b> el hospital no existe<\/td><\/tr>\n<tr><td><code>GET /api/medicos/{id}<\/code><\/td><td><b>200<\/b><\/td><td><b>404<\/b><\/td><\/tr>\n<tr><td><code>GET /api/medicos?hospitalId=<\/code><\/td><td><b>200<\/b> (puede ser lista vac\u00eda)<\/td><td><b>404<\/b> el hospital no existe \u00b7 <b>400<\/b> si falta <code>hospitalId<\/code><\/td><\/tr>\n<tr><td><code>DELETE /api/medicos/{id}<\/code><\/td><td><b>204<\/b><\/td><td><b>404<\/b> \u00b7 <b>409<\/b> si tiene consultas<\/td><\/tr>\n<\/table>\n\n<p class=\"paso\"><b>20.<\/b> <b>El <code>@RestControllerAdvice<\/code>.<\/b> Recoge las dos excepciones propias y los errores de validaci\u00f3n. Todos los errores devuelven el mismo cuerpo JSON, con <code>mensaje<\/code> y <code>codigo<\/code>. Los errores de <code>@Valid<\/code> llegan como <code>MethodArgumentNotValidException<\/code>; a\u00f1ado tambi\u00e9n el JSON ilegible (por ejemplo, una especialidad que no existe), que tambi\u00e9n es un 400.<\/p>\n<pre data-f=\"exception/ManejadorErrores.java\">package com.hospital.examen.exception;\n\nimport java.util.Map;\nimport java.util.stream.Collectors;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.http.converter.HttpMessageNotReadableException;\nimport org.springframework.web.bind.MethodArgumentNotValidException;\nimport org.springframework.web.bind.annotation.ExceptionHandler;\nimport org.springframework.web.bind.annotation.RestControllerAdvice;\n\n@RestControllerAdvice\npublic class ManejadorErrores {\n\n    @ExceptionHandler(NoEncontradoException.class)\n    public ResponseEntity&lt;Map&lt;String, Object&gt;&gt; noEncontrado(NoEncontradoException e) {\n        return respuesta(HttpStatus.NOT_FOUND, e.getMessage());\n    }\n\n    @ExceptionHandler(ConflictoException.class)\n    public ResponseEntity&lt;Map&lt;String, Object&gt;&gt; conflicto(ConflictoException e) {\n        return respuesta(HttpStatus.CONFLICT, e.getMessage());\n    }\n\n    // Errores de @Valid: se juntan los mensajes de todos los campos incorrectos\n    @ExceptionHandler(MethodArgumentNotValidException.class)\n    public ResponseEntity&lt;Map&lt;String, Object&gt;&gt; validacion(MethodArgumentNotValidException e) {\n        String mensaje = e.getBindingResult().getFieldErrors().stream()\n                .map(f -&gt; f.getField() + \": \" + f.getDefaultMessage())\n                .collect(Collectors.joining(\"; \"));\n        return respuesta(HttpStatus.BAD_REQUEST, mensaje);\n    }\n\n    // JSON mal escrito, sin cuerpo o con un valor de enum que no existe\n    @ExceptionHandler(HttpMessageNotReadableException.class)\n    public ResponseEntity&lt;Map&lt;String, Object&gt;&gt; cuerpoIlegible(HttpMessageNotReadableException e) {\n        return respuesta(HttpStatus.BAD_REQUEST, \"El cuerpo de la petici\u00f3n no es v\u00e1lido\");\n    }\n\n    private ResponseEntity&lt;Map&lt;String, Object&gt;&gt; respuesta(HttpStatus estado, String mensaje) {\n        return ResponseEntity.status(estado).body(Map.of(\"mensaje\", mensaje, \"codigo\", estado.value()));\n    }\n}<\/pre>\n\n<p class=\"paso\"><b>21.<\/b> <b>Registrar una consulta<\/b> (<code>POST /api/pacientes/{id}/consultas<\/code>):<\/p>\n<ul>\n<li><b>a)<\/b> Hay que buscar <b>dos<\/b> entidades antes de crear la consulta: el <code>Paciente<\/code> (el <code>{id}<\/code> de la direcci\u00f3n) y el <code>Medico<\/code> (el <code>medicoId<\/code> del cuerpo). La consulta apunta a las dos.<\/li>\n<li><b>b)<\/b> Si falta cualquiera de las dos, <b>404<\/b> (<code>NoEncontradoException<\/code>). Si el cuerpo es inv\u00e1lido (falta alg\u00fan campo o el coste es negativo), <b>400<\/b>.<\/li>\n<li><b>c)<\/b> Devuelvo un <code>ConsultaResumenDTO<\/code>, con <b>201<\/b>: es el recurso que se acaba de crear, y el resumen no vuelve al paciente (sin bucles).<\/li>\n<\/ul>\n<pre data-f=\"service/IPacienteService.java\">package com.hospital.examen.service;\n\nimport com.hospital.examen.dto.ConsultaRequestDTO;\nimport com.hospital.examen.dto.ConsultaResumenDTO;\nimport com.hospital.examen.dto.PacienteResponseDTO;\n\npublic interface IPacienteService {\n\n    PacienteResponseDTO obtener(Long id);\n\n    ConsultaResumenDTO registrarConsulta(Long pacienteId, ConsultaRequestDTO dto);\n}<\/pre>\n<pre data-f=\"service/PacienteService.java\">package com.hospital.examen.service;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport com.hospital.examen.dto.ConsultaRequestDTO;\nimport com.hospital.examen.dto.ConsultaResumenDTO;\nimport com.hospital.examen.dto.PacienteResponseDTO;\nimport com.hospital.examen.entity.Consulta;\nimport com.hospital.examen.entity.Medico;\nimport com.hospital.examen.entity.Paciente;\nimport com.hospital.examen.exception.NoEncontradoException;\nimport com.hospital.examen.repository.IConsultaRepository;\nimport com.hospital.examen.repository.IMedicoRepository;\nimport com.hospital.examen.repository.IPacienteRepository;\n\n@Service\npublic class PacienteService implements IPacienteService {\n\n    @Autowired\n    private IPacienteRepository pacienteRepository;\n\n    @Autowired\n    private IMedicoRepository medicoRepository;\n\n    @Autowired\n    private IConsultaRepository consultaRepository;\n\n    @Override\n    @Transactional(readOnly = true)\n    public PacienteResponseDTO obtener(Long id) {\n        return mapearADTO(buscarPaciente(id));\n    }\n\n    @Override\n    @Transactional\n    public ConsultaResumenDTO registrarConsulta(Long pacienteId, ConsultaRequestDTO dto) {\n        // Las dos entidades a las que apunta la consulta\n        Paciente paciente = buscarPaciente(pacienteId);\n        Medico medico = medicoRepository.findById(dto.medicoId())\n                .orElseThrow(() -&gt; new NoEncontradoException(\"No existe el m\u00e9dico \" + dto.medicoId()));\n\n        Consulta consulta = new Consulta(medico, dto.fecha(), dto.coste(), dto.tipo(), false);\n        paciente.addConsulta(consulta);\n        return mapearConsulta(consultaRepository.save(consulta));\n    }\n\n    private Paciente buscarPaciente(Long id) {\n        return pacienteRepository.findById(id)\n                .orElseThrow(() -&gt; new NoEncontradoException(\"No existe el paciente \" + id));\n    }\n\n    private ConsultaResumenDTO mapearConsulta(Consulta c) {\n        return new ConsultaResumenDTO(c.getFecha(), c.getMedico().getNombre(), c.getTipo(), c.getCoste());\n    }\n\n    // Entity -&gt; DTO (recorre las consultas, que son LAZY: por eso se hace dentro de la transacci\u00f3n)\n    private PacienteResponseDTO mapearADTO(Paciente p) {\n        List&lt;ConsultaResumenDTO&gt; consultas = new ArrayList&lt;&gt;();\n        for (Consulta c : p.getConsultas()) {\n            consultas.add(mapearConsulta(c));\n        }\n        return new PacienteResponseDTO(p.getId(), p.getNombre(), p.getHistorial().getNumeroHistorial(),\n                p.getHistorial().getGrupoSanguineo(), consultas);\n    }\n}<\/pre>\n<pre data-f=\"controller/PacienteController.java\">package com.hospital.examen.controller;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\nimport com.hospital.examen.dto.ConsultaRequestDTO;\nimport com.hospital.examen.dto.ConsultaResumenDTO;\nimport com.hospital.examen.dto.PacienteResponseDTO;\nimport com.hospital.examen.service.IPacienteService;\n\nimport jakarta.validation.Valid;\n\n@RestController\n@RequestMapping(\"/api/pacientes\")\npublic class PacienteController {\n\n    @Autowired\n    private IPacienteService pacienteService;\n\n    // GET /api/pacientes/{id} -&gt; 200 | 404\n    @GetMapping(\"/{id}\")\n    public ResponseEntity&lt;PacienteResponseDTO&gt; obtener(@PathVariable Long id) {\n        return ResponseEntity.ok(pacienteService.obtener(id));\n    }\n\n    // POST /api/pacientes/{id}/consultas -&gt; 201 | 400 | 404 (paciente o m\u00e9dico)\n    @PostMapping(\"/{id}/consultas\")\n    public ResponseEntity&lt;ConsultaResumenDTO&gt; registrarConsulta(@PathVariable Long id,\n            @Valid @RequestBody ConsultaRequestDTO dto) {\n        return ResponseEntity.status(HttpStatus.CREATED).body(pacienteService.registrarConsulta(id, dto));\n    }\n}<\/pre>\n\n<h3>Parte 5: preguntas de comprensi\u00f3n<\/h3>\n\n<p class=\"paso\"><b>22.<\/b> <b>LazyInitializationException.<\/b> Ocurre al leer una relaci\u00f3n <code>LAZY<\/code> (aqu\u00ed, las consultas del paciente, o el m\u00e9dico de cada consulta) <b>cuando la sesi\u00f3n de Hibernate ya se ha cerrado<\/b>: por ejemplo, si el servicio devuelve la entidad y es el controlador quien intenta recorrerla. Se evita convirtiendo a DTO <b>dentro<\/b> del servicio y anot\u00e1ndolo con <code>@Transactional<\/code> (<code>readOnly = true<\/code> si solo lee), para que la sesi\u00f3n siga abierta mientras se recorren las relaciones.<\/p>\n\n<p class=\"paso\"><b>23.<\/b> <b>El bucle infinito.<\/b> La causa es que la relaci\u00f3n es <b>bidireccional<\/b>: <code>Hospital<\/code> tiene la lista de m\u00e9dicos y cada <code>Medico<\/code> apunta a su <code>Hospital<\/code>. Al convertir a JSON, Jackson recorre hospital \u2192 m\u00e9dicos \u2192 hospital \u2192 m\u00e9dicos\u2026 sin fin. Dos soluciones:<\/p>\n<ul>\n<li><b>Usar DTO<\/b> en vez de entidades (la buena): el DTO de salida no tiene referencia de vuelta, o solo un resumen (<code>nombreHospital<\/code>).<\/li>\n<li><b>Anotaciones de Jackson<\/b> sobre las entidades: <code>@JsonIgnore<\/code> en el lado que no queremos serializar, o la pareja <code>@JsonManagedReference<\/code> / <code>@JsonBackReference<\/code>. Funciona, pero ata la entidad al formato JSON, por eso no es lo recomendable.<\/li>\n<\/ul>\n\n<p class=\"paso\"><b>24.<\/b> <b>Borrar un hospital con m\u00e9dicos.<\/b> El 500 viene de la base de datos (violaci\u00f3n de clave for\u00e1nea: los m\u00e9dicos siguen apuntando al hospital). Deber\u00eda devolver <b>409 Conflict<\/b>. Falta la comprobaci\u00f3n previa en el servicio, igual que con las consultas de un m\u00e9dico:<\/p>\n<pre data-f=\"HospitalService.eliminar (idea)\">if (medicoRepository.countByHospitalId(id) &gt; 0) {\n    throw new ConflictoException(\"El hospital tiene m\u00e9dicos\");\n}\nhospitalRepository.deleteById(id);<\/pre>\n\n<p class=\"paso\"><b>25.<\/b> <b>El esquema de tablas.<\/b> Las claves for\u00e1neas (FK) est\u00e1n siempre en el lado propietario:<\/p>\n<pre data-f=\"esquema de tablas\">hospitales   (id_hospital PK, nombre, ciudad)\nmedicos      (id_medico PK, nombre, salario, especialidad, activo,\n              id_hospital FK -&gt; hospitales)                    1:N\nhistoriales  (id_historial PK, numero_historial UNIQUE, grupo_sanguineo, alergias)\npacientes    (id_paciente PK, nombre, fecha_nacimiento,\n              id_historial FK UNIQUE -&gt; historiales)           1:1\nconsultas    (id_consulta PK, fecha, coste, tipo, seguimiento,\n              id_medico   FK -&gt; medicos,                       N:M con datos:\n              id_paciente FK -&gt; pacientes)                     dos 1:N hacia Consulta<\/pre>\n<div class=\"why\"><b>C\u00f3mo corregirte.<\/b> Parte 1 (3 puntos): enums, columnas y restricciones bien, la FK en <code>Medico<\/code>, <code>mappedBy<\/code> en <code>Hospital<\/code>, el constructor de <code>Paciente<\/code> con el historial y <code>Consulta<\/code> con sus dos <code>@ManyToOne<\/code>. Parte 4 (3 puntos): los DTO con sus validaciones, la conversi\u00f3n solo en el servicio, el controlador sin l\u00f3gica, el <code>@RestControllerAdvice<\/code> y los c\u00f3digos 201, 200, 204, 400, 404 y 409 bien elegidos. Si fallaste en lo de las relaciones, repasa los pasos 11 a 13; si fue en la API, los pasos 18 y 19.<\/div>\n  <nav class=\"nav pie\"><a href=\"#ejercicio-2\">\u2190 Volver al enunciado<\/a> <a href=\"#\">\u2190 Todos los ejercicios<\/a><\/nav>\n<\/section>\n<\/main>\n<script>\n/* Bloques de c\u00f3digo: resaltado de Java y bot\u00f3n \"Copiar\". Tablas con scroll en m\u00f3vil. */\n(function () {\n  // Tablas: se envuelven en .tw para que hagan scroll horizontal en pantallas estrechas\n  document.querySelectorAll('main table').forEach(function (t) {\n    var w = document.createElement('div'); w.className = 'tw';\n    t.parentNode.insertBefore(w, t); w.appendChild(t);\n  });\n\n  // Resaltado sencillo para Java (comentarios, textos, anotaciones, palabras clave, n\u00fameros)\n  var RX = /(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)|(\"(?:[^\"\\\\\\n]|\\\\.)*\")|(@\\w+)|\\b(public|private|protected|class|interface|record|enum|extends|implements|return|new|if|else|for|try|catch|throw|import|package|static|final|void|int|long|boolean|double|null|true|false|this|instanceof)\\b|\\b(\\d+L?)\\b/g;\n  function esc(s) { return s.replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;'); }\n\n  document.querySelectorAll('pre').forEach(function (pre) {\n    var text = pre.textContent;\n    var esJava = /\\b(public|private)\\b[\\s\\S]*[{;]|^@\\w+/m.test(text) && /\\b(class|interface|record|enum|import)\\b/.test(text);\n    if (esJava) {\n      var out = '', last = 0, m;\n      RX.lastIndex = 0;\n      while ((m = RX.exec(text))) {\n        out += esc(text.slice(last, m.index));\n        var cls = m[1] ? 't-c' : m[2] ? 't-s' : m[3] ? 't-a' : m[4] ? 't-k' : 't-n';\n        out += '<span class=\"' + cls + '\">' + esc(m[0]) + '<\/span>';\n        last = RX.lastIndex;\n      }\n      out += esc(text.slice(last));\n      pre.setAttribute('data-raw', text);\n      pre.innerHTML = out;\n    }\n\n    // Bot\u00f3n Copiar\n    var b = document.createElement('button');\n    b.type = 'button'; b.className = 'copy'; b.textContent = 'Copiar';\n    b.addEventListener('click', function () {\n      var raw = pre.getAttribute('data-raw') || text;\n      function hecho() { b.textContent = 'Copiado'; setTimeout(function () { b.textContent = 'Copiar'; }, 1400); }\n      if (navigator.clipboard && navigator.clipboard.writeText) {\n        navigator.clipboard.writeText(raw).then(hecho, function () { copiaAntigua(raw); hecho(); });\n      } else { copiaAntigua(raw); hecho(); }\n    });\n    pre.appendChild(b);\n  });\n\n  // Copia para navegadores sin portapapeles moderno (o abriendo el archivo sin servidor)\n  function copiaAntigua(t) {\n    var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';\n    document.body.appendChild(a); a.select();\n    try { document.execCommand('copy'); } catch (e) {}\n    document.body.removeChild(a);\n  }\n\n  // Al imprimir, abrir todos los desplegables\n  window.addEventListener('beforeprint', function () {\n    document.querySelectorAll('details').forEach(function (d) { d.setAttribute('open', ''); });\n  });\n})();\n\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#\"]');\n  if (!a) return;\n  e.preventDefault();\n  var destino = a.getAttribute('href');\n  // \"#/...\" es un enlace a otra p\u00e1gina; el resto, un enlace dentro de esta (en un marco, un \"#x\" normal se\n  // resolver\u00eda contra la p\u00e1gina contenedora y recargar\u00eda todo el archivo dentro del marco)\n  if (destino.indexOf('#/') === 0) parent.postMessage({ ruta: destino }, '*');\n  else location.hash = destino;\n});\naddEventListener('message', function (e) {\n  if (e.source !== parent || !e.data || typeof e.data.ancla !== 'string') return;\n  var ancla = e.data.ancla, destino = ancla && document.getElementById(ancla);\n  location.hash = ancla;                    // necesario para que funcione :target (ejercicios)\n  // salto directo, sin deslizarse desde donde estaba (la gu\u00eda tiene scroll-behavior: smooth)\n  if (destino) destino.scrollIntoView({ behavior: 'instant' });\n  else scrollTo({ top: 0, behavior: 'instant' });\n});\nif (window.ANCLA_INICIAL) location.hash = window.ANCLA_INICIAL;\n<\/script>\n<\/body>\n<\/html>\n"};
var marcos = {}, cortina = null;     // cortina: datos de la que acaba de cerrar el selector (ver recursos/paginas/selector.js)

function ruta() {
  var trozos = location.hash.replace(/^#\/?/, '').split('/');
  var vista = PAGINAS[trozos[0]] ? trozos[0] : 'inicio';
  // Solo letras, números, guiones y guiones bajos: la ancla acaba escrita dentro de una página
  var ancla = vista === trozos[0] ? (trozos[1] || '').replace(/[^\w-]/g, '') : '';
  return { vista: vista, ancla: ancla };
}

function mostrar() {
  var r = ruta(), marco = marcos[r.vista];
  if (!marco) {                         // las páginas se crean la primera vez que se visitan
    marco = marcos[r.vista] = document.createElement('iframe');
    marco.title = marco.name = r.vista;
    marco.allow = 'clipboard-write';    // para el botón Copiar de los bloques de código
    marco.srcdoc = PAGINAS[r.vista].replace('<head>', '<head><script>window.ANCLA_INICIAL=' + JSON.stringify(r.ancla) +
      (cortina ? ';window.REVELA=' + JSON.stringify(cortina) : '') + '<\/script>');
    document.body.appendChild(marco);
  } else {
    marco.contentWindow.postMessage({ ancla: r.ancla, revela: cortina }, '*');
  }
  Object.keys(marcos).forEach(function (k) { marcos[k].classList.toggle('activo', k === r.vista); });
  marco.focus();
  cortina = null;
}

// Enlaces entre páginas, enviados por el puente de cada marco (solo se aceptan los de nuestros marcos)
addEventListener('message', function (e) {
  var nuestro = Object.keys(marcos).some(function (k) { return marcos[k].contentWindow === e.source; });
  if (nuestro && e.data && e.data.cortina) cortina = e.data.cortina;
  if (nuestro && e.data && typeof e.data.ruta === 'string' && e.data.ruta.indexOf('#/') === 0) location.hash = e.data.ruta;
});
addEventListener('hashchange', mostrar);
mostrar();
</script>
