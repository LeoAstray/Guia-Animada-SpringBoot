\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#14212b\"/><\/marker>\n  <marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#2e7d4f\"/><\/marker>\n  <marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#b23a2b\"/><\/marker>\n<\/defs><\/svg>\n\n\n<div class=\"loader\" id=\"loader\" aria-hidden=\"true\"><div><div class=\"bar\" id=\"bar\"><\/div><p id=\"pct\">BARAJANDO 33 CARTAS \u00b7 0%<\/p><\/div><\/div>\n<div class=\"progress\" id=\"progress\" aria-hidden=\"true\"><\/div>\n<i class=\"hud tl\" aria-hidden=\"true\"><\/i><i class=\"hud tr\" aria-hidden=\"true\"><\/i><i class=\"hud bl\" aria-hidden=\"true\"><\/i><i class=\"hud br\" aria-hidden=\"true\"><\/i>\n\n<header class=\"bar full\">\n  <a class=\"back\" href=\"#/\">\u2190 Elegir otra gu\u00eda<\/a>\n  <span class=\"tag\">GU\u00cdA COMPLETA<\/span>\n<\/header>\n\n<\!-- PORTADA\n     - T\u00edtulo: cada palabra va en un <span class=\"w\">; la que lleva \"p\" sale en rosa.\n       El retraso (animation-delay) hace que aparezcan una detr\u00e1s de otra.\n     - Los tres sobres enlazan con el id de cada parte (#parte1, #parte2, #parte3). -->\n<header class=\"hero\" id=\"inicio\">\n  <div>\n    <h1 aria-label=\"Spring Boot de cero a REST\">\n      <span class=\"w\" style=\"animation-delay:1.00s\">Spring<\/span>\n      <span class=\"w\" style=\"animation-delay:1.13s\">Boot<\/span>\n      <span class=\"w\" style=\"animation-delay:1.26s\">de<\/span>\n      <span class=\"w p\" style=\"animation-delay:1.39s\">cero<\/span>\n      <span class=\"w\" style=\"animation-delay:1.52s\">a<\/span>\n      <span class=\"w\" style=\"animation-delay:1.65s\">REST<\/span>\n    <\/h1>\n    <p class=\"lede\">Una sola gu\u00eda, paso a paso: empieza con Spring Data JPA, cruza el puente hacia REST y termina con la API completa de la biblioteca editorial. Todo el c\u00f3digo est\u00e1 probado y explicado para que puedas presentarlo.<\/p>\n    <div class=\"cta\">\n      <a class=\"btn main\" href=\"#parte1\">Abrir el sobre 1 \u2192<\/a>\n      <a class=\"btn ghost\" id=\"resume\" href=\"#parte1\" hidden>Seguir donde lo dej\u00e9 <span class=\"flag\" id=\"resume-n\">000/033<\/span><\/a>\n    <\/div>\n  <\/div>\n\n  <nav class=\"packs\" aria-label=\"Las tres partes de la gu\u00eda\">\n    <a class=\"pack c\" href=\"#parte1\">\n      <div class=\"no\">001\u2013017 \u00b7 COM\u00daN<\/div>\n      <div class=\"pt\">Data JPA<\/div>\n      <p>Proyecto, MySQL, entidades, relaciones, repositorios y consultas.<\/p>\n    <\/a>\n    <a class=\"pack r\" href=\"#parte2\">\n      <div class=\"no\">018\u2013019 \u00b7 RARA<\/div>\n      <div class=\"pt\">El puente<\/div>\n      <p>DTO, servicio, controlador y c\u00f3digos HTTP sobre lo que ya sabes.<\/p>\n    <\/a>\n    <a class=\"pack h\" href=\"#parte3\">\n      <div class=\"no\">020\u2013032 \u00b7 HOLO<\/div>\n      <div class=\"pt\">API REST<\/div>\n      <p>La biblioteca editorial: dise\u00f1o, c\u00f3digo, validaci\u00f3n y pruebas.<\/p>\n    <\/a>\n  <\/nav>\n\n  <\!-- Cinta decorativa (el texto se repite dos veces para que el bucle no se note) -->\n  <div class=\"marquee\" aria-hidden=\"true\"><span>@Entity \u00b7 @OneToOne \u00b7 @OneToMany \u00b7 @ManyToMany \u00b7 JpaRepository \u00b7 @Query \u00b7 record DTO \u00b7 @Service \u00b7 @RestController \u00b7 ResponseEntity \u00b7 201 CREATED \u00b7 404 NOT FOUND \u00b7 409 CONFLICT \u00b7 @Valid \u00b7 @Entity \u00b7 @OneToOne \u00b7 @OneToMany \u00b7 @ManyToMany \u00b7 JpaRepository \u00b7 @Query \u00b7 record DTO \u00b7 @Service \u00b7 @RestController \u00b7 ResponseEntity \u00b7 201 CREATED \u00b7 404 NOT FOUND \u00b7 409 CONFLICT \u00b7 @Valid \u00b7 <\/span><\/div>\n<\/header>\n\n\n<div class=\"layout\">\n<aside class=\"sidebar\">\n  <button type=\"button\" class=\"drawer-close\" id=\"drawer-close\" aria-label=\"Cerrar \u00edndice\">Cerrar<\/button>\n  <div class=\"brand\">Spring Boot de cero a REST<small>Data JPA, el puente y la API completa<\/small><\/div>\n  <nav class=\"menu\" id=\"menu\" aria-label=\"\u00cdndice de la gu\u00eda\">\n<details class=\"group g1\" open><summary><span class=\"n\">1<\/span>El tutorial de JPA<\/summary><ul><li><a href=\"#paso-1\">1 Crear el proyecto en Spring Initializr<\/a><\/li><li><a href=\"#paso-2\">2 Abrir el proyecto en VS Code<\/a><\/li><li><a href=\"#paso-3\">3 Configurar la conexi\u00f3n y las tablas<\/a><\/li><li class=\"sub\"><a href=\"#paso-3A\">A\u00f1adir el servidor web (paso 3A)<\/a><\/li><li><a href=\"#paso-4\">4 Crear los paquetes y distinguir los tipos Java<\/a><\/li><li><a href=\"#paso-5\">5 Crear el enum Posicion<\/a><\/li><li><a href=\"#paso-6\">6 Crear la entidad Jugador<\/a><\/li><li><a href=\"#paso-7\">7 Crear la interfaz del repositorio<\/a><\/li><li><a href=\"#paso-8\">8 Ejecutar la primera prueba desde ExamenApplication<\/a><\/li><li><a href=\"#paso-9\">9 Practicar buscar, cambiar y borrar desde ExamenApplication<\/a><\/li><li><a href=\"#paso-10\">10 Escribir consultas en la interfaz<\/a><\/li><li><a href=\"#paso-11\">11 A\u00f1adir una relaci\u00f3n uno a uno<\/a><\/li><li><a href=\"#paso-12\">12 Crear una relaci\u00f3n uno a muchos<\/a><\/li><li><a href=\"#paso-13\">13 Representar una relaci\u00f3n muchos a muchos<\/a><\/li><li><a href=\"#paso-14\">14 Cargar los datos iniciales<\/a><\/li><li><a href=\"#paso-15\">15 Escribir consultas en el repositorio y ejecutarlas en la aplicaci\u00f3n<\/a><\/li><li><a href=\"#paso-16\">16 Corregir errores y terminar el proyecto<\/a><\/li><li><a href=\"#paso-17\">17 Materiales utilizados y documentaci\u00f3n de apoyo<\/a><\/li><\/ul><\/details>\n<details class=\"group g2\" open><summary><span class=\"n\">2<\/span>El puente a REST<\/summary><ul><li><a href=\"#s16\">18 Qu\u00e9 cambia al pasar a REST (y por qu\u00e9)<\/a><\/li><li><a href=\"#s17\">19 El puente paso a paso, con el proyecto de f\u00fatbol<\/a><\/li><\/ul><\/details>\n<details class=\"group g3\" open><summary><span class=\"n\">3<\/span>La API completa<\/summary><ul><li><a href=\"#s18\">20 El ejercicio: qu\u00e9 se pide y c\u00f3mo se resuelve<\/a><\/li><li><a href=\"#s19\">21 Crear y configurar el proyecto<\/a><\/li><li><a href=\"#s20\">22 Misi\u00f3n 1: decisiones de dise\u00f1o y entidades<\/a><\/li><li><a href=\"#s21\">23 Los repositorios<\/a><\/li><li><a href=\"#s22\">24 Misi\u00f3n 2: los DTO como contrato de la API<\/a><\/li><li><a href=\"#s23\">25 Los servicios: interfaces, implementaciones y conversi\u00f3n<\/a><\/li><li><a href=\"#s24\">26 Los controladores y los c\u00f3digos de estado<\/a><\/li><li><a href=\"#s25\">27 Misi\u00f3n 5: las trampas de comprensi\u00f3n<\/a><\/li><li><a href=\"#s26\">28 Ampliaci\u00f3n: validaci\u00f3n declarativa con @Valid<\/a><\/li><li><a href=\"#s27\">29 Probar con Postman o curl<\/a><\/li><li><a href=\"#s28\">30 C\u00f3mo explicar el ejercicio<\/a><\/li><li><a href=\"#s29\">31 Entregables y r\u00fabrica<\/a><\/li><li><a href=\"#s30\">32 Chuleta final<\/a><\/li><\/ul><\/details>\n<details class=\"group g4\" open><summary><span class=\"n\">4<\/span>Ejercicios de pr\u00e1ctica<\/summary><ul><li><a href=\"#ejercicios\">33 Ejercicios de pr\u00e1ctica<\/a><\/li><\/ul><\/details>\n  <\/nav>\n<\/aside>\n\n<div class=\"content\">\n<main>\n<div class=\"part\" id=\"parte1\" data-indice=\"El tutorial de JPA\">\n  <span class=\"num\">1<\/span>\n  <span class=\"ttl\">Spring Data JPA\n    <small>El proyecto \u00abexamen\u00bb: jugadores, equipos, estadios y fichajes.<\/small>\n  <\/span>\n  <span class=\"set\">CARTAS 001\u2013017 \u00b7 COM\u00daN<\/span>\n<\/div>\n<section id=\"paso-1\">\n<header class=\"opener r1\"><h2>Crear el proyecto en Spring Initializr<\/h2><div class=\"set\"><b>001<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n    <p class=\"paso\">1. Abre el navegador y escribe\n        <code><a href=\"https://start.spring.io\">https://start.spring.io<\/a><\/code>.\n    <\/p>\n    <p class=\"paso\">2. En <b>Project<\/b>, marca <b>Maven<\/b>. Maven es quien lee la lista de piezas del proyecto y\n        descarga las bibliotecas necesarias.<\/p>\n    <p class=\"paso\">3. En <b>Language<\/b>, marca <b>Java<\/b>.<\/p>\n    <p class=\"paso\">4. En <b>Spring Boot<\/b>, elige <b>4.1.3.<\/b><\/p>\n    <p class=\"paso\">5. Completa con los datos de la tabla:<\/p>\n    <table>\n        <tr>\n            <th><b>Campo<\/b><\/th>\n            <th><b>Escribe<\/b><\/th>\n            <th><b>Para qu\u00e9 sirve<\/b><\/th>\n        <\/tr>\n        <tr>\n            <td>Group<\/td>\n            <td>leo.astray<\/td>\n            <td>Identifica el grupo o autor del proyecto.<\/td>\n        <\/tr>\n        <tr>\n            <td>Artifact<\/td>\n            <td>examen<\/td>\n            <td>Da nombre al proyecto y al archivo que se construir\u00e1.<\/td>\n        <\/tr>\n        <tr>\n            <td>Package name<\/td>\n            <td>leo.astray.examen<\/td>\n            <td>La direcci\u00f3n com\u00fan de nuestras clases.<\/td>\n        <\/tr>\n        <tr>\n            <td>Packaging<\/td>\n            <td>Jar<\/td>\n            <td>Un paquete ejecutable de Java.<\/td>\n        <\/tr>\n        <tr>\n            <td>Java<\/td>\n            <td>21<\/td>\n            <td>Versi\u00f3n con la que vas a programar.<\/td>\n        <\/tr>\n        <tr>\n            <td>Configuration<\/td>\n            <td>Properties<\/td>\n            <td>Crea application.properties, si aparece esta opci\u00f3n.<\/td>\n        <\/tr>\n    <\/table>\n    <p class=\"paso\">6. Pulsa <b>Add Dependencies<\/b>. Busca y a\u00f1ade, una por una, <b>Spring Data JPA<\/b>, <b>MySQL\n            Driver<\/b>, <b>Spring Boot DevTools<\/b>, <b>Spring Web<\/b> y <b>Validation<\/b>.<\/p>\n    <p class=\"paso\">7. JPA permite relacionar objetos con tablas; Spring Data aporta los repositorios; Hibernate realiza\n        el trabajo de persistencia. MySQL Driver es el \u00abtraductor\u00bb que permite a Java hablar con MySQL. DevTools ayuda\n        con los reinicios durante el desarrollo. Spring Web y Validation no se usan hasta la Parte 2 (la API REST), pero\n        conviene a\u00f1adirlas ya: as\u00ed no hay que tocar el <code>pom.xml<\/code> m\u00e1s adelante.<\/p>\n    <p class=\"paso\">8. Pulsa <b>Generate<\/b>. Se descargar\u00e1 un ZIP. Guardalo en la carpeta donde quieras tener el\n        proyecto.<\/p>\n    <figure class=\"fig shot\"><img alt=\"Pantalla de Spring Initializr con los datos del proyecto rellenos\"\n            src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACgAAAAVwCAYAAACAPgbwAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAP+lSURBVHhe7N15fFTV/f/x972zZJKQjUACJBAFxZ1FZQmKoIJrXX4FxaXWuvVbN1at1da97rK6trba1q87tvqtdV9ACglbBeqKAoYkhISErJOZzHZ/fyQzZIYEkhAggdfz+7gPmXPOnLsk6Xdm7ns+xzjkkMMsNWNZUQ8BAAAAAAAAAAAAAAAAAEAXZMY2AAAAAAAAAAAAAAAAAACAro8AIAAAAAAAAAAAAAAAAAAA3ZCxqyWAQ6GQgsEQywIDXZBhGLLZTJkmOV4AAAAAAAAAAAAAAADgYGTk5AxqMd3n8/nldNqVkpKi+PgEOZ02kQME9j/DkHy+oDyeelVXV8vnC8jpdMQOAwAAAAAAAAAAAAAAAHCAazEAWF/vUWZmhtLTU5sqAIYUCu00DMB+YpqGDMOUzWaqoqJKpaVlSkiIjx0GAAAAAAAAAAAAAAAA4AC209qh9fUeZWf3U3p6mnw+v4LBIOE/oIsJhSwFg0H5fH6lp6cpO7uf6us9scMAAAAAAAAAAAAAAAAAHMCiAoA+n1+ZmRlKTk6Sz+dr3gWgi/L5fEpOTlJmZoZ8Pn9sNwAAAAAAAAAAAAAAAIADVCQAGAqF5HTalZ6eSvgP6GZ8Pp/S01PldNoVCoViuwEAAAAAAAAAAAAAAAAcgCIBwGAwpJSUFAWDhIeA7oi/YQAAAAAAAAAAAAAAAODgEgkAWpal+PgEWRbhIaA7sqxQ09+wFdsFAAAAAAAAAAAAAAAA4AAUCQBKktNpUyi0B+Ehy5AVVItbs0HNHwDoJKGQJafTFtsMAAAAAAAAAAAAAAAA4AAVFQDck8JhQY/kKw/K8kmWR7IamjaPZPkkX6kUbLBk+R0KemKfDaAz7MnfMAAAAAAAAAAAAAAAAIDuxcjJGWRJks/n16BBhygYjCrXt3uWFPBIib0sHXWtQ7YEQ6FAUIZpNHaHLJl2U/5a6esFUpVVqvScRNX/4JItPnYyAHvCZrNpw4Yf5XQ6YrsAAAAAAAAAAAAAAAAAHGCiKgC2W0iyDClUIx1xral+JybKMn2KT7UrLsmUK9mmhDSHTNPQESdnyj5psX427QIdPeRI+Xz+2NlaVFNTo6KiLZGtI8rKtqm0tCy2ucPcbre2bNka27yTiortrR5zW46prGybysq2Rf69u/HA3uDxeOXxeGObAQAAAAAAAAAAAAAAgL2uvt6jqqranbaamjr5/YHY4ft r>\n    <p class=\"paso\">1. Ve a la carpeta donde hayas dejado el zip que se descarg\u00f3. Clic derecho sobre el ZIP, <b>Extraer\n            todo<\/b>. No trabajes dentro del ZIP.\n    <\/p>\n    <p class=\"paso\">2. Abre VS Code. En <b>File &gt; Open Folder<\/b> &gt; Abrir carpeta<\/b>, selecciona la\n        carpeta que has extraido.<\/p>\n    <p class=\"paso\">3. Acepta la importaci\u00f3n del proyecto Maven cuando se solicite y espera a que termine de descargar\n        dependencias. La primera vez necesitas conexi\u00f3n a Internet.<\/p>\n    <h3>Entender las carpetas que ya existen<\/h3>\n    <ul>\n        <li><code>pom.xml<\/code>: la lista de dependencias y las reglas de construcci\u00f3n. Aqu\u00ed a\u00f1adimos dependencias si\n            las necesitamos.<\/li>\n        <li><code>src/main/java<\/code>: aqu\u00ed va tu c\u00f3digo Java.<\/li>\n        <li><code>src/main/resources<\/code>: aqu\u00ed van la configuraci\u00f3n y los datos SQL de inicio.<\/li>\n        <li><code>ExamenApplication.java<\/code>: clase de arranque. Su m\u00e9todo <code>main<\/code> pone en marcha Spring.\n        <\/li>\n    <\/ul>\n    <p>Piensa en una mochila: las carpetas separan los cuadernos; <code>pom.xml<\/code> es la lista del material y la\n        clase principal es el bot\u00f3n de encendido.<\/p>\n<\/section>\n<section id=\"paso-3\">\n<header class=\"opener r1\"><h2>Configurar la conexi\u00f3n y las tablas<\/h2><div class=\"set\"><b>003<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n    <p class=\"paso\">1. En el explorador de VS Code, despliega <code>src &gt; main &gt; resources<\/code>.<\/p>\n    <p class=\"paso\">2. Haz clic en <code>application.properties<\/code>.<\/p>\n    <p class=\"paso\">3. Escribe este contenido. Sustituye usuario, contrase\u00f1a y puerto por los de tu MySQL.<\/p>\n    <pre class=\"code\" data-f=\"src/main/resources/application.properties\">spring.application.name=examen\nserver.port=8080\n\nspring.datasource.url=jdbc:mysql://localhost:3308/examen?createDatabaseIfNotExist=true\nspring.datasource.username=root\nspring.datasource.password=\nspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver\n\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true\nspring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect\nspring.jpa.database-platform=org.hibernate.dialect.MySQLDialect\nspring.sql.init.mode=always\nspring.jpa.defer-datasource-initialization=true\nspring.jpa.properties.hibernate.format_sql=true<\/pre>\n    <p class=\"paso\">4. Guarda con <b>Ctrl+S<\/b>.<\/p>\n    <p>Es importante mencionar que en la linea de spring.application.name=examen se tiene que cambiar examen por el\n        nombre que hayamos puesto en Artifact al crear el proyecto en start.spring.io. En la URL,\n        <code>jdbc:mysql<\/code> indica el tipo de conexi\u00f3n; <code>localhost<\/code>, tu ordenador;\n        <code>3308<\/code>, el puerto del servidor; y <code>examen<\/code>, el archivador que abrimos.\n    <\/p>\n    <p><code>show-sql<\/code> ense\u00f1a las consultas en la terminal y <code>format_sql<\/code> las distribuye para leerlas\n        mejor. <code>ddl-auto<\/code> indica qu\u00e9 har\u00e1 Hibernate con la estructura. Los valores que puede tener ddl-auto\n        son los siguientes, en este tutorial vamos a usar o create-drop o update:<\/p>\n    <table>\n        <tr>\n            <th><b>Valor<\/b><\/th>\n            <th><b>Qu\u00e9 ocurre<\/b><\/th>\n        <\/tr>\n        <tr>\n            <td>update<\/td>\n            <td>Intenta ajustar las tablas al modelo. \u00datil al practicar; no resuelve todas las migraciones.<\/td>\n        <\/tr>\n        <tr>\n            <td>create<\/td>\n            <td>Recrea las tablas gestionadas al arrancar y se pierden sus datos anteriores.<\/td>\n        <\/tr>\n        <tr>\n            <td>create-drop<\/td>\n            <td>Recrea al arrancar y elimina las tablas al cerrar normalmente.<\/td>\n        <\/tr>\n        <tr>\n            <td>validate<\/td>\n            <td>Comprueba que las tablas encajan con las entidades; no las crea.<\/td>\n        <\/tr>\n        <tr>\n            <td>none<\/td>\n            <td>No pide a Hibernate crear ni modificar el esquema.<\/td>\n        <\/tr>\n    <\/table>\n    <p class=\"note\">Al principio dejamos update. En el paso 3A (el de debajo de este) a\u00f1adimos el servidor web para\n        mantener la\n        aplicaci\u00f3n abierta. En el paso 14 cambiaremos la configuraci\u00f3n de la base de pr\u00e1ctica para cargar un juego de\n        datos repetible con create-drop.<\/p>\n    <h3 id=\"paso-3A\" data-indice=\"A\u00f1adir el servidor web (paso 3A)\">A\u00f1adir el servidor web y mantener la aplicaci\u00f3n\n        abierta<\/h3>\n    <p>El servidor web de Spring Boot permite que la aplicaci\u00f3n siga arrancada despu\u00e9s de terminar las instrucciones de\n        run. As\u00ed puedes abrir phpMyAdmin y examinar las tablas mientras el programa sigue funcionando. Con create-drop,\n        las tablas se mantienen durante la ejecuci\u00f3n y se eliminan al cerrar normalmente la aplicaci\u00f3n.<\/p>\n<\/section>\n<section id=\"paso-4\">\n<header class=\"opener r1\"><h2>Crear los paquetes y distinguir los tipos Java<\/h2><div class=\"set\"><b>004<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n  <p class=\"paso\">1. Despliega <code>src/main/java/leo/astray/examen<\/code>.<\/p>\n  <p class=\"paso\">2. Clic derecho sobre la carpeta de examen y elige <b>New Java Package<\/b>. Escribe\n    <code>model<\/code> y pulsa Intro. Dentro de model ahora repite y crea <code>entity<\/code>, <code>enums<\/code> y\n    <code>repository<\/code>.\n  <\/p>\n  <pre class=\"code\" data-f=\"estructura de paquetes\">leo/astray/examen/\n  ExamenApplication.java\n  model/       \n    entity/   Jugador.java...\n    enums/        Posicion.java...\n    repository/   IJugadorRepository.java...<\/pre>\n  <p>Un paquete organiza y da una direcci\u00f3n a las clases. En este ejemplo, la direcci\u00f3n de Jugador ser\u00e1\n    leo.astray.examen.model.entity.Jugador. Entity contiene las entidades que representan datos de tablas y repository\n    contiene las interfaces de acceso a esos datos, no palabras obligatorias de Java.<\/p>\n  <h3>Porque elegir Class Interface o Enum<\/h3>\n  <table>\n    <tr>\n      <th><b>Tipo<\/b><\/th>\n      <th><b>Idea sencilla<\/b><\/th>\n      <th><b>Uso en el proyecto<\/b><\/th>\n    <\/tr>\n    <tr>\n      <td>class<\/td>\n      <td>Un molde para fabricar objetos con datos y acciones.<\/td>\n      <td>Jugador, Equipo, Fichaje...<\/td>\n    <\/tr>\n    <tr>\n      <td>interface<\/td>\n      <td>Un contrato de operaciones que alguien debe ofrecer.<\/td>\n      <td>El repositorio promete buscar y guardar.<\/td>\n    <\/tr>\n    <tr>\n      <td>enum<\/td>\n      <td>Una lista cerrada de opciones permitidas.<\/td>\n      <td>Posicion, ponemos un listado de valores permitidos en precisamente ese campo.<\/td>\n    <\/tr>\n  <\/table>\n  <p>Para crear cada uno, haz clic derecho sobre la carpeta &gt; New Java File &gt; escogemos class/enum/interface.<\/p>\n<\/section>\n<section id=\"paso-5\">\n<header class=\"opener r1\"><h2>Crear el enum Posicion<\/h2><div class=\"set\"><b>005<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n    <p class=\"paso\">1. Clic derecho en <code>enums<\/code> &gt; <b>New Java File &gt; Enum<\/b> y escribe\n        <code>Posicion<\/code>.<\/p>\n    <p class=\"paso\">2. Sustituye el contenido por este c\u00f3digo completo y guarda.<\/p>\n    <pre data-f=\"enums/Posicion.java\">package leo.astray.examen.enums;\n\npublic enum Posicion {\n    PORTERO, DEFENSA, CENTROCAMPISTA, DELANTERO\n}<\/pre>\n    <div class=\"kid\">Una posici\u00f3n es como elegir un sabor de una lista del men\u00fa: no puedes inventar otra palabra sin\n        a\u00f1adirla a la lista. En Java escribir\u00e1s <code>Posicion.PORTERO<\/code>, no el texto libre <code>\"portero\"<\/code>.\n        En SQL emplearemos el nombre exacto, por ejemplo <code>'PORTERO'<\/code>.<\/div>\n    <p><code>public<\/code> permite utilizar este tipo desde los dem\u00e1s paquetes. Las llaves agrupan su contenido. El\n        nombre p\u00fablico <code>Posicion<\/code> coincide exactamente con el archivo <code>Posicion.java<\/code>, incluidas\n        las may\u00fasculas.<\/p>\n<\/section>\n<section id=\"paso-6\">\n<header class=\"opener r1\"><h2>Crear la entidad Jugador<\/h2><div class=\"set\"><b>006<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n<p class=\"paso\">1. Clic derecho en <code>entity<\/code> &gt; <b>New Java File &gt; Class<\/b> y escribe <code>Jugador<\/code>.<\/p>\n<p class=\"paso\">2. Pega este archivo completo. Las anotaciones empiezan por <code>@<\/code>: son etiquetas que explican a JPA c\u00f3mo guardar la clase.<\/p>\n<pre data-f=\"entity/Jugador.java\">package leo.astray.examen.entity;\n\nimport leo.astray.examen.enums.Posicion;\nimport jakarta.persistence.*;\n\n@Entity\n@Table(name = \"jugadores\")\npublic class Jugador {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_jugador\")\n    private Long id;\n\n    @Column(nullable = false, length = 100)\n    private String nombre;\n\n    @Column(nullable = false, unique = true, length = 50)\n    private String mote;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 20)\n    private Posicion posicion;\n\n    public Jugador() {}\n\n    public Jugador(String nombre, String mote, Posicion posicion) {\n        this.nombre = nombre;\n        this.mote = mote;\n        this.posicion = posicion;\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public String getMote() { return mote; }\n    public Posicion getPosicion() { return posicion; }\n\n    public void setNombre(String nombre) { this.nombre = nombre; }\n    public void setMote(String mote) { this.mote = mote; }\n    public void setPosicion(Posicion posicion) {\n        this.posicion = posicion;\n    }\n}<\/pre>\n\n<p>Una <b>entidad<\/b> es una clase que JPA sabe relacionar con la base. Normalmente cada objeto guardado (nombre, mote, posicion...) corresponde a una fila de su tabla.<\/p>\n<p><code>@Entity<\/code> marca la entidad. <code>@Table<\/code> fija el nombre SQL. <code>@Id<\/code> se\u00f1ala la <b>clave primaria<\/b>, el n\u00famero que identifica una fila sin confundirla con otra. <code>IDENTITY<\/code> deja que MySQL genere ese n\u00famero al insertar. El objeto nuevo tiene <code>id = null<\/code> hasta que se guarda; no le inventes un identificador para una inserci\u00f3n normal.<\/p>\n<p><code>Long<\/code> es un tipo num\u00e9rico que tambi\u00e9n admite <code>null<\/code>. <code>String<\/code> guarda texto. <code>private<\/code> protege los campos para acceder a ellos mediante m\u00e9todos. <code>@Column(nullable=false)<\/code> proh\u00edbe SQL <code>NULL<\/code>; no impide por s\u00ed sola una cadena vac\u00eda. <code>unique=true<\/code> impide repetir el mote y <code>length<\/code> fija la longitud de la columna al generar el esquema.<\/p>\n<p><code>@Enumerated(EnumType.STRING)<\/code> guarda <code>DELANTERO<\/code> como texto. Guardar una posici\u00f3n por n\u00famero ser\u00eda m\u00e1s fr\u00e1gil si luego cambias el orden de los valores del enum.<\/p>\n<p>Los <b>constructores<\/b> se llaman como la clase y no tienen tipo de retorno. El vac\u00edo permite a JPA crear el objeto al leerlo; el otro permite rellenarlo al fabricarlo t\u00fa. <code>this.nombre<\/code> es el campo del objeto y <code>nombre<\/code> es el dato recibido. Los <b>getters<\/b> devuelven informaci\u00f3n; los <b>setters<\/b> la cambian. <code>return<\/code> entrega un resultado y <code>void<\/code> significa que el m\u00e9todo no devuelve uno.<\/p>\n<p>Para generar Getters y Setters en VS Code: coloca el cursor dentro de la clase, clic derecho &gt; <b>Source Action &gt; Generate Getters and Setters<\/b>, selecciona los campos y acepta. Para constructores, <b>Source Action &gt; Generate Constructors<\/b>.<\/p>\n<div class=\"ok\"><code>Ctrl+Shift+M<\/code> abre <b>Problems<\/b>. No deben quedar errores rojos. <code>jakarta.persistence<\/code> es el paquete usado aqu\u00ed; no aceptes un import antiguo <code>javax.persistence<\/code>. Un <code>import<\/code> indica la direcci\u00f3n de un tipo de otro paquete, no crea otra copia del archivo.<\/div>\n<\/section>\n\n<section id=\"paso-7\">\n<header class=\"opener r1\"><h2>Crear la interfaz del repositorio<\/h2><div class=\"set\"><b>007<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n<p class=\"paso\">1. Clic derecho en <code>repository<\/code> &gt; <b>New Java File &gt; Interface<\/b>. Escribe <code>IJugadorRepository<\/code>. Si solo hay <b>New File<\/b>, crea <code>IJugadorRepository.java<\/code> y escribe <code>public interface<\/code>, como abajo.<\/p>\n<p class=\"paso\">2. Pega el archivo completo y guarda.<\/p>\n<pre data-f=\"repository/IJugadorRepository.java\">package leo.astray.examen.repository;\n\nimport leo.astray.examen.entity.Jugador;\nimport org.springframework.data.jpa.repository.JpaRepository;\n\npublic interface IJugadorRepository\n        extends JpaRepository&lt;Jugador, Long&gt; {\n}<\/pre>\n<div class=\"kid\">Una <b>interfaz<\/b> es como una carta de servicios, dice qu\u00e9 operaciones (m\u00e9todos) se ofrecen.<\/div>\n<p><code>extends<\/code> permite heredar el contrato de <code>JpaRepository<\/code>. Los dos tipos entre <code>&lt; &gt;<\/code> dicen \u00abeste repositorio trabaja con <code>Jugador<\/code> y sus identificadores son <code>Long<\/code>\u00bb. Si la entidad usa <code>Integer<\/code>, el segundo tipo debe ser <code>Integer<\/code>, y las llamadas usar\u00edan <code>1<\/code> en vez de <code>1L<\/code>.<\/p>\n<div class=\"why\">Estamos usando la convenci\u00f3n <b>I + entidad + Repository<\/b>. La seguimos para reconocer las interfaces. Esa I ayuda a organizarse, pero Java no obliga a ponerla.<\/div>\n<p>JpaRepository ya trae m\u00e9todos predefinidos, no tenemos que implementarlos manualmente. Algunos son los siguientes:<\/p>\n<table>\n<tr><th>M\u00e9todo que ya tienes<\/th><th>Para qu\u00e9 lo usas<\/th><\/tr>\n<tr><td><code>save(objeto)<\/code><\/td><td>Insertar o guardar los cambios de una entidad.<\/td><\/tr>\n<tr><td><code>findById(id)<\/code><\/td><td>Buscar por clave primaria; devuelve <code>Optional<\/code>.<\/td><\/tr>\n<tr><td><code>findAll()<\/code><\/td><td>Obtener todos los registros en una lista.<\/td><\/tr>\n<tr><td><code>existsById(id)<\/code><\/td><td>Saber si existe sin pedir toda la entidad.<\/td><\/tr>\n<tr><td><code>count()<\/code><\/td><td>Contar las filas.<\/td><\/tr>\n<tr><td><code>deleteById(id)<\/code><\/td><td>Borrar por identificador, respetando las relaciones.<\/td><\/tr>\n<\/table>\n<\/section>\n\n<section id=\"paso-8\">\n<header class=\"opener r1\"><h2>Ejecutar la primera prueba desde ExamenApplication<\/h2><div class=\"set\"><b>008<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n<p class=\"paso\">1. Abre <code>ExamenApplication.java<\/code>. Est\u00e1 en <code>src/main/java/leo/astray/examen/ExamenApplication.java<\/code>. Es el archivo que Spring Initializr cre\u00f3 para arrancar el proyecto.<\/p>\n<p class=\"paso\">2. Sustituye su contenido por este c\u00f3digo completo:<\/p>\n<pre data-f=\"ExamenApplication.java\">package leo.astray.examen;\n\nimport leo.astray.examen.entity.Jugador;\nimport leo.astray.examen.enums.Posicion;\nimport leo.astray.examen.repository.IJugadorRepository;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.CommandLineRunner;\nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\n@SpringBootApplication\npublic class ExamenApplication implements CommandLineRunner {\n\n    @Autowired\n    private IJugadorRepository jugadorRepository;\n\n    public static void main(String[] args) {\n        SpringApplication.run(ExamenApplication.class, args);\n    }\n\n    @Override\n    public void run(String... args) {\n\n        if (jugadorRepository.count() == 0) {\n\n            Jugador jugador1 = new Jugador\n                  (\"Lionel Messi\",\"La Pulga\",Posicion.DELANTERO);\n\n            jugadorRepository.save(jugador1);\n\n            System.out.println(\"ID creado: \" + jugador1.getId());\n        }\n\n        System.out.println(\"Total: \" + jugadorRepository.count());\n\n        for (Jugador jugador : jugadorRepository.findAll()) {\n            System.out.println(jugador.getNombre());\n        }\n    }\n}<\/pre>\n\n<p class=\"paso\">3. Entiende qu\u00e9 hace cada parte.<\/p>\n<ul>\n<li><code>@SpringBootApplication<\/code>: marca la clase que arranca y configura la aplicaci\u00f3n. Ya ven\u00eda en el archivo generado.<\/li>\n<li><code>implements CommandLineRunner<\/code>: permite que esta misma clase tenga un m\u00e9todo <code>run<\/code> que Spring ejecutar\u00e1 al terminar de preparar la aplicaci\u00f3n y la conexi\u00f3n con la base de datos.<\/li>\n<li><code>@Autowired<\/code>: le pide a Spring que coloque en <code>jugadorRepository<\/code> el repositorio preparado para trabajar con los jugadores.<\/li>\n<li><code>main<\/code>: arranca Spring. Conservamos este m\u00e9todo.<\/li>\n<li><code>run<\/code>: contiene las operaciones que queremos probar despu\u00e9s del arranque. Aqu\u00ed escribiremos los ejercicios.<\/li>\n<li><code>@Override<\/code>: indica que estamos escribiendo el m\u00e9todo <code>run<\/code> exigido por <code>CommandLineRunner<\/code>.<\/li>\n<\/ul>\n<p>Dentro de <code>run<\/code>:<\/p>\n<table>\n<tr><th>Instrucci\u00f3n<\/th><th>Qu\u00e9 hace<\/th><\/tr>\n<tr><td><code>if (jugadorRepository.count() == 0)<\/code><\/td><td>Comprueba si la tabla est\u00e1 vac\u00eda. Si est\u00e1 vac\u00eda, crea a Lionel Messi. As\u00ed evitamos intentar guardar otra vez el mismo mote al reiniciar esta primera prueba.<\/td><\/tr>\n<tr><td><code>Jugador jugador1 = new Jugador(...);<\/code><\/td><td>Crea el objeto <b>en la memoria del programa<\/b>.<\/td><\/tr>\n<tr><td><code>jugadorRepository.save(jugador1);<\/code><\/td><td>Lo guarda <b>en MySQL<\/b>. Crear el objeto con <code>new<\/code> no basta para guardarlo.<\/td><\/tr>\n<tr><td><code>for (Jugador jugador : jugadorRepository.findAll())<\/code><\/td><td>Recupera todos los jugadores y los recorre uno a uno para imprimir sus nombres.<\/td><\/tr>\n<\/table>\n\n<p class=\"paso\">4. Guarda todos los archivos. Pulsa <b>File &gt; Save All<\/b> o <b>Archivo &gt; Guardar todo<\/b>.<\/p>\n<p class=\"paso\">5. Ejecuta el proyecto.<\/p>\n<p class=\"paso\">6. Comprueba el resultado. Si la tabla estaba vac\u00eda, aparecer\u00e1 algo parecido a:<\/p>\n<pre>ID creado: 1\nTotal: 1\nLionel Messi<\/pre>\n<p>El ID puede ser diferente de 1. Si ya hab\u00eda jugadores, mostrar\u00e1 la cantidad y los nombres existentes. Adem\u00e1s ten en cuenta que hemos puesto en application.properties que nos ense\u00f1e el sql de cada consulta entonces va a aparecer el c\u00f3digo SQL generado entre los resultados.<\/p>\n<div class=\"ok\">En phpMyAdmin, abre <code>examen &gt; jugadores &gt; Examinar<\/code>. Con <code>ddl-auto=update<\/code>, los datos permanecen al detener la aplicaci\u00f3n. Con el servidor web a\u00f1adido, la aplicaci\u00f3n seguir\u00e1 en marcha hasta que la detengas con <code>Ctrl+C<\/code> o dando clic en el bot\u00f3n de parar.<\/div>\n<\/section>\n\n<section id=\"paso-9\">\n<header class=\"opener r1\"><h2>Practicar buscar, cambiar y borrar desde ExamenApplication<\/h2><div class=\"set\"><b>009<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n<p class=\"paso\">1. Abre <code>ExamenApplication.java<\/code>. Utilizaremos el mismo m\u00e9todo <code>run<\/code> del paso anterior. A\u00f1ade este import junto a los dem\u00e1s, <b>antes de<\/b> <code>@SpringBootApplication<\/code>:<\/p>\n<pre data-f=\"ExamenApplication.java (imports)\">import java.util.Optional;<\/pre>\n\n<p class=\"paso\">2. Busca un jugador y cambia su nombre. Dentro de <code>run<\/code>, localiza el listado del paso anterior:<\/p>\n<pre>for (Jugador jugador : jugadorRepository.findAll()) {\n    System.out.println(jugador.getNombre());\n}<\/pre>\n<p><b>Despu\u00e9s de la llave que cierra ese <code>for<\/code><\/b>, pega lo siguiente. El c\u00f3digo debe seguir dentro de las llaves de <code>run<\/code>:<\/p>\n<pre data-f=\"ExamenApplication.java (dentro de run)\">Optional&lt;Jugador&gt; resultado = jugadorRepository.findById(1L);\n\nif (resultado.isPresent()) {\n\n    Jugador jugador = resultado.get();\n\n    jugador.setNombre(\"Ana Garc\u00eda\");\n\n    jugadorRepository.save(jugador);\n\n    System.out.println(\n        \"Nombre cambiado: \" + jugador.getNombre()\n    );\n\n} else {\n\n    System.out.println(\"No existe ese jugador\");\n\n}<\/pre>\n<div class=\"warn\">Usa un identificador que exista en tu tabla. Si el jugador tiene ID 5, cambia <code>1L<\/code> por <code>5L<\/code>.<\/div>\n<p><b>Qu\u00e9 hace cada l\u00ednea:<\/b><\/p>\n<ul>\n<li><code>jugadorRepository.findById(1L)<\/code>: busca en la base de datos al jugador con ID 1.<\/li>\n<li><code>Optional&lt;Jugador&gt;<\/code>: es una caja que puede contener al jugador encontrado o estar vac\u00eda.<\/li>\n<li><code>resultado.isPresent()<\/code>: comprueba si la caja contiene un jugador.<\/li>\n<li><code>resultado.get()<\/code>: saca el jugador de la caja. Lo utilizamos despu\u00e9s de comprobar que existe.<\/li>\n<li><code>jugador.setNombre(...)<\/code>: cambia el nombre en el objeto Java.<\/li>\n<li><code>jugadorRepository.save(jugador)<\/code>: guarda ese cambio en MySQL.<\/li>\n<\/ul>\n<p>Estamos modificando un jugador que ya ten\u00eda identificador, as\u00ed que guardamos los cambios de ese registro.<\/p>\n\n<p class=\"paso\">3. Guarda y comprueba la modificaci\u00f3n. Guarda los archivos y ejecuta el proyecto. Si el jugador existe, aparecer\u00e1:<\/p>\n<pre>Nombre cambiado: Ana Garc\u00eda<\/pre>\n<div class=\"ok\">En phpMyAdmin, entra en <code>examen &gt; jugadores &gt; Examinar<\/code>. Actualiza la p\u00e1gina y comprueba el nombre.<\/div>\n\n<p class=\"paso\">4. Prueba el borrado con un jugador temporal. Debajo del bloque anterior, <b>todav\u00eda dentro de <code>run<\/code><\/b>, a\u00f1ade:<\/p>\n<pre data-f=\"ExamenApplication.java (dentro de run)\">Jugador temporal = new Jugador(\n    \"Temporal\",\n    \"PruebaUnica\",\n    Posicion.PORTERO\n);\n\njugadorRepository.save(temporal);\n\nLong idTemporal = temporal.getId();\n\nSystem.out.println(\n    \"ID del jugador temporal: \" + idTemporal\n);\n\njugadorRepository.deleteById(idTemporal);\n\nSystem.out.println(\n    \"\u00bfSigue existiendo? \" + jugadorRepository.existsById(idTemporal)\n);<\/pre>\n<p>Este bloque hace lo siguiente:<\/p>\n<ol>\n<li>Crea un jugador temporal en memoria.<\/li>\n<li>Lo guarda en MySQL.<\/li>\n<li>Obtiene el identificador que MySQL le ha asignado.<\/li>\n<li>Borra ese jugador usando su identificador.<\/li>\n<li>Comprueba si sigue existiendo.<\/li>\n<\/ol>\n<p>Guarda y vuelve a ejecutar. El resultado esperado del \u00faltimo mensaje es:<\/p>\n<pre>\u00bfSigue existiendo? false<\/pre>\n<p><code>false<\/code> significa que el jugador temporal ya no existe. Como lo creamos y borramos durante la misma ejecuci\u00f3n, al revisar despu\u00e9s la tabla en phpMyAdmin no aparecer\u00e1.<\/p>\n<div class=\"why\"><code>findById<\/code> devuelve un <code>Optional&lt;Jugador&gt;<\/code> porque puede no encontrar nada; <code>findAll<\/code> devuelve una <code>List&lt;Jugador&gt;<\/code> porque puede encontrar varios. El sufijo <code>L<\/code> de <code>1L<\/code> indica que ese n\u00famero es de tipo <code>long<\/code>.<\/div>\n<\/section>\n\n<section id=\"paso-10\">\n<header class=\"opener r1\"><h2>Escribir consultas en la interfaz<\/h2><div class=\"set\"><b>010<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n<p class=\"paso\">1. Abre <code>IJugadorRepository.java<\/code>. Dentro de esta interfaz escribimos las b\u00fasquedas que necesitamos. Para estas consultas, <b>Spring Data prepara el c\u00f3digo que consulta MySQL a partir del nombre del m\u00e9todo<\/b>. Deja el archivo as\u00ed, manteniendo el paquete de tu proyecto:<\/p>\n<pre data-f=\"repository/IJugadorRepository.java\">package leo.astray.examen.repository;\n\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport leo.astray.examen.entity.Jugador;\nimport leo.astray.examen.enums.Posicion;\n\npublic interface IJugadorRepository\n        extends JpaRepository&lt;Jugador, Long&gt; {\n\n    Jugador findByMote(String mote);\n\n    List&lt;Jugador&gt; findByPosicionAndNombre(\n        Posicion posicion, String nombre\n    );\n}<\/pre>\n\n<p class=\"paso\">2. Entiende la primera consulta: buscar por mote.<\/p>\n<pre>Jugador findByMote(String mote);<\/pre>\n<div class=\"kid\">Se lee as\u00ed: \u00abBusca un jugador cuyo mote coincida con el texto que te doy\u00bb.<\/div>\n<ul>\n<li><code>Jugador<\/code>: devuelve un jugador.<\/li>\n<li><code>findByMote<\/code>: significa \u00abbuscar por el campo <code>mote<\/code>\u00bb.<\/li>\n<li><code>String mote<\/code>: es el texto que recibir\u00e1 para buscar.<\/li>\n<li><code>;<\/code>: termina la declaraci\u00f3n. Aqu\u00ed no escribimos el c\u00f3digo de la b\u00fasqueda.<\/li>\n<\/ul>\n<p>Como el mote es \u00fanico, no deber\u00eda haber dos jugadores con el mismo mote. <b>Si no encuentra ninguno, este m\u00e9todo devuelve <code>null<\/code>.<\/b><\/p>\n\n<p class=\"paso\">3. Prueba esa consulta en <code>ExamenApplication.java<\/code>. Dentro de <code>run<\/code>, a\u00f1ade:<\/p>\n<pre data-f=\"ExamenApplication.java (dentro de run)\">Jugador encontrado = jugadorRepository.findByMote(\"Rayo\");\n\nif (encontrado != null) {\n    System.out.println(encontrado.getNombre());\n} else {\n    System.out.println(\"No existe ning\u00fan jugador con ese mote\");\n}<\/pre>\n<p><code>encontrado != null<\/code> comprueba que hemos encontrado un jugador antes de pedirle su nombre.<\/p>\n\n<p class=\"paso\">4. Entiende la segunda consulta: buscar por posici\u00f3n y nombre.<\/p>\n<pre>List&lt;Jugador&gt; findByPosicionAndNombre(\n    Posicion posicion, String nombre\n);<\/pre>\n<div class=\"kid\">Se lee as\u00ed: \u00abBusca los jugadores que tengan esta posici\u00f3n <b>y tambi\u00e9n<\/b> este nombre\u00bb.<\/div>\n<p><code>And<\/code> significa <b>y<\/b>: deben cumplirse las dos condiciones. Aqu\u00ed utilizamos <code>List&lt;Jugador&gt;<\/code> porque puede haber varios jugadores con el mismo nombre y posici\u00f3n. Es simplemente una lista de resultados.<\/p>\n\n<p class=\"paso\">5. Pru\u00e9bala tambi\u00e9n dentro de <code>run<\/code>.<\/p>\n<pre data-f=\"ExamenApplication.java (dentro de run)\">for (Jugador jugador :\n        jugadorRepository.findByPosicionAndNombre(\n            Posicion.DELANTERO, \"Ana Garc\u00eda\")) {\n\n    System.out.println(jugador.getNombre());\n    System.out.println(jugador.getMote());\n}<\/pre>\n<p>El <code>for<\/code> muestra los jugadores encontrados, uno a uno. Si no hay coincidencias, no entra en el bucle. Escribe el nombre exactamente como lo tengas guardado.<\/p>\n<p class=\"paso\">6. Guarda y ejecuta.<\/p>\n<div class=\"why\">Escribe los nombres de los <b>campos Java<\/b> correctamente, sino puede que no funcione el m\u00e9todo: <code>findByMote<\/code> busca por <code>mote<\/code> y <code>findByPosicionAndNombre<\/code> busca por <code>posicion<\/code> y <code>nombre<\/code>.<\/div>\n<p>Con estas dos consultas puedes entender el mecanismo. A\u00f1ade las dem\u00e1s cuando el ejercicio las pida. Si un enunciado exige expresamente <code>Optional&lt;Jugador&gt;<\/code>, tendr\u00e1s que respetar ese requisito.<\/p>\n<\/section>\n\n<section id=\"paso-11\">\n<header class=\"opener r1\"><h2>A\u00f1adir una relaci\u00f3n uno a uno<\/h2><div class=\"set\"><b>011<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n<p>Una relaci\u00f3n <b>uno a uno<\/b> conecta un objeto con otro.<\/p>\n<div class=\"kid\">Piensa en un jugador y su ficha personal de estad\u00edsticas: cada jugador tiene una ficha y esa ficha no se comparte con otro jugador. En este ejemplo la ficha es obligatoria.<\/div>\n\n<h3>Preparar la clase principal<\/h3>\n<p class=\"paso\">1. Abre <code>ExamenApplication.java<\/code> en <code>src/main/java/leo/astray/examen<\/code>.<\/p>\n<p class=\"paso\">2. Borra solamente las instrucciones de las pruebas anteriores que est\u00e1n <b>dentro de las llaves de <code>run<\/code><\/b>. Conserva <code>main<\/code>, <code>@SpringBootApplication<\/code>, <code>implements CommandLineRunner<\/code>, los campos con <code>@Autowired<\/code> y el propio m\u00e9todo <code>run<\/code>.<\/p>\n<p class=\"paso\">3. Deja temporalmente esta instrucci\u00f3n dentro de <code>run<\/code>:<\/p>\n<pre data-f=\"ExamenApplication.java (dentro de run)\">System.out.println(\"Preparando las relaciones\");<\/pre>\n<div class=\"why\">A partir de ahora, guardar un jugador exige darle tambi\u00e9n un perfil. Las pruebas antiguas que lo guardaban sin perfil dejar\u00edan de ser v\u00e1lidas.<\/div>\n\n<h3>Crear la entidad del perfil<\/h3>\n<p class=\"paso\">4. En el explorador de VS Code, busca el paquete <code>entity<\/code>. Haz clic derecho sobre \u00e9l \u2192 <b>New Java File \u2192 Class<\/b>. Escribe <code>PerfilEstadistico<\/code>. VS Code crea <code>PerfilEstadistico.java<\/code>.<\/p>\n<p class=\"paso\">5. Sustituye el contenido del archivo por este c\u00f3digo completo:<\/p>\n<pre data-f=\"entity/PerfilEstadistico.java\">package leo.astray.examen.entity;\n\nimport jakarta.persistence.*;\n\n@Entity\n@Table(name = \"perfiles_estadisticos\")\npublic class PerfilEstadistico {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_perfil\")\n    private Long id;\n\n    @Column(nullable = false)\n    private int partidos;\n    @Column(nullable = false)\n    private int goles;\n    @Column(nullable = false)\n    private int asistencias;\n    @Column(nullable = false)\n    private double valoracion;\n\n    public PerfilEstadistico() {}\n\n    public PerfilEstadistico(int partidos, int goles,\n            int asistencias, double valoracion) {\n        this.partidos = partidos;\n        this.goles = goles;\n        this.asistencias = asistencias;\n        this.valoracion = valoracion;\n    }\n\n    public Long getId() { return id; }\n    public int getPartidos() { return partidos; }\n    public int getGoles() { return goles; }\n    public int getAsistencias() { return asistencias; }\n    public double getValoracion() { return valoracion; }\n}<\/pre>\n\n<h3>Conectar el jugador con su perfil<\/h3>\n<p class=\"paso\">6. Abre <code>Jugador.java<\/code>. A\u00f1ade este campo junto a sus otros atributos, <b>dentro de la clase y fuera de cualquier m\u00e9todo<\/b>:<\/p>\n<pre data-f=\"entity/Jugador.java (nuevo campo)\">@OneToOne(cascade = CascadeType.ALL, optional = false)\n@JoinColumn(name = \"id_perfil\", nullable = false, unique = true)\nprivate PerfilEstadistico perfil;<\/pre>\n<p class=\"paso\">7. A\u00f1ade estos m\u00e9todos (getters y setters) dentro de la clase, junto a sus otros getters y setters, puedes usar el generate getters and setters que mencionamos en pasos anteriores:<\/p>\n<pre data-f=\"entity/Jugador.java (nuevos m\u00e9todos)\">public PerfilEstadistico getPerfil() {\n    return perfil;\n}\n\npublic void setPerfil(PerfilEstadistico perfil) {\n    this.perfil = perfil;\n}<\/pre>\n<p class=\"paso\">8. Cambia el constructor de <code>Jugador<\/code>. <b>Sustituye<\/b> el de 3 par\u00e1metros del paso 6 por este de 4, que a\u00f1ade el perfil. Conserva tambi\u00e9n el constructor vac\u00edo <code>public Jugador() {}<\/code>:<\/p>\n<pre data-f=\"entity/Jugador.java (constructor nuevo, sustituye al de 3 par\u00e1metros)\">public Jugador(String nombre, String mote,\n        Posicion posicion, PerfilEstadistico perfil) {\n    this.nombre = nombre;\n    this.mote = mote;\n    this.posicion = posicion;\n    this.perfil = perfil;\n}<\/pre>\n<p>Si prefieres generarlo con VS Code: borra el de 3 par\u00e1metros, clic derecho dentro de la clase &gt; <b>Source Action &gt; Generate Constructors<\/b> y marca solo <code>nombre<\/code>, <code>mote<\/code>, <code>posicion<\/code> y <code>perfil<\/code>. No marques <code>id<\/code> (lo pone MySQL).<\/p>\n<div class=\"why\"><b>\u00bfPor qu\u00e9 exigir el perfil en el constructor?<\/b> Porque la relaci\u00f3n es obligatoria: un jugador sin perfil no puede guardarse. Con este constructor, el compilador no te deja crear un <code>Jugador<\/code> sin \u00e9l, y el error aparece en rojo en VS Code, no al ejecutar y guardar. Por eso solo dejamos <b>una<\/b> forma de crear un jugador: <code>new Jugador(nombre, mote, posicion, perfil)<\/code>. El constructor vac\u00edo se queda porque JPA lo necesita para crear los objetos al leer filas de la base; t\u00fa no lo uses. Las pruebas antiguas del paso 9 que usaban 3 par\u00e1metros ya no compilan, y por eso el paso 2 ped\u00eda vaciar <code>run<\/code>.<\/div>\n<p><b>Qu\u00e9 significa cada parte:<\/b> <code>@OneToOne<\/code> declara la relaci\u00f3n. <code>@JoinColumn<\/code> crea en <code>jugadores<\/code> la columna <code>id_perfil<\/code>, que guarda el n\u00famero de una fila de <code>perfiles_estadisticos<\/code>. Ese n\u00famero es una <b>clave for\u00e1nea<\/b>: una referencia a otra tabla, como apuntar el n\u00famero de la ficha en la tarjeta del jugador.<\/p>\n<p><code>nullable = false<\/code> obliga a indicar un perfil. <code>unique = true<\/code> impide que dos jugadores compartan el mismo. <code>optional = false<\/code> expresa tambi\u00e9n en el modelo Java que la relaci\u00f3n es obligatoria.<\/p>\n<p>El <b>propietario de la relaci\u00f3n<\/b> es el lado que controla la columna de uni\u00f3n; aqu\u00ed es <code>Jugador<\/code>. <code>cascade = CascadeType.ALL<\/code> propaga las operaciones JPA al perfil: al guardar un jugador nuevo se guarda su perfil y al borrar ese jugador tambi\u00e9n se borra su perfil. Tiene sentido porque esa ficha pertenece a ese jugador.<\/p>\n\n<h3>C\u00f3mo se guardar\u00e1 desde Java<\/h3>\n<p>Este bloque es un ejemplo para poner <b>dentro de <code>run<\/code><\/b>, cuando hayas terminado el modelo y cargado los datos del paso 14. No lo a\u00f1adas todav\u00eda a la prueba final:<\/p>\n<pre data-f=\"ExamenApplication.java (ejemplo)\">PerfilEstadistico perfil = new PerfilEstadistico(\n    10, 2, 1, 7.5);\n\nJugador jugador = new Jugador(\n    \"Leo\", \"Flecha\", Posicion.DEFENSA, perfil);\n\njugadorRepository.save(jugador);<\/pre>\n<p>Primero preparas la ficha; despu\u00e9s fabricas el jugador pas\u00e1ndosela en el constructor, y por \u00faltimo lo guardas. Al guardar el jugador, la cascada guarda tambi\u00e9n la ficha. El orden importa: el perfil tiene que existir antes que el jugador, porque el constructor lo pide.<\/p>\n<div class=\"warn\"><b>No ejecutes todav\u00eda el modelo nuevo con las filas antiguas.<\/b> Esas filas podr\u00edan no tener el perfil obligatorio. Termina las relaciones de los pasos 12 y 13; en el 14 preparar\u00e1s datos que encajan con ellas.<\/div>\n<p>Si un ejercicio pide navegar tambi\u00e9n desde el perfil hasta su jugador, el lado inverso llevar\u00eda <code>@OneToOne(mappedBy = \"perfil\")<\/code>. <code>perfil<\/code> es el nombre del atributo de <code>Jugador<\/code>. Para nuestro ejemplo basta con poder ir de jugador a perfil.<\/p>\n<\/section>\n\n<section id=\"paso-12\">\n<header class=\"opener r1\"><h2>Crear una relaci\u00f3n uno a muchos<\/h2><div class=\"set\"><b>012<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n<p>Una relaci\u00f3n <b>uno a muchos<\/b> significa que un objeto puede tener varios del otro tipo. En este ejercicio un equipo puede tener varios estadios, pero cada estadio pertenece a un solo equipo.<\/p>\n<p>Primero veremos la relaci\u00f3n en una direcci\u00f3n y despu\u00e9s la convertiremos en dos direcciones. Son dos versiones de la misma relaci\u00f3n; al final conservaremos la bidireccional.<\/p>\n\n<h3>Crear Estadio<\/h3>\n<p class=\"paso\">1. Clic derecho en <code>entity<\/code> \u2192 <b>New Java File \u2192 Class<\/b>. Escribe <code>Estadio<\/code> y pega el archivo completo:<\/p>\n<pre data-f=\"entity/Estadio.java\">package leo.astray.examen.entity;\n\nimport jakarta.persistence.*;\n\n@Entity\n@Table(name = \"estadios\")\npublic class Estadio {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_estadio\")\n    private Long id;\n\n    @Column(nullable = false, length = 100)\n    private String nombre;\n    @Column(nullable = false)\n    private int capacidad;\n\n    public Estadio() {}\n\n    public Estadio(String nombre, int capacidad) {\n        this.nombre = nombre;\n        this.capacidad = capacidad;\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public int getCapacidad() { return capacidad; }\n}<\/pre>\n\n<h3>Crear Equipo con una lista de estadios<\/h3>\n<p class=\"paso\">2. Crea <code>Equipo.java<\/code> de la misma manera y pega este c\u00f3digo completo:<\/p>\n<pre data-f=\"entity/Equipo.java\">package leo.astray.examen.entity;\n\nimport jakarta.persistence.*;\nimport java.math.BigDecimal;\nimport java.util.ArrayList;\nimport java.util.List;\n\n@Entity\n@Table(name = \"equipos\")\npublic class Equipo {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_equipo\")\n    private Long id;\n\n    @Column(nullable = false, length = 100)\n    private String nombre;\n    @Column(nullable = false, length = 100)\n    private String ciudad;\n    @Column(nullable = false, precision = 14, scale = 2)\n    private BigDecimal presupuesto;\n\n    @OneToMany(cascade = CascadeType.ALL, orphanRemoval = true)\n    @JoinColumn(name = \"id_equipo\")\n    private List&lt;Estadio&gt; estadios = new ArrayList&lt;&gt;();\n\n    public Equipo() {}\n\n    public Equipo(String nombre, String ciudad,\n            BigDecimal presupuesto) {\n        this.nombre = nombre;\n        this.ciudad = ciudad;\n        this.presupuesto = presupuesto;\n    }\n\n    public Long getId() { return id; }\n    public String getNombre() { return nombre; }\n    public String getCiudad() { return ciudad; }\n    public BigDecimal getPresupuesto() { return presupuesto; }\n    public List&lt;Estadio&gt; getEstadios() { return estadios; }\n\n    public void addEstadio(Estadio estadio) {\n        estadios.add(estadio);\n    }\n}<\/pre>\n<p><code>List&lt;Estadio&gt;<\/code> es la lista de estadios de ese equipo. Aqu\u00ed necesitamos una colecci\u00f3n porque puede haber varios. <code>new ArrayList&lt;&gt;()<\/code> prepara una lista vac\u00eda donde poder a\u00f1adirlos; si no la creas, podr\u00edas tener <code>null<\/code> y no podr\u00edas usar <code>add<\/code>.<\/p>\n<p><code>BigDecimal<\/code> sirve para representar importes decimales exactos. Para dinero escribe, por ejemplo, <code>new BigDecimal(\"100000.00\")<\/code>. <code>precision = 14, scale = 2<\/code> permite 14 cifras en total, 2 de ellas decimales.<\/p>\n<div class=\"why\">En esta primera versi\u00f3n puedes ir de <code>Equipo<\/code> a sus estadios, pero <code>Estadio<\/code> no tiene un campo para volver al equipo. Por eso se llama <b>unidireccional<\/b>. Aunque <code>@JoinColumn<\/code> est\u00e9 escrito en <code>Equipo<\/code>, en este mapeo la columna <code>id_equipo<\/code> est\u00e1 en la tabla <code>estadios<\/code>.<\/div>\n\n<h3>Convertirla en bidireccional<\/h3>\n<p class=\"paso\">3. Abre <code>Estadio.java<\/code>. A\u00f1ade este atributo dentro de la clase, despu\u00e9s de los otros campos, y los m\u00e9todos junto a sus getters:<\/p>\n<pre data-f=\"entity/Estadio.java (nuevo campo y m\u00e9todos)\">@ManyToOne(fetch = FetchType.LAZY, optional = false)\n@JoinColumn(name = \"id_equipo\", nullable = false)\nprivate Equipo equipo;\n\npublic Equipo getEquipo() {\n    return equipo;\n}\n\npublic void setEquipo(Equipo equipo) {\n    this.equipo = equipo;\n}<\/pre>\n<p>Desde el punto de vista de un estadio, muchos estadios pueden apuntar al mismo equipo: por eso aqu\u00ed escribimos <code>@ManyToOne<\/code>.<\/p>\n<p class=\"paso\">4. Vuelve a <code>Equipo.java<\/code>. <b>Sustituye las dos anotaciones de la lista <code>estadios<\/code><\/b> por esta. Conserva una sola lista y elimina la antigua <code>@JoinColumn<\/code> de ese campo:<\/p>\n<pre data-f=\"entity/Equipo.java (lista estadios)\">@OneToMany(mappedBy = \"equipo\", cascade = CascadeType.ALL,\n    orphanRemoval = true)\nprivate List&lt;Estadio&gt; estadios = new ArrayList&lt;&gt;();<\/pre>\n<p>Ahora puedes ir de equipo a estadios y de estadio a equipo: es <b>bidireccional<\/b>. En la base sigue habiendo una sola columna <code>estadios.id_equipo<\/code>. <code>mappedBy = \"equipo\"<\/code> se\u00f1ala el campo Java <code>equipo<\/code> de <code>Estadio<\/code>; no se escribe <code>id_equipo<\/code> porque ese es el nombre SQL.<\/p>\n<p><code>orphanRemoval = true<\/code> significa que quitar un estadio de esta relaci\u00f3n puede borrar su fila al sincronizar los cambios con la base. \u00dasalo cuando el hijo deba desaparecer al separarlo del padre. <code>cascade = ALL<\/code> incluye borrar los estadios al borrar su equipo; no es lo mismo que quitar un elemento de la lista.<\/p>\n<p>Un ejemplo de creaci\u00f3n, para usar dentro de <code>run<\/code> si el ejercicio lo pide, ser\u00eda:<\/p>\n<pre data-f=\"ExamenApplication.java (ejemplo)\">Equipo equipo = new Equipo(\n    \"Estrellas\", \"Madrid\", new BigDecimal(\"100000.00\"));\nEstadio estadio = new Estadio(\"Campo Norte\", 5000);\n\nequipo.addEstadio(estadio);\nequipoRepository.save(equipo);<\/pre>\n<p>Este ejemplo explica la operaci\u00f3n; no lo copies adem\u00e1s de los datos iniciales del paso 14. All\u00ed se crear\u00e1n ya esos registros con SQL. Para usarlo necesitar\u00edas importar <code>java.math.BigDecimal<\/code> en la clase principal y tener el repositorio de equipos que crearemos en ese paso.<\/p>\n<\/section>\n\n<section id=\"paso-13\">\n<header class=\"opener r1\"><h2>Representar una relaci\u00f3n muchos a muchos<\/h2><div class=\"set\"><b>013<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n<p>Una relaci\u00f3n <b>muchos a muchos<\/b> permite que varios objetos de un tipo se relacionen con varios del otro. Un jugador puede pasar por distintos equipos a lo largo de su carrera y cada equipo puede tener muchos jugadores.<\/p>\n<p>Hay dos formas seg\u00fan lo que pida el examen. Si solo necesitas unir jugador y equipo, sirve <code>@ManyToMany<\/code>. Si adem\u00e1s debes guardar precio, temporada o tipo de operaci\u00f3n, crea <code>Fichaje<\/code>.<\/p>\n<div class=\"warn\"><b>El proyecto que seguimos construyendo usa Fichaje.<\/b> La primera opci\u00f3n es una explicaci\u00f3n alternativa; no la a\u00f1adas al modelo final.<\/div>\n\n<h3>Opci\u00f3n A: cuando solo interesa la uni\u00f3n<\/h3>\n<p>La base necesita una tabla intermedia con un ID de jugador y un ID de equipo. En <code>Jugador<\/code> el mapeo podr\u00eda ser:<\/p>\n<pre data-f=\"entity/Jugador.java (opci\u00f3n A)\">@ManyToMany\n@JoinTable(name = \"jugadores_equipos\",\n    joinColumns = @JoinColumn(name = \"id_jugador\"),\n    inverseJoinColumns = @JoinColumn(name = \"id_equipo\"))\nprivate Set&lt;Equipo&gt; equipos = new HashSet&lt;&gt;();\n\npublic Set&lt;Equipo&gt; getEquipos() {\n    return equipos;\n}\n\npublic void addEquipo(Equipo equipo) {\n    equipos.add(equipo);\n    equipo.getJugadores().add(this);\n}<\/pre>\n<p>En <code>Equipo<\/code>, el otro lado ser\u00eda:<\/p>\n<pre data-f=\"entity/Equipo.java (opci\u00f3n A)\">@ManyToMany(mappedBy = \"equipos\")\nprivate Set&lt;Jugador&gt; jugadores = new HashSet&lt;&gt;();\n\npublic Set&lt;Jugador&gt; getJugadores() {\n    return jugadores;\n}<\/pre>\n<p>Ambos archivos necesitar\u00edan <code>import java.util.Set;<\/code> e <code>import java.util.HashSet;<\/code>. Un <code>Set<\/code> es una colecci\u00f3n que evita elementos repetidos seg\u00fan la igualdad de los objetos Java. Aqu\u00ed lo usamos para representar una pertenencia sin repetir el mismo objeto.<\/p>\n<p><code>@JoinTable<\/code> da nombre a la tabla intermedia. <code>joinColumns<\/code> corresponde al propietario, aqu\u00ed el jugador; <code>inverseJoinColumns<\/code>, al equipo. <code>mappedBy = \"equipos\"<\/code> apunta al atributo de <code>Jugador<\/code>.<\/p>\n<div class=\"warn\">No pongas cascada de borrado hacia los equipos: borrar un jugador no debe borrar los equipos compartidos con otros jugadores.<\/div>\n\n<h3>Opci\u00f3n B: crear Fichaje con sus propios datos<\/h3>\n<p class=\"paso\">1. Para seguir el tutorial, conserva <code>Jugador<\/code>, <code>Equipo<\/code>, <code>Estadio<\/code> y <code>PerfilEstadistico<\/code> de los pasos anteriores. Si hab\u00edas copiado la opci\u00f3n A, quita sus campos <code>equipos<\/code> y <code>jugadores<\/code>, las anotaciones y los m\u00e9todos que dependen de ellos. No mantengas las dos formas para el mismo historial.<\/p>\n<p class=\"paso\">2. Clic derecho en <code>enums<\/code> \u2192 <b>New Java File \u2192 Enum<\/b>. Crea <code>PeriodoMercado<\/code> y pega:<\/p>\n<pre data-f=\"enums/PeriodoMercado.java\">package leo.astray.examen.enums;\n\npublic enum PeriodoMercado {\n    VERANO,\n    INVIERNO\n}<\/pre>\n<p class=\"paso\">3. Crea del mismo modo <code>TipoOperacion<\/code>:<\/p>\n<pre data-f=\"enums/TipoOperacion.java\">package leo.astray.examen.enums;\n\npublic enum TipoOperacion {\n    TRASPASO,\n    CESION,\n    LIBRE\n}<\/pre>\n<div class=\"kid\">Un <b>enum<\/b> es una lista cerrada de valores permitidos. Es como elegir entre los sabores escritos en un men\u00fa: puedes usar <code>VERANO<\/code> o <code>INVIERNO<\/code>, pero no inventarte un texto distinto por error.<\/div>\n<p>Los archivos tambi\u00e9n terminan en <code>.java<\/code>; la palabra <code>enum<\/code> indica qu\u00e9 est\u00e1s creando.<\/p>\n<p class=\"paso\">4. Clic derecho en <code>entity<\/code> \u2192 <b>New Java File \u2192 Class<\/b>. Crea <code>Fichaje<\/code> y pega este archivo:<\/p>\n<pre data-f=\"entity/Fichaje.java\">package leo.astray.examen.entity;\n\nimport jakarta.persistence.*;\nimport java.math.BigDecimal;\nimport leo.astray.examen.enums.PeriodoMercado;\nimport leo.astray.examen.enums.TipoOperacion;\n\n@Entity\n@Table(name = \"fichajes\")\npublic class Fichaje {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id_fichaje\")\n    private Long id;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"id_jugador\", nullable = false)\n    private Jugador jugador;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"id_equipo\", nullable = false)\n    private Equipo equipo;\n\n    @Column(nullable = false, length = 5)\n    private String temporada;\n    @Column(nullable = false, precision = 14, scale = 2)\n    private BigDecimal precio;\n    @Column(name = \"clausula_pagada\", nullable = false)\n    private boolean clausulaPagada;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 10)\n    private PeriodoMercado mercado;\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 10)\n    private TipoOperacion tipo;\n\n    public Fichaje() {}\n\n    public Fichaje(Jugador jugador, Equipo equipo,\n            String temporada, BigDecimal precio,\n            boolean clausulaPagada, PeriodoMercado mercado,\n            TipoOperacion tipo) {\n        this.jugador = jugador;\n        this.equipo = equipo;\n        this.temporada = temporada;\n        this.precio = precio;\n        this.clausulaPagada = clausulaPagada;\n        this.mercado = mercado;\n        this.tipo = tipo;\n    }\n\n    public Long getId() { return id; }\n    public Jugador getJugador() { return jugador; }\n    public Equipo getEquipo() { return equipo; }\n    public String getTemporada() { return temporada; }\n    public BigDecimal getPrecio() { return precio; }\n    public boolean isClausulaPagada() { return clausulaPagada; }\n    public PeriodoMercado getMercado() { return mercado; }\n    public TipoOperacion getTipo() { return tipo; }\n\n    public void setJugador(Jugador jugador) {\n        this.jugador = jugador;\n    }\n}<\/pre>\n<div class=\"kid\">Un fichaje es como un recibo que dice \u00abeste jugador ha fichado por este equipo, en esta temporada y por este precio\u00bb.<\/div>\n<p>Por eso tiene <b>dos relaciones muchos a uno<\/b>: muchos fichajes pueden apuntar al mismo jugador y muchos al mismo equipo.<\/p>\n<div class=\"warn\"><code>@Enumerated(EnumType.STRING)<\/code> guarda el nombre del valor, por ejemplo <code>VERANO<\/code>. El SQL debe usar ese mismo texto. No escribas <code>verano<\/code> o <code>CESI\u00d3N<\/code> si tus constantes son <code>VERANO<\/code> y <code>CESION<\/code>.<\/div>\n<p class=\"paso\">5. Abre <code>Jugador.java<\/code>. A\u00f1ade los imports <code>java.util.List<\/code> y <code>java.util.ArrayList<\/code> debajo de los dem\u00e1s imports. Dentro de la clase a\u00f1ade este campo, su getter y el m\u00e9todo de ayuda:<\/p>\n<pre data-f=\"entity/Jugador.java (fichajes)\">@OneToMany(mappedBy = \"jugador\", cascade = CascadeType.ALL,\n    orphanRemoval = true)\nprivate List&lt;Fichaje&gt; fichajes = new ArrayList&lt;&gt;();\n\npublic List&lt;Fichaje&gt; getFichajes() {\n    return fichajes;\n}\n\npublic void addFichaje(Fichaje fichaje) {\n    fichajes.add(fichaje);\n    fichaje.setJugador(this);\n}<\/pre>\n<p class=\"paso\">6. Abre <code>Equipo.java<\/code>. A\u00f1ade este campo y su getter dentro de la clase. Ya tienes los imports de <code>List<\/code> y <code>ArrayList<\/code>:<\/p>\n<pre data-f=\"entity/Equipo.java (fichajes)\">@OneToMany(mappedBy = \"equipo\")\nprivate List&lt;Fichaje&gt; fichajes = new ArrayList&lt;&gt;();\n\npublic List&lt;Fichaje&gt; getFichajes() {\n    return fichajes;\n}<\/pre>\n<div class=\"warn\"><b>No vuelvas a generar los constructores.<\/b> Conserva los que ya tienen <code>Jugador<\/code> (el vac\u00edo y el de 4 par\u00e1metros del paso 11: nombre, mote, posici\u00f3n y perfil), <code>Equipo<\/code> y el resto. Las listas <code>fichajes<\/code> <b>no<\/b> van en ning\u00fan constructor: nacen vac\u00edas y se llenan despu\u00e9s con <code>addFichaje<\/code>. Si usas <b>Generate Constructors<\/b> y marcas <code>fichajes<\/code>, cambias la forma de crear un jugador y el c\u00f3digo de los pasos 11 y 19 deja de compilar. Si solo necesitas getters y setters que falten, genera \u00fanicamente esos.<\/div>\n<p>Los dos campos <code>mappedBy<\/code> se\u00f1alan los atributos de <code>Fichaje<\/code>, que es quien guarda las claves for\u00e1neas. No a\u00f1adas otra <code>@JoinColumn<\/code> en esas listas. En <code>Equipo<\/code> no ponemos cascada de borrado para los fichajes: si un equipo tiene historial asociado, primero hay que decidir qu\u00e9 pide el ejercicio que hagamos con ese historial.<\/p>\n<p>Para crear un fichaje desde Java, el equipo debe existir o guardarse antes. El constructor de <code>Fichaje<\/code> recibe al jugador y al equipo; despu\u00e9s puedes usar <code>jugador.addFichaje(fichaje)<\/code> y guardar el jugador para propagar el guardado al fichaje. Si est\u00e1s usando tambi\u00e9n la lista inversa de ese equipo en memoria, a\u00f1ade el fichaje a <code>equipo.getFichajes()<\/code> para mantenerla sincronizada.<\/p>\n<\/section>\n\n<section id=\"paso-14\">\n<header class=\"opener r1\"><h2>Cargar los datos iniciales<\/h2><div class=\"set\"><b>014<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n<p>Ahora ya est\u00e1n definidas las relaciones. Vamos a crear un peque\u00f1o juego de datos conocido para que todos los ejemplos den resultados f\u00e1ciles de comprobar.<\/p>\n\n<h3>Preparar la configuraci\u00f3n<\/h3>\n<p class=\"paso\">1. Guarda todos los archivos con <b>File \u2192 Save All<\/b>. Det\u00e9n la aplicaci\u00f3n antes de cambiar su configuraci\u00f3n.<\/p>\n<p class=\"paso\">2. Abre <code>src/main/resources/application.properties<\/code>. Estas opciones recrean las tablas: \u00fasalas sobre <code>examen<\/code>, la base de pr\u00e1ctica.<\/p>\n<div class=\"warn\">Si la base contiene datos que quieres conservar, utiliza otra base de pr\u00e1ctica vac\u00eda y cambia el nombre en la conexi\u00f3n antes de continuar.<\/div>\n<p class=\"paso\">3. Sustituye la l\u00ednea anterior de <code>ddl-auto<\/code> y a\u00f1ade las otras dos opciones. Deja una sola l\u00ednea de cada propiedad:<\/p>\n<pre data-f=\"src/main/resources/application.properties\">spring.jpa.hibernate.ddl-auto=create-drop\nspring.sql.init.mode=always\nspring.jpa.defer-datasource-initialization=true<\/pre>\n<p><code>create-drop<\/code> crea las tablas desde las entidades al arrancar y las elimina al cerrar normalmente. <code>mode=always<\/code> activa <code>data.sql<\/code> tambi\u00e9n al usar MySQL. <code>defer-datasource-initialization=true<\/code> hace que esos <code>INSERT<\/code> se ejecuten despu\u00e9s de que Hibernate cree las tablas. Conserva tus propiedades de conexi\u00f3n a MySQL.<\/p>\n\n<h3>Crear data.sql<\/h3>\n<p class=\"paso\">4. En VS Code, clic derecho sobre <code>src/main/resources<\/code> \u2192 <b>New File<\/b>. Escribe <code>data.sql<\/code>, pulsa Enter y pega:<\/p>\n<pre data-f=\"src/main/resources/data.sql\">INSERT INTO perfiles_estadisticos\n  (id_perfil, partidos, goles, asistencias, valoracion)\nVALUES (1, 10, 6, 3, 8.5),\n       (2, 12, 0, 1, 7.2);\n\nINSERT INTO jugadores\n  (id_jugador, nombre, mote, posicion, id_perfil)\nVALUES (1, 'Ana', 'Rayo', 'DELANTERO', 1),\n       (2, 'Luis', 'Muro', 'PORTERO', 2);\n\nINSERT INTO equipos (id_equipo, nombre, ciudad, presupuesto)\nVALUES (1, 'Estrellas', 'Madrid', 100000.00),\n       (2, 'Cometas', 'Sevilla', 80000.00);\n\nINSERT INTO estadios (id_estadio, nombre, capacidad, id_equipo)\nVALUES (1, 'Campo Norte', 5000, 1),\n       (2, 'Campo Sur', 3000, 2);\n\nINSERT INTO fichajes\n  (id_fichaje, id_jugador, id_equipo, temporada, precio,\n   clausula_pagada, mercado, tipo)\nVALUES (1, 1, 1, '26/27', 1200.00, false, 'VERANO', 'TRASPASO'),\n       (2, 2, 2, '26/27', 500.00, false, 'INVIERNO', 'CESION');<\/pre>\n<div class=\"warn\">El orden importa: primero la fila a la que vas a apuntar y despu\u00e9s la fila que la necesita. No puedes insertar un jugador con <code>id_perfil = 1<\/code> si ese perfil todav\u00eda no existe. Tampoco puedes insertar un fichaje de un equipo inexistente.<\/div>\n<p>Aqu\u00ed damos los ID a mano para que las pruebas sean f\u00e1ciles de seguir. Cuando crees un objeto nuevo desde Java, no le pongas un ID: MySQL generar\u00e1 otro mediante <code>IDENTITY<\/code>.<\/p>\n\n<h3>Crear el repositorio de equipos<\/h3>\n<p class=\"paso\">5. Clic derecho sobre <code>repository<\/code> \u2192 <b>New Java File \u2192 Interface<\/b>. Escribe <code>IEquipoRepository<\/code> y pega:<\/p>\n<pre data-f=\"repository/IEquipoRepository.java\">package leo.astray.examen.repository;\n\nimport leo.astray.examen.entity.Equipo;\nimport org.springframework.data.jpa.repository.JpaRepository;\n\npublic interface IEquipoRepository\n        extends JpaRepository&lt;Equipo, Long&gt; {\n}<\/pre>\n<p>Una <b>interfaz<\/b> dice qu\u00e9 operaciones est\u00e1n disponibles. Al extender <code>JpaRepository&lt;Equipo, Long&gt;<\/code> recibes operaciones como guardar, buscar y borrar equipos. <code>Equipo<\/code> dice qu\u00e9 entidad maneja y <code>Long<\/code> qu\u00e9 tipo tiene su ID. Spring prepara la implementaci\u00f3n; t\u00fa la utilizar\u00e1s desde <code>ExamenApplication<\/code>.<\/p>\n<p>La <code>I<\/code> inicial y el final <code>Repository<\/code> siguen la forma de nombrar usada en estos apuntes y materiales. Son una convenci\u00f3n, no una obligaci\u00f3n del lenguaje Java. El archivo se crea como <b>Interface<\/b>, mientras las entidades se crean como <b>Class<\/b>.<\/p>\n\n<h3>Arrancar y ver las tablas<\/h3>\n<p class=\"paso\">6. Comprueba que has a\u00f1adido la dependencia del servidor web siguiendo el paso 3A. Mant\u00e9n las pruebas dentro de <code>ExamenApplication<\/code> y deja temporalmente solo un mensaje dentro de <code>run<\/code> para no insertar otra vez los registros que ya carga <code>data.sql<\/code>.<\/p>\n<pre data-f=\"ExamenApplication.java (dentro de run)\">System.out.println(\"Datos iniciales cargados\");<\/pre>\n<p class=\"paso\">7. Guarda todos los archivos y ejecuta el proyecto. Espera a que la aplicaci\u00f3n arranque y muestre el mensaje de <code>run<\/code>.<\/p>\n<p class=\"paso\">8. Deja la aplicaci\u00f3n arrancada. En phpMyAdmin, abre <code>examen<\/code> y examina <code>perfiles_estadisticos<\/code>, <code>jugadores<\/code>, <code>equipos<\/code>, <code>estadios<\/code> y <code>fichajes<\/code>.<\/p>\n<div class=\"ok\">Con este <code>data.sql<\/code> debes encontrar dos filas en cada tabla.<\/div>\n<p class=\"paso\">9. Cuando acabes de mirar los datos, pulsa <code>Ctrl+C<\/code> en la terminal. <code>create-drop<\/code> elimina las tablas al cerrar normalmente. Al volver a arrancar, las recrea y carga otra vez <code>data.sql<\/code>.<\/p>\n<div class=\"why\">Si el examen exige conservar los cambios entre ejecuciones, normalmente usar\u00e1s <code>ddl-auto=update<\/code> y <code>spring.sql.init.mode=never<\/code> despu\u00e9s de preparar los datos. Cambiar a <code>update<\/code> no recupera unas tablas que el cierre anterior con <code>create-drop<\/code> ya haya eliminado.<\/div>\n<\/section>\n\n<section id=\"paso-15\">\n<header class=\"opener r1\"><h2>Escribir consultas en el repositorio y ejecutarlas en la aplicaci\u00f3n<\/h2><div class=\"set\"><b>015<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n<p>El <b>repositorio declara c\u00f3mo buscar<\/b>. <code>ExamenApplication<\/code> <b>llama a esa b\u00fasqueda y utiliza su resultado<\/b>. Son dos partes de la misma tarea.<\/p>\n<div class=\"kid\">Es como escribir una receta y despu\u00e9s cocinarla.<\/div>\n<p>Por ejemplo, <code>Jugador findByMote(String mote);<\/code> declara una b\u00fasqueda en <code>IJugadorRepository<\/code>. <code>jugadorRepository.findByMote(\"Rayo\")<\/code> la ejecuta desde <code>run<\/code>. No escribimos el cuerpo de esa b\u00fasqueda en la interfaz porque Spring Data lo prepara.<\/p>\n\n<h3>Dejar claro qu\u00e9 m\u00e9todos son de cada sitio<\/h3>\n<p class=\"paso\">1. Abre <code>IJugadorRepository.java<\/code>. Para una b\u00fasqueda por mote \u00fanico, conserva esta declaraci\u00f3n <b>dentro de las llaves de la interfaz<\/b>, sin cuerpo:<\/p>\n<pre data-f=\"repository/IJugadorRepository.java\">Jugador findByMote(String mote);<\/pre>\n<p class=\"paso\">2. Para usarla, el bloque siguiente va <b>dentro de <code>run<\/code> de <code>ExamenApplication.java<\/code><\/b>:<\/p>\n<pre data-f=\"ExamenApplication.java (dentro de run)\">Jugador jugador = jugadorRepository.findByMote(\"Rayo\");\n\nif (jugador != null) {\n    System.out.println(jugador.getNombre());\n} else {\n    System.out.println(\"No existe ese mote\");\n}<\/pre>\n<div class=\"why\"><code>findById<\/code>, <code>findAll<\/code>, <code>save<\/code>, <code>deleteById<\/code>, <code>existsById<\/code> y <code>count<\/code> ya vienen de <code>JpaRepository<\/code>. No los declares otra vez para usarlos. En cambio, las b\u00fasquedas nuevas por mote, posici\u00f3n o ciudad s\u00ed se a\u00f1aden al repositorio.<\/div>\n\n<h3>Cuando el enunciado pide escribir SQL<\/h3>\n<p class=\"paso\">3. A\u00f1ade estos imports a <code>IJugadorRepository.java<\/code>, junto a los que ya tenga. Un import se escribe una sola vez:<\/p>\n<pre data-f=\"repository/IJugadorRepository.java (imports)\">import java.util.List;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.jpa.repository.Modifying;\nimport org.springframework.data.repository.query.Param;\nimport org.springframework.transaction.annotation.Transactional;<\/pre>\n<p class=\"paso\">4. A\u00f1ade los tres m\u00e9todos siguientes <b>dentro de la interfaz<\/b>, antes de su \u00faltima llave. Conserva <code>extends JpaRepository&lt;Jugador, Long&gt;<\/code> y las consultas anteriores que necesites.<\/p>\n\n<h4>Buscar por posici\u00f3n y por un trozo del nombre<\/h4>\n<pre data-f=\"repository/IJugadorRepository.java\">@Query(value = \"\"\"\n    SELECT * FROM jugadores\n    WHERE posicion = 'DELANTERO' AND nombre LIKE '%Ana%'\n    \"\"\", nativeQuery = true)\nList&lt;Jugador&gt; buscarPorPosicionYNombre();<\/pre>\n<p><code>@Query<\/code> permite escribir la consulta. <code>nativeQuery = true<\/code> indica que es SQL y utiliza las tablas y columnas de MySQL. Aqu\u00ed los valores est\u00e1n fijados en la propia consulta: buscamos delanteros cuyo nombre contenga Ana. Los signos <code>%<\/code> permiten que haya texto antes o despu\u00e9s de Ana. Por eso el m\u00e9todo no recibe par\u00e1metros.<\/p>\n<p>Aqu\u00ed usamos <code>List&lt;Jugador&gt;<\/code> porque puede haber varios jugadores que cumplan la condici\u00f3n. No hace falta crear una variable de tipo lista en <code>run<\/code>; puedes recorrer directamente el resultado:<\/p>\n<pre data-f=\"ExamenApplication.java (dentro de run)\">for (Jugador jugador : jugadorRepository.buscarPorPosicionYNombre()) {\n    System.out.println(jugador.getNombre());\n}<\/pre>\n\n<h4>Buscar jugadores que tienen alg\u00fan fichaje en equipos de una ciudad<\/h4>\n<pre data-f=\"repository/IJugadorRepository.java\">@Query(value = \"\"\"\n    SELECT DISTINCT j.*\n    FROM jugadores j\n    JOIN fichajes f ON f.id_jugador = j.id_jugador\n    JOIN equipos e ON e.id_equipo = f.id_equipo\n    WHERE e.ciudad = :ciudad\n    \"\"\", nativeQuery = true)\nList&lt;Jugador&gt; buscarPorCiudad(@Param(\"ciudad\") String ciudad);<\/pre>\n<p><code>JOIN<\/code> une las tablas siguiendo sus claves. <code>j<\/code>, <code>f<\/code> y <code>e<\/code> son nombres cortos para escribir menos. <code>DISTINCT<\/code> evita repetir un jugador si tiene varios fichajes que cumplen la condici\u00f3n. <code>:ciudad<\/code> se enlaza con el argumento que lleva <code>@Param(\"ciudad\")<\/code>.<\/p>\n<p>Para usarla, dentro de <code>run<\/code>:<\/p>\n<pre data-f=\"ExamenApplication.java (dentro de run)\">for (Jugador jugador : jugadorRepository.buscarPorCiudad(\"Madrid\")) {\n    System.out.println(jugador.getNombre());\n}<\/pre>\n\n<h4>Cambiar la posici\u00f3n de los jugadores fichados por un equipo<\/h4>\n<pre data-f=\"repository/IJugadorRepository.java\">@Modifying(clearAutomatically = true, flushAutomatically = true)\n@Transactional\n@Query(value = \"\"\"\n    UPDATE jugadores SET posicion = :posicion\n    WHERE id_jugador IN (\n        SELECT id_jugador FROM fichajes\n        WHERE id_equipo = :idEquipo\n    )\n    \"\"\", nativeQuery = true)\nint cambiarPosicionPorEquipo(\n    @Param(\"posicion\") String posicion,\n    @Param(\"idEquipo\") Long idEquipo);<\/pre>\n<p>Para probarla, al final de <code>run<\/code>:<\/p>\n<pre data-f=\"ExamenApplication.java (al final de run)\">int cambiados = jugadorRepository.cambiarPosicionPorEquipo(\n    \"DEFENSA\", 1L);\nSystem.out.println(\"Filas cambiadas: \" + cambiados);<\/pre>\n<p><code>@Modifying<\/code> avisa de que la consulta cambia datos. <code>@Transactional<\/code> permite realizar el cambio dentro de una transacci\u00f3n. El resultado <code>int<\/code> indica el n\u00famero de filas afectadas. Con nuestros datos, afecta a Ana porque tiene un fichaje con el equipo 1.<\/p>\n<div class=\"warn\">Este <code>UPDATE<\/code> va directamente a la base. <code>flushAutomatically<\/code> env\u00eda primero los cambios pendientes y <code>clearAutomatically<\/code> limpia las entidades que estaban cargadas para no seguir leyendo copias antiguas. Despu\u00e9s vuelve a consultar si quieres ver el estado actualizado. Prueba este bloque al final, cuando ya hayas terminado de usar los objetos cargados antes.<\/div>\n\n<h3>Si te piden JPQL<\/h3>\n<p>JPQL escribe los nombres de <b>clases y atributos Java<\/b>; SQL escribe los de <b>tablas y columnas<\/b>. Por ejemplo, <code>Jugador<\/code> es la clase y <code>jugadores<\/code> es la tabla. Este m\u00e9todo alternativo va dentro del repositorio y necesita importar <code>leo.astray.examen.enums.Posicion<\/code>:<\/p>\n<pre data-f=\"repository/IJugadorRepository.java\">@Query(\"select j from Jugador j where j.posicion = :posicion\")\nList&lt;Jugador&gt; buscarJPQL(@Param(\"posicion\") Posicion posicion);<\/pre>\n<p>En <code>run<\/code> lo llamar\u00edas con <code>jugadorRepository.buscarJPQL(Posicion.DELANTERO)<\/code>.<\/p>\n<div class=\"why\">No necesitas aprender varias formas para hacer lo mismo si no las pide el examen: distingue primero consulta derivada, SQL y JPQL, y practica la que corresponda al enunciado.<\/div>\n<\/section>\n\n<section id=\"paso-16\">\n<header class=\"opener r1\"><h2>Corregir errores y terminar el proyecto<\/h2><div class=\"set\"><b>016<\/b>/033 <span class=\"rar\">COM\u00daN<\/span><\/div><\/header>\n\n<h3>Cuando algo falla<\/h3>\n<p class=\"paso\">1. En VS Code abre <b>Problems<\/b> con <code>Ctrl+Shift+M<\/code>. Corrige primero los errores de Java: archivo y clase con nombres distintos, imports que faltan, <code>package<\/code> incorrecto o llaves mal cerradas. Guarda todos los archivos.<\/p>\n<p class=\"paso\">2. Comprueba el JDK del proyecto. En la paleta <code>Ctrl+Shift+P<\/code>, busca <b>Java: Configure Java Runtime<\/b>. Para estos apuntes utiliza JDK 21. En terminal, <code>java -version<\/code> te dice qu\u00e9 Java est\u00e1 usando esa terminal; puede ser distinto si tienes varias instalaciones.<\/p>\n<p class=\"paso\">3. Si Maven no reconoce una dependencia, revisa <code>pom.xml<\/code>, su bloque <code>dependencies<\/code> y si ha terminado la descarga. Si VS Code sigue mostrando errores de \u00edndice despu\u00e9s de corregirlo, busca <b>Java: Clean Java Language Server Workspace<\/b> y deja que vuelva a importar el proyecto.<\/p>\n<p class=\"paso\">4. Si falla la conexi\u00f3n, revisa que MySQL est\u00e9 arrancado, el nombre de la base, el puerto, el usuario y la contrase\u00f1a. En la pesta\u00f1a SQL de phpMyAdmin, <code>SELECT @@port;<\/code> permite comprobar el puerto de ese servidor. <code>Access denied<\/code> suele indicar credenciales o permisos; <code>Communications link failure<\/code>, que no se consigue establecer la conexi\u00f3n.<\/p>\n<p class=\"paso\">5. Si falla un <code>INSERT<\/code>, busca la causa SQL concreta en la terminal: tabla inexistente, columna mal escrita, dato obligatorio ausente, clave repetida o clave for\u00e1nea sin fila de destino. Revisa el orden de <code>data.sql<\/code>.<\/p>\n<p class=\"paso\">6. Si aparece <code>LazyInitializationException<\/code>, revisa que est\u00e1s recorriendo las relaciones dentro del <code>run<\/code> de la clase principal, anotado con <code>@Transactional<\/code>, y que Spring est\u00e1 ejecutando ese m\u00e9todo mediante <code>CommandLineRunner<\/code>.<\/p>\n<p class=\"paso\">7. Si indica que no encuentra una propiedad de una consulta derivada, compara la firma del repositorio con el nombre exacto del atributo Java. <code>findByNombre<\/code> necesita el campo <code>nombre<\/code>; no se escribe usando el nombre SQL si es diferente.<\/p>\n\n<h3>Revisar los fallos concretos de estas pr\u00e1cticas<\/h3>\n<ul class=\"check\">\n<li><code>ExamenApplication<\/code> y <code>MotorApplication<\/code> deben implementar <code>CommandLineRunner<\/code>. Las pruebas van dentro de su <code>run<\/code>. No llames a <code>run<\/code> manualmente desde <code>main<\/code> ni crees otra clase para hacer estas comprobaciones.<\/li>\n<li>En <code>ExamenApplication<\/code>, los repositorios se llaman <code>jugadorReposi
