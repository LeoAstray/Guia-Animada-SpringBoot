U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Silkscreen'; font-style: normal; font-weight: 700; font-display: swap;\n  src: url(../fuentes/Silkscreen-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Unbounded'; font-style: normal; font-weight: 200 900; font-display: swap;\n  src: url(../fuentes/Unbounded-variable.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n\n/* =========================================================\n   VARIABLES: colores, tipograf\u00edas y curva de animaci\u00f3n.\n   Cambia aqu\u00ed un color y se cambia en toda la gu\u00eda.\n   ========================================================= */\n:root {\n  /* Fondos (de m\u00e1s oscuro a m\u00e1s claro) */\n  --void:   #0d0a1f;   /* fondo de la p\u00e1gina */\n  --void-2: #151030;   /* tarjetas, \u00edndice, tablas */\n  --void-3: #211a47;   /* cabeceras de tabla, c\u00f3digo en l\u00ednea */\n  --void-4: #2c2360;   /* barra de scroll */\n  --line:   #3a2f6b;   /* bordes y separadores */\n\n  /* Texto */\n  --ink:   #ece8ff;    /* texto principal */\n  --ink-2: #bdb4ea;    /* texto secundario */\n  --ink-3: #958bc9;    /* notas al pie, leyendas */\n\n  /* Acentos */\n  --lime:   #c6ff3d;   /* acci\u00f3n principal y \"est\u00e1s aqu\u00ed\" */\n  --pink:   #ff4fa3;   /* Parte 2 (rara) y avisos \"Ojo\" */\n  --cyan:   #3de0ff;   /* Parte 1 (com\u00fan) y \"Por qu\u00e9\" */\n  --violet: #8b5bff;\n  --gold:   #ffd23d;   /* Parte 3 (holo) y \"Para un ni\u00f1o de 5 a\u00f1os\" */\n  --green:  #5ef0a0;   /* \"Comprobaci\u00f3n\" */\n  --red:    #ff6b6b;\n  --plum:   #2a1450;   /* fondo del sobre de la Parte 2 */\n  --plum-2: #1c1440;   /* fondo del sobre de la Parte 3 */\n  --code-bg:#07051a;   /* fondo de los bloques de c\u00f3digo */\n\n  /* Foil hologr\u00e1fico (gira con la variable --ang) */\n  --holo: conic-gradient(from var(--ang, 200deg) at var(--mx, 50%) var(--my, 50%),\n          #c6ff3d, #3de0ff, #8b5bff, #ff4fa3, #ffd23d, #c6ff3d);\n  --rar: var(--cyan);  /* color de rareza de la carta actual */\n\n  /* Tipograf\u00edas */\n  --pix:  \"Silkscreen\", ui-monospace, monospace;                 /* etiquetas p\u00edxel */\n  --disp: \"Unbounded\", \"Segoe UI Black\", sans-serif;             /* t\u00edtulos */\n  --body: \"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif; /* lectura */\n  --mono: \"Cascadia Code\", \"Cascadia Mono\", Consolas, \"SFMono-Regular\", Menlo, monospace; /* c\u00f3digo */\n\n  /* Altura de la barra superior (la que lleva el enlace \u00abElegir otra gu\u00eda\u00bb) */\n  --bar: 3rem;\n\n  /* Curva de todas las animaciones */\n  --out: cubic-bezier(.16, 1, .3, 1);\n}\n\n@property --ang { syntax: \"<angle>\"; inherits: true; initial-value: 200deg; }\n@keyframes spin { to { --ang: 560deg; } }\n\n/* =========================================================\n   BASE: reglas generales de la p\u00e1gina\n   ========================================================= */\n* { box-sizing: border-box; }\n\nhtml {\n  scroll-behavior: smooth;\n  scroll-padding-top: 5rem;\n  scrollbar-color: var(--violet) var(--void);\n}\n\nbody {\n  margin: 0;\n  background: var(--void);\n  color: var(--ink);\n  font: 1.0625rem/1.68 var(--body);\n  -webkit-text-size-adjust: 100%;\n  overflow-x: hidden;\n}\n\n::selection { background: var(--lime); color: var(--void); }\n\n::-webkit-scrollbar { width: 11px; height: 11px; }\n::-webkit-scrollbar-track { background: var(--void); }\n::-webkit-scrollbar-thumb { background: var(--void-4); border-radius: 10px; border: 2px solid var(--void); }\n::-webkit-scrollbar-thumb:hover { background: var(--violet); }\n\n:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; border-radius: 6px; }\n\na { color: var(--lime); text-underline-offset: .2em; text-decoration-thickness: 1px; }\na:hover { color: #e2ff9a; }\nb, strong { color: #fff; }\n\n/* Palabras largas (nombres de clases, URLs) no rompen el ancho */\np, li, td, h2, h3 { overflow-wrap: anywhere; }\n\n/* Barra superior de todas las p\u00e1ginas de la gu\u00eda: para volver al selector de gu\u00edas.\n   (header.bar y no .bar, porque el cargador tambi\u00e9n tiene un .bar) */\n.tag { margin: 0; font: 700 .75rem var(--pix); letter-spacing: .08em; color: var(--ink-3); }\nheader.bar {\n  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 1rem;\n  height: var(--bar); padding: 0 max(1rem, calc((100vw - 56rem) / 2));\n  background: rgba(13, 10, 31, .88); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);\n}\nheader.bar .back { font: 700 .78rem var(--pix); text-decoration: none; }\nheader.bar .tag { color: var(--cyan); }\n@media (max-width: 40rem) { header.bar .back { font-size: .7rem; } }\n\n/* =========================================================\n   SELECTOR DE GU\u00cdAS\n   Un escenario fijo a pantalla completa: las tres opciones son tarjetas de un carrusel que gira con el\n   scroll. La que queda en el centro se agranda, el fondo toma su color y debajo aparece su descripci\u00f3n.\n   Usa los colores y tipograf\u00edas de recursos/css/01-variables.css y la base de recursos/css/02-base.css.\n   ========================================================= */\nhtml { scroll-behavior: auto; }   /* el selector.js desliza el scroll a mano; sin \u00e9l, la p\u00e1gina sigue siendo normal */\nbody { background: var(--void); }\n::selection { background: var(--ink); color: var(--void); }\n\n/* Barra superior: la marca a la izquierda y la posici\u00f3n a la derecha, sin fondo para dejar ver el color */\nheader.bar { position: fixed; left: 0; right: 0; padding: 0 clamp(1.2rem, 4vw, 3.5rem); background: none; border-bottom: 0; backdrop-filter: none; }\nheader.bar .marca { color: var(--ink-2); font: 700 .78rem var(--pix); letter-spacing: .04em; }\nheader.bar .tag { color: var(--ink); font-variant-numeric: tabular-nums; }\n\n/* La pista es tan alta como las tres paradas; el escenario se queda fijo mientras se recorre */\n.pista { position: relative; height: calc(var(--n) * 100svh); }\n.parada { position: absolute; left: 0; top: calc(var(--i) * 100svh); width: 1px; height: 100svh; }\n.escenario {\n  position: sticky; top: 0; z-index: 0; height: 100svh; overflow: hidden; isolation: isolate;\n  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; row-gap: 1rem; touch-action: none;\n  padding: calc(var(--bar) + 1.4rem) clamp(1.2rem, 4vw, 3.5rem) clamp(1.2rem, 3.2vh, 2.2rem);\n}\n\n/* Un fondo por opci\u00f3n; el scroll los funde de uno a otro */\n.fondos { position: absolute; inset: 0; z-index: -1; background: var(--void); }\n.fondo { position: absolute; inset: 0; opacity: 0; --acc: var(--lime);\n  background: radial-gradient(72% 64% at 50% 52%, color-mix(in oklab, var(--acc) 58%, var(--void)), color-mix(in oklab, var(--acc) 20%, var(--void)) 68%, var(--void) 100%); }\n.fondo.f1 { opacity: 1; }\n.fondo.f2 { --acc: var(--cyan); }\n.fondo.f3 { --acc: var(--green); }\n\n.pregunta {\n  margin: 0; max-width: 11ch; color: var(--ink); text-wrap: balance;\n  font: 900 clamp(1.8rem, 4.4vw, 3.6rem)/1.03 var(--disp); letter-spacing: -.035em;\n}\n.desliza {\n  position: absolute; z-index: 5; top: calc(var(--bar) + 1.6rem); right: clamp(1.2rem, 4vw, 3.5rem); margin: 0;\n  display: flex; align-items: center; gap: .6rem; color: var(--ink); font: 700 .75rem var(--pix); letter-spacing: .04em;\n  transition: opacity .4s;\n}\n.desliza svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; animation: baja 1.6s var(--out) infinite; }\n@keyframes baja { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(3px); } }\nbody.visto .desliza { opacity: 0; pointer-events: none; }\nbody.visto .desliza svg { animation: none; }\n\n/* El carrusel: las tres tarjetas se colocan en perspectiva y las mueve el scroll (selector.js) */\n.carrusel { position: relative; min-height: 0; margin-block: -.9rem; perspective: 1500px; }\n.carta {\n  --acc: var(--lime);\n  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);\n  height: min(104%, 34rem, calc(74vw * 7 / 5)); aspect-ratio: 5 / 7; container-type: inline-size;\n  background: var(--void-2); border: 2px solid var(--acc); border-radius: 1.5rem;\n  box-shadow: 0 34px 50px -28px rgba(0, 0, 0, .9);\n  cursor: pointer; will-change: transform, opacity;\n}\n.carta:not(.activa) { cursor: pointer; }\n.carta::before { content: \"\"; position: absolute; inset: 7px; border: 1px solid rgba(236, 232, 255, .09); border-radius: 1.05rem; pointer-events: none; }\n.carta::after { content: \"\"; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;\n  background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .12) 50%, transparent 65%); }\n.cara { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 5cqw; padding: 8cqw 8cqw 7cqw; }\n.nombre { margin: 0; color: var(--acc); font: 900 12cqw/1 var(--disp); letter-spacing: -.03em; }\n.dibujo { width: 100%; height: 100%; min-height: 0; overflow: visible; }\n.dibujo * { fill: none; stroke: var(--acc); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }\n.dibujo .sello { fill: var(--acc); stroke: none; font: 900 22px var(--disp); }\n.dato { justify-self: start; margin: 0; padding: .22rem .7rem; border-radius: 999px; background: var(--acc); color: var(--void); font: 700 clamp(.75rem, 4.4cqw, .85rem) var(--pix); letter-spacing: .04em; }\n\n/* Los dibujos se trazan solos cuando su tarjeta queda en el centro */\n.ld { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; transition: stroke-dashoffset 1.1s var(--out), opacity .2s; }\n.carta.activa .ld { stroke-dashoffset: 0; opacity: 1; }\n\n/* Debajo, la descripci\u00f3n de la opci\u00f3n del centro. Las tres ocupan el mismo sitio y se funden. */\n.pie { display: grid; }\n.texto {\n  --acc: var(--lime);\n  grid-area: 1 / 1; display: grid; grid-template-columns: minmax(0, 38rem) auto; align-items: end; column-gap: 2rem;\n  opacity: 0; pointer-events: none;\n}\n.texto.activa { pointer-events: auto; }\n.texto.t1 { opacity: 1; }\n.lema { margin: 0 0 .5rem; color: var(--ink); font: 700 1.25rem/1.25 var(--body); text-wrap: balance; }\n.desc { margin: 0; color: var(--ink); font-size: 1.02rem; line-height: 1.55; text-wrap: pretty; }\n.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .9rem 0 0; padding: 0; list-style: none; }\n.chips li { margin: 0; padding: .24rem .7rem; border: 1px solid color-mix(in srgb, var(--acc) 55%, transparent); border-radius: 999px; color: var(--ink); font: 700 .75rem var(--pix); letter-spacing: .03em; }\n.abrir {\n  display: inline-flex; align-items: center; gap: .7rem; padding: 1rem 1.5rem; border-radius: 999px;\n  background: var(--acc); color: var(--void); text-decoration: none; font: 700 .82rem var(--pix);\n  box-shadow: 0 14px 24px -14px rgba(0, 0, 0, .8); transition: filter .25s;\n}\n.abrir svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s var(--out); }\n.abrir:hover { color: var(--void); filter: brightness(1.1); }\n.abrir:hover svg, .abrir:focus-visible svg { transform: translateX(5px); }\n\n/* Las tres opciones a un lado, para saltar de una a otra */\n.riel { position: absolute; z-index: 20; right: clamp(.7rem, 2vw, 1.6rem); top: 50%; transform: translateY(-50%); display: grid; gap: .6rem; }\n.riel a {\n  display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 50%;\n  border: 1.5px solid color-mix(in srgb, var(--ink) 40%, transparent); background: rgba(13, 10, 31, .55);\n  color: var(--ink); text-decoration: none; font: 700 .75rem var(--pix); transition: background .3s, color .3s, border-color .3s;\n}\n.riel a:hover { border-color: var(--ink); }\n.riel a[aria-current=\"true\"] { background: var(--ink); border-color: var(--ink); color: var(--void); }\n\n/* La cortina: crece desde el bot\u00f3n pulsado con el color de la opci\u00f3n y entonces se abre la gu\u00eda */\n.cortina {\n  position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; pointer-events: none;\n  background: var(--color, var(--lime)); clip-path: circle(0 at var(--x, 50%) var(--y, 50%));\n}\n.cortina span { color: var(--void); font: 700 clamp(.8rem, 2.2vw, 1rem) var(--pix); letter-spacing: .06em; text-transform: uppercase; opacity: 0; }\n.cortina.cierra { pointer-events: auto; clip-path: circle(150vmax at var(--x) var(--y)); transition: clip-path .75s var(--out); }\n.cortina.cierra span { opacity: 1; transition: opacity .3s .45s; }\n\n/* ---------- M\u00d3VIL ---------- */\n@media (max-width: 40rem) {\n  .desliza { display: none; }\n  .carta { height: min(100%, 31rem, calc(70vw * 7 / 5)); }\n  .carrusel { margin-block: 0; }\n  .texto { grid-template-columns: 1fr; row-gap: 1rem; }\n  .lema { font-size: 1.08rem; }\n  .desc { font-size: .95rem; line-height: 1.5; }\n  .abrir { justify-content: center; }\n  .riel a { width: 2.1rem; height: 2.1rem; }\n}\n@media (max-height: 46rem) { .chips { display: none; } }\n\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  .ld { stroke-dashoffset: 0; transition: none; }\n  .desliza svg { animation: none; }\n  /* la cortina no crece: solo se funde */\n  .cortina { clip-path: none; opacity: 0; transition: opacity .25s; }\n  .cortina.cierra { clip-path: none; opacity: 1; transition: opacity .25s; }\n  .cortina.cierra span { transition: none; }\n}\n\n<\/style>\n<noscript><style>\n  /* Sin JavaScript no hay escenario que gire: las tres opciones salen una debajo de otra */\n  html { scroll-snap-type: none; }\n  .pista { height: auto; }\n  .escenario { touch-action: auto; position: static; height: auto; display: block; overflow: visible; padding-bottom: 3rem; }\n  .carrusel { display: grid; gap: 1.5rem; justify-items: center; margin: 2rem 0; }\n  .carta { position: relative; left: auto; top: auto; transform: none; height: auto; width: min(22rem, 100%); }\n  .pie { display: block; }\n  .texto { position: static; opacity: 1; pointer-events: auto; margin: 0 0 2rem; }\n  .riel, .desliza, .parada { display: none; }\n  .ld { stroke-dashoffset: 0; opacity: 1; }\n<\/style><\/noscript>\n<\/head>\n<body class=\"selector\">\n<header class=\"bar\">\n  <span class=\"marca\">Spring Boot de cero a REST<\/span>\n  <span class=\"tag\" id=\"cuenta\" aria-live=\"polite\">1 / 3<\/span>\n<\/header>\n\n<main class=\"pista\" id=\"pista\" style=\"--n: 3\">\n  <\!-- Tres puntos de parada: al hacer scroll, la p\u00e1gina se queda siempre en uno de ellos -->\n  <span class=\"parada\" id=\"opcion-1\" style=\"--i: 0\"><\/span>\n  <span class=\"parada\" id=\"opcion-2\" style=\"--i: 1\"><\/span>\n  <span class=\"parada\" id=\"opcion-3\" style=\"--i: 2\"><\/span>\n\n  <div class=\"escenario\">\n    <div class=\"fondos\" aria-hidden=\"true\"><i class=\"fondo f1\"><\/i><i class=\"fondo f2\"><\/i><i class=\"fondo f3\"><\/i><\/div>\n\n    <h1 class=\"pregunta\">\u00bfC\u00f3mo quieres seguir la gu\u00eda?<\/h1>\n    <p class=\"desliza\" aria-hidden=\"true\">Desliza para ver las otras\n      <svg viewBox=\"0 0 16 16\"><path d=\"M8 2v11M3 8.5l5 5 5-5\"/><\/svg>\n    <\/p>\n\n    <div class=\"carrusel\">\n      <article class=\"carta c1\" data-i=\"0\" style=\"--acc: var(--lime)\">\n        <div class=\"cara\">\n          <h2 class=\"nombre\">Gu\u00eda<br>completa<\/h2>\n          <svg class=\"dibu p class=\"desc\">Enunciados tipo examen con puntuaci\u00f3n. Cada ejercicio tiene su solucionario aparte: primero lo haces t\u00fa y despu\u00e9s comparas.<\/p>\n          <ul class=\"chips\"><li>2 ejercicios<\/li><li>Solucionarios<\/li><li>Con puntuaci\u00f3n<\/li><\/ul>\n        <\/div>\n        <a class=\"abrir\" href=\"#/ejercicios\" data-nombre=\"los ejercicios\">Abrir los ejercicios\n          <svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M2 8h11M8.5 3l5 5-5 5\"/><\/svg><\/a>\n      <\/div>\n    <\/div>\n\n    <nav class=\"riel\" aria-label=\"Elegir gu\u00eda\">\n      <a href=\"#opcion-1\" aria-label=\"Gu\u00eda completa\" title=\"Gu\u00eda completa\" aria-current=\"true\">1<\/a>\n      <a href=\"#opcion-2\" aria-label=\"Gu\u00eda resumida\" title=\"Gu\u00eda resumida\">2<\/a>\n      <a href=\"#opcion-3\" aria-label=\"Ejercicios\" title=\"Ejercicios\">3<\/a>\n    <\/nav>\n  <\/div>\n<\/main>\n\n<\!-- La cortina del color de la opci\u00f3n elegida: cubre la pantalla un instante antes de abrir la gu\u00eda -->\n<div class=\"cortina\" id=\"cortina\" aria-hidden=\"true\"><span><\/span><\/div>\n<script>\n/* Selector de gu\u00edas: un gesto de scroll = una opci\u00f3n. La rueda, el dedo y el teclado llevan a la opci\u00f3n\n   siguiente con un deslizamiento suave (no hace falta recorrer la p\u00e1gina); las tarjetas giran siguiendo ese\n   scroll y, al elegir, una cortina de color abre la gu\u00eda (la p\u00e1gina de destino la recoge: recursos/paginas/entrada.js).\n   Sin este script la p\u00e1gina sigue siendo usable: las tres opciones salen una debajo de otra (ver <noscript>). */\n(function () {\n  var pista = document.getElementById('pista');\n  var cartas = [].slice.call(document.querySelectorAll('.carta'));\n  var textos = [].slice.call(document.querySelectorAll('.texto'));\n  var fondos = [].slice.call(document.querySelectorAll('.fondo'));\n  var rieles = [].slice.call(document.querySelectorAll('.riel a'));\n  var cuenta = document.getElementById('cuenta');\n  var cortina = document.getElementById('cortina');\n  var n = cartas.length;\n  var quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var pos = 0, meta = 0, activa = -1, cuadro = 0;\n\n  // D\u00f3nde est\u00e1 el scroll, en \"opciones\": 0 es la primera, 1 la segunda, 2 la tercera (admite decimales)\n  function medir() {\n    meta = Math.max(0, Math.min(n - 1, window.scrollY / (pista.offsetHeight / n)));\n  }\n  function limitar(v) { return Math.max(0, Math.min(1, v)); }\n\n  function pintar() {\n    var paso = cartas[0].offsetWidth * 0.86;\n    cartas.forEach(function (c, i) {\n      var d = i - pos, a = Math.abs(d);\n      c.style.transform = 'translate(-50%, -50%) translate3d(' + (d * paso) + 'px, 0, ' + (-Math.min(a, 1.4) * 140) + 'px)' +\n        ' rotateY(' + (-d * 34) + 'deg) scale(' + (1.04 - Math.min(a, 1) * 0.3) + ')';\n      c.style.opacity = 1 - Math.min(a, 1) * 0.55;\n      c.style.zIndex = 10 - Math.round(a * 4);\n    });\n    textos.forEach(function (t, i) {\n      var d = i - pos;\n      t.style.opacity = limitar(1 - Math.abs(d) * 2.2);\n      t.style.transform = 'translateY(' + (d * 26) + 'px)';\n    });\n    fondos.forEach(function (f, i) { f.style.opacity = limitar(1 - Math.abs(i - pos) * 1.1); });\n    var cerca = Math.round(pos);\n    if (cerca !== activa) marcar(cerca);\n  }\n\n  // La opci\u00f3n del centro: qu\u00e9 tarjeta se dibuja, qu\u00e9 texto se puede pulsar y qu\u00e9 n\u00famero se ilumina\n  function marcar(i) {\n    activa = i;\n    cartas.forEach(function (c, k) { c.classList.toggle('activa', k === i); });\n    textos.forEach(function (t, k) { t.classList.toggle('activa', k === i); t.inert = k !== i; });\n    if (document.activeElement && document.activeElement.closest && document.activeElement.closest('.texto[inert]')) rieles[i].focus({ preventScroll: true });   // el foco no se pierde al girar\n    rieles.forEach(function (r, k) { r.setAttribute('aria-current', k === i ? 'true' : 'false'); });\n    cuenta.textContent = (i + 1) + ' / ' + n;\n    cuenta.setAttribute('aria-label', 'Opci\u00f3n ' + (i + 1) + ' de ' + n);\n  }\n\n  function bucle() {\n    cuadro = 0;\n    medir();\n    var dif = meta - pos;\n    pos = quieto || Math.abs(dif) < 0.002 ? meta : pos + dif * 0.2;\n    pintar();\n    document.body.classList.toggle('visto', window.scrollY > 40);\n    if (pos !== meta) cuadro = requestAnimationFrame(bucle);\n  }\n  function pedir() { if (!cuadro) cuadro = requestAnimationFrame(bucle); }\n\n  // ---------- Ir a una opci\u00f3n con un deslizamiento suave ----------\n  var yendo = false, libreHasta = 0, ultimoGesto = 0, espera = 0;\n  function suave(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }\n  function ir(i) {\n    i = Math.max(0, Math.min(n - 1, i));\n    var desde = window.scrollY, hasta = i * (pista.offsetHeight / n);\n    if (Math.abs(hasta - desde) < 1) return;\n    if (quieto) { window.scrollTo(0, hasta); return; }\n    var t0 = performance.now(), dur = 1000;\n    yendo = true;\n    (function paso(ahora) {\n      var t = Math.min(1, (ahora - t0) / dur);\n      window.scrollTo(0, desde + (hasta - desde) * suave(t));\n      if (t < 1) requestAnimationFrame(paso);\n      else { yendo = false; libreHasta = performance.now() + 150; }\n    })(t0);\n  }\n  // Un gesto (aunque la rueda o el dedo sigan \"rodando\" por inercia) solo cuenta una vez\n  function gesto(sentido) {\n    var ahora = performance.now(), seguido = ahora - ultimoGesto < 160;\n    ultimoGesto = ahora;\n    if (yendo || seguido || ahora < libreHasta) return;\n    ir(Math.round(meta) + sentido);\n  }\n\n  addEventListener('scroll', function () {\n    pedir();\n    if (yendo) return;\n    // Arrastrar la barra de scroll: al soltar, se acomoda en la opci\u00f3n m\u00e1s cercana\n    clearTimeout(espera);\n    espera = setTimeout(function () { if (!yendo) ir(Math.round(meta)); }, 180);\n  }, { passive: true });\n  addEventListener('resize', pedir);\n\n  addEventListener('wheel', function (e) {\n    if (e.ctrlKey) return;               // el zoom del navegador\n    e.preventDefault();\n    if (Math.abs(e.deltaY) > 2) gesto(e.deltaY > 0 ? 1 : -1);\n    else ultimoGesto = performance.now();\n  }, { passive: false });\n\n  var y0 = null;                          // dedo (el CSS desactiva el scroll nativo t\u00e1ctil: touch-action: none)\n  addEventListener('touchstart', function (e) { y0 = e.touches[0].clientY; }, { passive: true });\n  addEventListener('touchend', function (e) {\n    if (y0 === null) return;\n    var dy = y0 - e.changedTouches[0].clientY; y0 = null;\n    if (Math.abs(dy) > 36) gesto(dy > 0 ? 1 : -1);\n  }, { passive: true });\n\n  addEventListener('keydown', function (e) {\n    if (e.altKey || e.ctrlKey || e.metaKey) return;\n    var s = { ArrowDown: 1, PageDown: 1, ArrowRight: 1, ArrowUp: -1, PageUp: -1, ArrowLeft: -1 }[e.key];\n    if (e.key === ' ' && !(e.target.closest && e.target.closest('a, button'))) s = e.shiftKey ? -1 : 1;\n    if (e.key === 'Home') { e.preventDefault(); ir(0); return; }\n    if (e.key === 'End') { e.preventDefault(); ir(n - 1); return; }\n    if (!s) return;\n    e.preventDefault();\n    gesto(s);\n  });\n\n  // Los n\u00fameros de la derecha y las tarjetas: la de los lados se coloca en el centro; la del centro abre su gu\u00eda\n  rieles.forEach(function (r, i) {\n    r.addEventListener('click', function (e) { e.preventDefault(); ir(i); });\n  });\n  cartas.forEach(function (c, i) {\n    c.addEventListener('click', function () {\n      if (i === activa) textos[i].querySelector('.abrir').click(); else ir(i);\n    });\n  });\n\n  // ---------- Abrir una gu\u00eda ----------\n  // La cortina crece desde el bot\u00f3n con el color de la opci\u00f3n. Al cubrirlo todo se navega, y la p\u00e1gina de\n  // destino la recoge con la misma cortina (los datos viajan por sessionStorage, o por mensaje en el archivo \u00fanico).\n  [].forEach.call(document.querySelectorAll('.abrir'), function (a) {\n    a.addEventListener('click', function (e) {\n      if (a.dataset.sigue || e.button || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;\n      e.preventDefault();\n      e.stopPropagation();          // en el archivo \u00fanico, el puente de la gu\u00eda no debe adelantarse a la cortina\n      var r = a.getBoundingClientRect();\n      var datos = {\n        x: Math.round(e.clientX || r.left + r.width / 2), y: Math.round(e.clientY || r.top + r.height / 2),\n        color: getComputedStyle(a).backgroundColor, texto: 'Abriendo ' + a.dataset.nombre\n      };\n      cortina.style.setProperty('--x', datos.x + 'px');\n      cortina.style.setProperty('--y', datos.y + 'px');\n      cortina.style.setProperty('--color', datos.color);\n      cortina.firstElementChild.textContent = datos.texto;\n      cortina.classList.add('cierra');\n      setTimeout(function () {\n        datos.t = Date.now();\n        try { sessionStorage.setItem('cortina', JSON.stringify(datos)); } catch (err) {}\n        if (parent !== window) parent.postMessage({ cortina: datos }, '*');\n        a.dataset.sigue = '1'; a.click(); delete a.dataset.sigue;\n        setTimeout(function () { cortina.classList.remove('cierra'); }, 1500);   // por si la p\u00e1gina sigue aqu\u00ed\n      }, quieto ? 350 : 900);\n    });\n  });\n  addEventListener('pageshow', function (e) { if (e.persisted) cortina.classList.remove('cierra'); });\n\n  medir(); pos = meta; pintar(); pedir();\n})();\n\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#\"]');\n  if (!a) return;\n  e.preventDefault();\n  var destino = a.getAttribute('href');\n  // \"#/...\" es un enlace a otra p\u00e1gina; el resto, un enlace dentro de esta (en un marco, un \"#x\" normal se\n  // resolver\u00eda contra la p\u00e1gina contenedora y recargar\u00eda todo el archivo dentro del marco)\n  if (destino.indexOf('#/') === 0) parent.postMessage({ ruta: destino }, '*');\n  else location.hash = destino;\n});\naddEventListener('message', function (e) {\n  if (e.source !== parent || !e.data || typeof e.data.ancla !== 'string') return;\n  var ancla = e.data.ancla, destino = ancla && document.getElementById(ancla);\n  location.hash = ancla;                    // necesario para que funcione :target (ejercicios)\n  // salto directo, sin deslizarse desde donde estaba (la gu\u00eda tiene scroll-behavior: smooth)\n  if (destino) destino.scrollIntoView({ behavior: 'instant' });\n  else scrollTo({ top: 0, behavior: 'instant' });\n});\nif (window.ANCLA_INICIAL) location.hash = window.ANCLA_INICIAL;\n<\/script>\n<\/body>\n<\/html>\n", "completa": "<!doctype html>\n<html lang=\"es\" data-total=\"033\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"color-scheme\" content=\"dark\">\n<script>\n/* Entrada con cortina: si se llega desde el selector, la cortina del color de la opci\u00f3n elegida sigue tapando\n   la p\u00e1gina mientras carga y luego se recoge hacia el punto donde se puls\u00f3. Va en el <head> para que ni un\n   instante se vea la p\u00e1gina sin cortina. En la carpeta, los datos llegan por sessionStorage; en el archivo\n   \u00fanico, por window.REVELA (p\u00e1gina nueva) o por un mensaje (p\u00e1gina que ya estaba abierta). */\n(function () {\n  var d, quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  try {\n    d = window.REVELA;\n    if (!d) d = JSON.parse(sessionStorage.getItem('cortina') || 'null');\n    sessionStorage.removeItem('cortina');\n  } catch (e) {}\n\n  function abrir(d) {\n    if (!d || Date.now() - d.t > 8000) return;\n    var raiz = document.documentElement, punto = d.x + 'px ' + d.y + 'px';\n    var cortina = document.createElement('div'), texto = document.createElement('span');\n    cortina.setAttribute('aria-hidden', 'true');\n    cortina.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;pointer-events:none;background:' +\n      d.color + ';clip-path:circle(150vmax at ' + punto + ')';\n    texto.style.cssText = 'color:#0d0a1f;font:700 14px Silkscreen,monospace;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:0 1rem';\n    texto.textContent = d.texto || '';\n    cortina.appendChild(texto);\n    raiz.classList.add('entra');          // la gu\u00eda completa se salta su cargador: la cortina ya hace de cargador\n    raiz.appendChild(cortina);\n\n    var hecho = false;\n    function recoger() {\n      if (hecho) return;\n      hecho = true;\n      cortina.getBoundingClientRect();    // fija el estado inicial para que la transici\u00f3n arranque\n      texto.style.transition = 'opacity .25s';\n      texto.style.opacity = '0';\n      cortina.style.transition = quieto ? 'opacity .3s' : 'clip-path .95s cubic-bezier(.16,1,.3,1)';\n      if (quieto) cortina.style.opacity = '0'; else cortina.style.clipPath = 'circle(0 at ' + punto + ')';\n      setTimeout(function () { cortina.remove(); raiz.classList.remove('entra'); }, 1100);\n    }\n    // Se espera a la p\u00e1gina Y a las tipograf\u00edas: si se recogiera antes, se ver\u00eda el texto saltar al cambiar de letra\n    var lista = new Promise(function (ok) {\n      if (document.readyState === 'complete') ok(); else addEventListener('load', ok);\n    }).then(function () { return document.fonts ? document.fonts.ready : 0; });\n    lista.then(function () { setTimeout(recoger, 250); });\n    setTimeout(recoger, 3500);            // por si la carga se alarga (sin conexi\u00f3n, por ejemplo)\n  }\n\n  addEventListener('message', function (e) { if (e.source === parent && e.data && e.data.revela) abrir(e.data.revela); });\n  abrir(d);\n})();\n\n<\/script>\n<title>Spring Boot de cero a REST \u00b7 gu\u00eda animada<\/title>\n<script>document.documentElement.classList.add('js');<\/script>\n<style>\n/* =========================================================\n   TIPOGRAF\u00cdAS (guardadas en fuentes/, solo el juego \u00ablatin\u00bb, que cubre el espa\u00f1ol).\n   As\u00ed la gu\u00eda no depende de internet ni de Google Fonts.\n   ========================================================= */\n@font-face { font-family: 'Atkinson Hyperlegible'; font-style: italic; font-weight: 400; font-display: swap;\n  src: url(../fuentes/AtkinsonHyperlegible-400-italic.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Atkinson Hyperlegible'; font-style: normal; font-weight: 400; font-display: swap;\n  src: url(../fuentes/AtkinsonHyperlegible-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Atkinson Hyperlegible'; font-style: normal; font-weight: 700; font-display: swap;\n  src: url(../fuentes/AtkinsonHyperlegible-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Silkscreen'; font-style: normal; font-weight: 400; font-display: swap;\n  src: url(../fuentes/Silkscreen-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Silkscreen'; font-style: normal; font-weight: 700; font-display: swap;\n  src: url(../fuentes/Silkscreen-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family: 'Unbounded'; font-style: normal; font-weight: 200 900; font-display: swap;\n  src: url(../fuentes/Unbounded-variable.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n\n/* =========================================================\n   VARIABLES: colores, tipograf\u00edas y curva de animaci\u00f3n.\n   Cambia aqu\u00ed un color y se cambia en toda la gu\u00eda.\n   ========================================================= */\n:root {\n  /* Fondos (de m\u00e1s oscuro a m\u00e1s claro) */\n  --void:   #0d0a1f;   /* fondo de la p\u00e1gina */\n  --void-2: #151030;   /* tarjetas, \u00edndice, tablas */\n  --void-3: #211a47;   /* cabeceras de tabla, c\u00f3digo en l\u00ednea */\n  --void-4: #2c2360;   /* barra de scroll */\n  --line:   #3a2f6b;   /* bordes y separadores */\n\n  /* Texto */\n  --ink:   #ece8ff;    /* texto principal */\n  --ink-2: #bdb4ea;    /* texto secundario */\n  --ink-3: #958bc9;    /* notas al pie, leyendas */\n\n  /* Acentos */\n  --lime:   #c6ff3d;   /* acci\u00f3n principal y \"est\u00e1s aqu\u00ed\" */\n  --pink:   #ff4fa3;   /* Parte 2 (rara) y avisos \"Ojo\" */\n  --cyan:   #3de0ff;   /* Parte 1 (com\u00fan) y \"Por qu\u00e9\" */\n  --violet: #8b5bff;\n  --gold:   #ffd23d;   /* Parte 3 (holo) y \"Para un ni\u00f1o de 5 a\u00f1os\" */\n  --green:  #5ef0a0;   /* \"Comprobaci\u00f3n\" */\n  --red:    #ff6b6b;\n  --plum:   #2a1450;   /* fondo del sobre de la Parte 2 */\n  --plum-2: #1c1440;   /* fondo del sobre de la Parte 3 */\n  --code-bg:#07051a;   /* fondo de los bloques de c\u00f3digo */\n\n  /* Foil hologr\u00e1fico (gira con la variable --ang) */\n  --holo: conic-gradient(from var(--ang, 200deg) at var(--mx, 50%) var(--my, 50%),\n          #c6ff3d, #3de0ff, #8b5bff, #ff4fa3, #ffd23d, #c6ff3d);\n  --rar: var(--cyan);  /* color de rareza de la carta actual */\n\n  /* Tipograf\u00edas */\n  --pix:  \"Silkscreen\", ui-monospace, monospace;                 /* etiquetas p\u00edxel */\n  --disp: \"Unbounded\", \"Segoe UI Black\", sans-serif;             /* t\u00edtulos */\n  --body: \"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif; /* lectura */\n  --mono: \"Cascadia Code\", \"Cascadia Mono\", Consolas, \"SFMono-Regular\", Menlo, monospace; /* c\u00f3digo */\n\n  /* Altura de la barra superior (la que lleva el enlace \u00abElegir otra gu\u00eda\u00bb) */\n  --bar: 3rem;\n\n  /* Curva de todas las animaciones */\n  --out: cubic-bezier(.16, 1, .3, 1);\n}\n\n@property --ang { syntax: \"<angle>\"; inherits: true; initial-value: 200deg; }\n@keyframes spin { to { --ang: 560deg; } }\n\n/* =========================================================\n   BASE: reglas generales de la p\u00e1gina\n   ========================================================= */\n* { box-sizing: border-box; }\n\nhtml {\n  scroll-behavior: smooth;\n  scroll-padding-top: 5rem;\n  scrollbar-color: var(--violet) var(--void);\n}\n\nbody {\n  margin: 0;\n  background: var(--void);\n  color: var(--ink);\n  font: 1.0625rem/1.68 var(--body);\n  -webkit-text-size-adjust: 100%;\n  overflow-x: hidden;\n}\n\n::selection { background: var(--lime); color: var(--void); }\n\n::-webkit-scrollbar { width: 11px; height: 11px; }\n::-webkit-scrollbar-track { background: var(--void); }\n::-webkit-scrollbar-thumb { background: var(--void-4); border-radius: 10px; border: 2px solid var(--void); }\n::-webkit-scrollbar-thumb:hover { background: var(--violet); }\n\n:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; border-radius: 6px; }\n\na { color: var(--lime); text-underline-offset: .2em; text-decoration-thickness: 1px; }\na:hover { color: #e2ff9a; }\nb, strong { color: #fff; }\n\n/* Palabras largas (nombres de clases, URLs) no rompen el ancho */\np, li, td, h2, h3 { overflow-wrap: anywhere; }\n\n/* Barra superior de todas las p\u00e1ginas de la gu\u00eda: para volver al selector de gu\u00edas.\n   (header.bar y no .bar, porque el cargador tambi\u00e9n tiene un .bar) */\n.tag { margin: 0; font: 700 .75rem var(--pix); letter-spacing: .08em; color: var(--ink-3); }\nheader.bar {\n  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 1rem;\n  height: var(--bar); padding: 0 max(1rem, calc((100vw - 56rem) / 2));\n  background: rgba(13, 10, 31, .88); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);\n}\nheader.bar .back { font: 700 .78rem var(--pix); text-decoration: none; }\nheader.bar .tag { color: var(--cyan); }\n@media (max-width: 40rem) { header.bar .back { font-size: .7rem; } }\n\n/* =========================================================\n   CARGADOR, BARRA DE PROGRESO Y MARCAS DE LAS ESQUINAS\n   ========================================================= */\n\n/* Cargador con porcentaje (solo la primera vez por sesi\u00f3n) */\n.loader {\n  position: fixed; inset: 0; z-index: 100;\n  display: grid; place-items: center;\n  background: var(--void);\n  transition: clip-path .9s var(--out);\n}\n.loader.done { clip-path: inset(0 0 100% 0); }\n.loader .bar { display: flex; gap: 8px; justify-content: center; }\n.loader .bar i { width: 10px; height: 10px; background: var(--line); transition: background .15s; }\n.loader .bar i.on { background: var(--lime); }\n.loader p {\n  margin: .9rem 0 0; text-align: center;\n  font: 700 .75rem var(--pix); color: var(--ink-2); letter-spacing: .1em;\n}\n\n/* Barra de progreso de lectura (arriba del todo) */\n.progress {\n  position: fixed; top: 0; left: 0; z-index: 60;\n  width: 100%; height: 4px;\n  transform-origin: 0 50%; transform: scaleX(var(--p, 0));\n  background: var(--holo);\n}\n\n/* Marcas HUD de las esquinas */\n.hud {\n  position: fixed; z-index: 55; pointer-events: none; opacity: .8;\n  width: 20px; height: 20px; border: 2px solid var(--violet);\n}\n.hud.tl { top: 12px;    left: 12px;  border-right: 0; border-bottom: 0; }\n.hud.tr { top: 12px;    right: 12px; border-left: 0;  border-bottom: 0; }\n.hud.bl { bottom: 12px; left: 12px;  border-right: 0; border-top: 0; }\n.hud.br { bottom: 12px; right: 12px; border-left: 0;  border-top: 0; }\n\n/* =========================================================\n   PORTADA: t\u00edtulo, botones, los tres sobres y la cinta\n   ========================================================= */\n.hero {\n  position: relative; isolation: isolate; overflow: hidden;\n  min-height: calc(100vh - var(--bar)); min-height: calc(100svh - var(--bar));\n  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);\n  align-items: center; gap: 2rem;\n  padding: 6rem 6vw 7rem;\n}\n.hero::before {\n  content: \"\"; position: absolute; inset: -20%; z-index: -1;\n  background:\n    radial-gradient(40% 50% at 78% 45%, rgba(139, 91, 255, .28), transparent 70%),\n    radial-gradient(30% 40% at 15% 85%, rgba(61, 224, 255, .12), transparent 70%);\n}\n\n/* T\u00edtulo: cada palabra aparece con efecto p\u00edxel */\n.hero h1 {\n  margin: 0 0 1.6rem; color: var(--lime); text-wrap: balance;\n  font: 900 clamp(2.9rem, 7.2vw, 6rem)/.93 var(--disp); letter-spacing: -.04em;\n}\n/* El recorte deja margen por arriba, abajo y a los lados: con line-height .93 y\n   letter-spacing negativo, los rabillos (la \"g\" de Spring) y la \u00faltima letra\n   sobresalen de la caja y se cortar\u00edan. */\n.hero h1 .w { display: inline-block; padding: .08em .06em .22em 0; margin-bottom: -.22em; clip-path: inset(-.1em 100% -.1em -.1em); animation: pix .9s steps(8) forwards; }\n.hero h1 .w.p { color: var(--pink); }\n@keyframes pix { to { clip-path: inset(-.1em -.1em -.1em -.1em); } }\n\n.hero .lede { max-width: 34rem; margin: 0 0 2.2rem; font-size: 1.2rem; color: var(--ink-2); text-wrap: pretty; }\n\n/* Botones */\n.cta { display: flex; flex-wrap: wrap; gap: .8rem; }\n.btn {\n  display: inline-flex; align-items: center; gap: .6rem;\n  padding: 1rem 1.5rem; border-radius: 999px; text-decoration: none;\n  font: 700 .8rem var(--pix);\n  transition: transform .45s var(--out), box-shadow .45s var(--out), background .3s;\n}\n.btn.main { background: var(--lime); color: var(--void); box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .8); }\n.btn.main:hover { color: var(--void); transform: translateY(-3px); box-shadow: 0 18px 30px -14px rgba(0, 0, 0, .9); }\n.btn.ghost { border: 2px solid var(--violet); color: var(--ink); }\n.btn.ghost:hover { background: var(--void-3); color: var(--ink); }\n.btn.ghost[hidden] { display: none; }\n.btn .flag { padding: .15rem .45rem; border-radius: 4px; background: var(--pink); color: var(--void); }\n\n/* Los tres sobres (se reparten, se inclinan y brillan con el rat\u00f3n) */\n.packs { position: relative; height: 460px; perspective: 1200px; }\n.pack {\n  position: absolute; top: 50%; left: 50%; overflow: hidden;\n  width: 230px; height: 330px; margin: -165px 0 0 -115px; padding: 1.15rem;\n  border-radius: 18px; color: var(--ink); text-decoration: none;\n  transform: translateX(var(--x)) translateY(var(--y, 0)) rotate(var(--r)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));\n  transition: transform .7s var(--out), box-shadow .7s var(--out);\n  box-shadow: 0 30px 50px -22px rgba(0, 0, 0, .85);\n  animation: deal 1.1s var(--out) backwards;\n}\n.pack:nth-child(1) { animation-delay: 1.5s; }\n.pack:nth-child(2) { animation-delay: 1.65s; }\n.pack:nth-child(3) { animation-delay: 1.8s; }\n@keyframes deal { from { transform: translateX(0) translateY(120px) rotate(0) scale(.7); opacity: 0; } }\n\n.pack::after {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none; opacity: 0;\n  background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, .4), transparent 45%);\n  mix-blend-mode: overlay; transition: opacity .4s;\n}\n.pack:hover, .pack:focus-visible { z-index: 5; color: inherit; --y: -14px; }\n.pack:hover::after, .pack:focus-visible::after { opacity: 1; }\n.pack .no { font: 700 .75rem var(--pix); letter-spacing: .05em; }\n.pack .pt { margin: 8.6rem 0 .5rem; font: 900 1.75rem/1 var(--disp); letter-spacing: -.03em; }\n.pack p { margin: 0; font-size: .9rem; line-height: 1.4; }\n\n.pack.c { --x: -185px; --r: -9deg; background: var(--void-2); border: 2px solid var(--cyan); }\n.pack.c .no, .pack.c .pt { color: var(--cyan); }\n.pack.r { --x: 0px; --r: -1deg; z-index: 2; background: var(--plum); border: 2px solid var(--pink); }\n.pack.r .no, .pack.r .pt { color: var(--pink); }\n.pack.h { --x: 185px; --r: 8deg; z-index: 3; background: var(--holo); color: var(--void);\n  animation: deal 1.1s var(--out) 1.8s backwards, spin 7s linear infinite; }\n.pack.h:hover { color: var(--void); }\n\n/* Cinta de anotaciones en contorno (decorativa) */\n.marquee {\n  position: absolute; left: 0; right: 0; bottom: 2.2rem; overflow: hidden; pointer-events: none;\n  white-space: nowrap; font: 900 2.4rem var(--disp); color: transparent; -webkit-text-stroke: 1px var(--line);\n}\n.marquee span { display: inline-block; animation: mq 50s linear infinite; }\n@keyframes mq { to { transform: translateX(-50%); } }\n\n/* =========================================================\n   ESTRUCTURA E \u00cdNDICE LATERAL\n   ========================================================= */\n.layout {\n  display: grid; grid-template-columns: 19.5rem minmax(0, 1fr);\n  min-height: 100vh; border-top: 1px solid var(--line);\n}\n.content { min-width: 0; }\nmain { max-width: 56rem; padding: 2rem 4vw 6rem; }\nsection { margin: 0 0 5rem; }\nsection > *:not(.opener) { max-width: 46rem; }\nsection > .tw, section > .fig, section > pre, section > .grid { max-width: none; }\n\n/* Barra superior de la gu\u00eda completa: ocupa todo el ancho y deja libres las marcas HUD de las esquinas */\nheader.bar.full { padding: 0 3rem; }\n\n/* \u00cdndice (queda justo debajo de la barra superior, que es fija) */\n.sidebar {\n  position: sticky; top: var(--bar); align-self: start; overflow: auto;\n  height: calc(100vh - var(--bar)); padding: 1.6rem 1rem 6rem;\n  background: var(--void-2); border-right: 1px solid var(--line); scrollbar-width: thin;\n}\n.brand { margin: 0 0 1.4rem; padding: 0 .5rem; color: var(--lime); font: 900 1rem/1.25 var(--disp); letter-spacing: -.02em; }\n.brand small { display: block; margin-top: .3rem; color: var(--ink-3); font: 400 .85rem/1.4 var(--body); letter-spacing: 0; }\n\n.group { margin: 0 0 .5rem; }\n.group > summary {\n  display: flex; align-items: center; gap: .6rem; cursor: pointer; list-style: none;\n  padding: .6rem .5rem; border-radius: 8px; color: var(--ink-2); text-transform: uppercase;\n  font: 700 .78rem/1.3 var(--pix); letter-spacing: .04em;\n}\n.group > summary:hover { background: var(--void-3); }\n.group > summary::-webkit-details-marker { display: none; }\n.group > summary .n {\n  display: inline-grid; place-items: center; flex: none;\n  width: 1.7rem; height: 2.3rem; border-radius: 5px; color: var(--void); font: 700 .8rem var(--pix);\n}\n.group.g1 .n { background: var(--cyan); }\n.group.g2 .n { background: var(--pink); }\n.group.g3 .n { background: var(--holo); }\n.group.g4 .n { background: var(--green); }\n\n.group ul { list-style: none; margin: .2rem 0 .8rem; padding: 0 0 0 .4rem; }\n.group li a {\n  position: relative; display: block; padding: .38rem .6rem; border-radius: 8px;\n  color: var(--ink-2); text-decoration: none; font-size: .9rem; line-height: 1.35;\n  transition: background .25s, color .25s;\n}\n.group li.sub a { padding-left: 1.4rem; font-size: .85rem; }\n.group li a:hover { background: var(--void-3); color: var(--ink); }\n.group li a.active { background: var(--lime); color: var(--void); font-weight: 700; }\n.group li a.left::after { content: \"AQU\u00cd LO DEJASTE\"; display: block; margin-top: .25rem; color: var(--pink); font: 700 .7rem var(--pix); }\n.group li a.left.active::after { color: #7a0f46; }\n\n/* Bot\u00f3n de cerrar y fondo oscuro del caj\u00f3n (solo en m\u00f3vil) */\n.drawer-close { display: none; }\n.scrim {\n  position: fixed; inset: 0; z-index: 65; opacity: 0; pointer-events: none;\n  background: rgba(5, 3, 15, .6); backdrop-filter: blur(2px); transition: opacity .4s;\n}\n.scrim.on { opacity: 1; pointer-events: auto; }\n\nfooter { max-width: 56rem; padding: 2.5rem 4vw 7rem; border-top: 1px solid var(--line); color: var(--ink-3); font-size: .9rem; }\n\n/* =========================================================\n   CARTAS DE SECCI\u00d3N Y SOBRES DE CADA PARTE\n   r1 = Parte 1 (com\u00fan, cian) \u00b7 r2 = Parte 2 (rara, rosa) \u00b7 r3 = Parte 3 (holo)\n   ========================================================= */\n.r1 { --rar: var(--cyan); }\n.r2 { --rar: var(--pink); }\n.r3 { --rar: var(--holo); }\n.r4 { --rar: var(--green); }\n\n/* Carta que abre cada secci\u00f3n */\n.opener {\n  position: relative; overflow: hidden;\n  display: grid; gap: 1.1rem;\n  margin: 0 0 2.4rem; padding: 1.7rem 1.9rem 1.4rem;\n  background: var(--void-2); border: 2px solid var(--rar); border-radius: 22px;\n  transform-origin: 50% 100%;\n  transition: transform 1s var(--out), opacity .8s var(--out);\n}\n/* Filo interior de la carta */\n.opener::before {\n  content: \"\"; position: absolute; inset: 7px; pointer-events: none;\n  border: 1px solid rgba(236, 232, 255, .09); border-radius: 15px;\n}\n/* Brillo que sigue al puntero + reflejo fijo */\n.opener::after {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background:\n    radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, .07), transparent 40%),\n    linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .14) 50%, transparent 65%);\n}\n.r3.opener {\n  border: 2px solid transparent;\n  background: linear-gradient(var(--void-2), var(--void-2)) padding-box, var(--holo) border-box;\n  animation: spin 9s linear infinite;\n}\n\n/* Antes de entrar en pantalla la carta est\u00e1 inclinada y oculta */\n.js .opener:not(.in) { opacity: 0; transform: perspective(900px) rotateX(28deg) translateY(30px); }\n\n.opener h2 {\n  position: relative; margin: 0; text-wrap: balance;\n  font: 900 clamp(1.55rem, 3.1vw, 2.3rem)/1.1 var(--disp); letter-spacing: -.03em;\n}\n.opener h2 code { padding: 0; background: none; color: var(--lime); font-size: .8em; }\n.js .opener:not(.in) h2 { clip-path: inset(0 100% 0 0); }\n.opener.in h2 { animation: pixh .8s steps(10) .15s backwards; }\n@keyframes pixh { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }\n\n/* N\u00famero de colecci\u00f3n al pie: 007/030 + rareza */\n.opener .set {\n  justify-self: end; display: inline-flex; align-items: center;\n  color: var(--ink-2); font: 700 .75rem var(--pix); letter-spacing: .04em;\n}\n.opener .set b { color: var(--ink); font-size: .95rem; }\n.opener .set .rar { margin-left: .6rem; padding: .22rem .6rem; border-radius: 999px; background: var(--rar); color: var(--void); }\n\n/* Sobre que abre cada parte */\n.part {\n  position: relative; overflow: hidden; max-width: none;\n  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 1.6rem;\n  margin: 6rem 0 3rem; padding: 2rem; border-radius: 24px;\n  background: var(--void-3); border: 2px solid var(--cyan);\n}\n.part:first-child { margin-top: 2rem; }\n.part .num { color: var(--cyan); font: 900 clamp(4rem, 9vw, 7rem)/.85 var(--disp); letter-spacing: -.05em; }\n.part .ttl { font: 900 clamp(1.3rem, 2.6vw, 1.9rem)/1.15 var(--disp); letter-spacing: -.02em; text-wrap: balance; }\n.part .ttl small { display: block; margin-top: .6rem; color: var(--ink-2); font: 400 1rem/1.5 var(--body); letter-spacing: 0; text-wrap: pretty; }\n.part .set {\n  grid-column: 1 / -1; justify-self: start;\n  padding: .3rem .75rem; border-radius: 999px; background: var(--cyan); color: var(--void);\n  font: 700 .75rem var(--pix); letter-spacing: .04em;\n}\n.part.p2 { background: var(--plum); border-color: var(--pink); }\n.part.p2 .num { color: var(--pink); }\n.part.p2 .set { background: var(--pink); }\n.part.p3 {\n  border: 3px solid transparent;\n  background: linear-gradient(var(--plum-2), var(--plum-2)) padding-box, var(--holo) border-box;\n  animation: spin 8s linear infinite;\n}\n.part.p3 .num { color: var(--gold); }\n.part.p3 .set { background: var(--holo); }\n.part.p4 { border-color: var(--green); }\n.part.p4 .num { color: var(--green); }\n.part.p4 .set { background: var(--green); }\n\n/* =========================================================\n   TEXTO, LISTAS, NOTAS Y DESPLEGABLES\n   ========================================================= */\nh3 {\n  margin: 2.8rem 0 .8rem; color: var(--pink); text-wrap: balance;\n  font: 600 1.22rem/1.3 var(--disp); letter-spacing: -.01em;\n}\nsection:has(.r1) h3 { color: var(--cyan); }\nsection:has(.r3) h3 { color: var(--gold); }\nsection:has(.r4) h3 { color: var(--green); }\nh4 { margin: 1.8rem 0 .5rem; color: var(--ink); font: 600 1rem/1.3 var(--disp); }\np { margin: 0 0 1rem; text-wrap: pretty; }\nul, ol { margin: 0 0 1rem; padding-left: 1.4rem; }\nli { margin: .3rem 0; }\nli::marker { color: var(--violet); }\np.paso { margin: .8rem 0; }\n\n/* C\u00f3digo dentro del texto */\ncode { font-family: var(--mono); font-size: .88em; }\np code, li code, td code, summary code, h3 code, h4 code,\n.kid code, .why code, .warn code, .ok code, blockquote code {\n  padding: .08em .4em; border-radius: 5px; background: var(--void-3); color: var(--cyan);\n}\np code, li code { overflow-wrap: anywhere; word-break: break-word; }\n\n/* N\u00famero de paso redondo */\n.step {\n  display: inline-grid; place-items: center; vertical-align: .1em;\n  min-width: 1.7rem; height: 1.7rem; margin-right: .5rem; padding: 0 .4rem; border-radius: 6px;\n  background: var(--lime); color: var(--void); font: 700 .78rem/1 var(--pix);\n}\n\n/* Notas: <div class=\"kid\">, \"why\", \"warn\", \"ok\" */\n.kid, .why, .warn, .ok, p.note { margin: 1.7rem 0; padding: 1rem 1.2rem 1.1rem; border: 1px solid; border-radius: 14px; }\n.kid::before, .why::before, .warn::before, .ok::before {\n  /* display: table = la etiqueta va en su propia l\u00ednea, separada del texto */\n  display: table; margin-bottom: .75rem; padding: .3rem .75rem; border-radius: 999px; line-height: 1.3;\n  font: 700 .75rem var(--pix); letter-spacing: .03em; color: var(--void);\n}\n.kid  { background: rgba(255, 210, 61, .07); border-color: rgba(255, 210, 61, .38); }\n.kid::before  { content: \"PARA UN NI\u00d1O DE 5 A\u00d1OS\"; background: var(--gold); }\n.why  { background: rgba(61, 224, 255, .06); border-color: rgba(61, 224, 255, .36); }\n.why::before  { content: \"POR QU\u00c9\"; background: var(--cyan); }\n.warn { background: rgba(255, 79, 163, .07); border-color: rgba(255, 79, 163, .42); }\n.warn::before { content: \"OJO\"; background: var(--pink); }\n.ok   { background: rgba(94, 240, 160, .06); border-color: rgba(94, 240, 160, .36); }\n.ok::before   { content: \"COMPROBACI\u00d3N\"; background: var(--green); }\np.note { background: rgba(94, 240, 160, .06); border-color: rgba(94, 240, 160, .3); }\n.kid p:last-child, .why p:last-child, .warn p:last-child, .ok p:last-child { margin-bottom: 0; }\n\nblockquote { margin: 1.4rem 0; padding: 1rem 1.2rem; background: var(--void-3); border: 1px solid var(--line); border-radius: 14px; }\nblockquote p { margin: 0; }\n\n/* Columnas sueltas */\n.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; margin: 1.6rem 0; }\n.box { padding: 1rem 1.1rem; background: var(--void-2); border: 1px solid var(--line); border-radius: 14px; }\n\n/* Desplegables */\ndetails { padding: .5rem 0; border-top: 1px solid var(--line); }\nmain details:last-of-type { border-bottom: 1px solid var(--line); }\nmain summary { cursor: pointer; padding: .45rem 0; color: var(--ink); font: 700 1rem var(--body); }\nmain summary::marker { color: var(--lime); }\ndetails[open] > summary { margin-bottom: .4rem; }\n\n.good { color: var(--green); font-weight: 700; }\n.bad  { color: var(--red);   font-weight: 700; }\n\n/* Lista de comprobaci\u00f3n con casillas */\nul.check { list-style: none; padding-left: 0; }\nul.check li { position: relative; padding-left: 2rem; }\nul.check li::before {\n  content: \"\"; position: absolute; left: 0; top: .3em;\n  width: 1.1rem; height: 1.1rem; border: 2px solid var(--lime); border-radius: 4px;\n}\n\n/* =========================================================\n   BLOQUES DE C\u00d3DIGO Y TABLAS\n   ========================================================= */\npre {\n  position: relative; overflow: auto; tab-size: 4;\n  margin: 1.6rem 0; padding: 1.1rem 1.3rem;\n  background: var(--code-bg); color: #e6e1ff; border: 1px solid var(--line); border-radius: 14px;\n  font: .86rem/1.65 var(--mono);\n}\n/* <pre data-f=\"nombre/del/Archivo.java\"> muestra el nombre arriba */\npre[data-f] { padding-top: 3.1rem; }\n/* Sin nombre de archivo, el bot\u00f3n Copiar tiene su propia fila arriba: as\u00ed no tapa el c\u00f3digo */\npre:not([data-f]) { padding-top: 2.9rem; }\npre[data-f]::before {\n  content: attr(data-f); position: absolute; top: 0; left: 0; right: 0; height: 2.3rem;\n  display: flex; align-items: center; padding: 0 6rem 0 1.3rem;\n  border-bottom: 1px solid var(--line); color: var(--ink-2);\n  font: 700 .75rem var(--pix); letter-spacing: .03em;\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.copy {\n  position: absolute; top: .35rem; right: .5rem; cursor: pointer;\n  padding: .35rem .85rem; border-radius: 999px;\n  background: var(--void-3); color: var(--ink); border: 1px solid var(--line);\n  font: 700 .75rem var(--pix); transition: background .3s, color .3s;\n}\n.copy:hover { background: var(--violet); color: var(--void); }\n\n/* M\u00f3vil: letra algo menor y scroll horizontal dentro del bloque (la usan la gu\u00eda completa y la resumida) */\n@media (max-width: 40rem) {\n  pre { margin: 1.2rem 0; padding: .9rem 1rem; font-size: .78rem; border-radius: 12px; }\n  pre[data-f], pre:not([data-f]) { padding-top: 2.9rem; }\n  pre[data-f]::before { height: 2.2rem; padding: 0 5.5rem 0 1rem; font-size: .7rem; }\n  .copy { padding: .3rem .7rem; font-size: .7rem; }\n}\n\n/* Colores del resaltado de Java (los pone recursos/js/2-codigo.js) */\n.t-c { color: #8e86b8; font-style: italic; } /* comentarios */\n.t-s { color: var(--gold); }                 /* textos \"entre comillas\" */\n.t-a { color: var(--lime); }                 /* @Anotaciones */\n.t-k { color: var(--pink); }                 /* palabras clave */\n.t-n { color: var(--cyan); }                 /* n\u00fameros */\n\n/* Tablas (recursos/js/2-codigo.js las envuelve en .tw para el scroll en m\u00f3vil) */\n.tw { overflow-x: auto; margin: 1.5rem 0; background: var(--void-2); border: 1px solid var(--line); border-radius: 14px; }\ntable { width: 100%; border-collapse: collapse; font-size: .95rem; font-variant-numeric: tabular-nums; }\nth {\n  padding: .8rem 1rem; text-align: left; background: var(--void-3); border-bottom: 1px solid var(--line);\n  color: var(--lime); font: 700 .75rem/1.3 var(--pix); letter-spacing: .03em;\n}\nth b { color: inherit; }\ntd { padding: .7rem 1rem; vertical-align: top; border-bottom: 1px solid rgba(58, 47, 107, .6); }\ntd code { white-space: normal; overflow-wrap: anywhere; }\ntd:first-child { width: 30%; max-width: 16rem; font-weight: 700; color: #fff; }\ntr:last-child td { border-bottom: 0; }\ntr:hover td { background: rgba(139, 91, 255, .06); }\n\n/* =========================================================\n   DIAGRAMAS (figuras SVG) Y CAPTURAS\n   Para un diagrama nuevo usa estos colores directamente:\n   cajas fill=\"#211a47\", bordes stroke=\"#3de0ff\" / \"#c6ff3d\" / \"#ff4fa3\",\n   texto sin fill (sale claro). Los colores antiguos de abajo se\n   traducen solos para no tener que reescribir las figuras viejas.\n   ========================================================= */\n.fig {\n  overflow-x: auto; margin: 2rem 0; padding: 1.2rem;\n  background: var(--void-2); color: var(--ink); border: 1px solid var(--line); border-radius: 18px;\n}\n.fig svg { display: block; width: 100%; min-width: 40rem; height: auto; }\n.fig figcaption { margin-top: .6rem; color: var(--ink-3); font-size: .9rem; }\n.fig svg text { fill: var(--ink); font-family: var(--body); }\n.fig svg .ic { color: var(--cyan); }     /* iconos de contenido/_iconos.html */\n.fig svg .ic.g { color: var(--gold); }\n\n/* L\u00edneas que se dibujan al entrar en pantalla (class=\"ld\" pathLength=\"1\") */\n.fig .ld { stroke-dasharray: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 1.3s var(--out); }\n.js .fig:not(.in) .ld { stroke-dashoffset: 1; }\n\n/* Traducci\u00f3n de la paleta antigua de las figuras a la del mundo de cartas */\n.fig svg [fill=\"#e8edf1\"], .fig svg [fill=\"#e1ebf5\"], .fig svg [fill=\"#dcefee\"],\n.fig svg [fill=\"#fff\"], .fig svg [fill=\"#ffffff\"] { fill: var(--void-3); }\n.fig svg [fill=\"#e0f1e7\"] { fill: #123a2e; }\n.fig svg [fill=\"#fbeccf\"] { fill: #3a2e10; }\n.fig svg [fill=\"#f8e2de\"] { fill: #3d1430; }\n.fig svg [stroke=\"#536171\"], .fig svg [stroke=\"#4f5d68\"], .fig svg [stroke=\"#14212b\"] { stroke: var(--ink-3); }\n.fig svg [stroke=\"#2c5f8f\"] { stroke: var(--cyan); }\n.fig svg [stroke=\"#0b6b6b\"] { stroke: var(--lime); }\n.fig svg [stroke=\"#2e7d4f\"], .fig svg [stroke=\"#1f6a40\"] { stroke: var(--green); }\n.fig svg [stroke=\"#a35b00\"] { stroke: var(--gold); }\n.fig svg [stroke=\"#b23a2b\"] { stroke: var(--pink); }\n.fig svg text[fill=\"#4f5d68\"], .fig svg text[fill=\"#536171\"] { fill: var(--ink-2); }\n.fig svg text[fill=\"#14212b\"] { fill: var(--ink); }\n.fig svg text[fill=\"#2c5f8f\"] { fill: var(--cyan); }\n.fig svg text[fill=\"#0b6b6b\"] { fill: var(--lime); }\n.fig svg text[fill=\"#2e7d4f\"], .fig svg text[fill=\"#1f6a40\"] { fill: var(--green); }\n.fig svg text[fill=\"#a35b00\"] { fill: var(--gold); }\n.fig svg text[fill=\"#b23a2b\"] { fill: var(--pink); }\n.fig svg path[fill=\"#14212b\"], .fig svg path[fill=\"#4f5d68\"] { fill: var(--ink-2); }\n.fig svg path[fill=\"#2e7d4f\"] { fill: var(--green); }\n.fig svg path[fill=\"#b23a2b\"] { fill: var(--pink); }\n.fig svg path[fill=\"#0b6b6b\"] { fill: var(--lime); }\n.fig svg path[fill=\"#2c5f8f\"] { fill: var(--cyan); }\n#ar path, #arg path, #arr path { fill: var(--ink-2); }\n\n/* Capturas de pantalla */\n.fig.shot { padding: .8rem; }\n.fig.shot img { display: block; width: 100%; max-width: 58rem; border-radius: 10px; }\n\n/* =========================================================\n   BARRA INFERIOR (DOCK) Y MODO REPASO\n   ========================================================= */\n.dock {\n  position: fixed; left: 50%; bottom: 20px; z-index: 58;\n  display: flex; align-items: center; gap: 4px; padding: 5px;\n  transform: translateX(-50%);\n  background: rgba(21, 16, 48, .92); backdrop-filter: blur(12px);\n  border: 1px solid var(--line); border-radius: 999px;\n  box-shadow: 0 18px 30px -16px rgba(0, 0, 0, .9);\n  transition: transform .6s var(--out), opacity .6s;\n}\n.dock.hide { transform: translate(-50%, 140%); opacity: 0; }\n.dock button, .dock a {\n  padding: .6rem 1rem; border: 0; border-radius: 999px; cursor: pointer; white-space: nowrap;\n  background: transparent; color: var(--ink-2); text-decoration: none;\n  font: 700 .75rem var(--pix); letter-spacing: .03em; transition: background .3s, color .3s;\n}\n.dock button:hover, .dock a:hover { background: var(--void-3); color: var(--ink); }\n.dock button[aria-pressed=\"true\"] { background: var(--lime); color: var(--void); }\n.dock .count { padding: .6rem .9rem; color: var(--lime); font: 700 .75rem var(--pix); white-space: nowrap; }\n.dock .idx { display: none; }\n\n/* Modo repaso: deja solo cartas, t\u00edtulos, notas y tablas */\n.repaso main section > :is(p, pre, .fig, ol, ul, .grid, details, h4, blockquote) { display: none; }\n.repaso .opener { margin-bottom: 1.2rem; }\n.repaso section { margin-bottom: 3rem; }\n\n/* =========================================================\n   PANTALLAS MEDIANAS, M\u00d3VIL Y MOVIMIENTO REDUCIDO\n   ========================================================= */\n\n/* Port\u00e1tiles y tablets en horizontal (961px \u2013 1344px) */\n@media (min-width: 60.01rem) and (max-width: 84rem) {\n  .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }\n  .pack { width: 180px; height: 260px; margin: -130px 0 0 -90px; }\n  .pack .pt { margin-top: 6.2rem; font-size: 1.35rem; }\n  .pack p { font-size: .8rem; }\n  .pack.c { --x: -120px; }\n  .pack.h { --x: 120px; }\n}\n@media (min-width: 60.01rem) { .scrim { display: none; } }\n\n/* M\u00f3vil y tablet en vertical (hasta 960px) */\n@media (max-width: 60rem) {\n  .hero { grid-template-columns: 1fr; gap: 1rem; padding: 5rem 1.25rem 6rem; }\n  .packs { height: 340px; }\n  .pack { width: 160px; height: 235px; margin: -118px 0 0 -80px; padding: .9rem; }\n  .pack .pt { margin-top: 5.2rem; font-size: 1.2rem; }\n  .pack p { font-size: .78rem; }\n  .pack.c { --x: -100px; }\n  .pack.h { --x: 100px; }\n  .marquee { bottom: 1.4rem; font-size: 1.6rem; }\n  .hud { display: none; }\n  header.bar.full { padding: 0 1rem; }   /* sin marcas HUD en el m\u00f3vil, la barra no necesita margen extra */\n\n  /* El \u00edndice pasa a ser un caj\u00f3n que entra por la derecha */\n  .layout { display: block; }\n  .sidebar {\n    position: fixed; inset: 0 0 0 auto; z-index: 70;\n    width: min(22rem, 88vw); height: 100%;\n    transform: translateX(105%); transition: transform .5s var(--out);\n    box-shadow: -20px 0 40px rgba(0, 0, 0, .6);\n  }\n  .sidebar.open { transform: none; }\n  .drawer-close {\n    display: block; width: max-content; margin: 0 0 1rem auto; cursor: pointer;\n    padding: .55rem 1rem; border-radius: 999px;\n    background: var(--void-3); color: var(--ink); border: 1px solid var(--line);\n    font: 700 .75rem var(--pix);\n  }\n\n  main { padding: 1.5rem 1.25rem 6rem; }\n  footer { padding-left: 1.25rem; padding-right: 1.25rem; }\n  .opener { padding: 1.3rem 1.2rem 1.4rem; }\n  .opener h2 { font-size: clamp(1.4rem, 6.4vw, 1.9rem); }\n  .opener .set { justify-self: start; }\n  .part { grid-template-columns: 1fr; gap: .6rem; padding: 1.4rem; }\n\n  .dock { gap: 0; padding: 4px; max-width: calc(100vw - 24px); }\n  .dock .idx { display: inline-block; }\n  .dock button, .dock a { padding: .55rem .7rem; }\n  .dock .count { padding: .55rem .5rem; }\n}\n\n/* M\u00f3vil (hasta 640px): texto, c\u00f3digo, notas y tablas m\u00e1s compactos */\n@media (max-width: 40rem) {\n  body { font-size: 1rem; line-height: 1.62; }\n  html { scroll-padding-top: 4.5rem; }   /* deja sitio a la barra superior fija */\n  main { padding: 1.2rem 1rem 6rem; }\n  footer { padding-left: 1rem; padding-right: 1rem; }\n  section { margin-bottom: 3.5rem; }\n  h3 { margin-top: 2.2rem; font-size: 1.1rem; }\n\n  .hero { padding: 4.5rem 1rem 5.5rem; }\n  .hero h1 { font-size: clamp(2.2rem, 11vw, 2.9rem); }\n  .hero .lede { font-size: 1.05rem; margin-bottom: 1.6rem; }\n  .cta { flex-direction: column; align-items: stretch; }\n  .btn { justify-content: center; padding: .95rem 1.2rem; }\n\n  .opener { padding: 1.1rem 1rem 1.2rem; border-radius: 18px; gap: .9rem; }\n  .opener h2 { font-size: clamp(1.25rem, 6.2vw, 1.6rem); }\n  .part { margin: 4rem 0 2rem; padding: 1.2rem; border-radius: 18px; }\n  .part .num { font-size: 3.6rem; }\n\n  /* Las notas ocupan todo el ancho y respiran por dentro */\n  .kid, .why, .warn, .ok, p.note { margin: 1.4rem 0; padding: .9rem 1rem 1rem; }\n\n  /* Tablas: el texto se parte donde haga falta para que quepan en el ancho del m\u00f3vil */\n  table { font-size: .88rem; }\n  th { padding: .65rem .7rem; overflow-wrap: anywhere; }\n  td { padding: .6rem .7rem; overflow-wrap: anywhere; }\n  td:first-child { width: 38%; }\n  th code, td code { white-space: normal; overflow-wrap: anywhere; }\n\n  .fig { margin: 1.4rem 0; padding: .8rem; }\n  .fig svg { min-width: 34rem; }   /* el diagrama se desliza de lado */\n  .grid { grid-template-columns: 1fr; }\n}\n\n/* M\u00f3viles estrechos: se oculta \"Arriba\" para que quepa el dock y se encogen los sobres */\n@media (max-width: 30rem) {\n  .dock a { display: none; }\n  .dock button, .dock .count { padding: .5rem .4rem; font-size: .62rem; letter-spacing: 0; white-space: nowrap; }\n  .packs { height: 290px; }\n  .pack { width: 132px; height: 195px; margin: -98px 0 0 -66px; padding: .7rem; border-radius: 14px; }\n  .pack .pt { margin-top: 4.2rem; font-size: 1rem; }\n  .pack p { font-size: .7rem; }\n  .pack.c { --x: -82px; }\n  .pack.h { --x: 82px; }\n}\n\n/* Quien pide menos movimiento ve todo quieto y en su sitio */\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  *, *::before, *::after { animation: none !important; transition: none !important; }\n  .hero h1 .w { clip-path: none; }\n  .js .opener:not(.in) { opacity: 1; transform: none; }\n  .js .opener:not(.in) h2 { clip-path: none; }\n  .js .fig:not(.in) .ld { stroke-dashoffset: 0; }\n}\n\n/* =========================================================\n   IMPRESI\u00d3N (Ctrl+P): papel blanco y tinta oscura\n   ========================================================= */\n@media print {\n  :root {\n    --void: #fff; --void-2: #fff; --void-3: #f2f0fa; --void-4: #e6e2f5;\n    --ink: #111; --ink-2: #333; --ink-3: #444; --line: #ccc;\n    --lime: #3b5200; --cyan: #00566b; --pink: #99104f; --gold: #6b4d00;\n    --violet: #4b2aa8; --green: #0b5a32; --red: #9b1c1c;\n    --plum: #fff; --plum-2: #fff; --code-bg: #f6f6f6;\n  }\n  body { background: #fff; color: #111; font-size: 11pt; }\n  b, strong, td:first-child { color: #000; }\n  .kid::before, .why::before, .warn::before, .ok::before, .step { color: #fff; }\n  p code, li code, td code, h3 code { color: #00566b; }\n\n  .loader, .sidebar, header.bar, .copy, .dock, .hud, .progress, .hero .packs, .marquee, .cta, .scrim { display: none !important; }\n  .hero { display: block; min-height: 0; padding: 0 0 1rem; }\n  .hero h1 .w { clip-path: none; animation: none; }\n  .layout { display: block; border: 0; }\n  main { max-width: none; padding: 0; }\n\n  .opener, .part { animation: none !important; opacity: 1 !important; transform: none !important; border: 1px solid #999 !important; background: #fff !important; }\n  .opener h2 { clip-path: none !important; }\n  pre { white-space: pre-wrap; break-inside: avoid-page; color: #111; }\n  .fig { background: #fff; }\n  .fig svg text { fill: #111; }\n  .fig, .kid, .why, .warn, .ok { break-inside: avoid; }\n}\n\n<\/style>\n<\/head>\n<body>\n<\!-- Flechas de los diagramas e iconos (<use href=\"#i-person\"> etc.). No hace falta tocarlo. -->\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\"><defs>\n<symbol id=\"i-person\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"7\" r=\"3.5\"/><path d=\"M5 21v-2a7 7 0 0 1 14 0v2\"/><\/g><\/symbol>\n<symbol id=\"i-hand\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"10\" cy=\"8\" r=\"3.2\"/><path d=\"M4 21v-1.5a6 6 0 0 1 9-5.2\"/><path d=\"M17 3v9M17 3l-2 2M17 3l2 2\"/><\/g><\/symbol>\n<symbol id=\"i-chef\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 7.5a2.5 2.5 0 1 1 1.8-4.2A2.6 2.6 0 0 1 14.2 3.3 2.5 2.5 0 1 1 16 7.5V9H8z\"/><circle cx=\"12\" cy=\"12.5\" r=\"2.6\"/><path d=\"M5.5 21v-1.5a6.5 6.5 0 0 1 13 0V21\"/><\/g><\/symbol>\n<symbol id=\"i-child\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"9\" r=\"4\"/><path d=\"M7 21v-1a5 5 0 0 1 10 0v1\"/><path d=\"M10 3.5c1-.8 3-.8 4 0\"/><\/g><\/symbol>\n<symbol id=\"i-clip\" viewBox=\"0 0 24 24\">
